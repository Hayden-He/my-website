<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>示例小游戏 - 小游乐场</title>
  <meta name="description" content="新增游戏模板：包含公共游戏外壳、HUD、音效、最高分、更多游戏与自定义确认弹窗。" />
  <meta name="author" content="Hayden-He" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg?v=20261118001" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <script src="/assets/theme.js?v=20261118001"></script>
  <link rel="stylesheet" href="/assets/style.css?v=20261118001" />
  <link rel="stylesheet" href="/assets/game-shell.css?v=20261118001" />
  <script src="/assets/site-data.js?v=20261118001"></script>
  <script src="/assets/i18n.js?v=20261118001"></script>
  <script src="/assets/games.js?v=20261118001"></script>
  <script src="/assets/game-kit.js?v=20261118001"></script>
  <style>
    /* 只放这个游戏自己的棋盘/场地样式；HUD、按钮、遮罩等见 game-shell.css */
    .game-wrap { --game-width: 520px; }

    .hud { grid-template-columns: repeat(2, 1fr); }

    .template-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: linear-gradient(135deg, #eff6ff, #f8fafc 55%, #fff7ed);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .template-target {
      width: 148px;
      height: 148px;
      border: none;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #93c5fd, #2563eb 62%, #1e40af);
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 24px -8px rgba(37, 99, 235, 0.7);
      transition: transform 0.12s ease;
      touch-action: manipulation;
    }

    .template-target:active {
      transform: scale(0.94);
    }
  </style>
</head>
<body>
  <!-- inline-icons:start -->
  <!-- inline-icons:end -->
  <header class="game-topbar">
    <div class="container game-topbar-inner">
      <a class="back-link" href="/" data-i18n="← 返回大厅">← 返回大厅</a>
      <h1 class="game-topbar-title">
        <svg class="title-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><use href="#game-template"></use></svg>
        <span data-i18n="示例小游戏">示例小游戏</span>
      </h1>
      <div class="game-topbar-actions">
        <a class="game-topbar-cat" href="/categories/puzzle" data-i18n="益智休闲">益智休闲</a>
        <button class="lang-btn theme-btn" type="button" data-theme-toggle aria-label="主题：跟随系统" title="主题：跟随系统"><svg class="theme-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#theme-system"></use></svg></button>
        <button class="lang-btn" type="button" data-lang-toggle>EN</button>
      </div>
    </div>
  </header>

  <main class="game-wrap">
    <div class="hud">
      <div class="hud-box">
        <div class="hud-label" data-i18n="当前得分">当前得分</div>
        <div id="score-el" class="hud-value">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label" data-i18n="模式最高">模式最高</div>
        <div id="best-el" class="hud-value" style="color: var(--accent-text);">0</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="btn-group">
        <button id="sound-btn" class="btn-small secondary">音效: 开</button>
        <button id="restart-btn" class="btn-small" data-i18n="重开">重开</button>
      </div>
    </div>

    <div class="template-stage">
      <button id="target" class="template-target" type="button" data-i18n="开始游戏">开始游戏</button>
      <div id="overlay" class="overlay" role="status" aria-live="polite">
        <h2 data-i18n="完成！">完成！</h2>
        <p id="overlay-desc"></p>
        <div class="overlay-actions">
          <button id="overlay-btn" class="overlay-btn" data-i18n="再来一局">再来一局</button>
        </div>
      </div>
    </div>

    <div id="more-games" class="more-games"></div>
  </main>

  <script>
    (function () {
      const t = (key, params) => I18N.t(key, params);
      const STORAGE_KEY = 'game_best_template';
      const target = document.getElementById('target');
      const soundBtn = document.getElementById('sound-btn');
      const scoreEl = document.getElementById('score-el');
      const bestEl = document.getElementById('best-el');
      const overlay = document.getElementById('overlay');
      const overlayDesc = document.getElementById('overlay-desc');

      let score = 0;
      let best = GameKit.readBest(STORAGE_KEY);
      let soundEnabled = window.SiteData ? SiteData.getSound() : true;

      GameKit.bindSoundButton(soundBtn, soundEnabled, (on) => {
        soundEnabled = on;
      });

      function render() {
        scoreEl.textContent = score;
        bestEl.textContent = best;
        if (overlay.classList.contains('show')) {
          overlayDesc.textContent = t('本局得分：{score}（本模式最高：{best}）', { score, best });
        }
      }

      function playTone(freq, duration) {
        if (!soundEnabled || !window.SiteData) return;
        SiteData.withAudio((ac) => {
          try {
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.frequency.setValueAtTime(freq, ac.currentTime);
            gain.gain.setValueAtTime(0.06, ac.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start();
            osc.stop(ac.currentTime + duration);
          } catch {}
        });
      }

      target.addEventListener('click', () => {
        if (overlay.classList.contains('show')) return;
        score += 1;
        if (score > best) {
          best = score;
          GameKit.saveBestIfHigher(STORAGE_KEY, best);
        }
        playTone(520, 0.06);
        render();
        if (score >= 10) {
          overlay.classList.add('show');
          render();
        }
      });

      async function restart() {
        if (score > 0) {
          const ok = await window.SiteData.confirmDialog({
            title: t('重开本局'),
            message: t('当前进度将被清除，确定重开吗？'),
            confirmText: t('重开'),
            cancelText: t('继续本局'),
            danger: true,
          });
          if (!ok) return;
        }
        score = 0;
        overlay.classList.remove('show');
        render();
      }

      document.getElementById('restart-btn').addEventListener('click', restart);
      document.getElementById('overlay-btn').addEventListener('click', () => {
        score = 0;
        overlay.classList.remove('show');
        render();
      });

      render();
      document.addEventListener('i18n:change', render);
      GameKit.mountMoreGames('template', document.getElementById('more-games'));
    })();
  </script>
</body>
</html>
