<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="用不同材质的方块自由搭建 3D 作品，保存后随时回来继续。" />
  <link rel="canonical" href="https://my-website-all.pages.dev/games/block-workshop/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="小游乐场" />
  <meta property="og:locale" content="zh_CN" />
  <meta property="og:title" content="方块工坊 · Little Playground" />
  <meta property="og:description" content="用不同材质的方块自由搭建 3D 作品，保存后随时回来继续。" />
  <meta property="og:url" content="https://my-website-all.pages.dev/games/block-workshop/" />
  <meta property="og:image" content="https://my-website-all.pages.dev/assets/og-image.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="小游乐场 · Little Playground：12 款即开即玩的小游戏" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="方块工坊 · Little Playground" />
  <meta name="twitter:description" content="用不同材质的方块自由搭建 3D 作品，保存后随时回来继续。" />
  <meta name="twitter:image" content="https://my-website-all.pages.dev/assets/og-image.jpg" />
  <meta name="twitter:image:alt" content="小游乐场 · Little Playground：12 款即开即玩的小游戏" />
  <title>方块工坊 - 小游乐场</title>
  <meta name="author" content="Hayden-He" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="icon" href="/assets/icon.svg" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/style.css" />
  <link rel="stylesheet" href="/assets/game-shell.css" />
  <link rel="stylesheet" href="./modules/workshop.css" />
</head>
<body>
<!-- inline-icons:start -->
<!-- inline-icons:end -->
<div class="workshop">
  <header class="workshop-header">
    <a class="workshop-back" href="/" data-i18n="← 返回大厅">← 返回大厅</a>
    <h1><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#game-block-workshop"></use></svg><span data-i18n="方块工坊">方块工坊</span></h1>
    <div class="workshop-header-right">
      <a href="/categories/puzzle" data-i18n="益智休闲">益智休闲</a>
      <button class="lang-btn theme-btn" type="button" data-theme-toggle aria-label="主题：跟随系统" title="主题：跟随系统"><svg class="theme-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#theme-system"></use></svg></button>
      <button class="lang-btn" type="button" data-lang-toggle>EN</button>
    </div>
  </header>

  <main class="workshop-stage">
    <canvas id="world" tabindex="0" aria-describedby="workshop-keys" aria-label="方块搭建场地" data-i18n-attr="aria-label:方块搭建场地"></canvas>
    <p id="graphics-error" hidden></p>
    <aside id="workshop-gesture-tip" class="workshop-gesture-tip" aria-label="手势提示" data-i18n-attr="aria-label:手势提示" hidden>
      <ul>
        <li data-i18n="单指拖动旋转">单指拖动旋转</li>
        <li data-i18n="双指捏合缩放">双指捏合缩放</li>
        <li data-i18n="双指同向拖动平移">双指同向拖动平移</li>
      </ul>
      <button id="workshop-dismiss-tip" type="button" data-i18n="知道了">知道了</button>
    </aside>
  </main>

  <footer class="workshop-panel">
    <div class="workshop-actions">
      <button id="workshop-works" type="button" data-i18n="作品">作品</button>
      <button id="workshop-save" type="button" aria-label="保存并返回作品列表" data-i18n-attr="aria-label:保存并返回作品列表" data-i18n="保存">保存</button>
      <button id="workshop-export" type="button" aria-label="导出当前视角 PNG 图片" data-i18n-attr="aria-label:导出当前视角 PNG 图片" data-i18n="导出图片">导出图片</button>
      <button id="workshop-help" type="button" aria-pressed="false" aria-label="小桥教学" data-i18n-attr="aria-label:小桥教学" data-i18n="教学">教学</button>
      <button id="workshop-sound" type="button"></button>
      <button id="workshop-immersive" type="button" data-i18n="沉浸模式" hidden>沉浸模式</button>
    </div>
    <p id="workshop-save-status" role="status" aria-live="polite"></p>
    <div class="workshop-blueprint-row">
      <p id="workshop-blueprint" hidden class="workshop-blueprint" role="status"></p>
      <button id="workshop-finish-tutorial" class="workshop-finish-tutorial" type="button" hidden data-i18n="完成并退出教学">完成并退出教学</button>
    </div>
    <div class="workshop-tools">
      <div class="workshop-group" role="group" aria-label="搭建工具" data-i18n-attr="aria-label:搭建工具">
        <button type="button" data-tool="place" aria-pressed="true" data-i18n="放置">放置</button>
        <button type="button" data-tool="remove" aria-pressed="false" data-i18n="拆除">拆除</button>
        <button type="button" data-tool="pick" aria-pressed="false" data-i18n="吸管">吸管</button>
      </div>
      <div class="workshop-group" role="group" aria-label="编辑操作" data-i18n-attr="aria-label:编辑操作">
        <button type="button" id="workshop-undo" aria-label="撤销" data-i18n-attr="aria-label:撤销" data-i18n="撤销" disabled>撤销</button>
        <button type="button" id="workshop-redo" aria-label="重做" data-i18n-attr="aria-label:重做" data-i18n="重做" disabled>重做</button>
        <button type="button" id="workshop-symmetry" aria-pressed="false" aria-label="切换对称搭建" data-i18n-attr="aria-label:切换对称搭建" data-i18n="对称: 关">对称: 关</button>
      </div>
      <div class="workshop-group workshop-materials" role="group" aria-label="方块材料" data-i18n-attr="aria-label:方块材料">
        <button type="button" data-material="grass" aria-pressed="true" aria-label="草地" data-i18n-attr="aria-label:草地"><span data-i18n="草地">草地</span></button>
        <button type="button" data-material="stone" aria-pressed="false" aria-label="石头" data-i18n-attr="aria-label:石头"><span data-i18n="石头">石头</span></button>
        <button type="button" data-material="wood" aria-pressed="false" aria-label="木板" data-i18n-attr="aria-label:木板"><span data-i18n="木板">木板</span></button>
        <button type="button" data-material="sand" aria-pressed="false" aria-label="沙子" data-i18n-attr="aria-label:沙子"><span data-i18n="沙子">沙子</span></button>
        <button type="button" data-material="iron" aria-pressed="false" aria-label="铁" data-i18n-attr="aria-label:铁"><span data-i18n="铁">铁</span></button>
        <button type="button" data-material="copper" aria-pressed="false" aria-label="铜" data-i18n-attr="aria-label:铜"><span data-i18n="铜">铜</span></button>
        <button type="button" data-material="gold" aria-pressed="false" aria-label="金" data-i18n-attr="aria-label:金"><span data-i18n="金">金</span></button>
        <button type="button" data-material="diamond" aria-pressed="false" aria-label="钻石" data-i18n-attr="aria-label:钻石"><span data-i18n="钻石">钻石</span></button>
        <button type="button" data-material="brick" aria-pressed="false" aria-label="红砖" data-i18n-attr="aria-label:红砖"><span data-i18n="红砖">红砖</span></button>
        <button type="button" data-material="leaves" aria-pressed="false" aria-label="树叶" data-i18n-attr="aria-label:树叶"><span data-i18n="树叶">树叶</span></button>
        <button type="button" data-material="glass" aria-pressed="false" aria-label="玻璃" data-i18n-attr="aria-label:玻璃"><span data-i18n="玻璃">玻璃</span></button>
        <button type="button" data-material="snow" aria-pressed="false" aria-label="白雪" data-i18n-attr="aria-label:白雪"><span data-i18n="白雪">白雪</span></button>
      </div>
      <div class="workshop-group" role="group" aria-label="视角" data-i18n-attr="aria-label:视角">
        <button type="button" data-turn="-1" aria-label="左转 90°" data-i18n-attr="aria-label:左转 90°">↶ 90°</button>
        <button type="button" data-turn="1" aria-label="右转 90°" data-i18n-attr="aria-label:右转 90°">↷ 90°</button>
        <button type="button" id="workshop-overview" aria-label="回到全景" data-i18n-attr="aria-label:回到全景" data-i18n="全景">全景</button>
      </div>
    </div>
    <p id="workshop-keys" class="workshop-keys" data-i18n="左键放置 · 右键拆除 · 拖右键/Shift平移 · Ctrl+Z 撤销 · B/X/I 切工具 · M 对称 · R 全景 · 1-0 选材 · 方向键选格">左键放置 · 右键拆除 · 拖右键/Shift平移 · Ctrl+Z 撤销 · B/X/I 切工具 · M 对称 · R 全景 · 1-0 选材 · 方向键选格</p>
    <p id="workshop-status" class="workshop-status" role="status" data-i18n="点地面或方块表面放置。">点地面或方块表面放置。</p>
  </footer>

</div>
  <div class="container" data-site-footer-mount><section id="more-games" class="more-games"></section></div>

  <dialog id="workshop-library" class="workshop-dialog" aria-labelledby="workshop-library-title">
    <h2 id="workshop-library-title" data-i18n="作品">作品</h2>
    <div id="workshop-projects"></div>
    <h3 class="workshop-subheading" data-i18n="灵感模板">灵感模板</h3>
    <div id="workshop-templates"></div>
    <div class="workshop-actions">
      <button id="workshop-new" type="button" data-i18n="新建作品">新建作品</button>
      <button id="workshop-clear" type="button" data-i18n="清空当前作品">清空当前作品</button>
      <button id="workshop-close-library" type="button" data-i18n="返回搭建">返回搭建</button>
    </div>
  </dialog>
  <dialog id="workshop-naming" class="workshop-dialog" aria-labelledby="workshop-naming-title">
    <form id="workshop-naming-form">
      <h2 id="workshop-naming-title" data-i18n="保存作品">保存作品</h2>
      <label for="workshop-name" data-i18n="作品名称">作品名称</label>
      <input id="workshop-name" maxlength="40" aria-describedby="workshop-save-note" required />
      <p id="workshop-save-note" data-i18n="作品保存在当前浏览器。首次命名并保存后，后续放置和拆除会自动保存到这件作品。">作品保存在当前浏览器。首次命名并保存后，后续放置和拆除会自动保存到这件作品。</p>
      <p id="workshop-name-error" role="status"></p>
      <div class="workshop-actions">
        <button type="submit" data-i18n="保存">保存</button>
        <button id="workshop-cancel-name" type="button" data-i18n="取消">取消</button>
      </div>
    </form>
  </dialog>
  <script src="/assets/site-data.js"></script>
  <script src="/assets/i18n.js"></script>
  <script src="/assets/games.js"></script>
  <script src="/assets/game-kit.js"></script>
  <script>GameKit.mountMoreGames('block-workshop', document.getElementById('more-games'));</script>
  <script type="module" src="./modules/main.js"></script>
</body>
</html>
