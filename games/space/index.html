            ctx.fillRect(0, -boss.laserWidth * 0.52, 740, boss.laserWidth * 1.04);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, -boss.laserWidth * 0.26, 740, boss.laserWidth * 0.52);
            ctx.beginPath();
            ctx.arc(0, 0, boss.laserWidth * 0.95, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }

        ctx.save();
        ctx.translate(boss.x, boss.y);
        const corePulse = 11 + Math.sin(tNow * 0.015) * 2.2;
        const hit = boss.hitFlash > 0;

        if (boss.kind === 'prism') {
          // 苍蓝棱镜：外层旋转水晶环 + 棱镜装甲
          ctx.save();
          ctx.rotate(tNow * 0.0014);
          ctx.strokeStyle = hit ? '#ffffff' : '#38bdf8';
          ctx.lineWidth = 2;
          for (let k = 0; k < 4; k += 1) {
            ctx.rotate(Math.PI * 0.5);
            ctx.beginPath();
            ctx.moveTo(0, -48);
            ctx.lineTo(12, -32);
            ctx.lineTo(-12, -32);
            ctx.closePath();
            ctx.fillStyle = hit ? '#ffffff' : 'rgba(14, 165, 233, 0.72)';
            ctx.fill();
            ctx.stroke();
          }
          ctx.restore();
          ctx.beginPath();
          ctx.moveTo(0, 38);
          ctx.lineTo(36, 0);
          ctx.lineTo(0, -34);
          ctx.lineTo(-36, 0);
          ctx.closePath();
          ctx.fillStyle = hit ? '#ffffff' : '#0369a1';
          ctx.fill();
          ctx.strokeStyle = '#7dd3fc';
          ctx.lineWidth = 2.4;
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(0, 2, corePulse, 0, Math.PI * 2);
          ctx.fillStyle = '#22d3ee';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(0, 2, 5.5, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
        } else if (boss.kind === 'mothership') {
          // 紫曜母舰：宽体双翼机库 + 双门激光发射器
          for (const fx of [-22, 0, 22]) {
            ctx.fillStyle = '#e879f9';
            ctx.beginPath();
            ctx.moveTo(fx - 4, -34);
            ctx.lineTo(fx, -46 - Math.sin(tNow * 0.03) * 4);
            ctx.lineTo(fx + 4, -34);
            ctx.closePath();
            ctx.fill();
          }
          ctx.beginPath();
          ctx.moveTo(0, 34);
          ctx.lineTo(54, 12);
          ctx.lineTo(50, -24);
          ctx.lineTo(22, -36);
          ctx.lineTo(-22, -36);
          ctx.lineTo(-50, -24);
          ctx.lineTo(-54, 12);
          ctx.closePath();
          ctx.fillStyle = hit ? '#ffffff' : '#4c1d95';
          ctx.fill();
          ctx.strokeStyle = '#c084fc';
          ctx.lineWidth = 2.5;
          ctx.stroke();
          // 两侧舰载格纳库与炮管
          ctx.fillStyle = hit ? '#ffffff' : '#2e1065';
          ctx.fillRect(-38, -14, 18, 28);
          ctx.fillRect(20, -14, 18, 28);
          ctx.fillStyle = '#f0abfc';
          ctx.fillRect(-34, 14, 10, 8);
          ctx.fillRect(24, 14, 10, 8);
          ctx.beginPath();
          ctx.arc(0, 4, corePulse + 1, 0, Math.PI * 2);
          ctx.fillStyle = '#a855f7';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(0, 4, 6, 0, Math.PI * 2);
          ctx.fillStyle = '#fef08a';
          ctx.fill();
        } else {
          // 绯红裁决者：锐利倒三角主舰 + 侧翼装甲线条
          for (const fx of [-16, 16]) {
            ctx.fillStyle = '#fb7185';
            ctx.beginPath();
            ctx.moveTo(fx - 4, -32);
            ctx.lineTo(fx, -45 - Math.sin(tNow * 0.032) * 4);
            ctx.lineTo(fx + 4, -32);
            ctx.closePath();
            ctx.fill();
          }
          ctx.beginPath();
          ctx.moveTo(0, 40);
          ctx.lineTo(48, 8);
          ctx.lineTo(42, -24);
          ctx.lineTo(18, -34);
          ctx.lineTo(-18, -34);
          ctx.lineTo(-42, -24);
          ctx.lineTo(-48, 8);
          ctx.closePath();
          ctx.fillStyle = hit ? '#ffffff' : '#881337';
          ctx.fill();
          ctx.strokeStyle = '#fb7185';
          ctx.lineWidth = 2.5;
          ctx.stroke();
          ctx.fillStyle = hit ? '#ffffff' : '#4c0519';
          ctx.beginPath();
          ctx.moveTo(0, 26);
          ctx.lineTo(24, -12);
          ctx.lineTo(-24, -12);
          ctx.closePath();
          ctx.fill();
          ctx.beginPath();
          ctx.arc(0, 3, corePulse, 0, Math.PI * 2);
          ctx.fillStyle = '#f43f5e';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(0, 3, 6, 0, Math.PI * 2);
          ctx.fillStyle = '#fef08a';
          ctx.fill();
        }
        ctx.restore();
      }

      function draw() {
        const tNow = performance.now();
        ctx.save();
        if (shakeTimer > 0) {
          ctx.translate((Math.random() - 0.5) * shakeMag * 2, (Math.random() - 0.5) * shakeMag * 2);
        }

        // 深空背景
        const bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#050816');
        bg.addColorStop(0.55, '#0b132b');
        bg.addColorStop(1, '#050711');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        for (const nb of nebulae) {
          const ng = ctx.createRadialGradient(nb.x, nb.y, 10, nb.x, nb.y, nb.r);
          ng.addColorStop(0, nb.color);
          ng.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = ng;
          ctx.fillRect(0, 0, W, H);
        }

        // 远景带环行星
        ctx.save();
        ctx.translate(planet.x, planet.y);
        const pg = ctx.createRadialGradient(-planet.r * 0.35, -planet.r * 0.35, 6, 0, 0, planet.r);
        pg.addColorStop(0, 'rgba(96, 165, 250, 0.35)');
        pg.addColorStop(0.65, 'rgba(30, 64, 175, 0.2)');
        pg.addColorStop(1, 'rgba(15, 23, 42, 0.04)');
        ctx.fillStyle = pg;
        ctx.beginPath();
        ctx.arc(0, 0, planet.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.rotate(-0.32);
        ctx.beginPath();
        ctx.ellipse(0, 0, planet.r * 1.65, planet.r * 0.34, 0, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(125, 211, 252, 0.2)';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();

        // 背景流星
        for (const m of meteors) {
          ctx.save();
          ctx.globalAlpha = Math.min(0.65, m.life * 0.8);
          const mag = Math.hypot(m.vx, m.vy) || 1;
          const tx = m.x - (m.vx / mag) * m.len;
          const ty = m.y - (m.vy / mag) * m.len;
          const mg = ctx.createLinearGradient(m.x, m.y, tx, ty);
          mg.addColorStop(0, '#e0f2fe');
          mg.addColorStop(1, 'rgba(224, 242, 254, 0)');
          ctx.strokeStyle = mg;
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(m.x, m.y);
          ctx.lineTo(tx, ty);
          ctx.stroke();
          ctx.restore();
        }

        // Boss 登场红色警戒边缘光效
        if (bossAlertAlpha > 0) {
          ctx.save();
          ctx.globalAlpha = bossAlertAlpha * (0.22 + Math.sin(tNow * 0.024) * 0.14);
          const rg = ctx.createRadialGradient(W * 0.5, H * 0.5, W * 0.25, W * 0.5, H * 0.5, H * 0.65);
          rg.addColorStop(0, 'rgba(239, 68, 68, 0)');
          rg.addColorStop(1, 'rgba(239, 68, 68, 0.85)');
          ctx.fillStyle = rg;
          ctx.fillRect(0, 0, W, H);
          ctx.restore();
        }

        // 星空（超载暴走时拉成流光线条）
        const warp = player.overdriveTimer > 0;
        for (const s of stars) {
          ctx.globalAlpha = s.alpha;
          if (warp) {
            ctx.strokeStyle = s.tint;
            ctx.lineWidth = s.r;
            ctx.beginPath();
            ctx.moveTo(s.x, s.y);
            ctx.lineTo(s.x, s.y - 12);
            ctx.stroke();
          } else {
            ctx.fillStyle = s.tint;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.globalAlpha = 1;

        // 道具胶囊（高辨识度矢量图标）
        const pickupThemes = {
          weapon: { bg: '#d97706', rim: '#fde047' },
          shield: { bg: '#0891b2', rim: '#67e8f9' },
          overdrive: { bg: '#7c3aed', rim: '#e9d5ff' },
          heal: { bg: '#16a34a', rim: '#86efac' },
          emp: { bg: '#0284c7', rim: '#7dd3fc' },
        };
        for (const pk of pickups) {
          const th = pickupThemes[pk.type];
          const r = pk.r;
          ctx.save();
          ctx.translate(pk.x, pk.y);
          // 外脉冲光环
          ctx.beginPath();
          ctx.arc(0, 0, r + 3.5 + Math.sin(tNow * 0.012) * 1.6, 0, Math.PI * 2);
          ctx.strokeStyle = th.rim;
          ctx.globalAlpha = 0.55;
          ctx.lineWidth = 1.6;
          ctx.stroke();
          ctx.globalAlpha = 1;

          // 六边形微光底盘
          ctx.beginPath();
          for (let k = 0; k < 6; k += 1) {
            const a = (Math.PI * k) / 3 - Math.PI / 6;
            const px = Math.cos(a) * r;
            const py = Math.sin(a) * r;
            if (k === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fillStyle = th.bg;
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.6;
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.strokeStyle = '#ffffff';
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          if (pk.type === 'weapon') {
            // 双/三连箭头火炮图标
            ctx.lineWidth = 2.1;
            ctx.beginPath();
            ctx.moveTo(-4, 2);
            ctx.lineTo(0, -4.5);
            ctx.lineTo(4, 2);
            ctx.moveTo(-5.5, 6);
            ctx.lineTo(0, 0);
            ctx.lineTo(5.5, 6);
            ctx.stroke();
          } else if (pk.type === 'shield') {
            // 盾牌轮廓
            ctx.lineWidth = 1.7;
            ctx.beginPath();
            ctx.moveTo(0, -6.5);
            ctx.lineTo(6, -3.5);
            ctx.lineTo(5, 3);
            ctx.lineTo(0, 7);
            ctx.lineTo(-5, 3);
            ctx.lineTo(-6, -3.5);
            ctx.closePath();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.fill();
            ctx.stroke();
          } else if (pk.type === 'overdrive') {
            // 闪电图标
            ctx.beginPath();
            ctx.moveTo(1.5, -7);
            ctx.lineTo(-4.5, 1);
            ctx.lineTo(0, 1);
            ctx.lineTo(-1.5, 7);
            ctx.lineTo(4.5, -1);
            ctx.lineTo(0, -1);
            ctx.closePath();
            ctx.fill();
          } else if (pk.type === 'heal') {
            // 医疗十字
            ctx.fillRect(-2, -6, 4, 12);
            ctx.fillRect(-6, -2, 12, 4);
          } else if (pk.type === 'emp') {
            // 同心电磁脉冲环
            ctx.lineWidth = 1.7;
            ctx.beginPath();
            ctx.arc(0, 0, 6, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        // 己方子弹
        for (const b of bullets) {
          ctx.save();
          ctx.fillStyle = b.color;
          ctx.beginPath();
          ctx.roundRect(b.x - b.r * 0.55, b.y - 9, b.r * 1.1, 16, 3);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.roundRect(b.x - 1.2, b.y - 7, 2.4, 11, 1.5);
          ctx.fill();
          ctx.restore();
        }

        // 敌机与 Boss
        for (const e of enemies) drawEnemy(e, tNow);
        drawBoss(tNow);

        // 敌方弹幕（高对比亮心）
        for (const eb of enemyBullets) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(eb.x, eb.y, eb.r + 2, 0, Math.PI * 2);
          ctx.fillStyle = eb.color;
          ctx.globalAlpha = 0.45;
          ctx.fill();
          ctx.globalAlpha = 1;
          ctx.beginPath();
          ctx.arc(eb.x, eb.y, eb.r, 0, Math.PI * 2);
          ctx.fillStyle = eb.color;
          ctx.fill();
          ctx.beginPath();
          ctx.arc(eb.x, eb.y, eb.r * 0.48, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          ctx.restore();
        }

        // 自机与炮口闪光
        drawPlayer(tNow);
        for (const mf of muzzleFlashes) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, mf.life / mf.maxLife);
          const mg = ctx.createRadialGradient(mf.x, mf.y, 1, mf.x, mf.y, mf.r);
          mg.addColorStop(0, '#ffffff');
          mg.addColorStop(0.5, mf.color);
          mg.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = mg;
          ctx.beginPath();
          ctx.arc(mf.x, mf.y, mf.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // 脉冲清屏波
        if (empWave) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, empWave.life / empWave.maxLife);
          ctx.strokeStyle = '#7dd3fc';
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.arc(empWave.x, empWave.y, empWave.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        // 冲击波与粒子
        for (const sw of shockwaves) {
          const p = 1 - sw.life / sw.maxLife;
          ctx.save();
          ctx.globalAlpha = Math.max(0, (1 - p) * 0.8);
          ctx.strokeStyle = sw.color;
          ctx.lineWidth = 3 * (1 - p);
          ctx.beginPath();
          ctx.arc(sw.x, sw.y, sw.r + (sw.maxR - sw.r) * p, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
        for (const p of particles) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        for (const d of debris) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, d.life / d.maxLife);
          ctx.translate(d.x, d.y);
          ctx.rotate(d.rot);
          ctx.fillStyle = d.color;
          ctx.fillRect(-d.w * 0.5, -d.h * 0.5, d.w, d.h);
          ctx.restore();
        }

        // 右上角连击与得分倍率指示器
        if (state === 'playing' && combo >= 2 && comboTimer > 0) {
          ctx.save();
          const mult = combo >= 12 ? '1.5×' : (combo >= 6 ? '1.25×' : '');
          const label = mult ? `${combo} COMBO · ${mult}` : `${combo} COMBO`;
          ctx.font = '800 12px ui-sans-serif, system-ui, sans-serif';
          const tw = ctx.measureText(label).width + 18;
          const bx = W - tw - 12;
          const by = boss ? 46 : 14;
          ctx.fillStyle = 'rgba(15, 23, 42, 0.72)';
          ctx.beginPath();
          ctx.roundRect(bx, by, tw, 24, 999);
          ctx.fill();
          ctx.strokeStyle = combo >= 12 ? '#fde047' : (combo >= 6 ? '#38bdf8' : 'rgba(148, 163, 184, 0.5)');
          ctx.lineWidth = 1.4;
          ctx.stroke();
          ctx.fillStyle = combo >= 12 ? '#fde047' : (combo >= 6 ? '#7dd3fc' : '#e2e8f0');
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(label, bx + tw * 0.5, by + 11.5);
          // 倒计时细进度条
          const barW = (tw - 16) * Math.max(0, Math.min(1, comboTimer / 2.8));
          ctx.fillStyle = combo >= 12 ? '#fde047' : '#38bdf8';
          ctx.fillRect(bx + 8, by + 20, barW, 2);
          ctx.restore();
        }

        // 飘字
        for (const ft of floatTexts) {
          ctx.save();
          ctx.globalAlpha = Math.min(1, (ft.life / ft.maxLife) * 1.4);
          ctx.font = `900 ${Math.round(16 * ft.scale)}px ui-sans-serif, system-ui, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.lineWidth = 3.5;
          ctx.strokeStyle = 'rgba(2, 6, 23, 0.82)';
          ctx.strokeText(ft.text, ft.x, ft.y);
          ctx.fillStyle = ft.color;
          ctx.fillText(ft.text, ft.x, ft.y);
          ctx.restore();
        }

        // 波次播报条
        if (waveBannerTimer > 0 && waveBanner) {
          ctx.save();
          ctx.globalAlpha = Math.min(1, waveBannerTimer * 1.6);
          ctx.font = '900 18px ui-sans-serif, system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = boss ? '#fca5a5' : '#93c5fd';
          ctx.strokeStyle = 'rgba(2, 6, 23, 0.85)';
          ctx.lineWidth = 4;
          ctx.strokeText(waveBanner, W * 0.5, H * 0.42);
          ctx.fillText(waveBanner, W * 0.5, H * 0.42);
          ctx.restore();
        }

        if (flashAlpha > 0) {
          ctx.save();
          ctx.globalAlpha = flashAlpha;
          ctx.fillStyle = flashColor;
          ctx.fillRect(0, 0, W, H);
          ctx.restore();
        }

        ctx.restore();
      }

      // 输入事件（触屏相对拖动 + 鼠标跟随 + 键盘）
      function toCanvasPoint(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: ((event.clientX - rect.left) / rect.width) * W,
          y: ((event.clientY - rect.top) / rect.height) * H,
        };
      }

      canvas.addEventListener('pointerdown', (event) => {
        if (state !== 'playing') return;
        const pt = toCanvasPoint(event);
        if (event.pointerType === 'mouse') {
          mouseTarget = pt;
          return;
        }
        if (!event.isPrimary) return;
        activeTouchId = event.pointerId;
        touchLastPt = pt;
        try { canvas.setPointerCapture(event.pointerId); } catch {}
      });

      canvas.addEventListener('pointermove', (event) => {
        if (state !== 'playing') return;
        const pt = toCanvasPoint(event);
        if (event.pointerType === 'mouse') {
          mouseTarget = pt;
          return;
        }
        if (event.pointerId !== activeTouchId || !touchLastPt) return;
        player.x += pt.x - touchLastPt.x;
        player.y += (pt.y - touchLastPt.y) * 1.05;
        player.x = Math.max(22, Math.min(W - 22, player.x));
        player.y = Math.max(54, Math.min(H - 28, player.y));
        touchLastPt = pt;
      });

      function endTouch(event) {
        if (event.pointerType === 'mouse') {
          if (event.type === 'pointerleave') mouseTarget = null;
          return;
        }
        if (event.pointerId === activeTouchId) {
          activeTouchId = null;
          touchLastPt = null;
        }
      }
      canvas.addEventListener('pointerup', endTouch);
      canvas.addEventListener('pointercancel', endTouch);
      canvas.addEventListener('lostpointercapture', endTouch);
      canvas.addEventListener('pointerleave', endTouch);

      document.addEventListener('keydown', (event) => {
        if (GameKit.shouldIgnoreGameKey(event, { ignoreOnControl: true })) return;
        if (GameKit.isTutorialOpen() || (window.SiteData && SiteData.isDialogOpen())) return;
        keys[event.code] = true;

        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(event.code)) {
          event.preventDefault();
        }
        if (event.code === 'KeyP') {
          if (state === 'playing') pauseGame();
          else if (state === 'paused') resumeGame();
        } else if (event.code === 'Space') {
          if (state === 'playing') triggerEmp();
          else if (state === 'ready' || state === 'over') startGame();
          else if (state === 'paused') resumeGame();
        } else if (event.code === 'Enter') {
          if (state === 'ready' || state === 'over') startGame();
          else if (state === 'paused') resumeGame();
        }
      });

      document.addEventListener('keyup', (event) => {
        keys[event.code] = false;
      });

      window.addEventListener('blur', clearKeys);

      empBtn.addEventListener('click', triggerEmp);
      overlayBtn.addEventListener('click', () => {
        if (state === 'paused') resumeGame();
        else startGame();
      });
      pauseBtn.addEventListener('click', () => {
        if (state === 'playing') pauseGame();
        else if (state === 'paused') resumeGame();
      });
      restartBtn.addEventListener('click', async () => {
        if (await confirmAbandonIfActive()) startGame();
      });

      async function switchMode(nextMode) {
        if (nextMode === mode) return;
        if (!(await confirmAbandonIfActive())) return;
        mode = nextMode;
        writeStored(MODE_KEY, mode);
        syncModeButtons();
        resetState('ready');
      }
      modeStandardBtn.addEventListener('click', () => switchMode('standard'));
      modeAceBtn.addEventListener('click', () => switchMode('ace'));

      skinBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          const next = btn.dataset.skin;
          if (!SKINS[next]) return;
          skin = next;
          writeStored(SKIN_KEY, skin);
          syncModeButtons();
        });
      });

      function openTutorial(force) {
        if (state === 'playing') pauseGame();
        GameKit.showTutorial({
          id: 'space',
          force: !!force,
          steps: [
            {
              icon: 'game-space',
              title: t('拖动战机迎战'),
              text: t('手机在画布内拖动、电脑移动鼠标或按方向键/WASD 控制战机走位，主炮会自动连射。'),
            },
            {
              icon: 'art-zap',
              title: t('拾取强化与脉冲清屏'),
              text: t('击毁敌机掉落火力升级、护盾、超载与修甲道具；危机时按空格或点脉冲按钮消除全屏弹幕！'),
            },
            {
              icon: 'art-explosion',
              title: t('迎战星际 Boss'),
              text: t('每 5 波登场 1 架旗舰 Boss，看到激光预警线请立刻走位躲避，击破 Boss 补充脉冲次数。'),
            },
          ],
        });
      }

      helpBtn.addEventListener('click', () => openTutorial(true));
      GameKit.onHidden(pauseGame);
      document.addEventListener('site:dialogopen', () => {
        clearKeys();
        pauseGame();
      });
      document.addEventListener('i18n:change', () => {
        renderHud();
        renderOverlay();
      });

      let lastTime = performance.now();
      function frame(now) {
        const dt = Math.min(0.05, Math.max(0, (now - lastTime) / 1000));
        lastTime = now;
        update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      syncModeButtons();
      resetState('ready');
      GameKit.mountMoreGames('space', document.getElementById('more-games'));
      requestAnimationFrame(frame);
      openTutorial(false);
    })();
  </script>
</body>
</html>
