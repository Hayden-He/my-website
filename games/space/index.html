                enemyBullets.push({ x: source.x + offset, y: source.y + 30,
                  vx: 0, vy: 420, r: 8, color, crystal: true });
              }
            }
            return finished;
          }
        }
        return false;
      }

      function beamHitsPlayer(beam, width) {
        const dx = Math.cos(beam.angle);
        const dy = Math.sin(beam.angle);
        const px = player.x - beam.x;
        const py = player.y - beam.y;
        const along = px * dx + py * dy;
        return along > 0 && along < BOSS_BEAM_LENGTH && Math.abs(px * dy - py * dx) <= width;
      }

      function bossHullImpactTime(x, y, padding, previousX = x, previousY = y) {
        const carrier = boss.kind === 'mothership';
        const width = carrier ? (boss.phase === 2 ? 69 : 61) : boss.r;
        const height = carrier ? 42 : boss.r;
        return ellipseImpactTime(x, y, previousX, previousY, boss.x, boss.y, width + padding, height + padding);
      }

      function prismRetreat() {
        boss.vx = -boss.vx;
        setBossManeuver('retreat', 0.43);
      }

      function updatePrismBoss(dt) {
        if (boss.maneuver !== 'patrol') {
          updatePrismManeuver(dt);
        } else if (boss.y < boss.targetY) {
          boss.y = Math.min(boss.targetY, boss.y + BOSS_ENTRY_SPEED * dt);
        } else {
          patrolBoss(dt);
          boss.patternTimer -= dt;
          if (boss.patternTimer <= 0) {
            boss.patternIndex = (boss.patternIndex + 1) % 3;
            if (boss.patternIndex === 1) {
              startPrismSoloAttack('fan');
            } else if (boss.patternIndex === 2) {
              startPrismReflection();
            } else {
              startPrismSoloAttack('sweep');
            }
          }
        }
      }

      function updatePrismManeuver(dt) {
        const before = boss.maneuverTimer;
        boss.maneuverTimer = Math.max(0, boss.maneuverTimer - dt);
        switch (boss.maneuver) {
          case 'reflect-warn':
            if (boss.maneuverTimer === 0) setBossManeuver('reflect', mode === 'ace' ? 2.10 : 1.80);
            break;
          case 'reflect': {
            const shield = boss.prismReflect;
            shield.cooldown = Math.max(0, shield.cooldown - dt);
            for (let i = 0; i < shield.panels.length; i += 1) {
              shield.panels[i] = Math.max(0, shield.panels[i] - dt);
            }
            if (boss.maneuverTimer === 0) endPrismReflection();
            break;
          }
          case 'mirror':
            updatePrismMirror(dt);
            break;
          case 'attack':
            if (updatePrismAttack(dt)) {
              const { kind } = boss.prismAttack;
              boss.prismAttack = null;
              if (boss.phase === 2) {
                prismRetreat();
              } else if (kind === 'fan') {
                boss.patternTimer = mode === 'ace' ? 0.66 : 0.90;
                setBossManeuver('patrol', 0);
              } else {
                setBossManeuver('recover', mode === 'ace' ? 0.58 : 0.72);
              }
            }
            break;
          case 'transform':
            if (boss.maneuverTimer === 0) {
              boss.phase = 2;
              boss.patternIndex = 0;
              setBossManeuver('reposition', 0.42);
            }
            break;
          case 'reposition': {
            // 留出两侧的躲避通道，先横移，再进入玩家视野的中段。
            const target = W * 0.5;
            boss.x += Math.sign(target - boss.x) * Math.min(Math.abs(target - boss.x), 465 * dt);
            if (boss.maneuverTimer === 0) setBossManeuver('advance', 0.39);
            break;
          }
          case 'advance':
            boss.y = Math.min(188, boss.y + 265 * dt);
            if (boss.maneuverTimer === 0) {
              const attack = PRISM_PHASE_TWO_ATTACKS[boss.patternIndex];
              boss.patternIndex = (boss.patternIndex + 1) % PRISM_PHASE_TWO_ATTACKS.length;
              switch (attack) {
                case 'mirror': startPrismMirror(); break;
                case 'sweep':
                case 'barrage': startPrismSoloAttack(attack); break;
                case 'reflect': startPrismReflection(); break;
              }
            }
            break;
          case 'retreat': {
            boss.y = Math.max(boss.targetY, boss.y - 230 * dt);
            const side = W * 0.5 + Math.sign(boss.vx) * 82;
            boss.x += Math.sign(side - boss.x) * Math.min(Math.abs(side - boss.x), 205 * dt);
            if (mode === 'ace' && before > 0.18 && boss.maneuverTimer <= 0.18) {
              for (const offset of [-24, 24]) {
                const x = boss.x + offset;
                const y = boss.y + 27;
                const angle = Math.atan2(player.y - y, player.x - x);
                enemyBullets.push({ x, y, vx: Math.cos(angle) * 225, vy: Math.sin(angle) * 225,
                  r: 5.5, color: '#c4b5fd' });
              }
            }
            if (boss.maneuverTimer === 0) setBossManeuver('recover', mode === 'ace' ? 0.78 : 1.08);
            break;
          }
          case 'recover':
            if (boss.maneuverTimer === 0) {
              if (boss.phase === 1) {
                boss.patternTimer = 0.18;
                setBossManeuver('patrol', 0);
              } else {
                setBossManeuver('reposition', 0.42);
              }
            }
            break;
        }
      }

      function maybeDropPickup(x, y, guaranteed, allowEmp) {
        if (!guaranteed && Math.random() > 0.18) return;
        const pool = ['weapon', 'weapon', 'shield', 'overdrive'];
        if (player.hp < player.maxHp) pool.push('heal', 'heal');
        else pool.push('heal');
        if (allowEmp !== false && player.empCharges < 3 && Math.random() < 0.14) {
          pool.push('emp');
        }
        spawnPickup(pool[Math.floor(Math.random() * pool.length)], x, y);
      }

      function spawnPickup(type, x, y) {
        pickups.push({
          type,
          x: Math.max(24, Math.min(W - 24, x)),
          y,
          vy: 92,
          r: 14,
          life: 0,
        });
      }

      function firePlayerWeapons() {
        const sk = SKINS[skin];
        const overdrive = player.overdriveTimer > 0;
        const lv = player.weaponLv;
        const heavyCannon = lv === MAX_WEAPON_LEVEL;
        const y0 = player.y - 22;
        const dmg = overdrive ? 1.35 : 1;
        const spd = -650;

        function pushBolt(x, y, vx, vy, color, heavy = false) {
          bullets.push({
            x,
            y,
            vx,
            vy,
            r: heavy ? 6 : overdrive ? 5 : 4,
            dmg: heavy ? dmg + 0.8 : dmg,
            style: skin,
            color: color || (overdrive ? '#fde047' : sk.bolt),
            heavy,
          });
        }

        function pushFlash(x, y, r, color = sk.bolt, life = 0.06) {
          muzzleFlashes.push({ x, y, r, color, style: skin, life, maxLife: life });
        }

        if (lv === 1) {
          pushBolt(player.x, y0, 0, spd);
          pushFlash(player.x, y0, 9);
        } else if (lv === 2) {
          pushBolt(player.x - 10, y0 + 4, 0, spd);
          pushBolt(player.x + 10, y0 + 4, 0, spd);
          pushFlash(player.x - 10, y0 + 2, 8);
          pushFlash(player.x + 10, y0 + 2, 8);
        } else if (lv === 3) {
          pushBolt(player.x, y0, 0, spd);
          pushBolt(player.x - 12, y0 + 6, -55, spd * 0.96);
          pushBolt(player.x + 12, y0 + 6, 55, spd * 0.96);
          pushFlash(player.x, y0, 11);
        } else {
          pushBolt(player.x - 7, y0, 0, spd);
          pushBolt(player.x + 7, y0, 0, spd);
          pushBolt(player.x - 16, y0 + 8, -95, spd * 0.94);
          pushBolt(player.x + 16, y0 + 8, 95, spd * 0.94);
          pushBolt(player.x, y0 - 4, 0, spd * 1.06, heavyCannon ? sk.heavy.color : '#ffffff', heavyCannon);
          pushFlash(player.x, y0 - 3, heavyCannon ? 19 : 13, heavyCannon ? sk.heavy.edge : overdrive ? '#fde047' : '#ffffff', 0.065);
        }
        if (heavyCannon) playWeaponAccent('heavyShot');
        playShoot(sk.shot, overdrive, heavyCannon ? 0.50 : 1);
      }

      function fireBlastRound(dt) {
        player.blastCd = Math.max(0, player.blastCd - dt);
        if (player.blastAmmo === 0 || player.blastCd > 0) return;
        const y = player.y - 22;
        const onCourse = (target, radius, vx = 0, vy = 0) => {
          if (target.y < 0 || target.y >= y) return false;
          const travel = (y - target.y) / (BLAST_SPEED + vy);
          return Math.abs(target.x + vx * travel - player.x) <= radius + 6;
        };
        let aimed = enemies.some((e) => onCourse(e, e.r, e.vx, e.vy));
        if (!aimed && boss) {
          const bodyWidth = boss.kind === 'mothership' ? (boss.phase === 2 ? 69 : 61) : boss.r;
          const bodyReady = boss.maneuver !== 'transform' && boss.y >= boss.targetY - 12;
          const mirror = boss.prismMirror;
          aimed = (bodyReady && onCourse(boss, bodyWidth, boss.maneuver === 'patrol' ? boss.vx : 0))
            || (mirror && mirror.age >= PRISM_MIRROR_DEPLOY_SECONDS && onCourse(mirror, mirror.r))
            || (boss.guard && onCourse(boss.guard, CRIMSON_GUARD_HALF_WIDTH))
            || boss.supports?.some((craft) => onCourse(craft, 16));
        }
        if (!aimed) return;

        player.blastAmmo -= 1;
        player.blastCd = BLAST_INTERVAL;
        bullets.push({ x: player.x, y, vx: 0, vy: -BLAST_SPEED, r: 6, dmg: BLAST_DAMAGE,
          color: '#fb923c', explosive: true });
      }

      function detonateBlastRound(bullet) {
        const { x, y, dmg } = bullet;
        const withinBlast = (target, radius) =>
          (target.x - x) ** 2 + (target.y - y) ** 2 <= (BLAST_RADIUS + radius) ** 2;
        spawnExplosion(x, y, '#fb923c', 24, BLAST_RADIUS, 7, true);
        playWeaponAccent('blastImpact');
        for (let i = enemies.length - 1; i >= 0; i -= 1) {
          const e = enemies[i];
          if (!withinBlast(e, e.r)) continue;
          e.hp -= dmg;
          e.hitFlash = 0.10;
          if (e.hp <= 0) destroyEnemy(i);
        }

        // Resolve hull damage before the blast can destroy the shield links.
        if (boss && boss.y >= boss.targetY - 12 && bossHullImpactTime(x, y, BLAST_RADIUS) !== null) damageBoss(dmg, 0.10);
        if (boss?.guard && withinBlast(boss.guard, CRIMSON_GUARD_HALF_WIDTH)) damageCrimsonGuard(dmg);
        const mirror = boss?.prismMirror;
        if (mirror && mirror.age >= PRISM_MIRROR_DEPLOY_SECONDS && withinBlast(mirror, mirror.r)) damagePrismMirror(dmg);
        if (boss?.supports) {
          for (let i = boss.supports.length - 1; i >= 0; i -= 1) {
            if (withinBlast(boss.supports[i], 16)) damageMothershipSupport(i, dmg);
          }
        }
      }

      function collectPickup(pickup) {
        const { x, y } = pickup;
        const type = pickup.type === 'weapon' && player.weaponLv >= MAX_WEAPON_LEVEL ? 'blast' : pickup.type;
        let label;
        let duplicatePoints = 0;
        if (type === 'weapon') {
          player.weaponLv += 1;
          label = t('火力 Lv.{lv}!', { lv: player.weaponLv });
        } else if (type === 'blast') {
          player.blastAmmo += BLAST_AMMO_PER_PICKUP;
          label = t('爆破弹 +{count}', { count: BLAST_AMMO_PER_PICKUP });
        } else if (type === 'shield') {
          if (!player.hasShield) {
            player.hasShield = true;
            label = t('能量护盾!');
          } else {
            duplicatePoints = 40;
          }
        } else if (type === 'overdrive') {
          if (player.overdriveTimer === 0) {
            shockwaves.push({ x: player.x, y: player.y, r: 15, maxR: 58,
              color: SKINS[skin].boostColor, life: 0.28, maxLife: 0.28 });
            playWeaponAccent('overdriveStart');
          }
          player.overdriveTimer = OVERDRIVE_SECONDS;
          label = t('超载暴走!');
        } else if (type === 'heal') {
          if (player.hp < player.maxHp) {
            player.hp += 1;
            label = t('护甲 +1');
          } else {
            duplicatePoints = 50;
          }
        } else {
          if (player.empCharges < 3) {
            player.empCharges += 1;
            label = t('+1 脉冲!');
          } else {
            duplicatePoints = 60;
          }
        }

        playPowerup(type);
        if (duplicatePoints) {
          label = '+' + addScore(duplicatePoints);
        } else {
          pickupCue = { type, remaining: PICKUP_CUE_SECONDS };
        }
        addFloatText(x, y - 8, label, PICKUP_THEMES[type].rim, duplicatePoints ? 1.1 : 1.25);
      }

      function triggerEmp() {
        if (state !== 'playing' || player.empCharges <= 0 || empCooldown > 0 || boss?.maneuver === 'transform') return;
        player.empCharges -= 1;
        empCooldown = 0.6;
        empWave = { x: player.x, y: player.y, r: 24, maxR: 620, life: 0.45, maxLife: 0.45 };
        flashColor = '#7dd3fc';
        flashAlpha = 0.42;
        triggerShake(10, 0.35);
        playEmp();

        // 清除敌方弹幕，重创常规敌机与 Boss
        enemyBullets = [];
        for (let i = enemies.length - 1; i >= 0; i -= 1) {
          const e = enemies[i];
          e.hp -= 12;
          e.hitFlash = 0.14;
          if (e.hp <= 0) {
            destroyEnemy(i);
          }
        }
        if (boss) {
          if (boss.guard) destroyCrimsonGuard();
          if (boss.supports?.length) boss.supportJam = 1.30;
          if (boss.prismReflect) endPrismReflection();
          damageBoss(28, 0.14);
        }
        addFloatText(player.x, player.y - 34, t('脉冲清屏！'), '#7dd3fc', 1.3);
        renderHud();
      }

      function damagePlayer() {
        if (player.invulnTimer > 0 || player.overdriveTimer > 0) return;
        if (boss?.campSpot) boss.campSpot = null;
        if (player.hasShield) {
          player.hasShield = false;
          player.invulnTimer = 1.1;
          playPlayerHit();
          spawnExplosion(player.x, player.y, '#38bdf8', 16, 65);
          triggerShake(7, 0.22);
          addFloatText(player.x, player.y - 26, t('护盾抵消！'), '#67e8f9', 1.2);
          renderHud();
          return;
        }
        player.hp -= 1;
        player.invulnTimer = 1.6;
        if (player.weaponLv > 1) player.weaponLv -= 1;
        combo = 0;
        comboTimer = 0;
        playPlayerHit();
        flashColor = '#ef4444';
        flashAlpha = 0.38;
        triggerShake(11, 0.35);
        spawnExplosion(player.x, player.y, '#f97316', 20, 72);
        renderHud();
        if (player.hp <= 0) {
          player.hp = 0;
          playExplode(true);
          endGame();
        }
      }

      function destroyEnemy(index) {
        const e = enemies[index];
        enemies.splice(index, 1);
        kills += 1;
        combo += 1;
        comboTimer = 2.6;
        if (combo > maxCombo) maxCombo = combo;
        if (combo === 6 || combo === 12 || combo === 20) {
          playComboMilestone();
          addFloatText(player.x, player.y - 38, t('×{c} 连击！', { c: combo }), '#38bdf8', 1.25);
        }
        const gained = addScore(e.pts);
        const col = e.kind === 'asteroid' ? (e.rockStyle === 'shard' ? '#e9ad82' : '#94a3b8')
          : e.kind === 'gunship' ? '#f59e0b'
          : e.kind === 'drone' ? '#a855f7'
          : e.kind === 'interceptor' ? '#34d399'
          : '#fb7185';
        spawnExplosion(e.x, e.y, col, e.kind === 'gunship' ? 22 : 14, e.r * 2.3);
        playExplode(e.kind === 'gunship');
        addFloatText(e.x, e.y - 8, '+' + gained, '#fef08a', e.kind === 'gunship' ? 1.15 : 0.92);
        maybeDropPickup(e.x, e.y, (e.kind === 'gunship' || e.kind === 'drone') && Math.random() < 0.42);
      }

      function defeatBoss() {
        if (!boss) return;
        defeatedBosses.set(boss.kind, (defeatedBosses.get(boss.kind) ?? 0) + 1);
        const bx = boss.x;
        const by = boss.y;
        const pts = addScore(boss.pts);
        kills += 1;
        combo += 1;
        comboTimer = 2.8;
        if (combo > maxCombo) maxCombo = combo;
        boss = null;
        enemyBullets = [];
        bossSupplyTimer = 0;
        flashColor = '#fde047';
        flashAlpha = 0.52;
        triggerShake(15, 0.55);
        playExplode(true);
        playWaveClear();
        spawnExplosion(bx, by, '#f97316', 46, 150, 14);
        addFloatText(bx, by, '+' + pts, '#fde047', 1.45);
        if (practiceTier) {
          endGame();
          return;
        }
        if (player.empCharges < 3) player.empCharges += 1;
        maybeDropPickup(bx - 26, by, true, false);
        maybeDropPickup(bx + 26, by, true, false);
        startWave(wave + 1);
      }

      function decayVisualEffects(dt) {
        if (pickupCue) {
          pickupCue.remaining -= dt;
          if (pickupCue.remaining <= 0) pickupCue = null;
        }
        if (shakeTimer > 0) shakeTimer = Math.max(0, shakeTimer - dt);
        if (flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - dt * 2.2);
        if (bossAlertAlpha > 0) bossAlertAlpha = Math.max(0, bossAlertAlpha - dt * 0.75);
        if (empWave) {
          empWave.life -= dt;
          const p = 1 - empWave.life / empWave.maxLife;
          empWave.r = 24 + (empWave.maxR - 24) * p;
          if (empWave.life <= 0) empWave = null;
        }
        for (let i = particles.length - 1; i >= 0; i -= 1) {
          const p = particles[i];
          p.life -= dt;
          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }
          p.x += p.vx * dt;
          p.y += p.vy * dt;
        }
        for (let i = debris.length - 1; i >= 0; i -= 1) {
          const d = debris[i];
          d.life -= dt;
          if (d.life <= 0) {
            debris.splice(i, 1);
            continue;
          }
          d.x += d.vx * dt;
          d.y += d.vy * dt;
          d.rot += d.vRot * dt;
        }
        for (let i = muzzleFlashes.length - 1; i >= 0; i -= 1) {
          muzzleFlashes[i].life -= dt;
          if (muzzleFlashes[i].life <= 0) muzzleFlashes.splice(i, 1);
        }
        for (let i = afterimages.length - 1; i >= 0; i -= 1) {
          afterimages[i].life -= dt;
          if (afterimages[i].life <= 0) afterimages.splice(i, 1);
        }
        for (let i = shockwaves.length - 1; i >= 0; i -= 1) {
          shockwaves[i].life -= dt;
          if (shockwaves[i].life <= 0) shockwaves.splice(i, 1);
        }
        for (let i = floatTexts.length - 1; i >= 0; i -= 1) {
          const ft = floatTexts[i];
          ft.life -= dt;
          ft.y -= 32 * dt;
          if (ft.life <= 0) floatTexts.splice(i, 1);
        }
      }

      function update(dt) {
        if (state === 'paused') return;
        backgroundTime += dt;
        sceneBlend = Math.min(1, sceneBlend + dt / 1.35);

        const starSpeedMult = player.overdriveTimer > 0 ? 2.4 : (state === 'ready' ? 0.55 : 1);
        for (const s of stars) {
          s.y += s.speed * starSpeedMult * dt;
          if (s.y > H + 4) {
            s.y = -4;
            s.x = Math.random() * W;
          }
        }
        meteorTimer -= dt;
        if (meteorTimer <= 0) {
          meteorTimer = 2.4 + Math.random() * 3.8;
          const fromLeft = Math.random() < 0.5;
          meteors.push({
            x: fromLeft ? Math.random() * W * 0.65 : W * 0.35 + Math.random() * W * 0.65,
            y: -16,
            vx: (fromLeft ? 1 : -1) * (150 + Math.random() * 110),
            vy: 340 + Math.random() * 140,
            len: 42 + Math.random() * 28,
            life: 1.4,
          });
        }
        for (let i = meteors.length - 1; i >= 0; i -= 1) {
          const m = meteors[i];
          m.x += m.vx * dt;
          m.y += m.vy * dt;
          m.life -= dt;
          if (m.life <= 0 || m.y > H + 80) meteors.splice(i, 1);
        }

        if (state === 'over') {
          decayVisualEffects(dt);
          return;
        }
        if (state === 'ready') {
          const nowS = performance.now() * 0.001;
          player.x = W * 0.5 + Math.sin(nowS * 1.15) * 32;
          player.y = H - 74 + Math.cos(nowS * 1.8) * 6;
          player.bank = Math.cos(nowS * 1.15) * 0.08;
          return;
        }
        if (state !== 'playing') return;

        // 计时器衰减
        if (player.invulnTimer > 0) player.invulnTimer = Math.max(0, player.invulnTimer - dt);
        if (player.overdriveTimer > 0) {
          const before = player.overdriveTimer;
          player.overdriveTimer = Math.max(0, before - dt);
          if (before > OVERDRIVE_END_CUE && player.overdriveTimer <= OVERDRIVE_END_CUE) {
            playWeaponAccent('overdriveEnding');
          }
        }
        if (empCooldown > 0) empCooldown = Math.max(0, empCooldown - dt);
        if (waveBannerTimer > 0) waveBannerTimer = Math.max(0, waveBannerTimer - dt);
        if (comboTimer > 0) {
          comboTimer -= dt;
          if (comboTimer <= 0) combo = 0;
        }

        // 战机键盘 / 鼠标移动
        player.prevX = player.x;
        let kx = 0;
        let ky = 0;
        if (keys.ArrowLeft || keys.KeyA) kx -= 1;
        if (keys.ArrowRight || keys.KeyD) kx += 1;
        if (keys.ArrowUp || keys.KeyW) ky -= 1;
        if (keys.ArrowDown || keys.KeyS) ky += 1;
        if (kx !== 0 || ky !== 0) {
          mouseTarget = null;
          const len = Math.hypot(kx, ky) || 1;
          player.x += (kx / len) * 355 * dt;
          player.y += (ky / len) * 355 * dt;
        } else if (mouseTarget) {
          const dx = mouseTarget.x - player.x;
          const dy = mouseTarget.y - player.y;
          const dist = Math.hypot(dx, dy);
          const step = Math.min(dist, 920 * dt);
          if (dist > 0.5) {
            player.x += (dx / dist) * step;
            player.y += (dy / dist) * step;
          }
          if (dist < 2) mouseTarget = null;
        }

        player.x = Math.max(22, Math.min(W - 22, player.x));
        player.y = Math.max(54, Math.min(H - 28, player.y));
        const vxEst = (player.x - player.prevX) / Math.max(0.001, dt);
        const targetBank = Math.max(-0.28, Math.min(0.28, vxEst * 0.00075));
        player.bank += (targetBank - player.bank) * Math.min(1, dt * 14);

        if (player.overdriveTimer > 0) {
          afterimageCd -= dt;
          if (afterimageCd <= 0) {
            afterimageCd = 0.045;
            afterimages.push({
              x: player.x,
              y: player.y,
              bank: player.bank,
              style: skin,
              life: 0.16,
              maxLife: 0.16,
            });
          }
        }

        // 自动开火
        player.fireCd -= dt;
        if (player.fireCd <= 0) {
          const interval = player.overdriveTimer > 0 ? 0.08 : 0.155;
          player.fireCd = interval;
          firePlayerWeapons();
        }
        fireBlastRound(dt);

        // 波次编队生成
        if (spawnQueue.length > 0) {
          waveSpawnTimer -= dt;
          if (waveSpawnTimer <= 0) {
            const batch = spawnQueue.shift();
            for (const item of batch.items) {
              spawnEnemyAt(item);
            }
            waveSpawnTimer = batch.delay;
          }
        } else if (!boss && enemies.length === 0) {
          startWave(wave + 1);
        }

        // Boss 战周期性补给空投（避免持久战零道具）
        if (boss) {
          bossSupplyTimer -= dt;
          if (bossSupplyTimer <= 0) {
            bossSupplyTimer = 10.5;
            maybeDropPickup(W * (0.22 + Math.random() * 0.56), -16, true, true);
          }
        }

        // 更新己方子弹
        for (let i = bullets.length - 1; i >= 0; i -= 1) {
          const b = bullets[i];
          const previousX = b.x;
          const previousY = b.y;
          const sweep = b.heavy || b.explosive;
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          const escortHit = hitCrimsonGuard(b, previousX, previousY) || hitMothershipSupport(b, previousX, previousY);
          if (escortHit || b.y < -16 || b.x < -20 || b.x > W + 20) {
            if (escortHit && b.explosive) detonateBlastRound(b);
            bullets.splice(i, 1);
            continue;
          }
          let hit = false;
          for (let j = enemies.length - 1; j >= 0; j -= 1) {
            const e = enemies[j];
            if (b.piercedEnemy === e) continue;
            const rr = e.r + b.r;
            const collided = e.rockStyle === 'shard'
              ? fastRockOverlaps(e, previousX, previousY, b.x, b.y, b.r, dt)
              : (sweep
                ? bulletCrossesCircle(b, previousX, previousY, e.x, e.y, rr)
                : (b.x - e.x) ** 2 + (b.y - e.y) ** 2 <= rr * rr);
            if (collided) {
              if (b.explosive) {
                hit = true;
                break;
              }
              e.hp -= b.dmg;
              e.hitFlash = 0.065;
              playHit(b.heavy, false, b.style);
              pushParticle({
                x: b.x,
                y: b.y,
                vx: (Math.random() - 0.5) * 90,
                vy: -40 + Math.random() * 80,
                r: b.heavy ? 4.5 : 2,
                color: b.color,
                life: 0.16,
                maxLife: 0.16,
              });
              if (e.hp <= 0) destroyEnemy(j);
              if (b.heavy && !b.piercedEnemy) {
                b.piercedEnemy = e;
                continue;
              }
              hit = true;
              break;
            }
          }
          if (!hit) hit = hitPrismMirror(b, previousX, previousY);
          if (!hit && reflectPrismBolt(b, previousX, previousY)) {
            if (b.heavy) playHit(true, true, b.style);
            bullets.splice(i, 1);
            continue;
          }
          const bossImpact = !hit && boss && boss.y >= boss.targetY - 12
            ? bossHullImpactTime(b.x, b.y, b.r, sweep ? previousX : b.x, sweep ? previousY : b.y)
            : null;
          if (bossImpact !== null) {
            hit = true;
            if (sweep) {
              b.x = previousX + (b.x - previousX) * bossImpact;
              b.y = previousY + (b.y - previousY) * bossImpact;
            }
            const armored = boss.kind === 'mothership' ? mothershipShieldLinks() > 0 : boss.maneuver !== 'recover';
            if (!b.explosive && damageBoss(b.dmg, 0.065)) {
              playHit(b.heavy, armored, b.style);
              pushParticle({
                x: b.x,
                y: b.y,
                vx: (Math.random() - 0.5) * 110,
                vy: 40 + Math.random() * 70,
                r: b.heavy ? 4.5 : 2.2,
                color: b.color,
                life: 0.16,
                maxLife: 0.16,
              });
            }
          }
          if (hit) {
            if (b.explosive) detonateBlastRound(b);
            bullets.splice(i, 1);
          }
        }

        if (state === 'over') return;

        // 更新敌机
        const enemyFireScale = Math.max(0.58, 1 - wave * 0.032 - (mode === 'ace' ? 0.12 : 0));
        for (let i = enemies.length - 1; i >= 0; i -= 1) {
          const e = enemies[i];
          if (e.hitFlash > 0) e.hitFlash = Math.max(0, e.hitFlash - dt);
          if (e.lesson) {
            if (e.lockTimer <= 0) {
              e.y += e.vy * dt;
              if (e.lesson === 'flank') {
                const entry = Math.max(0, Math.min(1, (e.y - 8) / 138));
                e.x = e.entryX - e.entrySide * 114 * entry * entry * (3 - 2 * entry);
              }
            }
          } else if (e.kind === 'interceptor') {
            e.phase += dt * 3.4;
            e.x += Math.sin(e.phase) * 115 * dt;
            e.y += e.vy * dt;
          } else if (e.kind === 'drone') {
            e.phase += dt * 2.2;
            if (e.lockTimer <= 0) {
              e.x += e.vx * dt;
            }
            if (e.y < e.targetY) {
              e.y = Math.min(e.targetY, e.y + e.vy * dt);
            } else if (e.lockTimer <= 0) {
              e.y += (16 + Math.sin(e.phase) * 12) * dt;
            }
          } else {
            e.x += e.vx * dt;
            e.y += e.vy * dt;
          }

          if (e.x < e.r + 10) {
            e.x = e.r + 10;
            e.vx = Math.abs(e.vx);
          } else if (e.x > W - e.r - 10) {
            e.x = W - e.r - 10;
            e.vx = -Math.abs(e.vx);
          }
          if (e.kind === 'asteroid') e.rot += e.vRot * dt;

          // 敌机开火（攻击欲望随关数递进）
          if (e.lesson) {
            updateOpeningEnemyAttack(e, dt);
          } else if (e.y > 20 && e.y < H - 140) {
            if (e.kind === 'drone' && e.lockTimer > 0) {
              e.lockTimer -= dt;
              if (e.lockTimer <= 0) {
                const spd = 280 + wave * 5;
                enemyBullets.push({
                  x: e.x,
                  y: e.y + 12,
                  vx: Math.cos(e.lockAngle) * spd,
                  vy: Math.sin(e.lockAngle) * spd,
                  r: 5.5,
                  color: '#c084fc',
                });
                e.fireCd = 2.0 * enemyFireScale;
              }
            } else {
              e.fireCd -= dt;
              if (e.fireCd <= 0) {
                if (e.kind === 'scout' && wave > 4) {
                  e.fireCd = 2.15 * enemyFireScale;
                  const spd = 205 + wave * 3.5;
                  enemyBullets.push({ x: e.x, y: e.y + 14, vx: 0, vy: spd, r: 4.5, color: '#fb7185' });
                } else if (e.kind === 'interceptor') {
                  e.fireCd = Math.max(0.82, 1.55 * enemyFireScale);
                  const ang = Math.atan2(player.y - e.y, player.x - e.x);
                  const spd = 215 + wave * 4;
                  enemyBullets.push({ x: e.x, y: e.y + 12, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 5, color: '#fb7185' });
                } else if (e.kind === 'drone') {
                  e.lockAngle = Math.atan2(player.y - e.y, player.x - e.x);
                  e.lockTimer = 0.45;
                } else if (e.kind === 'gunship') {
                  e.fireCd = Math.max(1.05, 1.9 * enemyFireScale);
                  const spd = 195 + wave * 3.5;
                  const offsets = (wave >= 7 || mode === 'ace') ? [-0.42, -0.2, 0, 0.2, 0.42] : [-0.28, 0, 0.28];
                  for (const offset of offsets) {
                    const ang = Math.PI * 0.5 + offset;
                    enemyBullets.push({ x: e.x, y: e.y + 18, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 5.5, color: '#f59e0b' });
                  }
                }
              }
            }
          }

          if (e.y > H + e.r + 25) {
            enemies.splice(i, 1);
            continue;
          }

          // 与自机碰撞
          const hitR = e.r + 10;
          const playerHit = e.rockStyle === 'shard'
            ? fastRockOverlaps(e, player.x, player.y, player.x, player.y, 10)
            : (e.x - player.x) ** 2 + (e.y - player.y) ** 2 <= hitR * hitR;
          if (playerHit) {
            if (player.overdriveTimer > 0) {
              destroyEnemy(i);
            } else {
              destroyEnemy(i);
              damagePlayer();
              if (state === 'over') return;
            }
          }
        }

        // 更新 Boss（3 种形态与专属弹幕/激光模式）
        if (boss) {
          if (boss.hitFlash > 0) boss.hitFlash = Math.max(0, boss.hitFlash - dt);
          if (boss.kind === 'mothership') {
            updateMothership(dt);
          } else if (!updateBossCampCounter(dt)) {
            if (boss.kind === 'crimson') updateCrimsonBoss(dt);
            else updatePrismBoss(dt);
          }
          if (state === 'over') return;

          // Boss 本体碰撞
          if (boss.maneuver !== 'transform' && bossHullImpactTime(player.x, player.y, 10) !== null) {
            damagePlayer();
            if (state === 'over') return;
          }
        }

        // 更新敌方子弹
        for (let i = enemyBullets.length - 1; i >= 0; i -= 1) {
          const eb = enemyBullets[i];
          eb.x += eb.vx * dt;
          eb.y += eb.vy * dt;
          if (eb.y > H + 18 || eb.y < -18 || eb.x < -18 || eb.x > W + 18) {
            enemyBullets.splice(i, 1);
            continue;
          }
          const rr = eb.r + 8;
          if ((eb.x - player.x) ** 2 + (eb.y - player.y) ** 2 <= rr * rr) {
            enemyBullets.splice(i, 1);
            damagePlayer();
            if (state === 'over') return;
          }
        }

        // 更新道具（近距离轻吸附）
        for (let i = pickups.length - 1; i >= 0; i -= 1) {
          const pk = pickups[i];
          pk.life += dt;
          pk.y += pk.vy * dt;
          const dx = player.x - pk.x;
          const dy = player.y - pk.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 105 && dist > 1) {
            pk.x += (dx / dist) * 260 * dt;
            pk.y += (dy / dist) * 260 * dt;
          }
          if (pk.y > H + 20) {
            pickups.splice(i, 1);
            continue;
          }
          if (dist <= pk.r + 18) {
            pickups.splice(i, 1);
            collectPickup(pk);
          }
        }

        decayVisualEffects(dt);
        renderHud();
      }

      // 渲染
      function drawPlayer(tNow) {
        const sk = SKINS[skin];
        for (const af of afterimages) {
          const trailingSkin = SKINS[af.style];
          ctx.save();
          ctx.globalAlpha = Math.max(0, (af.life / af.maxLife) * 0.28);
          ctx.translate(af.x, af.y);
          ctx.rotate(af.bank);
          traceArmorPlate(trailingSkin.hull);
          ctx.fillStyle = trailingSkin.boostColor;
          ctx.fill();
          ctx.restore();
        }

        ctx.save();
        ctx.translate(player.x, player.y);
        drawPlayerStatus(tNow, sk);
        if (player.invulnTimer > 0 && Math.floor(tNow / 65) % 2 === 0) {
          ctx.restore();
          return;
        }

        ctx.rotate(player.bank);
        ctx.lineJoin = 'round';
        const boost = Math.min(1, player.overdriveTimer / OVERDRIVE_END_CUE);
        const ignition = Math.max(0, 1 - (OVERDRIVE_SECONDS - player.overdriveTimer) / 0.25);
        for (const [x, y, width, base] of sk.engines) {
          const reach = base + Math.sin(tNow * 0.045 + x) * 3 + (9 + ignition * 9) * boost;
          traceArmorPlate([[x - width, y], [x + width, y], [x + width * 0.55, y + reach * 0.55],
            [x, y + reach], [x - width * 0.55, y + reach * 0.55]]);
          ctx.fillStyle = boost > 0 ? sk.boostColor : sk.flame;
          ctx.fill();
          traceArmorPlate([[x - width * 0.38, y], [x + width * 0.38, y], [x, y + reach * 0.60]]);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
        }

        traceArmorPlate(sk.hull);
        ctx.fillStyle = sk.wing;
        ctx.strokeStyle = sk.wingHi;
        ctx.lineWidth = 1.45;
        ctx.fill();
        ctx.stroke();

        for (const side of [-1, 1]) {
          if (player.weaponLv >= 2) {
            ctx.fillStyle = sk.wingHi;
            ctx.fillRect(side * 15 - 1.5, 1, 3, 11);
          }
          if (player.weaponLv >= 4) {
            ctx.fillStyle = '#fde047';
            ctx.fillRect(side * 19 - 1.5, 6, 3, 8);
          }
        }

        const shoulder = skin === 'crimson' ? 8 : 6;
        const nose = skin === 'cobalt' ? -23 : -21;
        traceArmorPlate([[0, nose], [shoulder, 8], [4, 14], [-4, 14], [-shoulder, 8]]);
        ctx.fillStyle = sk.body;
        ctx.fill();
        traceArmorPlate([[0, -12], [3.5, -4], [2.5, 3], [-2.5, 3], [-3.5, -4]]);
        ctx.fillStyle = sk.cockpit;
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.fillRect(-0.8, -7, 1.6, 4);
        ctx.restore();
      }

      function drawPlayerStatus(tNow, sk) {
        if (player.hasShield) {
          const radius = 29 + Math.sin(tNow * 0.012) * 1.4;
          tracePickupFrame('shield', radius);
          ctx.fillStyle = 'rgba(56, 189, 248, 0.10)';
          ctx.strokeStyle = '#67e8f9';
          ctx.lineWidth = 1.8;
          ctx.fill();
          ctx.stroke();
        }
        if (player.overdriveTimer > 0) {
          ctx.save();
          const ending = player.overdriveTimer <= OVERDRIVE_END_CUE;
          ctx.rotate(tNow * 0.002);
          ctx.strokeStyle = ending ? '#fbbf24' : sk.boostColor;
          ctx.lineWidth = 2;
          const radius = player.hasShield ? 37 : 30;
          for (let i = 0; i < 4; i += 1) {
            const from = i * Math.PI / 2;
            ctx.beginPath();
            ctx.arc(0, 0, radius, from, from + 0.47);
            ctx.stroke();
          }
          ctx.restore();
        }
        if (pickupCue) {
          const alpha = pickupCue.remaining / PICKUP_CUE_SECONDS;
          ctx.save();
          ctx.globalAlpha = alpha * 0.82;
          tracePickupFrame(pickupCue.type, 29 + (1 - alpha) * 17);
          ctx.strokeStyle = PICKUP_THEMES[pickupCue.type].rim;
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawEnemyHpBar(e) {
        if (e.maxHp < 2 || e.hp >= e.maxHp) return;
        const w = Math.max(24, Math.min(40, e.r * 1.45));
        const y = -e.r - 10;
        const pct = Math.max(0, Math.min(1, e.hp / e.maxHp));
        ctx.fillStyle = 'rgba(2, 6, 23, 0.85)';
        ctx.fillRect(-w * 0.5 - 1, y - 1, w + 2, 6);
        ctx.fillStyle = pct > 0.5 ? '#4ade80' : (pct > 0.25 ? '#fbbf24' : '#fb7185');
        ctx.fillRect(-w * 0.5, y, w * pct, 4);
      }

      function drawEnemy(e, tNow) {
        ctx.save();
        ctx.translate(e.x, e.y);
        drawOpeningEnemyWarning(e);
        if (e.kind === 'asteroid') {
          drawAsteroid(e);
        } else if (e.kind === 'scout') {
          drawScoutHull(e, tNow);
        } else if (e.kind === 'interceptor') {
          drawInterceptorHull(e, tNow);
        } else if (e.kind === 'drone') {
          // 狙击无人机：激光锁定预警细线
          if (e.lockTimer > 0) {
            ctx.save();
            ctx.setLineDash([5, 5]);
            ctx.strokeStyle = 'rgba(192, 132, 252, 0.72)';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(0, 12);
            ctx.lineTo(Math.cos(e.lockAngle) * 380, Math.sin(e.lockAngle) * 380);
            ctx.stroke();
            ctx.restore();
          }
          ctx.beginPath();
          ctx.moveTo(0, 16);
          ctx.lineTo(16, 0);
          ctx.lineTo(10, -15);
          ctx.lineTo(-10, -15);
          ctx.lineTo(-16, 0);
          ctx.closePath();
          ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : '#6d28d9';
          ctx.fill();
          ctx.strokeStyle = '#c084fc';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(0, 1, 5.2, 0, Math.PI * 2);
          ctx.fillStyle = '#e879f9';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(0, 1, 2.3, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
        } else if (e.kind === 'gunship') {
          drawGunshipHull(e, tNow);
        }
        drawEnemyHpBar(e);
        ctx.restore();
      }

      function drawAsteroid(rock) {
        const fast = rock.rockStyle === 'shard';
        const r = rock.r;
        if (fast) {
          const speed = Math.hypot(rock.vx, rock.vy);
          const x = -rock.vx / speed * 33;
          const y = -rock.vy / speed * 33;
          const streak = ctx.createLinearGradient(0, 0, x, y);
          streak.addColorStop(0, 'rgba(252, 180, 113, 0.70)');
          streak.addColorStop(1, 'rgba(252, 180, 113, 0)');
          ctx.lineCap = 'round';
          ctx.lineWidth = r * 0.56;
          ctx.strokeStyle = streak;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(x, y);
          ctx.stroke();
        }
        ctx.save();
        ctx.rotate(rock.rot);
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(rock.poly[0].x, rock.poly[0].y);
        for (let i = 1; i < rock.poly.length; i += 1) ctx.lineTo(rock.poly[i].x, rock.poly[i].y);
        ctx.closePath();
        const face = ctx.createLinearGradient(-r * 0.6, -r * 0.6, r * 0.6, r * 0.65);
        face.addColorStop(0, rock.hitFlash > 0 ? '#fff7ed' : fast ? '#d19a76' : '#808fa4');
        face.addColorStop(1, fast ? '#705056' : '#37455e');
        ctx.fillStyle = face;
        ctx.strokeStyle = rock.hitFlash > 0 ? '#fff7ed' : fast ? '#ffcd9f' : '#adbbce';
        ctx.lineWidth = 1.65;
        ctx.fill();
        ctx.stroke();

        if (fast) {
          traceArmorPlate([[0, -r * 0.67], [r * 0.35, -r * 0.16], [r * 0.16, r * 0.55],
            [-r * 0.19, r * 0.26], [-r * 0.23, -r * 0.14]]);
          ctx.fillStyle = 'rgba(255, 206, 159, 0.45)';
          ctx.fill();
        } else {
          for (const [x, y, size] of [[-0.29, -0.18, 0.21], [0.29, 0.27, 0.15]]) {
            ctx.beginPath();
            ctx.ellipse(r * x, r * y, r * size, r * size * 0.73, 0.27, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(18, 27, 47, 0.61)';
            ctx.strokeStyle = 'rgba(200, 215, 225, 0.47)';
            ctx.lineWidth = 1.1;
            ctx.fill();
            ctx.stroke();
          }
        }

        if (rock.hp < rock.maxHp) {
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = rock.hp <= rock.maxHp * 0.5 ? '#fdba83' : 'rgba(241, 189, 162, 0.72)';
          ctx.beginPath();
          ctx.moveTo(-r * 0.43, r * 0.26);
          ctx.lineTo(-r * 0.10, r * 0.08);
          ctx.lineTo(r * 0.08, r * 0.31);
          ctx.lineTo(r * 0.34, -r * 0.34);
          if (rock.hp <= rock.maxHp * 0.5) {
            ctx.moveTo(r * 0.08, r * 0.31);
            ctx.lineTo(r * 0.20, r * 0.60);
          }
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawOpeningEnemyWarning(enemy) {
        if (!enemy.lesson || enemy.lockTimer <= 0) return;
        ctx.save();
        ctx.setLineDash(enemy.lesson === 'spread' ? [6, 7] : [4, 6]);
        ctx.strokeStyle = enemy.lesson === 'spread' ? 'rgba(251, 191, 36, 0.69)' : 'rgba(110, 231, 183, 0.72)';
        ctx.lineWidth = 1.6;
        for (const shot of openingEnemyShots(enemy)) {
          ctx.beginPath();
          ctx.moveTo(shot.x, shot.y);
          ctx.lineTo(shot.x + Math.cos(shot.angle) * H, shot.y + Math.sin(shot.angle) * H);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(shot.x, shot.y, 2.6, 0, Math.PI * 2);
          ctx.fillStyle = '#f8fafc';
          ctx.fill();
        }
        ctx.restore();
      }

      function drawEnemyEngine(x, y, length, width, color) {
        traceArmorPlate([[x - width, y], [x, y - length], [x + width, y]]);
        ctx.fillStyle = color;
        ctx.fill();
      }

      function drawScoutHull(enemy, tNow) {
        drawEnemyEngine(0, -12, 6 + Math.sin(tNow * 0.04 + enemy.phase) * 2.5, 3, '#fb923c');
        traceArmorPlate([[0, -15], [7, -6], [10, -2], [5, 8], [0, 17], [-5, 8], [-10, -2], [-7, -6]]);
        ctx.fillStyle = enemy.hitFlash > 0 ? '#fff1f2' : '#9f254a';
        ctx.strokeStyle = '#fda4af';
        ctx.lineWidth = 1.4;
        ctx.fill();
        ctx.stroke();
        traceArmorPlate([[0, -10], [4, -3], [2, 8], [0, 12], [-2, 8], [-4, -3]]);
        ctx.fillStyle = '#fc6d90';
        ctx.fill();
        ctx.fillStyle = '#fff1cf';
        ctx.fillRect(-1.5, -2, 3, 7);
      }

      function drawInterceptorHull(enemy, tNow) {
        ctx.save();
        if (enemy.lesson === 'flank') {
          const phase = Math.max(0, Math.min(1, (enemy.y - 8) / 138));
          ctx.rotate(enemy.entrySide * Math.sin(Math.PI * phase) * 0.42);
        }
        const thrust = 7 + Math.sin(tNow * 0.04 + enemy.phase) * 2.5;
        for (const side of [-1, 1]) {
          drawEnemyEngine(side * 10, -8, thrust, 2.4, '#45e6bd');
        }
        traceArmorPlate([[0, 19], [9, 6], [20, -6], [18, -14], [10, -8], [5, -9],
          [0, -14], [-5, -9], [-10, -8], [-18, -14], [-20, -6], [-9, 6]]);
        ctx.fillStyle = enemy.hitFlash > 0 ? '#f0fdfa' : '#0b594c';
        ctx.strokeStyle = '#87e8c1';
        ctx.lineWidth = 1.4;
        ctx.fill();
        ctx.stroke();
        for (const side of [-1, 1]) {
          traceArmorPlate([[side * 17, -10], [side * 17, -6], [side * 8, 4], [side * 9, -4]]);
          ctx.fillStyle = '#37b89b';
          ctx.fill();
        }
        traceArmorPlate([[0, -7], [4, 0], [0, 11], [-4, 0]]);
        ctx.fillStyle = enemy.lockTimer > 0 ? '#f8fafc' : '#71e7cf';
        ctx.fill();
        ctx.restore();
      }

      function drawGunshipHull(enemy, tNow) {
        const thrust = 8 + Math.sin(tNow * 0.035 + enemy.phase) * 3;
        for (const side of [-1, 1]) {
          drawEnemyEngine(side * 15, -16, thrust, 4, '#fb923c');
        }
        traceArmorPlate([[-26, -3], [-21, -19], [-11, -22], [11, -22], [21, -19], [26, -3],
          [23, 13], [13, 16], [8, 22], [-8, 22], [-13, 16], [-23, 13]]);
        ctx.fillStyle = enemy.hitFlash > 0 ? '#fff7ed' : '#5e3b36';
        ctx.strokeStyle = '#facc78';
        ctx.lineWidth = 1.7;
        ctx.fill();
        ctx.stroke();
        traceArmorPlate([[-9, -17], [9, -17], [13, -10], [9, 9], [-9, 9], [-13, -10]]);
        ctx.fillStyle = '#b37345';
        ctx.fill();
        for (const side of [-1, 1]) {
          const x = side * 16;
          ctx.fillStyle = '#2d2026';
          ctx.fillRect(x - 4, -9, 8, 18);
          ctx.fillStyle = '#feb86d';
          ctx.fillRect(x - 3, 8, 6, 5);
        }
        ctx.fillStyle = enemy.lockTimer > 0 ? '#fff7ca' : '#f0a94f';
        ctx.fillRect(-4, 11, 8, 7);
      }

      function drawBoss(tNow) {
        if (!boss) return;
        const lasers = boss.lasers || computeBossLasers(boss);
        const beamPalette = { outer: 'rgba(192, 132, 252, 0.34)', core: '#e9d5ff', warn: '192, 132, 252' };

        const prismAttack = boss.prismAttack;
        const prismSource = prismAttack?.fromMirror ? boss.prismMirror : boss;
        if (prismAttack?.sweep) drawPrismSweep(prismAttack, prismSource);
        if (boss.campCounter) drawBossCampWarning(boss.campCounter);
        if (boss.maneuver === 'dash-warn') drawCrimsonDashWarning();
        if (boss.maneuver === 'scatter-warn') drawCrimsonScatterWarning();

        if (prismAttack?.step === 'warn') {
          const x = prismSource.x - 36;
          const y = prismSource.y + 30;
          ctx.save();
          ctx.fillStyle = prismAttack.fromMirror ? 'rgba(232, 121, 249, 0.18)' : 'rgba(56, 189, 248, 0.18)';
          ctx.fillRect(x, y, 72, H - y);
          ctx.setLineDash([6, 5]);
          ctx.strokeStyle = prismAttack.fromMirror ? '#e9a5ff' : '#7dd3fc';
          ctx.lineWidth = 2;
          ctx.strokeRect(x, y, 72, H - y);
          ctx.restore();
        }

        // 虚线随炮口瞄准，锁定后用实线标出两条光束的边界。
        if (boss.laserState === 'telegraph') {
          const locked = boss.laserTimer <= MOTHERSHIP_LASER_LOCK_SECONDS;
          const blink = 0.48 + Math.sin(tNow * 0.038) * 0.36;
          for (const beam of lasers) {
            ctx.save();
            ctx.translate(beam.x, beam.y);
            ctx.beginPath();
            ctx.arc(0, 0, 5 + blink * 4, 0, Math.PI * 2);
            ctx.fillStyle = locked ? '#fed7aa' : `rgba(${beamPalette.warn}, ${(0.45 + blink * 0.35).toFixed(2)})`;
            ctx.fill();
            ctx.rotate(beam.angle);
            ctx.fillStyle = locked ? 'rgba(251, 146, 60, 0.26)' : 'rgba(' + beamPalette.warn + ', 0.12)';
            ctx.fillRect(0, -boss.laserWidth, BOSS_BEAM_LENGTH, boss.laserWidth * 2);
            if (locked) {
              ctx.strokeStyle = '#fed7aa';
              ctx.lineWidth = 2.2;
              ctx.strokeRect(0, -boss.laserWidth, BOSS_BEAM_LENGTH, boss.laserWidth * 2);
            } else {
              ctx.setLineDash([8, 6]);
              ctx.strokeStyle = `rgba(${beamPalette.warn}, ${(0.28 + blink * 0.65).toFixed(2)})`;
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.lineTo(BOSS_BEAM_LENGTH, 0);
              ctx.stroke();
            }
            ctx.restore();
          }
        } else if (boss.laserState === 'fire') {
          for (const beam of lasers) {
            drawBossBeam(beam, boss.laserWidth, beamPalette.outer, beamPalette.core);
          }
        }

        if (boss.supports?.length) drawMothershipSupports(tNow);
        if (boss.prismMirror) drawPrismMirror(tNow);

        ctx.save();
        ctx.translate(boss.x, boss.y);
        const hit = boss.hitFlash > 0;

        if (boss.kind === 'prism') {
          drawPrismHull(tNow, hit);
          if (boss.prismReflect) drawPrismReflection(tNow);
          if (boss.prismMirror) drawPrismFightLabel(t('本体'), -58, '#fde68a');
        } else if (boss.kind === 'mothership') {
          drawMothershipHull(tNow, hit);
        } else {
          drawCrimsonHull(tNow, hit);
          if (boss.guard) drawCrimsonGuard();
        }
        ctx.restore();
      }

      function drawBossCampWarning(counter) {
        const progress = 1 - counter.remaining / BOSS_COUNTER_WARNING;
        ctx.save();
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 1.5 + progress;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(counter.x, counter.y);
        ctx.lineTo(counter.targetX, counter.targetY);
        ctx.stroke();
        ctx.translate(counter.targetX, counter.targetY);
        ctx.setLineDash([]);
        const radius = 25 - progress * 7;
        for (let i = 0; i < 4; i += 1) {
          const angle = i * Math.PI * 0.5;
          ctx.beginPath();
          ctx.arc(0, 0, radius, angle - 0.38, angle + 0.38);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawMothershipHull(tNow, hit) {
        const transforming = boss.maneuver === 'transform';
        const opened = transforming ? 1 - boss.maneuverTimer : boss.phase === 2 ? 1 : 0;
        const exposed = boss.maneuver === 'recover';
        const edge = boss.phase === 2 ? '#f0abfc' : '#c4b5fd';
        const links = mothershipShieldLinks();
        ctx.lineJoin = 'round';

        for (const side of [-1, 1]) {
          ctx.save();
          ctx.scale(side, 1);
          ctx.translate(opened * 8, -opened * 4);
          traceArmorPlate([[12, -31], [37, -30], [54, -17], [61, 10], [46, 28], [23, 17], [15, 2]]);
          const wing = ctx.createLinearGradient(20, -32, 58, 28);
          wing.addColorStop(0, '#665687');
          wing.addColorStop(0.47, '#37305b');
          wing.addColorStop(1, '#181429');
          ctx.fillStyle = hit ? '#e9d5ff' : wing;
          ctx.strokeStyle = edge;
          ctx.lineWidth = 1.7;
          ctx.fill();
          ctx.stroke();

          traceArmorPlate([[24, -25], [36, -24], [48, -15], [44, -4], [36, -9], [24, -10]]);
          ctx.fillStyle = '#72618e';
          ctx.fill();
          const bay = ctx.createLinearGradient(0, 0, 0, 25);
          bay.addColorStop(0, '#0b1021');
          bay.addColorStop(1, opened > 0.5 ? '#423176' : '#241b46');
          traceArmorPlate([[22, -3], [38, -4], [48, 9], [40, 21], [28, 17]]);
          ctx.fillStyle = bay;
          ctx.strokeStyle = '#9f8bca';
          ctx.lineWidth = 1.2;
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = boss.maneuver === 'deploy' ? '#a5f3fc' : '#ab88e0';
          ctx.fillRect(29, 13, 10, 2);
          ctx.fillRect(26, 7, 14, 2);
          ctx.restore();
        }

        traceArmorPlate([[-27, -34], [27, -34], [43, -17], [40, 13], [25, 33],
          [0, 42], [-25, 33], [-40, 13], [-43, -17]]);
        const hull = ctx.createLinearGradient(-32, -38, 31, 43);
        hull.addColorStop(0, '#59506e');
        hull.addColorStop(0.55, '#241c3b');
        hull.addColorStop(1, '#120e21');
        ctx.fillStyle = hit && !links ? '#f3e8ff' : hull;
        ctx.strokeStyle = edge;
        ctx.lineWidth = 2.2;
        ctx.fill();
        ctx.stroke();
        traceArmorPlate([[-20, -28], [20, -28], [28, -18], [10, -12], [-10, -12], [-28, -18]]);
        ctx.fillStyle = '#7e7198';
        ctx.fill();
        ctx.fillStyle = '#d8b4fe';
        ctx.fillRect(-12, -24, 24, 3);

        const coreWidth = exposed ? 14 : 8 + opened * 1.7;
        const core = exposed ? '#ffecaa' : '#d8b4fe';
        traceArmorPlate([[0, -4], [coreWidth + 6, 9], [coreWidth, 22], [0, 32],
          [-coreWidth, 22], [-coreWidth - 6, 9]]);
        ctx.fillStyle = exposed ? '#583753' : '#150e27';
        ctx.strokeStyle = exposed ? '#fcd37a' : '#9779c3';
        ctx.lineWidth = 1.5;
        ctx.fill();
        ctx.stroke();
        const pulse = Math.sin(tNow * 0.012) * (exposed ? 1.6 : 0.65);
        traceArmorPlate([[0, 3 - pulse], [coreWidth, 13], [0, 25 + pulse], [-coreWidth, 13]]);
        ctx.fillStyle = core;
        ctx.fill();
        traceArmorPlate([[0, 3 - pulse], [0, 25 + pulse], [-coreWidth, 13]]);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.fill();

        if (links || transforming) {
          ctx.beginPath();
          ctx.ellipse(0, 0, 71 + opened * 3, 49, 0, 0, Math.PI * 2);
          ctx.fillStyle = links === 2 ? 'rgba(103, 232, 249, 0.13)' : 'rgba(103, 232, 249, 0.05)';
          ctx.fill();
          ctx.strokeStyle = transforming ? '#e9d5ff' : hit ? '#e0fdff' : '#67e8f9';
          ctx.lineWidth = links === 2 ? 2.5 : 1.6;
          if (links < 2) ctx.setLineDash([7, 5]);
          ctx.stroke();
        }
      }

      function drawMothershipSupports(tNow) {
        for (const craft of boss.supports) {
          const linked = boss.supportJam === 0 && craft.age >= MOTHERSHIP_DEPLOY_SECONDS;
          ctx.save();
          if (linked) {
            const x = boss.x + craft.side * 41;
            const y = boss.y + 16;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(craft.x, craft.y);
            ctx.strokeStyle = 'rgba(34, 211, 238, 0.28)';
            ctx.lineWidth = 7;
            ctx.stroke();
            ctx.strokeStyle = '#a5f3fc';
            ctx.lineWidth = 1.6;
            ctx.stroke();
            const pulse = (craft.age * 1.7) % 1;
            ctx.beginPath();
            ctx.arc(craft.x + (x - craft.x) * pulse, craft.y + (y - craft.y) * pulse, 3, 0, Math.PI * 2);
            ctx.fillStyle = '#ecfeff';
            ctx.fill();
          }

          ctx.translate(craft.x, craft.y);
          ctx.lineJoin = 'round';
          traceArmorPlate([[0, -15], [8, -8], [16, -2], [15, 8], [6, 8], [0, 15], [-6, 8],
            [-15, 8], [-16, -2], [-8, -8]]);
          ctx.fillStyle = craft.flash > 0 ? '#e0fcff' : '#204760';
          ctx.strokeStyle = '#85f1fa';
          ctx.lineWidth = 1.5;
          ctx.fill();
          ctx.stroke();
          traceArmorPlate([[0, -7], [6, 0], [0, 8], [-6, 0]]);
          ctx.fillStyle = linked ? '#b7f9ff' : '#4f90a5';
          ctx.fill();

          const thrust = 4 + Math.sin(tNow * 0.05 + craft.side) * 2;
          for (const side of [-1, 1]) {
            traceArmorPlate([[side * 8, 7], [side * 13, 7], [side * 10, 9 + thrust]]);
            ctx.fillStyle = '#bc91ff';
            ctx.fill();
          }
          ctx.fillStyle = '#160f2a';
          ctx.fillRect(-17, -24, 34, 6);
          ctx.fillStyle = '#67e8f9';
          ctx.fillRect(-16, -23, 32 * craft.hp / craft.maxHp, 4);
          ctx.restore();
        }
      }

      function drawCrimsonDashWarning() {
        const end = crimsonDashEnd();
        const halfWidth = boss.r + 10;
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineWidth = halfWidth * 2;
        ctx.strokeStyle = 'rgba(244, 63, 94, 0.20)';
        ctx.beginPath();
        ctx.moveTo(boss.x, boss.y);
        ctx.lineTo(boss.x, end);
        ctx.stroke();

        ctx.lineCap = 'butt';
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#fda4af';
        ctx.setLineDash([7, 6]);
        for (const side of [-1, 1]) {
          const x = boss.x + side * halfWidth;
          ctx.beginPath();
          ctx.moveTo(x, boss.y);
          ctx.lineTo(x, end);
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.arc(boss.x, end, halfWidth, 0, Math.PI);
        ctx.stroke();

        ctx.setLineDash([]);
        ctx.strokeStyle = '#fed7aa';
        ctx.lineWidth = 2.5;
        for (let y = boss.y + 75; y < end; y += 74) {
          ctx.beginPath();
          ctx.moveTo(boss.x - 10, y - 6);
          ctx.lineTo(boss.x, y + 5);
          ctx.lineTo(boss.x + 10, y - 6);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawCrimsonScatterWarning() {
        const y = boss.y + 21;
        ctx.save();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = 'rgba(253, 186, 116, 0.68)';
        ctx.setLineDash([5, 8]);
        for (const side of [-1, 1]) {
          const x = boss.x + side * 31;
          for (const spread of CRIMSON_SCATTER_ANGLES) {
            const angle = Math.PI * 0.5 - side * spread;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + Math.cos(angle) * H, y + Math.sin(angle) * H);
            ctx.stroke();
          }
          ctx.beginPath();
          ctx.arc(x, y, 5 + (1 - boss.maneuverTimer) * 5, 0, Math.PI * 2);
          ctx.fillStyle = '#fed7aa';
          ctx.fill();
        }

      function drawCrimsonHull(tNow, hit) {

          armor.addColorStop(1, '#310d20');
          ctx.fillStyle = hit ? '#fff1f2' : armor;
          ctx.strokeStyle = opening > 0.5 ? '#fdab80' : '#fda4af';

          ctx.fill();
          ctx.stroke();

          traceArmorPlate([[15, -28], [28, -27], [36, -17], [38, -6], [32, -1], [25, -18], [16, -18]]);
          ctx.fillStyle = '#f47b7f';
          ctx.fill();
          traceArmorPlate([[27, 2], [40, -1], [35, 9], [28, 17]]);

        traceArmorPlate([[-22, -28], [22, -28], [31, -9], [24, 15], [0, 43], [-24, 15], [-31, -9]]);

      function drawBossBeam(beam, width, outer, core) {
        ctx.save();
        ctx.translate(beam.x, beam.y);
        ctx.rotate(beam.angle);
        ctx.fillStyle = outer;
        ctx.fillRect(0, -width, BOSS_BEAM_LENGTH, width * 2);
        ctx.fillStyle = core;
        ctx.fillRect(0, -width * 0.52, BOSS_BEAM_LENGTH, width * 1.04);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, -width * 0.26, BOSS_BEAM_LENGTH, width * 0.52);
        ctx.beginPath();
        ctx.arc(0, 0, width * 0.95, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawPrismSweep(attack, source) {
        const beam = prismBeam(attack, source);
        const { from, to, secondPass, width } = attack.sweep;
        const color = attack.fromMirror ? '240, 171, 252' : secondPass ? '196, 181, 253' : '125, 211, 252';
        if (attack.step === 'sweep-fire') {
          drawBossBeam(beam, width, 'rgba(' + color + ', 0.46)', 'rgb(' + color + ')');
          return;
        }

        ctx.save();
        ctx.translate(beam.x, beam.y);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, BOSS_BEAM_LENGTH, from, to, to < from);
        ctx.closePath();
        ctx.fillStyle = 'rgba(' + color + ', 0.14)';
        ctx.fill();

        ctx.save();
        ctx.rotate(from);
        ctx.fillStyle = 'rgba(' + color + ', 0.28)';
        ctx.fillRect(0, -width, BOSS_BEAM_LENGTH, width * 2);
        ctx.setLineDash([7, 6]);
        ctx.strokeStyle = 'rgb(' + color + ')';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(BOSS_BEAM_LENGTH, 0);
        ctx.stroke();
        ctx.restore();

        const radius = 126;
        const angle = from + (to - from) * 0.78;
        ctx.strokeStyle = 'rgb(' + color + ')';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, radius, from, angle, to < from);
        ctx.stroke();
        ctx.translate(Math.cos(angle) * radius, Math.sin(angle) * radius);
        ctx.rotate(angle + Math.sign(to - from) * Math.PI * 0.5);
        ctx.beginPath();
        ctx.moveTo(-9, -6);
        ctx.lineTo(0, 0);
        ctx.lineTo(-9, 6);
        ctx.stroke();
        ctx.restore();
      }

      function drawPrismHull(tNow, hit, mirror = false) {
        const transforming = !mirror && boss.maneuver === 'transform';
        const exposed = !mirror && boss.maneuver === 'recover';
        const progress = transforming ? 1 - boss.maneuverTimer : boss.phase === 2 ? 1 : 0;
        const opened = progress * progress * (3 - 2 * progress);
        const attack = boss.prismAttack;
        const charging = attack && attack.fromMirror === mirror && attack.kind !== 'fan';
        const edge = mirror ? '#e9a5ff' : boss.phase === 2 ? '#a5a4ff' : '#7dd3fc';
        const glow = mirror ? '#f5c2ff' : exposed ? '#ffdd8b' : charging ? '#e6fcff' : '#66ddff';
        ctx.lineJoin = 'round';

        for (const side of [-1, 1]) {
          ctx.save();
          ctx.scale(side, 1);
          if (opened > 0) {
            ctx.beginPath();
            ctx.moveTo(19, 0);
            ctx.lineTo(47 + opened * 16, -opened * 14);
            ctx.strokeStyle = 'rgba(147, 197, 253, ' + (opened * 0.72) + ')';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([3, 4]);
            ctx.stroke();
            ctx.setLineDash([]);
          }

          ctx.translate(27 + opened * 34, -opened * 10);
          ctx.rotate(-opened * 0.67);
          ctx.globalAlpha *= 1 - opened * 0.16;
          traceArmorPlate([[0, -28], [19, -19], [23, 9], [5, 30], [-8, 15], [-11, -12]]);
          const plating = ctx.createLinearGradient(-10, -22, 25, 24);
          plating.addColorStop(0, hit ? '#c6efff' : '#466f96');
          plating.addColorStop(0.55, '#182e52');
          plating.addColorStop(1, '#091325');
          ctx.fillStyle = plating;
          ctx.strokeStyle = edge;
          ctx.lineWidth = 1.8;
          ctx.fill();
          ctx.stroke();

          traceArmorPlate([[1, -22], [15, -13], [17, 7], [4, 23], [-2, 4]]);
          ctx.fillStyle = charging ? '#63e0f9' : '#21668d';
          ctx.fill();
          traceArmorPlate([[1, -22], [8, -5], [4, 23], [-2, 4]]);
          ctx.fillStyle = charging ? '#d9ffff' : '#459bbb';
          ctx.fill();

          ctx.strokeStyle = '#87acc5';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(-7, -11);
          ctx.lineTo(-4, 13);
          ctx.lineTo(1, 19);
          ctx.stroke();
          ctx.restore();
        }

        const shoulder = 28 - opened * 10;
        const nose = 38 - opened * 13;
        traceArmorPlate([[0, -39], [shoulder, -17], [shoulder + 3, 11], [15, 24],
          [0, nose], [-15, 24], [-shoulder - 3, 11], [-shoulder, -17]]);
        const hull = ctx.createLinearGradient(-28, -37, 24, 31);
        hull.addColorStop(0, '#526c8d');
        hull.addColorStop(0.42, '#20385a');
        hull.addColorStop(0.43, '#14223d');
        hull.addColorStop(1, '#081021');
        ctx.fillStyle = hit ? '#d0ecff' : hull;
        ctx.strokeStyle = edge;
        ctx.lineWidth = 2;
        ctx.fill();
        ctx.stroke();

        traceArmorPlate([[0, -32], [shoulder - 4, -14], [10, -10], [0, -22],
          [-10, -10], [-shoulder + 4, -14]]);
        ctx.fillStyle = '#789bb4';
        ctx.fill();
        ctx.fillStyle = glow;
        ctx.fillRect(-2, -29, 4, 11);

        ctx.save();
        ctx.translate(0, 6);
        ctx.strokeStyle = '#060d1d';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(0, 0, 15 + opened * 4, 0, Math.PI * 2);
        ctx.stroke();
        ctx.lineWidth = 2;
        ctx.strokeStyle = edge;
        ctx.stroke();

        const angle = charging && attack.sweep ? prismBeam(attack, mirror ? boss.prismMirror : boss).angle
          : Math.PI * 0.5 + Math.sin(tNow * 0.003) * (0.25 + opened * 0.22);
        ctx.rotate(angle - Math.PI * 0.5);
        traceArmorPlate([[-7, -9], [7, -9], [9, 10], [4, 17], [-4, 17], [-9, 10]]);
        ctx.fillStyle = '#192d46';
        ctx.strokeStyle = '#8fb7d0';
        ctx.fill();
        ctx.stroke();
        traceArmorPlate([[0, -11 - opened * 4], [8 + opened * 3, 1], [0, 13 + opened * 3], [-8 - opened * 3, 1]]);
        ctx.fillStyle = glow;
        ctx.fill();
        traceArmorPlate([[0, -11 - opened * 4], [0, 13 + opened * 3], [-8 - opened * 3, 1]]);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.58)';
        ctx.fill();
        ctx.restore();

        if (transforming) {
          ctx.beginPath();
          ctx.ellipse(0, 0, 54 + opened * 31, 46 - opened * 9, 0, 0, Math.PI * 2);
          ctx.setLineDash([6, 5]);

        }
      }

      function drawPrismReflection(tNow) {
        const active = boss.maneuver === 'reflect';
        const progress = active ? 1 : 1 - boss.maneuverTimer / PRISM_REFLECT_WARNING;
        ctx.save();
        ctx.scale(1, PRISM_REFLECT_ASPECT);
        const halo = ctx.createRadialGradient(0, 0, 42, 0, 0, 84);
        halo.addColorStop(0, 'rgba(224, 219, 255, 0)');
        halo.addColorStop(0.50, active ? 'rgba(196, 181, 253, 0.36)' : 'rgba(196, 181, 253, 0.18)');
        halo.addColorStop(1, 'rgba(126, 96, 231, 0)');
        ctx.fillStyle = halo;
        ctx.fillRect(-84, -84, 168, 168);

        const angleStep = Math.PI * 2 / PRISM_REFLECT_PANELS;
        for (let i = 0; i < PRISM_REFLECT_PANELS; i += 1) {
          const lit = Math.max(0, Math.min(1, (progress - i * 0.12) * 5));
          const flash = boss.prismReflect.panels[i] / 0.17;
          ctx.save();
          ctx.rotate(angleStep * i);
          ctx.translate((1 - lit) * 10, 0);
          ctx.globalAlpha = 0.18 + lit * 0.82;
          traceArmorPlate([[49, -15], [57, -23], [66, -21], [66, 21], [57, 23], [49, 15]]);
          const glass = ctx.createLinearGradient(48, -20, 68, 20);
          glass.addColorStop(0, flash > 0 ? '#fff7d6' : '#ede9fe');
          glass.addColorStop(0.38, '#a5a3fc');
          glass.addColorStop(0.43, '#4f3aa0');
          glass.addColorStop(0.72, '#7629a5');
          glass.addColorStop(1, '#281a57');
          ctx.fillStyle = glass;
          ctx.strokeStyle = flash > 0 ? '#fff2bc' : '#e9ddff';
          ctx.lineWidth = 1.6 + flash;
          ctx.fill();
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(52, -12);
          ctx.lineTo(58, -18);
          ctx.lineTo(62, -16);
          ctx.lineTo(62, 13);
          ctx.strokeStyle = flash > 0 ? '#ffffff' : '#c7d2fe';
          ctx.lineWidth = 1.1;
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(73, 0, 1.6 + flash * 1.6, 0, Math.PI * 2);
          ctx.fillStyle = '#fff1b5';
          ctx.fill();
          ctx.restore();
        }

        ctx.rotate(tNow * 0.0009);
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = active ? 'rgba(233, 213, 255, 0.70)' : 'rgba(233, 213, 255, 0.35)';
        ctx.setLineDash([8, 9, 2, 9]);
        ctx.beginPath();
        ctx.arc(0, 0, 77, 0, Math.PI * 2);
        ctx.stroke();

      function drawReflectedBolt(bullet) {
        ctx.save();
        ctx.translate(bullet.x, bullet.y);
        ctx.rotate(Math.atan2(-bullet.vx, bullet.vy));

        trail.addColorStop(0.40, '#ec4899');
        trail.addColorStop(1, 'rgba(236, 72, 153, 0)');
        traceArmorPlate([[-5, 1], [-3, -14], [0, -26], [3, -14], [5, 1]]);
        ctx.fillStyle = trail;
        ctx.fill();
        traceArmorPlate([[-5, -2], [-3, -6], [3, -6], [5, -2], [0, 8]]);

        ctx.stroke();
