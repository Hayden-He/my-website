  <style>


    .btn-small.flag-active {
      background: #f97316;
      color: #fff;
    }

    .board-wrap {
      position: relative;
      width: 100%;
      max-width: 480px;
      background: #cbd5e1;
      border-radius: 16px;
      padding: 10px;
      box-shadow: var(--shadow-md);
      user-select: none;
      -webkit-user-select: none;
    }

    .board-wrap.shake {
      animation: mine-shake 0.34s ease-out;
    }

    @keyframes mine-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(3px); }
    }

    .mine-grid-scroll {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 10px;
      touch-action: pan-x pinch-zoom;
    }

    .mine-grid {
      --cols: 9;
      width: 100%;
      aspect-ratio: 1 / 1;
      display: grid;
      grid-template-columns: repeat(var(--cols), 1fr);
      grid-template-rows: repeat(var(--cols), 1fr);
      gap: 3px;
      touch-action: manipulation;
    }

    .mine-grid.dense {
      gap: 2px;
    }

    @media (max-width: 500px) {
      .mine-grid.mid { min-width: 360px; }
      .mine-grid.dense { min-width: 448px; }
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 6px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      transition: transform 0.08s ease, background 0.1s ease;
    }

    .mine-grid.mid .cell {
      font-size: 0.88rem;
      border-radius: 5px;
    }

    .mine-grid.dense .cell {
      font-size: 0.74rem;
      border-radius: 4px;
    }

    .cell.closed {
      background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 1px 2px rgba(15, 23, 42, 0.14);
    }

    .cell.closed:hover {
      background: linear-gradient(180deg, #ffffff 0%, #dbeafe 100%);
    }

    .cell.closed:active,
    .cell.closed.chord-preview {
      transform: scale(0.94);
    }

    .cell.closed.chord-preview {
      background: linear-gradient(180deg, #eff6ff 0%, #bfdbfe 100%);
    }

    .cell.flagged {
      background: linear-gradient(180deg, #fff7ed 0%, #fed7aa 100%);
    }

    .cell.question {
      background: linear-gradient(180deg, #eff6ff 0%, #bfdbfe 100%);
      color: #1d4ed8;
    }

    .cell.hint-flash {
      animation: hint-glow 0.7s ease-out;
    }

    @keyframes hint-glow {
      0% { box-shadow: inset 0 0 0 3px #10b981; background: #d1fae5; }
      100% { box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.06); }
    }

    .cell.open {
      background: #f8fafc;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.06);
      cursor: default;
    }

    .cell.open.chordable {
      cursor: pointer;
    }

    .cell.mine-hit {
      background: #ef4444;
      color: #fff;
    }

    .cell.mine-show {
      background: #fee2e2;
    }

    .cell.wrong-flag {
      background: #fecaca;
    }

    .n1 { color: #2563eb; }
    .n2 { color: #16a34a; }
    .n3 { color: #dc2626; }
    .n4 { color: #4f46e5; }
    .n5 { color: #991b1b; }
    .n6 { color: #0891b2; }
    .n7 { color: #1e293b; }
    .n8 { color: #64748b; }

    :root[data-theme="dark"] .board-wrap {
      background: #1a243a;
      border: 1px solid var(--border);
    }

    :root[data-theme="dark"] .cell.closed {
      background: linear-gradient(180deg, #334155 0%, #24314b 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 1px 2px rgba(0, 0, 0, 0.45);
    }

    :root[data-theme="dark"] .cell.closed:hover,
    :root[data-theme="dark"] .cell.closed.chord-preview {
      background: linear-gradient(180deg, #3b4c68 0%, #2a3a58 100%);
    }

    :root[data-theme="dark"] .cell.flagged {
      background: linear-gradient(180deg, #7c2d12 0%, #4a1d0c 100%);
      color: #fed7aa;
    }

    :root[data-theme="dark"] .cell.question {
      background: linear-gradient(180deg, #1e3a8a 0%, #172554 100%);
      color: #93c5fd;
    }

    :root[data-theme="dark"] .cell.hint-flash {
      animation: hint-glow-dark 0.7s ease-out;
    }

    @keyframes hint-glow-dark {
      0% { box-shadow: inset 0 0 0 3px #34d399; background: #065f46; }
      100% { box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35); }
    }

    :root[data-theme="dark"] .cell.open {
      background: #0f172a;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
    }

    :root[data-theme="dark"] .cell.mine-show {
      background: #fda4af;
    }

    :root[data-theme="dark"] .cell.wrong-flag {
      background: rgba(239, 68, 68, 0.22);
    }

    :root[data-theme="dark"] .n1 { color: #60a5fa; }
    :root[data-theme="dark"] .n2 { color: #4ade80; }
    :root[data-theme="dark"] .n3 { color: #f87171; }
    :root[data-theme="dark"] .n4 { color: #a78bfa; }
    :root[data-theme="dark"] .n5 { color: #fb923c; }
    :root[data-theme="dark"] .n6 { color: #22d3ee; }
    :root[data-theme="dark"] .n7 { color: #e2e8f0; }
    :root[data-theme="dark"] .n8 { color: #94a3b8; }

    /* 本页尺寸；其余外壳样式见 assets/game-shell.css */
    .game-wrap { --game-width: 540px; }
    .hud { grid-template-columns: repeat(3, 1fr); }
    .btn-group { flex-wrap: wrap; justify-content: center; }
    .mine-streak { margin: -4px 0 0; font-size: 0.8rem; }

    @media (max-width: 340px) {
      /* 320px 下按钮改成 2 列，避免最后只剩一个按钮单独一行 */
      .btn-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .board-wrap.shake,
      .cell.hint-flash {
        animation: none;
      }
    }

  </style>
</head>

  <script src="/assets/site-data.js"></script>
  <script src="/assets/i18n.js"></script>
  <script src="/assets/games.js"></script>
  <script src="/assets/game-kit.js"></script>
  <script src="/assets/game-rules.js"></script>
  <script>
    (function () {
      const t = (key, params) => (window.I18N ? I18N.t(key, params) : key);

      function createIcon(name, className, viewBox) {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', className || 'icon');
        svg.setAttribute('viewBox', viewBox || '0 0 24 24');
        svg.setAttribute('aria-hidden', 'true');
        svg.setAttribute('focusable', 'false');
        const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
        use.setAttribute('href', '#' + name);
        svg.appendChild(use);
        return svg;
      }

      function appendCellIcon(btn, name) {
        btn.textContent = '';
        btn.appendChild(createIcon(name, 'cell-icon', '0 0 32 32'));
      }

      const GLOBAL_BEST_KEY = 'game_best_minesweeper';
      const DIFF_BEST_PREFIX = 'game_best_minesweeper_';
      const MODE_KEY = 'game_mode_minesweeper';
      const CURRENT_STREAK_KEY = 'game_save_minesweeper_streak';
      const BEST_STREAK_KEY = 'game_best_minesweeper_streak';
      const MAX_HINTS = 2;

      const DIFFS = {
        easy: { size: 9, mines: 10, label: '9×9 轻松' },
        medium: { size: 12, mines: 22, label: '12×12 标准' },
        hard: { size: 16, mines: 40, label: '16×16 挑战' },
      };

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const boardWrap = document.querySelector('.board-wrap');
      const gridEl = document.getElementById('mine-grid');
      const minesEl = document.getElementById('mines-el');
      const timeEl = document.getElementById('time-el');
      const bestEl = document.getElementById('best-el');
      const streakEl = document.getElementById('mine-streak');
      const hintBtn = document.getElementById('hint-btn');
      const toolBtn = document.getElementById('tool-btn');
      const soundBtn = document.getElementById('sound-btn');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');
      const diffBtns = document.querySelectorAll('.mode-pill[data-diff]');
      const helpBtn = document.getElementById('help-btn');

      let soundEnabled = window.SiteData ? SiteData.getSound() : true;
      GameKit.bindSoundButton(soundBtn, soundEnabled, (on) => {
        soundEnabled = on;
      });

      function playTone(freq, duration, type, slideTo) {
        if (!soundEnabled || !window.SiteData) return;
        SiteData.withAudio((ac) => {
          try {
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = type || 'sine';
            osc.frequency.setValueAtTime(freq, ac.currentTime);
            if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime + duration);
            gain.gain.setValueAtTime(0.08, ac.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start();
            osc.stop(ac.currentTime + duration);
          } catch {}
        });
      }

      let diff = 'easy';
      try {
        const savedDiff = localStorage.getItem(MODE_KEY);
        if (savedDiff && DIFFS[savedDiff]) diff = savedDiff;
      } catch {}
      let size = 9;
      let totalMines = 10;
      let board = [];
      let flagMode = false;
      let started = false;
      let ended = false;
      let elapsed = 0;
      let timerId = null;
      let openedCount = 0;
      let flagCount = 0;
      let hitPos = null;
      let dialogOpen = false;
      let endState = '';
      let endSec = 0;
      let endBest = 0;
      let hintsLeft = MAX_HINTS;
      let hintUsed = false;
      let hintCellKey = '';
      let hintFlashTimer = null;
      let gameId = 0;
      let currentStreak = GameKit.readBest(CURRENT_STREAK_KEY);
      let bestStreak = GameKit.readBest(BEST_STREAK_KEY);

      function readBest(key) {
        return GameKit.readBest(key);
      }

      function saveStreaks() {
        try {
          localStorage.setItem(CURRENT_STREAK_KEY, String(currentStreak));
        } catch {}
        if (bestStreak > 0) GameKit.writeBest(BEST_STREAK_KEY, bestStreak);
      }

      function saveBest(sec) {
        const diffKey = DIFF_BEST_PREFIX + diff;
        const curDiffBest = readBest(diffKey);
        if (!curDiffBest || sec < curDiffBest) {
          GameKit.writeBest(diffKey, sec);
        }
        const curGlobalBest = readBest(GLOBAL_BEST_KEY);
        if (!curGlobalBest || sec < curGlobalBest) {
          GameKit.writeBest(GLOBAL_BEST_KEY, sec);
        }
      }

      function updateHintButton() {
        hintBtn.disabled = !started || ended || hintsLeft <= 0;
        hintBtn.textContent = t('提示 ({n})', { n: hintsLeft });
        hintBtn.title = t('安全提示，使用后本局不计入最快纪录');
      }

      function renderStreak() {
        streakEl.textContent = t('当前连胜 {current} · 最高连胜 {best}', {
          current: currentStreak,
          best: bestStreak,
        });
      }

      function updateHud() {
        minesEl.textContent = Math.max(0, totalMines - flagCount);
        timeEl.textContent = elapsed + 's';
        const best = readBest(DIFF_BEST_PREFIX + diff);
        bestEl.textContent = best > 0 ? best + 's' : '--';
        updateHintButton();
        renderStreak();
      }

      function stopTimer() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
      }

      function startTimer() {
        stopTimer();
        timerId = setInterval(() => {
          if (!started || ended || document.hidden || dialogOpen) return;
          elapsed += 1;
          timeEl.textContent = elapsed + 's';
        }, 1000);
      }

      function neighbors(r, c) {
        return GameRules.mineNeighbors(size, r, c);
      }

      function placeMines(safeR, safeC) {
        GameRules.placeMinesOnBoard(board, totalMines, safeR, safeC);
      }

      function initGame() {
        gameId += 1;
        stopTimer();
        clearTimeout(hintFlashTimer);
        cancelLongPress();
        clearChordPreview();
        suppressClick = false;
        boardWrap.classList.remove('shake');
        const cfg = DIFFS[diff];
        size = cfg.size;
        totalMines = cfg.mines;
        started = false;
        ended = false;
        elapsed = 0;
        openedCount = 0;
        flagCount = 0;
        hitPos = null;
        endState = '';
        endSec = 0;
        endBest = 0;
        hintsLeft = MAX_HINTS;
        hintUsed = false;
        hintCellKey = '';

        board = GameRules.createMineBoard(size);

        diffBtns.forEach((button) => {
          const active = button.dataset.diff === diff;
          button.classList.toggle('active', active);
          button.setAttribute('aria-pressed', String(active));
        });
        gridEl.style.setProperty('--cols', String(size));
        gridEl.className = 'mine-grid' + (size === 12 ? ' mid' : size === 16 ? ' dense' : '');
        overlay.classList.remove('show');
        updateHud();
        render();
      }

      function revealSafeArea(startR, startC) {
        const opened = GameRules.revealMineSafeArea(board, startR, startC);
        openedCount += opened;
        return opened;
      }

      function countFlags(list) {
        let next = 0;
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            if (list[r][c].flag) next += 1;
          }
        }
        return next;
      }

      function checkWin() {
        if (openedCount === size * size - totalMines) {
          ended = true;
          stopTimer();
          for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
              if (board[r][c].mine) {
                board[r][c].flag = true;
                board[r][c].question = false;
              }
            }
          }
          flagCount = totalMines;
          const finalSec = Math.max(1, elapsed);
          if (!hintUsed) {
            saveBest(finalSec);
            currentStreak += 1;
            if (currentStreak > bestStreak) bestStreak = currentStreak;
            saveStreaks();
          }
          updateHud();
          render();
          playTone(523, 0.12, 'triangle', 784);
          setTimeout(() => playTone(784, 0.18, 'sine', 1046), 80);
          endState = 'win';
          endSec = finalSec;
          endBest = readBest(DIFF_BEST_PREFIX + diff);
          renderEndText();
          overlay.classList.add('show');
        }
      }

      function renderEndText() {
        if (endState === 'win') {
          overlayTitle.textContent = t('排雷成功！🎉');
          const summary = hintUsed
            ? t('{label} · 用时 {sec} 秒（使用了安全提示，不计入最快纪录）', {
                label: t(DIFFS[diff].label),
                sec: endSec,
              })
            : t('{label} · 用时 {sec} 秒（最佳 {best} 秒）', {
                label: t(DIFFS[diff].label),
                sec: endSec,
                best: endBest > 0 ? endBest : endSec,
              });
          overlayDesc.textContent = summary;
        } else if (endState === 'lose') {
          overlayTitle.textContent = t('踩到地雷了');
          overlayDesc.textContent = t('坚持了 {elapsed} 秒，再试一次吧！', { elapsed: endSec });
        }
      }

      function triggerLose(r, c) {
        const currentGame = gameId;
        ended = true;
        hitPos = r + ',' + c;
        stopTimer();
        currentStreak = 0;
        saveStreaks();
        updateHud();
        playTone(170, 0.28, 'sawtooth', 75);
        endState = 'lose';
        endSec = elapsed;
        render();
        renderEndText();
        if (!reducedMotion.matches) {
          boardWrap.classList.remove('shake');
          void boardWrap.offsetWidth;
          boardWrap.classList.add('shake');
        }
        const delay = reducedMotion.matches ? 0 : 420;
        if (delay === 0) {
          overlay.classList.add('show');
        } else {
          setTimeout(() => {
            if (currentGame !== gameId || !ended) return;
            overlay.classList.add('show');
          }, delay);
        }
      }

      function openCell(r, c) {
        if (ended) return;
        const cell = board[r][c];
        if (cell.flag) return;

        if (!started) {
          started = true;
          placeMines(r, c);
          startTimer();
          updateHintButton();
        }

        if (cell.open) {
          // 快捷排雷（Chord）：周围旗子数等于数字时翻开其余格
          if (cell.adj > 0) {
            const adjCells = neighbors(r, c);
            const flags = adjCells.filter(([nr, nc]) => board[nr][nc].flag).length;
            if (flags === cell.adj) {
              let anyOpened = false;
              for (const [nr, nc] of adjCells) {
                const target = board[nr][nc];
                if (target.open || target.flag) continue;
                if (target.mine) {
                  triggerLose(nr, nc);
                  return;
                }
                anyOpened = revealSafeArea(nr, nc) > 0 || anyOpened;
              }
              if (anyOpened) {
                playTone(580, 0.06, 'sine', 740);
                render();
                checkWin();
              }
            }
          }
          return;
        }

        if (cell.mine) {
          triggerLose(r, c);
          return;
        }

        const count = revealSafeArea(r, c);
        playTone(count > 3 ? 620 : 480, 0.05, 'sine', count > 3 ? 820 : 560);
        render();
        checkWin();
      }

      function toggleFlag(r, c) {
        if (ended) return;
        const cell = board[r][c];
        if (cell.open) return;
        if (!cell.flag && !cell.question) {
          cell.flag = true;
          flagCount += 1;
          playTone(680, 0.05, 'triangle');
        } else if (cell.flag) {
          cell.flag = false;
          cell.question = true;
          flagCount = countFlags(board);
          playTone(520, 0.045, 'sine');
        } else {
          cell.question = false;
          playTone(380, 0.05, 'triangle');
        }
        updateHud();
        render();
      }

      function useSafeHint() {
        if (!started || ended || hintsLeft <= 0) return;
        const pick = GameRules.findSafeMineCell(board);
        if (!pick) return;
        hintsLeft -= 1;
        hintUsed = true;
        const [hr, hc] = pick;
        hintCellKey = hr + ',' + hc;
        clearTimeout(hintFlashTimer);
        hintFlashTimer = setTimeout(() => {
          hintCellKey = '';
          gridEl.querySelectorAll('.cell.hint-flash').forEach((el) => el.classList.remove('hint-flash'));
        }, 720);
        playTone(760, 0.08, 'sine', 980);
        updateHintButton();
        openCell(hr, hc);
      }

      function render() {
        const focusedCell = gridEl.contains(document.activeElement) ? document.activeElement.dataset : null;
        gridEl.innerHTML = '';
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            const cell = board[r][c];
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.dataset.r = String(r);
            btn.dataset.c = String(c);

            if (ended) {
              if (cell.mine && hitPos === r + ',' + c) {
                btn.className = 'cell mine-hit';
                appendCellIcon(btn, 'art-explosion');
              } else if (cell.mine && !cell.flag) {
                btn.className = 'cell mine-show';
                appendCellIcon(btn, 'game-minesweeper');
              } else if (!cell.mine && cell.flag) {
                btn.className = 'cell wrong-flag';
                appendCellIcon(btn, 'art-cross');
              } else if (cell.flag) {
                btn.className = 'cell closed flagged';
                appendCellIcon(btn, 'icon-flag');
              } else if (cell.open) {
                btn.className = 'cell open' + (cell.adj > 0 ? ' n' + cell.adj : '');
                btn.textContent = cell.adj > 0 ? String(cell.adj) : '';
              } else if (cell.question) {
                btn.className = 'cell closed question';
                btn.textContent = '?';
              } else {
                btn.className = 'cell closed';
              }
            } else if (cell.open) {
              btn.className = 'cell open' + (cell.adj > 0 ? ' n' + cell.adj + ' chordable' : '') +
                (hintCellKey === r + ',' + c ? ' hint-flash' : '');
              btn.textContent = cell.adj > 0 ? String(cell.adj) : '';
            } else if (cell.flag) {
              btn.className = 'cell closed flagged';
              appendCellIcon(btn, 'icon-flag');
            } else if (cell.question) {
              btn.className = 'cell closed question';
              btn.textContent = '?';
            } else {
              btn.className = 'cell closed';
            }

            let stateLabel;
            if (cell.mine && ended) {
              stateLabel = t(hitPos === r + ',' + c ? '踩中的地雷' : '地雷');
            } else if (!cell.mine && cell.flag && ended) {
              stateLabel = t('插错的旗子');
            } else if (cell.flag) {
              stateLabel = t('已插旗');
            } else if (cell.question) {
              stateLabel = t('已标问号');
            } else if (cell.open) {
              stateLabel = cell.adj > 0
                ? (cell.adj === 1
                  ? t('已翻开，周围 1 颗雷')
                  : t('已翻开，周围 {adj} 颗雷', { adj: cell.adj }))
                : t('已翻开，空白');
            } else {
              stateLabel = t('未翻开');
            }
            btn.setAttribute('aria-label', t('第 {row} 行第 {col} 列，{state}', {
              row: r + 1,
              col: c + 1,
              state: stateLabel,
            }));

            gridEl.appendChild(btn);
            if (focusedCell?.r === btn.dataset.r && focusedCell.c === btn.dataset.c) {
              btn.focus({ preventScroll: true });
            }
          }
        }
      }

      // 事件委托：支持左键翻开/快捷排雷、右键插旗与问号循环、手机长按标记、邻格高亮预览
      let longPress = null;
      let suppressClick = false;

      function clearChordPreview() {
        gridEl.querySelectorAll('.cell.chord-preview').forEach((el) => el.classList.remove('chord-preview'));
      }

      function cancelLongPress(event) {
        clearChordPreview();
        if (!longPress || (event && event.pointerId !== longPress.id)) return;
        clearTimeout(longPress.timer);
        longPress = null;
      }

      gridEl.addEventListener('contextmenu', (e) => e.preventDefault());

      gridEl.addEventListener('pointerdown', (e) => {
        cancelLongPress();
        if (!e.isPrimary) return;
        const btn = e.target.closest('.cell');
        if (!btn || ended) return;
        const isMouse = e.pointerType === 'mouse' || !e.pointerType;
        if (e.button !== 0) return;
        suppressClick = false;
        const r = Number(btn.dataset.r);
        const c = Number(btn.dataset.c);
        if (!flagMode && board[r][c].open && board[r][c].adj > 0) {
          neighbors(r, c).forEach(([nr, nc]) => {
            const target = board[nr][nc];
            if (!target.open && !target.flag) {
              gridEl.querySelector(`.cell[data-r="${nr}"][data-c="${nc}"]`)?.classList.add('chord-preview');
            }
          });
        }
        // 长按标记只用于触屏/手写笔；鼠标慢点不应变成标记
        if (!isMouse && !board[r][c].open) {
          const timer = setTimeout(() => {
            longPress = null;
            suppressClick = true;
            toggleFlag(r, c);
            if (navigator.vibrate) navigator.vibrate(15);
          }, 320);
          longPress = { id: e.pointerId, x: e.clientX, y: e.clientY, timer };
        }
      });

      gridEl.addEventListener('pointermove', (e) => {
        if (longPress?.id === e.pointerId && Math.hypot(e.clientX - longPress.x, e.clientY - longPress.y) > 8) {
          cancelLongPress(e);
          suppressClick = true;
        }
      });
      gridEl.addEventListener('pointerup', cancelLongPress);
      gridEl.addEventListener('pointerleave', cancelLongPress);
      gridEl.addEventListener('pointercancel', cancelLongPress);
      gridEl.addEventListener('lostpointercapture', cancelLongPress);

      gridEl.addEventListener('mousedown', (e) => {
        if (e.button !== 2) return;
        const btn = e.target.closest('.cell');
        if (!btn) return;
        toggleFlag(Number(btn.dataset.r), Number(btn.dataset.c));
      });

      gridEl.addEventListener('click', (e) => {
        if (suppressClick && e.detail !== 0) {
          suppressClick = false;
          return;
        }
        const btn = e.target.closest('.cell');
        if (!btn) return;
        const r = Number(btn.dataset.r);
        const c = Number(btn.dataset.c);
        if (flagMode && !board[r][c].open) {
          toggleFlag(r, c);
        } else {
          openCell(r, c);
        }
      });

      async function confirmAbandonAndRun(action, nextDiff) {
        if (!started || ended) {
          action();
          return;
        }
        const switching = Boolean(nextDiff && nextDiff !== diff);
        dialogOpen = true;
        const ok = await window.SiteData.confirmDialog({
          title: t(switching ? '切换难度' : '重开棋局'),
          message: t(switching ? '切换难度会清除当前棋局进度。' : '当前排雷进度将被清除，确定重开吗？'),
          confirmText: t(switching ? '切换' : '重开'),
          cancelText: t('继续本局'),
          danger: true,
        });
        dialogOpen = false;
        if (ok) action();
      }

      diffBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          const next = btn.dataset.diff;
          if (!DIFFS[next] || next === diff) return;
          confirmAbandonAndRun(() => {
            diff = next;
            try { localStorage.setItem(MODE_KEY, diff); } catch {}
            initGame();
          }, next);
        });
      });

      function renderToolMode() {
        toolBtn.textContent = '';
        toolBtn.appendChild(createIcon('icon-flag', 'tool-icon', '0 0 24 24'));
        const label = document.createElement('span');
        label.textContent = t(flagMode ? '模式: 插旗' : '模式: 翻开');
        toolBtn.appendChild(label);
        toolBtn.classList.toggle('flag-active', flagMode);
        toolBtn.setAttribute('aria-pressed', String(flagMode));
      }

      function toggleToolMode() {
        flagMode = !flagMode;
        renderToolMode();
      }

      toolBtn.addEventListener('click', toggleToolMode);
      hintBtn.addEventListener('click', useSafeHint);

      document.addEventListener('keydown', (e) => {
        if (GameKit.shouldIgnoreGameKey(e, { ignoreOnControl: true })) return;
        if (window.SiteData && SiteData.isDialogOpen && SiteData.isDialogOpen()) return;
        if (window.GameKit && GameKit.isTutorialOpen && GameKit.isTutorialOpen()) return;
        const target = e.target;
        if (target instanceof Element && target.closest('input, textarea, select, [contenteditable="true"]')) return;
        if (e.code === 'KeyF') {
          e.preventDefault();
          toggleToolMode();
        } else if (e.code === 'KeyH') {
          e.preventDefault();
          useSafeHint();
        } else if (e.code === 'KeyR') {
          e.preventDefault();
          confirmAbandonAndRun(initGame);
        }
      });

      document.addEventListener('site:dialogopen', () => {
        cancelLongPress();
        dialogOpen = true;
      });
      document.addEventListener('site:dialogclose', () => {
        dialogOpen = false;
      });

      document.getElementById('restart-btn').addEventListener('click', () => confirmAbandonAndRun(initGame));
      document.getElementById('overlay-btn').addEventListener('click', initGame);
      document.getElementById('view-board-btn').addEventListener('click', () => {
        overlay.classList.remove('show');
      });

      document.addEventListener('i18n:change', () => {
        renderToolMode();
        updateHintButton();
        renderStreak();
        if (ended) renderEndText();
        render();
      });

      const TUTORIAL_STEPS = [
        {
          icon: 'art-target',
          title: '目标：翻开所有安全格',
          text: '把所有不是雷的格子翻开就赢；不需要去点雷。',
        },
        {
          icon: 'art-grid',
          title: '数字 = 周围 8 格雷数',
          text: '数字表示它周围 8 格里有几颗雷，不是全盘剩余的雷数。',
        },
        {
          icon: 'icon-flag',
          title: '翻开、插旗与问号',
          text: '左键翻开；右键或手机长按可在插旗与 ? 间切换。第一下一定安全，支持三档难度与每局 2 次安全提示。',
        },
        {
          icon: 'art-zap',
          title: '快捷排雷',
          text: '周围旗数等于数字时，再点数字可翻开其余邻格。插错旗可能踩雷。',
        },
      ];

      function showRules(force) {
        GameKit.showTutorial({
          id: 'minesweeper',
          steps: TUTORIAL_STEPS.map((step) => ({
            icon: step.icon,
            title: t(step.title),
            text: t(step.text),
          })),
          force: !!force,
        });
      }

      helpBtn.addEventListener('click', () => showRules(true));

      initGame();
      renderToolMode();
      GameKit.mountMoreGames('minesweeper', document.getElementById('more-games'));
      showRules(false);
    })();
  </script>
</body>
</html>
