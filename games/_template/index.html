<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>示例小游戏 - 小游乐场</title>
  <meta name="description" content="新增游戏模板：包含公共游戏外壳、HUD、音效、最高分、更多游戏与自定义确认弹窗。" />
  <meta name="author" content="Hayden-He" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="小游乐场" />
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/style.css" />
  <link rel="stylesheet" href="/assets/game-shell.css" />
  <link rel="stylesheet" href="./modules/template.css" />
</head>
<body>
  <!-- inline-icons:start -->
  <!-- inline-icons:end -->
  <header class="game-topbar">
    <div class="container game-topbar-inner">
      <a class="back-link" href="/" data-i18n="← 返回大厅">← 返回大厅</a>
      <h1 class="game-topbar-title">
        <svg class="title-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><use href="#game-template"></use></svg>
        <span data-i18n="示例小游戏">示例小游戏</span>
      </h1>
      <div class="game-topbar-actions">
        <a class="game-topbar-cat" href="/categories/puzzle" data-i18n="益智休闲">益智休闲</a>
        <button class="lang-btn theme-btn" type="button" data-theme-toggle aria-label="主题：跟随系统" title="主题：跟随系统"><svg class="theme-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#theme-system"></use></svg></button>
        <button class="lang-btn" type="button" data-lang-toggle>EN</button>
      </div>
    </div>
  </header>

  <main class="game-wrap">
    <div class="hud">
      <div class="hud-box">
        <div class="hud-label" data-i18n="当前得分">当前得分</div>
        <div id="score-el" class="hud-value">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label" data-i18n="模式最高">模式最高</div>
        <div id="best-el" class="hud-value" style="color: var(--accent-text);">0</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="btn-group">
        <button id="sound-btn" class="btn-small secondary" type="button">音效: 开</button>
        <button id="restart-btn" class="btn-small" type="button" data-i18n="重开">重开</button>
      </div>
    </div>

    <div class="template-stage">
      <button id="target" class="template-target" type="button" data-i18n="开始游戏">开始游戏</button>
      <div id="overlay" class="overlay" role="status" aria-live="polite">
        <h2 data-i18n="完成！">完成！</h2>
        <p id="overlay-desc"></p>
        <div class="overlay-actions">
          <button id="overlay-btn" class="overlay-btn" type="button" data-i18n="再来一局">再来一局</button>
        </div>
      </div>
    </div>

    <div id="more-games" class="more-games" data-more-games="template"></div>
  </main>

  <script src="/assets/site-data.js"></script>
  <script src="/assets/i18n.js"></script>
  <script src="/assets/games.js"></script>
  <script src="/assets/game-kit.js"></script>
  <script type="module" src="./modules/main.js"></script>
</body>
</html>
