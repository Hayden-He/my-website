<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta property="og:description" content="数字华容道：滑动数字方块，把 1–8 / 1–15 按顺序排好；支持 3×3 与 4×4 棋盘，步数越少越好。" />

  <meta name="twitter:description" content="数字华容道：滑动数字方块，把 1–8 / 1–15 按顺序排好；支持 3×3 与 4×4 棋盘，步数越少越好。" />

  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="小游乐场" />

  <link rel="stylesheet" href="/assets/style.css" />
  <link rel="stylesheet" href="/assets/game-shell.css" />
  <style>
    :root { --game-width: 520px; }

    .hud {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .slide-stage {
      position: relative;
      width: 100%;
    }

    .slide-board {
      display: grid;
      grid-template-columns: repeat(var(--size, 3), 1fr);
      gap: 8px;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      aspect-ratio: 1 / 1;
      padding: 10px;
      background: var(--track);
      border-radius: 18px;
      touch-action: manipulation;
    }

    .slide-tile {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-strong);
      border-radius: 11px;
      background: var(--surface);
      color: var(--text);
      font-size: clamp(1.15rem, 5.6vw, 2rem);
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 2px 0 var(--border-strong);
      transition: transform 0.1s ease, background 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .slide-tile:active {
      transform: scale(0.96);
    }

    .slide-tile.movable {
      background: #eff6ff;
      border-color: #93c5fd;
    }

    :root[data-theme="dark"] .slide-tile.movable {
      background: rgba(59, 130, 246, 0.22);
      border-color: #3b82f6;
    }

    .slide-goal {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 12px;
    }

    .slide-goal .hint-text { text-align: start; }
    .slide-goal-grid {
      display: grid;
      flex: none;
      grid-template-columns: repeat(var(--size, 3), 1fr);
      gap: 2px;
    }
    .slide-goal-grid span {
      display: grid;
      place-items: center;
      width: 1.15rem;
      height: 1.15rem;
      background: var(--track);
      border-radius: 3px;
      font-size: 0.65rem;
      font-weight: 700;
    }
    .slide-goal-grid span:empty { background: transparent; border: 1px dashed var(--text-muted); }
    .slide-stage .overlay-actions { flex-wrap: wrap; justify-content: center; }

    .slide-tile:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }

    .slide-tile.blank {
      background: transparent;
      border: 1px dashed var(--border-strong);
      box-shadow: none;
      cursor: default;
    }

    .slide-board[data-size="4"] .slide-tile {
      border-radius: 9px;
      font-size: clamp(0.95rem, 4.2vw, 1.5rem);
    }

    @media (max-width: 380px) {
      .toolbar .mode-pill {
        padding-inline: 7px;
        font-size: 0.74rem;
        white-space: nowrap;
      }
      .toolbar .btn-small { padding-inline: 6px; }
      .slide-goal .hint-text { font-size: 0.76rem; line-height: 1.35; }
      .slide-board {
        gap: 6px;
        padding: 8px;
      }

      .slide-tile {
        border-radius: 9px;
      }
    }
  </style>
</head>
<body>
  <!-- inline-icons:start -->
  <!-- inline-icons:end -->

  <header class="game-topbar">
    <div class="container game-topbar-inner">
      <a class="back-link" href="/" data-i18n="← 返回大厅">← 返回大厅</a>
      <h1 class="game-topbar-title">
        <svg class="title-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><use href="#game-slide"></use></svg>
        <span data-i18n="数字华容道">数字华容道</span>
      </h1>
      <div class="game-topbar-actions">
        <a class="game-topbar-cat" href="/categories/puzzle" data-i18n="益智休闲">益智休闲</a>
        <button class="lang-btn theme-btn" type="button" data-theme-toggle aria-label="主题：跟随系统" title="主题：跟随系统"><svg class="theme-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#theme-system"></use></svg></button>
        <button class="lang-btn" type="button" data-lang-toggle>EN</button>
      </div>
    </div>
  </header>

  <main class="game-wrap">
    <div class="hud">
      <div class="hud-box">
        <div class="hud-label" data-i18n="步数">步数</div>
        <div id="moves-el" class="hud-value">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label" data-i18n="用时">用时</div>
        <div id="time-el" class="hud-value" style="color: var(--primary);">0s</div>
      </div>
      <div class="hud-box">
        <div class="hud-label" data-i18n="最少步数">最少步数</div>
        <div id="best-el" class="hud-value" style="color: var(--accent-text);">--</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="mode-pills" role="group" aria-label="棋盘尺寸" data-i18n-attr="aria-label:棋盘尺寸">
        <button id="mode-beginner" class="mode-pill" data-slide-mode="beginner" data-i18n="3×3 入门">3×3 入门</button>
        <button id="mode-3" class="mode-pill active" data-slide-mode="3" data-i18n="3×3 经典">3×3 经典</button>
        <button id="mode-4" class="mode-pill" data-slide-mode="4" data-i18n="4×4 标准">4×4 标准</button>
      </div>
      <div class="btn-group">
        <button id="help-btn" class="btn-small secondary" type="button" title="查看玩法" data-i18n="玩法" data-i18n-attr="title:查看玩法">玩法</button>
        <button id="sound-btn" class="btn-small secondary">音效: 开</button>
        <button id="restart-btn" class="btn-small" data-i18n="重开">重开</button>
        <button id="retry-btn" class="btn-small secondary" data-i18n="同盘重试">同盘重试</button>
      </div>
    </div>

    <div class="slide-goal">
      <p class="hint-text" data-i18n="点空位旁的方块，按顺序排好数字。空位留在右下角。">点空位旁的方块，按顺序排好数字。空位留在右下角。</p>
      <div id="slide-goal-grid" class="slide-goal-grid" aria-hidden="true"></div>
    </div>
    <div class="slide-stage">
      <div id="slide-board" class="slide-board" role="grid" aria-label="数字华容道棋盘" data-i18n-attr="aria-label:数字华容道棋盘"></div>
      <div id="overlay" class="overlay" role="status" aria-live="polite">
        <h2 id="overlay-title">完成！</h2>
        <p id="overlay-desc">步数：0 · 用时：0s</p>
        <div class="overlay-actions">
          <button id="overlay-btn" class="overlay-btn" data-i18n="再来一局">再来一局</button>
          <button id="overlay-retry-btn" class="overlay-btn secondary" data-i18n="同盘重试">同盘重试</button>
        </div>
      </div>
    </div>

    <p class="hint-text" data-i18n="键盘也可用方向键移动。初次玩可选 3×3 入门。">键盘也可用方向键移动。初次玩可选 3×3 入门。</p>

    <div id="more-games" class="more-games"></div>
  </main>

  <script src="/assets/site-data.js"></script>
  <script src="/assets/i18n.js"></script>
  <script src="/assets/games.js"></script>
  <script src="/assets/game-kit.js"></script>
  <script src="/assets/game-rules.js"></script>
  <script>
    (function () {
      const t = (key, params) => (window.I18N ? I18N.t(key, params) : key);
      const MODES = { beginner: 3, 3: 3, 4: 4 };
      const BEST_PREFIX = 'game_best_slide_';
      const MODE_KEY = 'game_mode_slide';

      const boardEl = document.getElementById('slide-board');
      const goalGrid = document.getElementById('slide-goal-grid');
      const movesEl = document.getElementById('moves-el');
      const timeEl = document.getElementById('time-el');
      const bestEl = document.getElementById('best-el');
      const soundBtn = document.getElementById('sound-btn');
      const restartBtn = document.getElementById('restart-btn');
      const retryBtn = document.getElementById('retry-btn');
      const modeButtons = document.querySelectorAll('[data-slide-mode]');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');
      const overlayBtn = document.getElementById('overlay-btn');
      const overlayRetryBtn = document.getElementById('overlay-retry-btn');

      let mode = '3';
      try {
        const savedMode = localStorage.getItem(MODE_KEY);
        if (typeof MODES[savedMode] === 'number') mode = savedMode;
      } catch {}

      let size = MODES[mode];
      let board = [];
      let initialBoard = [];
      let moves = 0;
      let elapsed = 0;
      let timerId = null;
      let started = false;
      let ended = false;
      let newRecord = false;
      let dialogOpen = false;

      let soundEnabled = window.SiteData ? SiteData.getSound() : true;
      GameKit.bindSoundButton(soundBtn, soundEnabled, (on) => {
        soundEnabled = on;
      });

      function playTone(freq, duration, delay) {
        if (!soundEnabled || !window.SiteData) return;
        setTimeout(() => {
          SiteData.withAudio((audio) => {
            const osc = audio.createOscillator();
            const gain = audio.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.06, audio.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + duration);
            osc.connect(gain);
            gain.connect(audio.destination);
            osc.start();
            osc.stop(audio.currentTime + duration);
          });
        }, delay || 0);
      }

      function bestKey() {
        return BEST_PREFIX + mode;
      }

      function readBest() {
        return GameKit.readBest(bestKey());
      }

      function stopTimer() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
      }

      function startTimer() {
        if (timerId) return;
        timerId = setInterval(() => {
          if (!started || ended || document.hidden || dialogOpen) return;
          elapsed += 1;
          timeEl.textContent = elapsed + 's';
        }, 1000);
      }

      function updateHud() {
        movesEl.textContent = String(moves);
        timeEl.textContent = elapsed + 's';
        const best = readBest();
        bestEl.textContent = best > 0 ? best + t(' 步') : '--';
      }

      function renderGoal() {
        goalGrid.style.setProperty('--size', String(size));
        goalGrid.replaceChildren(...GameRules.solvedSlideBoard(size).map((value) => {
          const tile = document.createElement('span');
          if (value) tile.textContent = String(value);
          return tile;
        }));
      }

      function render() {
        const activeTile = document.activeElement;
        const focusedValue = boardEl.contains(activeTile) ? Number(activeTile.textContent) : null;
        boardEl.style.setProperty('--size', String(size));
        boardEl.dataset.size = String(size);
        boardEl.innerHTML = '';
        const movable = GameRules.slideNeighbors(size, board.indexOf(0));
        board.forEach((value, index) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'slide-tile' + (value === 0 ? ' blank' : '');
          btn.dataset.index = String(index);
          if (value === 0) {
            btn.disabled = true;
            btn.setAttribute('aria-hidden', 'true');
            btn.setAttribute('aria-label', t('空格'));
          } else {
            btn.classList.toggle('movable', !ended && movable.includes(index));
            const row = Math.floor(index / size) + 1;
            const col = (index % size) + 1;
            btn.textContent = String(value);
            btn.setAttribute('aria-label', t('第 {row} 行第 {col} 列，数字 {n}', { row, col, n: value }));
            btn.addEventListener('click', () => moveTile(index));
          }
          boardEl.appendChild(btn);
          if (value !== 0 && value === focusedValue) btn.focus({ preventScroll: true });
        });
      }

      function startIfNeeded() {
        if (!started) {
          started = true;
          startTimer();
        }
      }

      function moveTile(index) {
        if (ended) return;
        const blank = board.indexOf(0);
        if (!GameRules.slideNeighbors(size, blank).includes(index)) return;
        const from = boardEl.children[index].getBoundingClientRect();
        [board[blank], board[index]] = [board[index], board[blank]];
        moves += 1;
        startIfNeeded();
        playTone(520, 0.04);
        render();
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
          const tile = boardEl.children[blank];
          const to = tile.getBoundingClientRect();
          tile.animate?.([
            { transform: `translate(${from.x - to.x}px, ${from.y - to.y}px)` },
            { transform: 'translate(0, 0)' },
          ], { duration: 110, easing: 'ease-out' });
        }
        updateHud();
        if (board.every((value, i) => value === (i + 1) % board.length)) finish();
      }

      function finish() {
        ended = true;
        stopTimer();
        const previousBest = readBest();
        newRecord = previousBest === 0 || moves < previousBest;
        if (newRecord) GameKit.writeBest(bestKey(), moves);
        const best = readBest();
        overlayTitle.textContent = t('完成！');
        overlayDesc.textContent = (newRecord ? t('新纪录！') : '') +
          t('步数：{moves} · 用时：{elapsed}s · 最少 {best} 步', { moves, elapsed, best });
        overlay.classList.add('show');
        if (boardEl.contains(document.activeElement)) overlayBtn.focus({ preventScroll: true });
        updateHud();
        playTone(660, 0.1);
        setTimeout(() => playTone(880, 0.14), 90);
      }

      function initGame(nextMode = mode, retry = false) {
        mode = nextMode;
        size = MODES[mode];
        stopTimer();
        moves = 0;
        elapsed = 0;
        started = false;
        ended = false;
        newRecord = false;
        if (retry) board = initialBoard.slice();
        else {
          board = GameRules.shuffleSlideBoard(size, mode === 'beginner');
          initialBoard = board.slice();
        }
        overlay.classList.remove('show');
        modeButtons.forEach((button) => {
          const active = button.dataset.slideMode === mode;
          button.classList.toggle('active', active);
          button.setAttribute('aria-pressed', String(active));
        });
        renderGoal();
        render();
        updateHud();
        try {
          localStorage.setItem(MODE_KEY, mode);
        } catch {}
      }

      async function restartWithConfirm(nextMode = mode, retry = false) {
        const switching = nextMode !== mode;
        if (moves === 0 || ended) {
          initGame(nextMode, retry);
          return;
        }
        const ok = await window.SiteData.confirmDialog({
          title: switching ? t('切换模式') : retry ? t('同盘重试') : t('重开本局'),
          message: switching
            ? t('切换模式会清除当前棋局进度。')
            : t('当前进度将被清除，确定重开吗？'),
          confirmText: switching ? t('切换') : retry ? t('重试') : t('重开'),
          cancelText: t('继续本局'),
          danger: true,
        });
        if (ok) initGame(nextMode, retry);
      }

      modeButtons.forEach((button) => {
        button.addEventListener('click', () => {
          if (button.dataset.slideMode !== mode) restartWithConfirm(button.dataset.slideMode);
        });
      });
      restartBtn.addEventListener('click', () => restartWithConfirm());
      retryBtn.addEventListener('click', () => restartWithConfirm(mode, true));
      overlayBtn.addEventListener('click', () => initGame());
      overlayRetryBtn.addEventListener('click', () => initGame(mode, true));

      document.addEventListener('keydown', (event) => {
        if (GameKit.shouldIgnoreGameKey(event, { ignoreOnControl: true })) return;
        if (window.SiteData && SiteData.isDialogOpen && SiteData.isDialogOpen()) return;
        if (window.GameKit && GameKit.isTutorialOpen && GameKit.isTutorialOpen()) return;
        if (ended) return;
        const blank = board.indexOf(0);
        const row = Math.floor(blank / size);
        const col = blank % size;
        let target = -1;
        if (event.key === 'ArrowUp' && row < size - 1) target = blank + size;
        else if (event.key === 'ArrowDown' && row > 0) target = blank - size;
        else if (event.key === 'ArrowLeft' && col < size - 1) target = blank + 1;
        else if (event.key === 'ArrowRight' && col > 0) target = blank - 1;
        if (target < 0) return;
        event.preventDefault();
        moveTile(target);
      });

      document.addEventListener('site:dialogopen', () => {
        dialogOpen = true;
      });
      document.addEventListener('site:dialogclose', () => {
        dialogOpen = false;
      });

      document.addEventListener('i18n:change', () => {
        render();
        updateHud();
        if (ended) {
          overlayTitle.textContent = t('完成！');
          const best = readBest();
          overlayDesc.textContent = (newRecord ? t('新纪录！') : '') +
            t('步数：{moves} · 用时：{elapsed}s · 最少 {best} 步', { moves, elapsed, best });
        }
      });

      function showTutorial(force) {
        GameKit.showTutorial({
          id: 'slide',
          force,
          steps: [
            { icon: 'game-slide', title: t('按序还原数字'), text: t('点击空位旁的方块，或用方向键把数字按顺序排好，把空位留在右下角。') },
            { icon: 'art-grid', title: t('多种难度与重试'), text: t('新手可先试 3×3 入门，进阶挑战 4×4；不满意步数时可点「同盘重试」刷新纪录。') },
          ],
        });
      }

      document.getElementById('help-btn').addEventListener('click', () => showTutorial(true));
      initGame();
      GameKit.mountMoreGames('slide', document.getElementById('more-games'));
      showTutorial(false);
    })();
  </script>
</body>
</html>
