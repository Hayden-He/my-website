  <style>
    :root { --game-width: 520px; }

    .slide-stage {
      position: relative;
      margin-top: 16px;
    }

    .slide-board {
      display: grid;
      grid-template-columns: repeat(var(--size, 3), 1fr);
      gap: 8px;
      width: min(100%, 440px);
      margin: 0 auto;
      aspect-ratio: 1 / 1;
      padding: 10px;
      background: var(--bg);
      border-radius: 18px;
      touch-action: manipulation;
    }

    .slide-tile {
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 11px;
      background: #fff;
      color: var(--text);
      font-size: clamp(1.1rem, 5.2vw, 1.9rem);
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 2px 0 rgba(15, 23, 42, 0.08);
      transition: transform 0.1s ease, background 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .slide-tile:active {
      transform: scale(0.96);
    }

    .slide-tile:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }

    .slide-tile.blank {
      background: transparent;
      box-shadow: none;
      cursor: default;
    }

    .slide-board[data-size="4"] .slide-tile {
      border-radius: 9px;
      font-size: clamp(0.95rem, 4.2vw, 1.5rem);
    }

    @media (max-width: 380px) {
      .slide-board {
        gap: 6px;
        padding: 8px;
      }

      .slide-tile {
        border-radius: 9px;
      }
    }
  </style>
</head>

    <path d="M16 2l3 8 8-3-3 8 8 3-8 3 3 8-8-3-3 8-3-8-8 3 3-8-8-3 8-3-3-8 8 3z" fill="#f97316"/>
    <circle cx="16" cy="16" r="6" fill="#facc15"/>
    <circle cx="16" cy="16" r="2.6" fill="#fff7ed"/>
  </symbol>
  <symbol id="art-cross" viewBox="0 0 32 32">
    <path d="M8 8l16 16M24 8 8 24" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  </symbol>
  <symbol id="game-slide" viewBox="0 0 32 32">
    <rect x="3" y="3" width="26" height="26" rx="7" fill="#e0e7ff"/>
    <g fill="#2563eb">
      <rect x="7" y="7" width="5" height="5" rx="1.4"/>
      <rect x="13.5" y="7" width="5" height="5" rx="1.4"/>
      <rect x="20" y="7" width="5" height="5" rx="1.4"/>
      <rect x="7" y="13.5" width="5" height="5" rx="1.4"/>
      <rect x="13.5" y="13.5" width="5" height="5" rx="1.4"/>
      <rect x="20" y="13.5" width="5" height="5" rx="1.4"/>
      <rect x="7" y="20" width="5" height="5" rx="1.4"/>
      <rect x="13.5" y="20" width="5" height="5" rx="1.4"/>
    </g>
    <rect x="20" y="20" width="5" height="5" rx="1.4" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  </symbol>
</svg>
<!-- inline-icons:end -->

  <header class="game-topbar">
    <div class="container game-topbar-inner">
      <a class="back-link" href="/" data-i18n="← 返回大厅">← 返回大厅</a>
      <h1 class="game-topbar-title">
        <svg class="title-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><use href="#game-slide"></use></svg>
        <span data-i18n="数字华容道">数字华容道</span>
      </h1>
      <div class="game-topbar-actions">
        <a class="game-topbar-cat" href="/categories/puzzle.html" data-i18n="益智休闲">益智休闲</a>
        <button class="lang-btn" type="button" data-lang-toggle>EN</button>
      </div>
    </div>
  </header>

  <main class="game-wrap">
    <div class="hud">
      <div class="hud-box">
        <div class="hud-label" data-i18n="步数">步数</div>
        <div id="moves-el" class="hud-value">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label" data-i18n="用时">用时</div>
        <div id="time-el" class="hud-value" style="color: var(--primary);">0s</div>
      </div>
      <div class="hud-box">
        <div class="hud-label" data-i18n="最少步数">最少步数</div>
        <div id="best-el" class="hud-value" style="color: var(--accent-text);">--</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="mode-pills" role="group" aria-label="棋盘尺寸" data-i18n-attr="aria-label:棋盘尺寸">
        <button id="mode-3" class="mode-pill active" data-i18n="3×3 轻松">3×3 轻松</button>
        <button id="mode-4" class="mode-pill" data-i18n="4×4 标准">4×4 标准</button>
      </div>
      <div class="btn-group">
        <button id="sound-btn" class="btn-small secondary">音效: 开</button>
        <button id="restart-btn" class="btn-small" data-i18n="重开">重开</button>
      </div>
    </div>

    <div class="slide-stage">
      <div id="slide-board" class="slide-board" role="grid" aria-label="数字华容道棋盘" data-i18n-attr="aria-label:数字华容道棋盘"></div>
      <div id="overlay" class="overlay" role="status" aria-live="polite">
        <h2 id="overlay-title">完成！</h2>
        <p id="overlay-desc">步数：0 · 用时：0s</p>
        <div class="overlay-actions">
          <button id="overlay-btn" class="overlay-btn" data-i18n="再来一局">再来一局</button>
        </div>
      </div>
    </div>

    <p class="hint-text" data-i18n="点击或轻触空格旁的方块滑动；方向键也可操作；3×3 先热身。">点击或轻触空格旁的方块滑动；方向键也可操作；3×3 先热身。</p>

    <div id="more-games" class="more-games"></div>
  </main>

  <script>
    (function () {
      const t = (key, params) => (window.I18N ? I18N.t(key, params) : key);
      const MODES = { 3: { size: 3, label: '3×3 轻松' }, 4: { size: 4, label: '4×4 标准' } };
      const BEST_PREFIX = 'game_best_slide_';
      const MODE_KEY = 'game_mode_slide';

      const boardEl = document.getElementById('slide-board');
      const movesEl = document.getElementById('moves-el');
      const timeEl = document.getElementById('time-el');
      const bestEl = document.getElementById('best-el');
      const soundBtn = document.getElementById('sound-btn');
      const restartBtn = document.getElementById('restart-btn');
      const mode3Btn = document.getElementById('mode-3');
      const mode4Btn = document.getElementById('mode-4');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');
      const overlayBtn = document.getElementById('overlay-btn');

      let mode = 3;
      try {
        if (Number(localStorage.getItem(MODE_KEY)) === 4) mode = 4;
      } catch {}

      let size = mode;
      let board = [];
      let moves = 0;
      let elapsed = 0;
      let timerId = null;
      let started = false;
      let ended = false;
      let newRecord = false;
      let dialogOpen = false;

      let soundEnabled = window.SiteData ? SiteData.getSound() : true;
      GameKit.bindSoundButton(soundBtn, soundEnabled, (on) => {
        soundEnabled = on;
      });

      function playTone(freq, duration, delay) {
        if (!soundEnabled || !window.SiteData) return;
        setTimeout(() => {
          SiteData.withAudio((audio) => {
            const osc = audio.createOscillator();
            const gain = audio.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.06, audio.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + duration);
            osc.connect(gain);
            gain.connect(audio.destination);
            osc.start();
            osc.stop(audio.currentTime + duration);
          });
        }, delay || 0);
      }

      function bestKey() {
        return BEST_PREFIX + size;
      }

      function readBest() {
        return GameKit.readBest(bestKey());
      }

      function stopTimer() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
      }

      function startTimer() {
        if (timerId) return;
        timerId = setInterval(() => {
          if (!started || ended || document.hidden || dialogOpen) return;
          elapsed += 1;
          timeEl.textContent = elapsed + 's';
        }, 1000);
      }

      function updateHud() {
        movesEl.textContent = String(moves);
        timeEl.textContent = elapsed + 's';
        const best = readBest();
        bestEl.textContent = best > 0 ? best + t(' 步') : '--';
      }

      function solvedBoard() {
        const values = [];
        for (let i = 1; i < size * size; i += 1) values.push(i);
        values.push(0);
        return values;
      }

      function isSolved() {
        for (let i = 0; i < board.length - 1; i += 1) {
          if (board[i] !== i + 1) return false;
        }
        return board[board.length - 1] === 0;
      }

      function neighbors(index) {
        const row = Math.floor(index / size);
        const col = index % size;
        const result = [];
        if (row > 0) result.push(index - size);
        if (row < size - 1) result.push(index + size);
        if (col > 0) result.push(index - 1);
        if (col < size - 1) result.push(index + 1);
        return result;
      }

      function makeBoard() {
        board = solvedBoard();
        let blank = board.length - 1;
        let last = -1;
        const steps = size === 3 ? 180 : 360;
        for (let i = 0; i < steps; i += 1) {
          const options = neighbors(blank).filter((index) => index !== last);
          const pick = options[Math.floor(Math.random() * options.length)];
          [board[blank], board[pick]] = [board[pick], board[blank]];
          last = blank;
          blank = pick;
        }
        if (isSolved()) makeBoard();
      }

      function render() {
        boardEl.style.setProperty('--size', String(size));
        boardEl.dataset.size = String(size);
        boardEl.innerHTML = '';
        board.forEach((value, index) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'slide-tile' + (value === 0 ? ' blank' : '');
          btn.dataset.index = String(index);
          if (value === 0) {
            btn.disabled = true;
            btn.setAttribute('aria-hidden', 'true');
            btn.setAttribute('aria-label', t('空格'));
          } else {
            const row = Math.floor(index / size) + 1;
            const col = (index % size) + 1;
            btn.textContent = String(value);
            btn.setAttribute('aria-label', t('第 {row} 行第 {col} 列，数字 {n}', { row, col, n: value }));
            btn.addEventListener('click', () => moveTile(index));
          }
          boardEl.appendChild(btn);
        });
      }

      function startIfNeeded() {
        if (!started) {
          started = true;
          startTimer();
        }
      }

      function moveTile(index) {
        if (ended) return;
        const blank = board.indexOf(0);
        if (!neighbors(blank).includes(index)) return;
        [board[blank], board[index]] = [board[index], board[blank]];
        moves += 1;
        startIfNeeded();
        playTone(520, 0.04);
        render();
        updateHud();
        if (isSolved()) finish();
      }

      function finish() {
        ended = true;
        stopTimer();
        const previousBest = readBest();
        newRecord = previousBest === 0 || moves < previousBest;
        if (newRecord) GameKit.writeBest(bestKey(), moves);
        const best = readBest();
        overlayTitle.textContent = t('完成！');
        overlayDesc.textContent = (newRecord ? t('新纪录！') : '') +
          t('步数：{moves} · 用时：{elapsed}s · 最少 {best} 步', { moves, elapsed, best });
        overlay.classList.add('show');
        updateHud();
        playTone(660, 0.1);
        setTimeout(() => playTone(880, 0.14), 90);
      }

      function initGame(nextSize) {
        if (nextSize === 3 || nextSize === 4) {
          size = nextSize;
          mode = nextSize;
        }
        stopTimer();
        moves = 0;
        elapsed = 0;
        started = false;
        ended = false;
        newRecord = false;
        makeBoard();
        overlay.classList.remove('show');
        mode3Btn.classList.toggle('active', size === 3);
        mode4Btn.classList.toggle('active', size === 4);
        render();
        updateHud();
        try {
          localStorage.setItem(MODE_KEY, String(size));
        } catch {}
      }

      async function restartWithConfirm() {
        if (moves === 0 || ended) {
          initGame();
          return;
        }
        const ok = await window.SiteData.confirmDialog({
          title: t('重开本局'),
          message: t('当前进度将被清除，确定重开吗？'),
          confirmText: t('重开'),
          cancelText: t('继续本局'),
          danger: true,
        });
        if (ok) initGame();
      }

      mode3Btn.addEventListener('click', () => initGame(3));
      mode4Btn.addEventListener('click', () => initGame(4));
      restartBtn.addEventListener('click', restartWithConfirm);
      overlayBtn.addEventListener('click', () => initGame());

      document.addEventListener('keydown', (event) => {
        if (GameKit.shouldIgnoreGameKey(event, { ignoreOnControl: true })) return;
        if (window.SiteData && SiteData.isDialogOpen && SiteData.isDialogOpen()) return;
        if (ended) return;
        const blank = board.indexOf(0);
        const row = Math.floor(blank / size);
        const col = blank % size;
        let target = -1;
        if (event.key === 'ArrowUp' && row < size - 1) target = blank + size;
        else if (event.key === 'ArrowDown' && row > 0) target = blank - size;
        else if (event.key === 'ArrowLeft' && col < size - 1) target = blank + 1;
        else if (event.key === 'ArrowRight' && col > 0) target = blank - 1;
        if (target < 0) return;
        event.preventDefault();
        moveTile(target);
      });

      document.addEventListener('site:dialogopen', () => {
        dialogOpen = true;
      });
      document.addEventListener('site:dialogclose', () => {
        dialogOpen = false;
      });

      document.addEventListener('i18n:change', () => {
        render();
        updateHud();
        if (ended) {
          overlayTitle.textContent = t('完成！');
          const best = readBest();
          overlayDesc.textContent = (newRecord ? t('新纪录！') : '') +
            t('步数：{moves} · 用时：{elapsed}s · 最少 {best} 步', { moves, elapsed, best });
        }
      });

      initGame();
      GameKit.mountMoreGames('slide', document.getElementById('more-games'));
    })();
  </script>
</body>
