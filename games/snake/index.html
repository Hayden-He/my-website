<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>经典贪吃蛇 - 小游乐场</title>
  <meta name="description" content="经典贪吃蛇：支持键盘与连续划屏，含经典撞墙与自由穿墙双模式。" />
  <link rel="canonical" href="https://my-website-all.pages.dev/games/snake/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="小游乐场" />
  <meta property="og:locale" content="zh_CN" />
  <meta property="og:title" content="经典贪吃蛇 · Little Playground" />
  <meta property="og:description" content="经典贪吃蛇：支持键盘与连续划屏，含经典撞墙与自由穿墙双模式。" />
  <meta property="og:url" content="https://my-website-all.pages.dev/games/snake/" />
  <meta property="og:image" content="https://my-website-all.pages.dev/assets/og-image.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="小游乐场 · Little Playground：12 款即开即玩的小游戏" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="经典贪吃蛇 · Little Playground" />
  <meta name="twitter:description" content="经典贪吃蛇：支持键盘与连续划屏，含经典撞墙与自由穿墙双模式。" />
  <meta name="twitter:image" content="https://my-website-all.pages.dev/assets/og-image.jpg" />
  <meta name="twitter:image:alt" content="小游乐场 · Little Playground：12 款即开即玩的小游戏" />
  <meta name="author" content="Hayden-He" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="小游乐场" />
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/style.css" />
  <link rel="stylesheet" href="/assets/game-shell.css" />
  <link rel="stylesheet" href="./modules/snake.css" />
</head>
<body>
  <!-- inline-icons:start -->
  <!-- inline-icons:end -->
  <header class="game-topbar">
    <div class="container game-topbar-inner">
      <a class="back-link" href="/" data-i18n="← 返回大厅">← 返回大厅</a>
      <h1 class="game-topbar-title">
        <svg class="title-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><use href="#game-snake"></use></svg>
        <span data-i18n="经典贪吃蛇">经典贪吃蛇</span>
      </h1>
      <div class="game-topbar-actions">
        <a class="game-topbar-cat" href="/categories/arcade" data-i18n="动作街机">动作街机</a>
        <button class="lang-btn theme-btn" type="button" data-theme-toggle aria-label="主题：跟随系统" title="主题：跟随系统"><svg class="theme-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#theme-system"></use></svg></button>
        <button class="lang-btn" type="button" data-lang-toggle>EN</button>
      </div>
    </div>
  </header>

  <main class="game-wrap">
    <div class="mobile-game-controls">
      <div class="hud">
        <div class="hud-box">
          <div class="hud-label" data-i18n="当前得分">当前得分</div>
          <div id="score-el" class="hud-value">0</div>
        </div>
        <div class="hud-box">
          <div class="hud-label" data-i18n="模式最高">模式最高</div>
          <div id="best-el" class="hud-value" style="color: var(--accent-text);">0</div>
        </div>
        <button id="pause-btn" class="btn-small secondary" type="button">暂停</button>
        <button id="restart-btn" class="btn-small" type="button" data-i18n="重开">重开</button>
        <div class="slow-status" id="slow-status">
          <span id="slow-label" data-i18n="减速中">减速中</span>
          <progress id="slow-progress" aria-labelledby="slow-label" value="0"></progress>
        </div>
      </div>

      <div class="toolbar">
        <div class="mode-pills" role="group" aria-label="游戏模式" data-i18n-attr="aria-label:游戏模式">
          <button id="mode-classic" class="mode-pill active" type="button" data-i18n="经典撞墙">经典撞墙</button>
          <button id="mode-wrap" class="mode-pill" type="button" data-i18n="自由穿墙">自由穿墙</button>
        </div>
        <div class="btn-group">
          <button id="help-btn" class="btn-small secondary" type="button" title="查看玩法" data-i18n="玩法" data-i18n-attr="title:查看玩法">玩法</button>
          <button id="immersive-btn" class="btn-small secondary" type="button" data-i18n="沉浸模式" hidden>沉浸模式</button>
          <button id="sound-btn" class="btn-small secondary" type="button">音效: 开</button>
        </div>
      </div>
    </div>

    <div class="mobile-game-stage">
      <div class="play-area">
        <div id="stage-box" class="stage-box">
          <canvas id="board" width="560" height="560" role="img" aria-label="贪吃蛇游戏棋盘" data-i18n-attr="aria-label:贪吃蛇游戏棋盘"></canvas>
          <div id="overlay" class="overlay" role="status" aria-live="polite">
            <h2 id="overlay-title">游戏结束</h2>
            <p id="overlay-desc">得分：0</p>
            <button id="overlay-btn" class="overlay-btn" type="button" data-i18n="再来一局">再来一局</button>
          </div>
        </div>
        <div class="dpad" role="group" aria-label="方向控制" data-i18n-attr="aria-label:方向控制">
          <div class="dpad-empty"></div>
          <button class="dpad-btn" data-dir="up" type="button" aria-label="向上" data-i18n-attr="aria-label:向上">↑</button>
          <div class="dpad-empty"></div>
          <button class="dpad-btn" data-dir="left" type="button" aria-label="向左" data-i18n-attr="aria-label:向左">←</button>
          <button class="dpad-btn" data-dir="down" type="button" aria-label="向下" data-i18n-attr="aria-label:向下">↓</button>
          <button class="dpad-btn" data-dir="right" type="button" aria-label="向右" data-i18n-attr="aria-label:向右">→</button>
        </div>
      </div>
    </div>

    <p class="hint-text hint-with-icons">
      <span class="hint-ico" aria-hidden="true"><svg viewBox="0 0 32 32"><use href="#mem-apple"></use></svg></span><span data-i18n="+10 · ">+10 · </span>
      <span class="hint-ico" aria-hidden="true"><svg viewBox="0 0 32 32"><use href="#art-star"></use></svg></span><span data-i18n="金星+30（限时）· ">金星+30（限时）· </span>
      <span class="hint-ico" aria-hidden="true"><svg viewBox="0 0 32 32"><use href="#art-snowflake"></use></svg></span><span data-i18n="冰果减速 · 方向键/WASD/划屏 · 空格/P 暂停">冰果减速 · 方向键/WASD/划屏 · 空格/P 暂停</span>
    </p>

    <div id="more-games" class="more-games" data-more-games="snake"></div>
  </main>

  <script src="/assets/canvas-polyfill.js"></script>
  <script src="/assets/site-data.js"></script>
  <script src="/assets/i18n.js"></script>
  <script src="/assets/games.js"></script>
  <script src="/assets/game-kit.js"></script>
  <script src="/assets/game-art.js"></script>
  <script src="/assets/game-rules.js"></script>
  <script type="module" src="./modules/main.js"></script>
</body>
</html>
