<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>太空战机 - 小游乐场</title>
  <meta name="description" content="操控战机躲避弹幕、升级主炮火力、释放清屏脉冲并挑战每 5 波的星际 Boss。" />
  <link rel="canonical" href="https://my-website-all.pages.dev/games/space/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="小游乐场" />
  <meta property="og:locale" content="zh_CN" />
  <meta property="og:title" content="太空战机 · Little Playground" />
  <meta property="og:description" content="操控战机躲避弹幕、升级主炮火力、释放清屏脉冲并挑战每 5 波的星际 Boss。" />
  <meta property="og:url" content="https://my-website-all.pages.dev/games/space/" />
  <meta property="og:image" content="https://my-website-all.pages.dev/assets/og-image.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="小游乐场 · Little Playground：12 款即开即玩的小游戏" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="太空战机 · Little Playground" />
  <meta name="twitter:description" content="操控战机躲避弹幕、升级主炮火力、释放清屏脉冲并挑战每 5 波的星际 Boss。" />
  <meta name="twitter:image" content="https://my-website-all.pages.dev/assets/og-image.jpg" />
  <meta name="twitter:image:alt" content="小游乐场 · Little Playground：12 款即开即玩的小游戏" />
  <meta name="author" content="Hayden-He" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="小游乐场" />
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/style.css" />
  <link rel="stylesheet" href="/assets/game-shell.css" />
  <link rel="stylesheet" href="./modules/space.css" />
</head>
<body>
  <!-- inline-icons:start -->
  <!-- inline-icons:end -->
  <header class="game-topbar">
    <div class="container game-topbar-inner">
      <a class="back-link" href="/" data-i18n="← 返回大厅">← 返回大厅</a>
      <h1 class="game-topbar-title">
        <svg class="title-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><use href="#game-space"></use></svg>
        <span data-i18n="太空战机">太空战机</span>
      </h1>
      <div class="game-topbar-actions">
        <a class="game-topbar-cat" href="/categories/arcade" data-i18n="动作街机">动作街机</a>
        <button class="lang-btn theme-btn" type="button" data-theme-toggle aria-label="主题：跟随系统" title="主题：跟随系统"><svg class="theme-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#theme-system"></use></svg></button>
        <button class="lang-btn" type="button" data-lang-toggle>EN</button>
      </div>
    </div>
  </header>

  <main class="game-wrap">
    <div class="hud">
      <div class="hud-box">
        <div class="hud-label" data-i18n="当前得分">当前得分</div>
        <div id="score-el" class="hud-value">0</div>
      </div>
      <div class="hud-box">
        <div id="wave-label" class="hud-label" data-i18n="当前波次">当前波次</div>
        <div id="wave-el" class="hud-value">1</div>
      </div>
      <div class="hud-box best-hud">
        <div class="hud-label" data-i18n="模式最高">模式最高</div>
        <div id="best-el" class="hud-value accent">0</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="mode-pills" role="group" aria-label="游戏模式" data-i18n-attr="aria-label:游戏模式">
        <button id="mode-standard" class="mode-pill active" type="button" data-i18n="标准闯关">标准闯关</button>
        <button id="mode-ace" class="mode-pill" type="button" data-i18n="王牌极速">王牌极速</button>
      </div>
      <div class="btn-group">
        <button id="pause-btn" class="btn-small secondary" type="button">暂停</button>
        <button id="sound-btn" class="btn-small secondary" type="button">音效: 开</button>
        <button id="help-btn" class="btn-small secondary" type="button" data-i18n="玩法">玩法</button>
        <button id="restart-btn" class="btn-small" type="button" data-i18n="重开">重开</button>
        <button id="immersive-btn" class="btn-small secondary" type="button" data-i18n="沉浸模式" hidden>沉浸模式</button>
      </div>
    </div>

    <div class="status-strip">
      <div class="status-group">
        <div class="armor-status">
          <span id="armor-count" class="armor-count" aria-hidden="true"></span>
          <div id="armor-el" class="armor-hearts" role="meter" aria-label="剩余护甲" aria-valuemin="0" aria-valuemax="3" aria-valuenow="3"></div>
        </div>
        <span id="shield-badge" class="status-badge shield" hidden data-i18n="护盾激活">护盾激活</span>
      </div>
      <div class="status-group">
        <span id="weapon-badge" class="status-badge">主炮 Lv.1</span>
        <span id="blast-badge" class="status-badge blast" hidden></span>
        <span id="overdrive-badge" class="status-badge overdrive" hidden></span>
      </div>
    </div>

    <div class="mobile-game-stage">
      <div class="stage-box">
        <div class="battle-status">
          <div id="battle-wave" class="battle-wave"></div>
          <div id="boss-bar-wrap" class="boss-bar-wrap" hidden>
            <div class="boss-bar-label">
              <span id="boss-name"></span>
              <span id="boss-phase-label" class="boss-phase-label" aria-live="polite" hidden></span>
              <span id="boss-hp-text">100%</span>
            </div>
            <div id="boss-bar-track" class="boss-bar-track" role="meter" aria-labelledby="boss-name" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div id="boss-bar-fill" class="boss-bar-fill"></div></div>
          </div>
        </div>
        <div class="playfield">
          <canvas id="canvas" width="460" height="560" aria-label="太空战机画布" data-i18n-attr="aria-label:太空战机画布"></canvas>
          <div id="overlay" class="overlay show" role="status" aria-live="polite">
            <h2 id="overlay-title">太空战机</h2>
            <p id="overlay-desc"></p>
            <div id="overlay-summary" class="overlay-summary" hidden>
              <p id="overlay-stats"></p>
              <p id="overlay-boss-clears"></p>
              <p id="overlay-boss-target"></p>
            </div>
            <div id="practice-menu" class="practice-menu" role="group" aria-label="Boss 练习" data-i18n-attr="aria-label:Boss 练习" hidden>
              <button class="overlay-btn secondary" type="button" data-practice-tier="1" disabled></button>
              <button class="overlay-btn secondary" type="button" data-practice-tier="2" disabled></button>
              <button class="overlay-btn secondary" type="button" data-practice-tier="3" disabled></button>
            </div>
            <div class="overlay-actions">
              <button id="overlay-btn" class="overlay-btn" type="button">开始游戏</button>
              <button id="practice-menu-btn" class="overlay-btn secondary" type="button" data-i18n="Boss 练习" hidden>Boss 练习</button>
              <button id="practice-back-btn" class="overlay-btn secondary" type="button" hidden></button>
            </div>
            <details id="flight-options" aria-live="off">
              <summary data-i18n="战机设置与图鉴">战机设置与图鉴</summary>
              <div id="flight-options-content"></div>
            </details>
          </div>
        </div>
      </div>
    </div>

    <div class="action-bar">
      <button id="emp-btn" class="emp-btn" type="button">
        <span data-i18n="⚡ 脉冲清屏">⚡ 脉冲清屏</span>
        <span id="emp-count">×2</span>
      </button>
      <div class="skin-pills" role="group" aria-label="战机涂装" data-i18n-attr="aria-label:战机涂装">
        <button class="skin-pill active" type="button" data-skin="cobalt"><span class="skin-swatch" style="background:#38bdf8"></span><span data-i18n="苍穹蓝翼">苍穹蓝翼</span></button>
        <button class="skin-pill" type="button" data-skin="crimson"><span class="skin-swatch" style="background:#fb7185"></span><span data-i18n="烈焰红隼">烈焰红隼</span></button>
        <button class="skin-pill" type="button" data-skin="phantom"><span class="skin-swatch" style="background:#a855f7"></span><span data-i18n="暗夜幽灵">暗夜幽灵</span></button>
      </div>
    </div>

    <p class="hint" data-i18n="触屏拖动 / 鼠标移动 / 方向键操控 · 空格释放清屏脉冲 · P 暂停">触屏拖动 / 鼠标移动 / 方向键操控 · 空格释放清屏脉冲 · P 暂停</p>

    <section class="space-legend" aria-label="战机道具与敌机图鉴" data-i18n-attr="aria-label:战机道具与敌机图鉴">
      <div class="legend-title" data-i18n="道具与机制说明">道具与机制说明</div>
      <div class="legend-grid">
        <div class="legend-item">
          <span class="legend-badge" style="background:#d97706" aria-hidden="true">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M8 2 12.5 7H9.8v6.5H6.2V7H3.5L8 2z" fill="#fff"/></svg>
          </span>
          <span data-i18n="火力升级：Lv.5 中央重弹可贯穿敌机">火力升级：Lv.5 中央重弹可贯穿敌机</span>
        </div>
        <div class="legend-item">
          <span class="legend-badge" style="background:#0891b2" aria-hidden="true">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M8 1.5 13.5 3.8v4c0 3.3-2.3 5.8-5.5 6.7C4.8 13.6 2.5 11.1 2.5 7.8v-4L8 1.5z" fill="#fff"/></svg>
          </span>
          <span data-i18n="能量护盾：抵消一次伤害">能量护盾：抵消一次伤害</span>
        </div>
        <div class="legend-item"><span class="legend-badge" style="background:#7c3aed" aria-hidden="true">⚡</span><span data-i18n="超载暴走：5.5 秒免伤，主炮射速翻倍">超载暴走：5.5 秒免伤，主炮射速翻倍</span></div>
        <div class="legend-item"><span class="legend-badge" style="background:#16a34a" aria-hidden="true">✚</span><span data-i18n="护甲修复：恢复1点护甲">护甲修复：恢复1点护甲</span></div>
        <div class="legend-item"><span class="legend-badge" style="background:#2563eb" aria-hidden="true">◎</span><span data-i18n="脉冲补给：清弹冲击波+1">脉冲补给：清弹冲击波+1</span></div>
        <div class="legend-item"><span class="legend-badge" style="background:#c2410c" aria-hidden="true">✦</span><span data-i18n="爆破弹：对准敌机时自动发射，命中造成范围伤害">爆破弹：对准敌机时自动发射，命中造成范围伤害</span></div>
        <div class="legend-item"><span class="legend-badge" style="background:#dc2626" aria-hidden="true">!</span><span data-i18n="Boss预警：离开激光或突进范围">Boss预警：离开激光或突进范围</span></div>
        <div class="legend-item"><span class="legend-badge" style="background:#475569" aria-hidden="true">◆</span><span data-i18n="裁决者与棱镜：趁反击窗口打出全额伤害">裁决者与棱镜：趁反击窗口打出全额伤害</span></div>
        <div class="legend-item"><span class="legend-badge" style="background:#7c3aed" aria-hidden="true">◇</span><span data-i18n="镜面护甲：侧移躲反弹，或用脉冲打断">镜面护甲：侧移躲反弹，或用脉冲打断</span></div>
        <div class="legend-item"><span class="legend-badge" style="background:#6b21a8" aria-hidden="true">◈</span><span data-i18n="棱镜镜像：击破镜像可结束交错火力">棱镜镜像：击破镜像可结束交错火力</span></div>
      </div>
    </section>

    <div id="more-games" class="more-games" data-more-games="space"></div>
  </main>

  <script src="/assets/canvas-polyfill.js"></script>
  <script src="/assets/site-data.js"></script>
  <script src="/assets/i18n.js"></script>
  <script src="/assets/games.js"></script>
  <script src="/assets/game-kit.js"></script>
  <script type="module" src="./modules/main.js"></script>
</body>
</html>
