<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>街头投篮 - 小游乐场</title>
  <meta name="description" content="街头投篮：点击或按空格起跳，空心入网、打板进球，挑战你的最高分。" />
  <meta name="author" content="Hayden-He" />
  <meta name="theme-color" content="#1e1b4b" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8F%80%3C/text%3E%3C/svg%3E" />
  <script src="/assets/canvas-polyfill.js"></script>
  <link rel="stylesheet" href="/assets/style.css" />
  <link rel="stylesheet" href="/assets/game-shell.css" />
  <script src="/assets/site-data.js"></script>
  <script src="/assets/i18n.js"></script>
  <script src="/assets/games.js"></script>
  <script src="/assets/game-kit.js"></script>
  <style>


    .hint-block {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1 1 260px;
    }

    .hud-value.accent {
      color: var(--accent);
    }

    .hud-value.danger {
      color: #ef4444;
    }

    .timer-bar-wrap {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .timer-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #3b82f6);
      transition: width 0.08s linear, background 0.2s ease;
    }

    .timer-bar.low {
      background: linear-gradient(90deg, #ef4444, #f97316);
    }

    .stage-box {
      position: relative;
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      background: #1e1b4b;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 640 / 420;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
    }

    .controls-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    @media (max-width: 560px) {
      .game-wrap {
        margin: 10px auto 24px;
        padding: 0 10px;
        gap: 8px;
      }

      .hud {
        grid-template-columns: repeat(5, 1fr);
        gap: 5px;
      }

      .hud-box {
        padding: 6px 3px;
        border-radius: 9px;
      }

      .hud-label {
        font-size: 0.65rem;
      }

      .hud-value {
        font-size: 0.96rem;
      }

      .hint-text {
        font-size: 0.78rem;
      }

      /* 窄屏下把 4 个操作按钮排成 2×2，避免文字被挤成竖排 */
      .btn-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        width: 100%;
      }
    }

    /* 本页尺寸；其余外壳样式见 assets/game-shell.css */
    .game-wrap {
      --game-width: 700px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .hud { grid-template-columns: repeat(5, 1fr); }
    .btn-group { gap: 8px; }

    .scene-hint {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: -4px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .scene-hint strong {
      color: var(--text);
      font-weight: 700;
    }

    /* 5 列 HUD 在 320/360 宽下过于拥挤，改成 3 列两行 */
    @media (max-width: 380px) {
      .hud { grid-template-columns: repeat(3, 1fr); }
    }

  </style>
</head>
<body>
  <header class="game-topbar">
    <div class="container game-topbar-inner">
      <a class="back-link" href="/" data-i18n="← 返回大厅">← 返回大厅</a>
      <h1 class="game-topbar-title" data-i18n="街头投篮 🏀">街头投篮 🏀</h1>
      <div class="game-topbar-actions">
        <a class="game-topbar-cat" href="/categories/arcade.html" data-i18n="动作街机">动作街机</a>
        <button class="lang-btn" type="button" data-lang-toggle>EN</button>
      </div>
    </div>
  </header>

  <main class="game-wrap">
    <div class="hud">
      <div class="hud-box">
        <div class="hud-label" data-i18n="总得分">总得分</div>
        <div id="score-el" class="hud-value">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label" data-i18n="进球倒计时">进球倒计时</div>
        <div id="time-el" class="hud-value">10.0s</div>
      </div>
      <div class="hud-box">
        <div class="hud-label" data-i18n="空心入网">空心入网</div>
        <div id="swish-el" class="hud-value accent">0</div>
        <div class="hud-sub" data-i18n="+4 · 火焰+5">+4 · 火焰+5</div>
      </div>
      <div class="hud-box">
        <div class="hud-label" data-i18n="打板进球">打板进球</div>
        <div id="bank-el" class="hud-value">0</div>
        <div class="hud-sub">+3</div>
      </div>
      <div class="hud-box">
        <div class="hud-label" data-i18n="最高分">最高分</div>
        <div id="best-el" class="hud-value">0</div>
      </div>
    </div>

    <div class="timer-bar-wrap">
      <div id="timer-bar" class="timer-bar"></div>
    </div>

    <div class="scene-hint">
      <span><span data-i18n="当前场景">当前场景</span> <strong id="scene-name">黄昏街头</strong></span>
      <span id="scene-next">下一场景 15 分</span>
    </div>

    <div class="stage-box">
      <canvas id="court" width="640" height="420"></canvas>
      <div id="game-overlay" class="overlay">
        <h2 data-i18n="时间到！🏀">时间到！🏀</h2>
        <p id="final-summary">本局得分：0</p>
        <p id="final-stats"></p>
        <button id="overlay-restart" class="btn-small" data-i18n="再来一局">再来一局</button>
        <p style="font-size:0.8rem" data-i18n="按空格或回车也可重开">按空格或回车也可重开</p>
      </div>
    </div>

    <div class="controls-row">
      <div class="hint-block">
        <span class="hint-text"><span data-i18n="操作：连续点击球场 / 连按空格升空，停手后下落；">操作：连续点击球场 / 连按空格升空，停手后下落；</span><span class="nowrap" data-i18n="P 暂停">P 暂停</span></span>
        <span class="hint-text" data-i18n="机制：进球重置倒计时 · 连续空心触发火焰连击 · 每 5 球金球 ×2 · 25/50/80 分护盾进阶">机制：进球重置倒计时 · 连续空心触发火焰连击 · 每 5 球金球 ×2 · 25/50/80 分护盾进阶</span>
      </div>
      <div class="btn-group">
        <button id="skin-btn" class="btn-small secondary">用球: 经典篮球</button>
        <button id="sound-btn" class="btn-small secondary">音效: 开</button>
        <button id="pause-btn" class="btn-small secondary">暂停</button>
        <button id="restart-btn" class="btn-small" data-i18n="重开">重开</button>
      </div>
    </div>

    <div id="more-games" class="more-games"></div>
  </main>

  <script>
    (function () {
      const t = (key, params) => (window.I18N ? I18N.t(key, params) : key);
      const STORAGE_KEY = 'game_best_basketball';
      const SKIN_STORAGE_KEY = 'game_skin_basketball';
      const canvas = document.getElementById('court');
      const ctx = canvas.getContext('2d');

      const scoreEl = document.getElementById('score-el');
      const timeEl = document.getElementById('time-el');
      const swishEl = document.getElementById('swish-el');
      const bankEl = document.getElementById('bank-el');
      const bestEl = document.getElementById('best-el');
      const timerBar = document.getElementById('timer-bar');
      const skinBtn = document.getElementById('skin-btn');
      const pauseBtn = document.getElementById('pause-btn');
      const soundBtn = document.getElementById('sound-btn');
      const overlay = document.getElementById('game-overlay');
      const finalSummary = document.getElementById('final-summary');
      const finalStats = document.getElementById('final-stats');
      const sceneNameEl = document.getElementById('scene-name');
      const sceneNextEl = document.getElementById('scene-next');

      const W = 640;
      const H = 420;
      // 适配高清屏：内部分辨率按设备像素比放大，逻辑坐标仍为 640x420
      const DPR = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = W * DPR;
      canvas.height = H * DPR;
      const FLOOR_Y = 354;
      const GRAVITY = 1080;
      const JUMP_VY = -425;
      const BASE_VX = -170;
      const BALL_R = 19;

      const BOARD_X = 76;
      const RIM_LEFT_X = 90;
      const RIM_RIGHT_X = 152;
      const RIM_CENTER_X = (RIM_LEFT_X + RIM_RIGHT_X) / 2;

      const BALL_SKINS = [
        { id: 'classic', name: '经典篮球', c0: '#fdba74', c1: '#f97316', c2: '#9a3412', seam: '#431407' },
        { id: 'planet', name: '蔚蓝星球', c0: '#7dd3fc', c1: '#0284c7', c2: '#1e3a8a', seam: '#4ade80' },
        { id: 'ice', name: '寒冰晶球', c0: '#f0f9ff', c1: '#38bdf8', c2: '#0369a1', seam: '#e0f2fe' },
        { id: 'water', name: '深海气泡', c0: '#67e8f9', c1: '#0891b2', c2: '#164e63', seam: '#cffafe' },
        { id: 'darkgold', name: '黑金夜影', c0: '#64748b', c1: '#1e293b', c2: '#020617', seam: '#facc15' },
      ];
      let skinIndex = 0;
      try {
        const savedSkin = parseInt(localStorage.getItem(SKIN_STORAGE_KEY) || '0', 10);
        if (savedSkin >= 0 && savedSkin < BALL_SKINS.length) skinIndex = savedSkin;
      } catch {}
      function renderSkinButton() {
        skinBtn.textContent = t('用球: {name}', { name: t(BALL_SKINS[skinIndex].name) });
      }
      renderSkinButton();

      // 城市天际线预设建筑
      const SKYLINE = [
        { x: 0, w: 58, h: 120 },
        { x: 54, w: 46, h: 165 },
        { x: 96, w: 62, h: 95 },
        { x: 155, w: 50, h: 145 },
        { x: 202, w: 72, h: 110 },
        { x: 270, w: 55, h: 178 },
        { x: 322, w: 68, h: 125 },
        { x: 386, w: 48, h: 155 },
        { x: 430, w: 74, h: 102 },
        { x: 500, w: 58, h: 160 },
        { x: 554, w: 86, h: 130 },
      ];

      let soundTimers = [];
      let soundEnabled = window.SiteData ? SiteData.getSound() : true;
      GameKit.bindSoundButton(soundBtn, soundEnabled, (on) => {
        soundEnabled = on;
        if (!on) clearSoundTimers();
      });

      function clearSoundTimers() {
        soundTimers.forEach((id) => clearTimeout(id));
        soundTimers = [];
      }

      function scheduleSound(fn, delay) {
        const id = setTimeout(() => {
          soundTimers = soundTimers.filter((t) => t !== id);
          fn();
        }, delay);
        soundTimers.push(id);
      }

      // 通过全站共用的音频上下文发声（见 assets/site-data.js），避免 iOS 等浏览器的自动播放限制
      function withAudio(fn) {
        if (!soundEnabled || !window.SiteData) return;
        SiteData.withAudio(fn);
      }

      function playTone(freq, duration, type, volume, slideTo) {
        withAudio((ac) => {
        try {
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = type || 'sine';
          osc.frequency.setValueAtTime(freq, ac.currentTime);
          if (slideTo) {
            osc.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime + duration);
          }
          gain.gain.setValueAtTime(volume || 0.12, ac.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
          osc.connect(gain);
          gain.connect(ac.destination);
          osc.start();
          osc.stop(ac.currentTime + duration);
        } catch {}
        });
      }

      function playNoise(duration, filterFreq, volume) {
        withAudio((ac) => {
        try {
          const bufSize = Math.floor(ac.sampleRate * duration);
          const buf = ac.createBuffer(1, bufSize, ac.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < bufSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const src = ac.createBufferSource();
          src.buffer = buf;
          const filter = ac.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(filterFreq, ac.currentTime);
          filter.Q.setValueAtTime(1.2, ac.currentTime);
          const gain = ac.createGain();
          gain.gain.setValueAtTime(volume, ac.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
          src.connect(filter);
          filter.connect(gain);
          gain.connect(ac.destination);
          src.start();
          src.stop(ac.currentTime + duration);
        } catch {}
        });
      }

      function playSound(kind, combo) {
        if (!soundEnabled) return;
        if (kind === 'jump') playTone(260, 0.08, 'sine', 0.09, 420);
        if (kind === 'bounce') playTone(110, 0.07, 'sine', 0.1, 62);
        if (kind === 'board') playTone(145, 0.09, 'triangle', 0.16, 85);
        if (kind === 'rim') playTone(380, 0.07, 'square', 0.055, 220);
        if (kind === 'net') playNoise(0.09, 1400, 0.08);
        if (kind === 'shield') playTone(300, 0.1, 'sawtooth', 0.06, 160);
        if (kind === 'swish') {
          playNoise(0.16, 2200, 0.14);
          const step = Math.min(combo || 1, 6) - 1;
          const baseFreq = 523 * Math.pow(1.06, step * 2);
          playTone(baseFreq, 0.12, 'sine', 0.13, baseFreq * 1.5);
          scheduleSound(() => playTone(baseFreq * 1.5, 0.16, 'sine', 0.11, baseFreq * 2), 65);
        }
        if (kind === 'gold') {
          playTone(659, 0.12, 'triangle', 0.12, 880);
          scheduleSound(() => playTone(880, 0.18, 'sine', 0.12, 1318), 60);
        }
        if (kind === 'score') playTone(440, 0.14, 'triangle', 0.13, 660);
        if (kind === 'tick') playTone(880, 0.04, 'sine', 0.05);
        if (kind === 'buzzer') {
          playTone(190, 0.28, 'sawtooth', 0.09, 140);
          scheduleSound(() => playTone(150, 0.3, 'sawtooth', 0.08, 120), 120);
        }
      }

      let bestScore = GameKit.readBest(STORAGE_KEY);

      function setText(el, v) {
        v = String(v);
        if (el._v !== v) { el._v = v; el.textContent = v; }
      }
      function setClass(el, v) {
        if (el._c !== v) { el._c = v; el.className = v; }
      }

      let state = {};
      let lastTime = 0;
      let lastTickSec = -1;

      function getShotTimeLimit(score) {
        return Math.max(7.0, 10.0 - Math.floor(score / 6) * 0.6);
      }

      function spawnBall() {
        // 金球：每累计 5 个进球后出现一次（若未投进，则不补发）
        const isGold = state.goldPending;
        state.goldPending = false;
        state.ball = {
          x: 565,
          y: FLOOR_Y - BALL_R,
          prevY: FLOOR_Y - BALL_R,
          vx: BASE_VX,
          vy: 0,
          rot: 0,
          hitBoard: false,
          hitRim: false,
          scored: false,
          isGold,
          resetCooldown: 0,
          bottomEntry: false,
          jumpLock: 0,
          squash: 0,
        };
      }

      function initGame() {
        clearSoundTimers();
        const limit = getShotTimeLimit(0);
        lastTickSec = -1;
        state = {
          score: 0,
          swishCount: 0,
          bankCount: 0,
          normalCount: 0,
          combo: 0,
          goalCount: 0,
          goldPending: false,
          paused: false,
          endedAt: 0,
          prevRimY: 186,
          started: false,
          ended: false,
          timeLimit: limit,
          timeLeft: limit,
          rimY: 186,
          baseRimY: 186,
          targetRimY: 186,
          rimFloatOffset: 0,
          rimFloatTarget: 18,
          rimFloatSpeed: 34,
          rimFloatPause: 0,
          rimSpring: 0,
          skyTime: 0,
          netSwing: 0,
          netExpand: 0,
          boardFlash: 0,
          blockerX: 250,
          blockerY: 180,
          blockerDir: 1,
          blockerSpeedScale: 1,
          blockerPhase: 0,
          blockerPause: 0,
          blockerFlash: 0,
          blockerFlash2: 0,
          shake: 0,
          rings: [],
          particles: [],
          trail: [],
          popups: [],
          ball: null,
        };
        spawnBall();
        overlay.classList.remove('show');
        pauseBtn.textContent = t('暂停');
        updateHud();
      }

      function getBlockers() {
        if (state.score < 25) return [];
        if (state.score >= 80) {
          return [
            { x: 225, y: state.blockerY, h: 38, flash: state.blockerFlash },
            { x: 305, y: 334 - state.blockerY, h: 38, flash: state.blockerFlash2 },
          ];
        }
        return [
          { x: state.score >= 50 ? state.blockerX : 250, y: state.blockerY, h: 56, flash: state.blockerFlash },
        ];
      }

      function saveBest() {
        if (state.score > bestScore) {
          bestScore = state.score;
          GameKit.saveBestIfHigher(STORAGE_KEY, bestScore);
        }
      }

      function getSceneInfo(score) {
        if (score >= 100) return { name: t('星河球场'), next: t('已解锁全部场景') };
        if (score >= 60) return { name: t('极光球场'), next: t('下一场景 100 分') };
        if (score >= 30) return { name: t('夜场灯光'), next: t('下一场景 60 分') };
        if (score >= 15) return { name: t('暮色球场'), next: t('下一场景 30 分') };
        return { name: t('黄昏街头'), next: t('下一场景 15 分') };
      }

      function renderFinal() {
        finalSummary.textContent = t('本局总分：{score} 分（最高纪录：{best} 分）', {
          score: state.score,
          best: bestScore,
        });
        finalStats.textContent = t('空心入网 {swish} 次 · 打板进球 {bank} 次 · 普通命中 {normal} 次', {
          swish: state.swishCount,
          bank: state.bankCount,
          normal: state.normalCount,
        });
      }

      function updateHud() {
        setText(scoreEl, state.score);
        setText(timeEl, state.timeLeft.toFixed(1) + 's');
        setClass(timeEl, 'hud-value' + (state.timeLeft <= 2.5 ? ' danger' : ''));
        setText(swishEl, state.swishCount);
        setText(bankEl, state.bankCount);
        setText(bestEl, bestScore);

        const scene = getSceneInfo(state.score);
        setText(sceneNameEl, scene.name);
        setText(sceneNextEl, scene.next);

        const pct = Math.max(0, Math.min(100, (state.timeLeft / state.timeLimit) * 100));
        const pctStr = pct.toFixed(1) + '%';
        if (timerBar._w !== pctStr) { timerBar._w = pctStr; timerBar.style.width = pctStr; }
        setClass(timerBar, 'timer-bar' + (state.timeLeft <= 2.5 ? ' low' : ''));
      }

      function addPopup(text, x, y, color) {
        state.popups.push({ text, x, y, color, life: 1.0 });
      }

      function spawnBurst(x, y, color, count) {
        for (let i = 0; i < count; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 60 + Math.random() * 140;
          state.particles.push({
            x,
            y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 40,
            r: 2.5 + Math.random() * 2.5,
            color,
            life: 1.0,
          });
        }
      }

      function addRing(x, y, color, maxR) {
        state.rings.push({ x, y, r: 8, maxR: maxR || 42, color, life: 1.0 });
      }

      function jumpBall() {
        if (state.ended || state.paused) return;
        if (!state.started) state.started = true;
        const b = state.ball;
        if (b.scored || b.jumpLock > 0) return;
        // 高空升力平滑衰减，防止贴顶滑行逃课，同时保持手感连贯
        const minY = BALL_R + 6;
        const ceilingZone = 75;
        const liftFactor = b.y < ceilingZone
          ? Math.max(0.18, (b.y - minY) / (ceilingZone - minY))
          : 1;
        b.vy = JUMP_VY * liftFactor;
        b.squash = -0.1;
        if (b.vx > -120) b.vx = BASE_VX;
        // 普通球起跳时产生轻巧的主题气流微粒，增强起跳反馈但不抢火焰球与金球风头
        if (state.combo < 2 && !b.isGold) {
          const skinId = BALL_SKINS[skinIndex].id;
          const puffColor = skinId === 'planet'
            ? '#bae6fd'
            : skinId === 'ice'
              ? '#e0f2fe'
              : skinId === 'water'
                ? '#a5f3fc'
                : skinId === 'darkgold'
                  ? '#fde68a'
                  : '#f8fafc';
          for (let i = 0; i < 5; i++) {
            state.particles.push({
              x: b.x + (Math.random() - 0.5) * 18,
              y: b.y + BALL_R - 2,
              vx: (Math.random() - 0.5) * 75,
              vy: 28 + Math.random() * 52,
              r: 2.0 + Math.random() * 1.2,
              color: puffColor,
              life: 0.65,
            });
          }
        }
        playSound('jump');
      }

      const gameWrap = document.querySelector('.game-wrap');
      gameWrap.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button, a, .overlay, .hud, .hint-text, .controls-row, .data-clear-wrap')) return;
        e.preventDefault();
        if (state.paused) { setPaused(false); return; }
        jumpBall();
      });

      function setPaused(flag) {
        if (!state.started || state.ended) return;
        if (state.paused === flag) return;
        state.paused = flag;
        pauseBtn.textContent = flag ? t('继续') : t('暂停');
        lastTime = 0;
      }

      document.addEventListener('keydown', (e) => {
        if (e.repeat) return;
        if (GameKit.shouldIgnoreGameKey(e, { ignoreOnControl: true })) return;
        if (window.SiteData && SiteData.isDialogOpen && SiteData.isDialogOpen()) return;
        if (window.GameKit && GameKit.isTutorialOpen && GameKit.isTutorialOpen()) return;
        if (e.code === 'KeyP') {
          setPaused(!state.paused);
          return;
        }
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') {
          if (e.code === 'Enter' && !state.ended) return;
          e.preventDefault();
          if (state.ended) {
            // 结算后短暂锁定，避免连续按键误触直接重开
            if ((e.code === 'Space' || e.code === 'Enter') && performance.now() - state.endedAt > 600) initGame();
            return;
          }
          if (e.code === 'Enter') return;
          if (state.paused) { setPaused(false); return; }
          jumpBall();
        }
      });

      GameKit.onHidden(() => setPaused(true));
      document.addEventListener('site:dialogopen', () => {
        if (state.started && !state.ended) setPaused(true);
      });

      document.addEventListener('i18n:change', () => {
        renderSkinButton();
        pauseBtn.textContent = state.paused ? t('继续') : t('暂停');
        if (state.ended) renderFinal();
        updateHud();
      });
      pauseBtn.addEventListener('click', () => setPaused(!state.paused));

      function collidePoint(b, px, py, radius) {
        const dx = b.x - px;
        const dy = b.y - py;
        const dist = Math.hypot(dx, dy);
        const minDist = BALL_R + radius;
        if (dist < minDist && dist > 0.001) {
          const nx = dx / dist;
          const ny = dy / dist;
          b.x = px + nx * minDist;
          b.y = py + ny * minDist;
          const dot = b.vx * nx + b.vy * ny;
          if (dot < 0) {
            const restitution = 0.68;
            b.vx -= (1 + restitution) * dot * nx;
            b.vy -= (1 + restitution) * dot * ny;
            if (b.vx > 65) b.vx = 65;
          }
          return true;
        }
        return false;
      }

      function update(dt) {
        if (state.paused) return;
        // 进球后的冷却期内暂停倒计时，下一球出现后再继续
        if (state.started && !state.ended && !state.ball.scored) {
          state.timeLeft -= dt;
          if (state.timeLeft <= 3.0 && state.timeLeft > 0) {
            const sec = Math.ceil(state.timeLeft);
            if (sec !== lastTickSec) {
              lastTickSec = sec;
              playSound('tick');
            }
          }
          if (state.timeLeft <= 0) {
            state.timeLeft = 0;
            state.ended = true;
            state.endedAt = performance.now();
            playSound('buzzer');
            saveBest();
            updateHud();
            renderFinal();
            overlay.classList.add('show');
            return;
          }
        }

        state.skyTime += dt;

        // 平滑过渡篮筐高度变化（15 分后改为随机方向与速率的平滑漂移）
        state.prevRimY = state.rimY;
        state.baseRimY += (state.targetRimY - state.baseRimY) * Math.min(1, dt * 6);
        if (state.score >= 15 && state.started && !state.ended) {
          if (state.rimFloatPause > 0) {
            state.rimFloatPause = Math.max(0, state.rimFloatPause - dt);
          } else {
            const diff = state.rimFloatTarget - state.rimFloatOffset;
            const stepSpd = state.rimFloatSpeed * Math.min(1, Math.max(0.35, Math.abs(diff) / 14));
            if (Math.abs(diff) <= stepSpd * dt) {
              state.rimFloatOffset = state.rimFloatTarget;
              state.rimFloatPause = 0.15 + Math.random() * 0.25;
              let nextTarget = (Math.random() * 2 - 1) * 28;
              if (Math.abs(nextTarget - state.rimFloatOffset) < 12) {
                nextTarget = state.rimFloatOffset >= 0 ? -18 - Math.random() * 10 : 18 + Math.random() * 10;
              }
              state.rimFloatTarget = nextTarget;
              state.rimFloatSpeed = 24 + Math.random() * 34;
            } else {
              state.rimFloatOffset += Math.sign(diff) * stepSpd * dt;
            }
          }
        } else {
          state.rimFloatOffset = 0;
        }
        state.rimY = Math.max(128, Math.min(236, state.baseRimY + state.rimFloatOffset));

        // 护盾随分数三阶段演进：25+ 垂直守卫 -> 50+ 斜向巡逻提速 -> 80+ 双子联动护盾
        // 行程扩大至 [64, 270] 封死贴顶走廊，并采用两端缓动 + 趟次微随机速率
        if (state.score >= 25 && state.started && !state.ended) {
          const baseSpd = state.score >= 80 ? 105 : state.score >= 50 ? 95 : 78;
          if (state.blockerPause > 0) {
            state.blockerPause = Math.max(0, state.blockerPause - dt);
          } else {
            const norm = Math.max(0, Math.min(1, (state.blockerY - 64) / (270 - 64)));
            const easeFactor = 0.45 + 0.9 * Math.sin(norm * Math.PI);
            state.blockerY += state.blockerDir * baseSpd * state.blockerSpeedScale * easeFactor * dt;
            if (state.blockerY >= 270) {
              state.blockerY = 270;
              state.blockerDir = -1;
              state.blockerSpeedScale = 0.85 + Math.random() * 0.33;
              state.blockerPause = 0.08;
            } else if (state.blockerY <= 64) {
              state.blockerY = 64;
              state.blockerDir = 1;
              state.blockerSpeedScale = 0.85 + Math.random() * 0.33;
              state.blockerPause = 0.08;
            }
          }
          if (state.score >= 50 && state.score < 80) {
            state.blockerPhase += dt * 1.35;
            state.blockerX = 270 + Math.sin(state.blockerPhase) * 45;
          } else {
            state.blockerX = 250;
          }
        }

        if (state.netSwing > 0) state.netSwing = Math.max(0, state.netSwing - dt * 2.2);
        if (state.netExpand > 0) state.netExpand = Math.max(0, state.netExpand - dt * 3.0);
        if (state.rimSpring > 0) state.rimSpring = Math.max(0, state.rimSpring - dt * 5.0);
        if (state.boardFlash > 0) state.boardFlash = Math.max(0, state.boardFlash - dt * 3.5);
        if (state.blockerFlash > 0) state.blockerFlash = Math.max(0, state.blockerFlash - dt * 4.5);
        if (state.blockerFlash2 > 0) state.blockerFlash2 = Math.max(0, state.blockerFlash2 - dt * 4.5);
        if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 28);

        state.rings = state.rings.filter((rg) => {
          rg.r += (rg.maxR - rg.r) * Math.min(1, dt * 9);
          rg.life -= dt * 2.2;
          return rg.life > 0;
        });

        state.popups = state.popups.filter((p) => {
          p.y -= 36 * dt;
          p.life -= dt * 1.1;
          return p.life > 0;
        });

        state.particles = state.particles.filter((p) => {
          p.vy += 320 * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt * 1.6;
          return p.life > 0;
        });

        const b = state.ball;
        const onFire = state.combo >= 2;

        if (state.started && !state.ended) {
          if (onFire || b.isGold) {
            state.trail.push({
              x: b.x,
              y: b.y,
              r: BALL_R * 0.75,
              color: b.isGold ? '#fde047' : '#fb923c',
              life: 0.35,
              maxLife: 0.35,
              alpha: 1.4,
            });
          } else if (Math.hypot(b.vx, b.vy) > 120) {
            state.trail.push({
              x: b.x,
              y: b.y,
              r: BALL_R * 0.36,
              color: '#e2e8f0',
              life: 0.14,
              maxLife: 0.14,
              alpha: 1.1,
            });
          }
          state.trail = state.trail.filter((t) => {
            t.life -= dt;
            return t.life > 0;
          });

          if (b.jumpLock > 0) b.jumpLock = Math.max(0, b.jumpLock - dt);
          b.prevY = b.y;
          b.vy += GRAVITY * dt;
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.rot += (b.vx / BALL_R) * dt;
          b.squash += (0 - b.squash) * Math.min(1, dt * 14);

          if (b.y < BALL_R + 6) {
            b.y = BALL_R + 6;
            b.vy = Math.max(Math.abs(b.vy) * 0.75, 240);
            b.jumpLock = 0.2;
            b.squash = 0.1;
          }

          if (b.y >= FLOOR_Y - BALL_R) {
            b.y = FLOOR_Y - BALL_R;
            b.bottomEntry = false;
            if (Math.abs(b.vy) > 95) {
              b.squash = 0.14;
              b.vy = -b.vy * 0.48;
              playSound('bounce');
              spawnBurst(b.x, FLOOR_Y - 2, 'rgba(254, 243, 199, 0.7)', 3);
            } else {
              b.vy = 0;
            }
            if (!b.scored) b.vx = BASE_VX;
          }

          if (b.x > RIM_RIGHT_X + BALL_R + 12 || b.y < state.rimY - BALL_R) {
            // 球离开篮网下方区域，或已回到篮筐上方：清除“底部进入”标记，保证之后自上而下的进球正常计分
            b.bottomEntry = false;
          }

          const boardTop = state.rimY - 82;
          const boardBottom = state.rimY + 26;
          if (
            b.x - BALL_R < BOARD_X + 6 &&
            b.x + BALL_R > BOARD_X - 6 &&
            b.y + BALL_R > boardTop &&
            b.y - BALL_R < boardBottom
          ) {
            if (b.x > BOARD_X && b.vx < 0) {
              b.x = BOARD_X + 6 + BALL_R;
              b.vx = Math.abs(b.vx) * 0.56;
              b.vy *= 0.85;
              b.hitBoard = true;
              b.squash = 0.1;
              state.boardFlash = 1.0;
              addRing(BOARD_X + 6, b.y, 'rgba(224, 242, 254, 0.85)', 28);
              playSound('board');
            } else if (b.x <= BOARD_X && b.vx > 0) {
              b.x = BOARD_X - 6 - BALL_R;
              b.vx = -Math.abs(b.vx) * 0.56;
              b.vy *= 0.85;
              b.squash = 0.1;
              state.boardFlash = 1.0;
              playSound('board');
            }
          }

          // 防守护盾碰撞（25/50/80 分三阶段演进）
          if (state.score >= 25 && !b.scored) {
            const blockers = getBlockers();
            for (let bi = 0; bi < blockers.length; bi++) {
              const blk = blockers[bi];
              const halfH = blk.h / 2;
              const bTop = blk.y - halfH;
              const bBot = blk.y + halfH;
              if (b.x + BALL_R > blk.x - 6 && b.x - BALL_R < blk.x + 6 && b.y + BALL_R > bTop && b.y - BALL_R < bBot) {
                const fromRight = b.x >= blk.x;
                if ((fromRight && b.vx < 0) || (!fromRight && b.vx > 0)) {
                  const relHit = (b.y - blk.y) / halfH;
                  b.x = fromRight ? blk.x + 6 + BALL_R : blk.x - 6 - BALL_R;
                  b.vx = (fromRight ? 1 : -1) * Math.abs(b.vx) * 0.54;
                  b.vy = relHit < 0 ? -210 + relHit * 60 : -110 + relHit * 70;
                  b.squash = 0.12;
                  if (bi === 0) state.blockerFlash = 1.0;
                  else state.blockerFlash2 = 1.0;
                  state.shake = Math.max(state.shake, 3);
                  addRing(blk.x + (fromRight ? 4 : -4), b.y, 'rgba(248, 113, 113, 0.9)', 26);
                  spawnBurst(blk.x + (fromRight ? 4 : -4), b.y, '#fca5a5', 6);
                  playSound('shield');
                  break;
                }
              }
            }
          }

          if (!b.scored) {
            if (collidePoint(b, RIM_LEFT_X, state.rimY, 4.5)) {
              b.hitRim = true;
              state.rimSpring = 1.0;
              playSound('rim');
            }
            if (collidePoint(b, RIM_RIGHT_X, state.rimY, 4.5)) {
              b.hitRim = true;
              state.rimSpring = 1.0;
              playSound('rim');
            }
          }

          // 软篮网底部阻挡：防止从篮筐底部穿入再掉下造成乌龙球
          if (!b.scored && b.vy < 0 && b.prevY - state.prevRimY >= 8 && b.y - state.rimY < 8) {
            if (b.x > RIM_LEFT_X - 4 && b.x < RIM_RIGHT_X + 4) {
              b.y = state.rimY + 8;
              b.vy = Math.max(Math.abs(b.vy) * 0.35, 70);
              b.vx += b.x < RIM_CENTER_X ? -45 : 45;
              b.bottomEntry = true;
              state.netSwing = Math.max(state.netSwing, 0.55);
              playSound('net');
            }
          }

          // 使用“相对篮筐”的位置判断穿越，避免篮筐移动时同一帧漏判
          if (!b.scored && !b.bottomEntry && b.vy > 0 && b.prevY - state.prevRimY <= 0 && b.y - state.rimY >= 0) {
            if (b.x > RIM_LEFT_X + 1 && b.x < RIM_RIGHT_X - 1) {
              b.scored = true;
              b.vx *= 0.2;
              b.vy = Math.max(b.vy * 0.5, 140);
              state.netSwing = 1.0;
              state.netExpand = 1.0;
              state.rimSpring = 0.7;

              let base = 2;
              let label = t('命中');
              let color = '#4ade80';

              if (!b.hitBoard && !b.hitRim) {
                base = 4;
                state.swishCount += 1;
                state.combo += 1;
                if (state.combo >= 2) base += 1;
                label = state.combo >= 2
                  ? t('🔥 火焰空心×{combo}', { combo: state.combo })
                  : t('空心入网');
                color = '#fbbf24';
                state.shake = Math.max(state.shake, 5.5);
                addRing(RIM_CENTER_X, state.rimY + 8, '#fbbf24', 52);
                playSound('swish', state.combo);
                spawnBurst(RIM_CENTER_X, state.rimY + 12, '#fbbf24', 16);
              } else if (b.hitBoard) {
                base = 3;
                state.bankCount += 1;
                state.combo = 0;
                label = t('打板进球');
                color = '#38bdf8';
                addRing(RIM_CENTER_X, state.rimY + 8, '#38bdf8', 38);
                playSound('score');
                spawnBurst(RIM_CENTER_X, state.rimY + 12, '#38bdf8', 11);
              } else {
                state.normalCount += 1;
                state.combo = 0;
                playSound('score');
                spawnBurst(RIM_CENTER_X, state.rimY + 12, '#4ade80', 8);
              }

              if (b.isGold) {
                state.shake = Math.max(state.shake, 6);
                addRing(RIM_CENTER_X, state.rimY + 8, '#fef08a', 60);
                playSound('gold');
              }

              const gained = b.isGold ? base * 2 : base;
              state.score += gained;
              state.goalCount += 1;
              if (state.goalCount % 5 === 0) state.goldPending = true;
              saveBest();

              state.timeLimit = getShotTimeLimit(state.score);
              state.timeLeft = state.timeLimit;
              lastTickSec = -1;

              // 4 分后每次进球随机小幅改变篮筐高度
              if (state.score >= 4) {
                state.targetRimY = 140 + Math.random() * 88;
              }

              addPopup((b.isGold ? t('⭐金球×2 ') : '') + label + ' +' + gained, RIM_CENTER_X + 24, state.rimY - 26, color);
              b.resetCooldown = 0.52;
            }
          }

          if (b.scored) {
            b.resetCooldown -= dt;
            if (b.resetCooldown <= 0) spawnBall();
          } else if (b.x < -BALL_R - 10 || b.x > W + BALL_R + 20) {
            state.combo = 0;
            spawnBall();
          }
        }

        updateHud();
      }

      function drawNightGlow(x, y, radiusX, radiusY, color, opacity) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(1, radiusY / radiusX);
        const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, radiusX);
        glow.addColorStop(0, `rgba(${color}, ${opacity})`);
        glow.addColorStop(0.5, `rgba(${color}, ${opacity * 0.38})`);
        glow.addColorStop(1, `rgba(${color}, 0)`);
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, radiusX, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawFloodlight(x, groundX, color) {
        const lampY = 61;
        const beam = ctx.createLinearGradient(x, lampY, groundX, FLOOR_Y);
        beam.addColorStop(0, `rgba(${color}, 0.27)`);
        beam.addColorStop(0.44, `rgba(${color}, 0.10)`);
        beam.addColorStop(1, `rgba(${color}, 0.02)`);
        ctx.fillStyle = beam;
        ctx.beginPath();
        ctx.moveTo(x - 13, lampY);
        ctx.lineTo(x + 13, lampY);
        ctx.lineTo(groundX + 124, FLOOR_Y);
        ctx.lineTo(groundX - 124, FLOOR_Y);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#253b4c';
        ctx.fillRect(x - 2, lampY, 4, FLOOR_Y - lampY);
        ctx.fillStyle = '#425b66';
        ctx.fillRect(x - 2, lampY, 1, FLOOR_Y - lampY);
        drawNightGlow(x, lampY, 51, 43, color, 0.48);
        ctx.fillStyle = '#122332';
        ctx.beginPath();
        ctx.roundRect(x - 21, lampY - 12, 42, 15, 4);
        ctx.fill();
        ctx.fillStyle = `rgb(${color})`;
        for (let panel = -1; panel <= 1; panel++) {
          ctx.fillRect(x + panel * 12 - 5, lampY - 7, 10, 6);
        }
      }

      function drawCourtClouds(color) {
        ctx.fillStyle = color;
        for (let i = 0; i < 3; i++) {
          const x = ((state.skyTime * (6 + i * 2) + i * 230) % (W + 180)) - 90;
          ctx.beginPath();
          ctx.ellipse(x, 58 + i * 32, 64 + i * 12, 12, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawNightCityAndFence(opts) {
        // 远层楼顶穿插于近层天际线后，近层保留少量亮窗与围栏
        ctx.fillStyle = opts.far;
        SKYLINE.forEach((building, i) => {
          const roof = FLOOR_Y - building.h - 16 - (i % 3) * 12;
          ctx.fillRect(building.x - 17, roof, building.w - 6, FLOOR_Y - roof);
        });
        SKYLINE.forEach((building, i) => {
          const roof = FLOOR_Y - building.h;
          ctx.fillStyle = i % 2 ? opts.nearA : opts.nearB;
          ctx.fillRect(building.x, roof, building.w, building.h);
          ctx.fillStyle = typeof opts.roofLine === 'function' ? opts.roofLine(i) : opts.roofLine;
          ctx.fillRect(building.x + 1, roof, building.w - 2, 2);
          for (let row = 0; roof + 14 + row * 17 < FLOOR_Y - 56; row++) {
            for (let column = 0; 10 + column * 13 < building.w - 7; column++) {
              if ((i * 11 + row * 13 + column * 7) % 17 < 4) {
                ctx.fillStyle = (i + row + column) % 3 === 0 ? opts.winA : opts.winB;
                ctx.fillRect(building.x + 10 + column * 13, roof + 14 + row * 17, 4, 7);
              }
            }
          }
        });

        drawFloodlight(185, 142, opts.lightL);
        drawFloodlight(514, 506, opts.lightR);

        const fenceTop = FLOOR_Y - 49;
        ctx.strokeStyle = opts.fenceMesh;
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = -49; x < W + 49; x += 16) {
          ctx.moveTo(x, fenceTop);
          ctx.lineTo(x + 49, FLOOR_Y);
          ctx.moveTo(x + 49, fenceTop);
          ctx.lineTo(x, FLOOR_Y);
        }
        ctx.stroke();
        ctx.fillStyle = opts.fenceRail;
        ctx.fillRect(0, fenceTop, W, 2);
        ctx.fillStyle = opts.fencePost;
        for (let x = 34; x < W; x += 101) ctx.fillRect(x, fenceTop - 2, 3, 51);

        // 光区裁在地面内，避免光晕盖住围栏或投篮区
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, FLOOR_Y, W, H - FLOOR_Y);
        ctx.clip();
        const floor = ctx.createLinearGradient(0, FLOOR_Y, 0, H);
        floor.addColorStop(0, opts.floor0);
        floor.addColorStop(0.5, opts.floor1);
        floor.addColorStop(1, opts.floor2);
        ctx.fillStyle = floor;
        ctx.fillRect(0, FLOOR_Y, W, H - FLOOR_Y);
        drawNightGlow(142, FLOOR_Y + 23, 185, 47, opts.lightL, opts.glowAlpha);
        drawNightGlow(506, FLOOR_Y + 20, 170, 42, opts.lightR, opts.glowAlpha * 0.9);
        ctx.restore();
        drawCourtMarkings(opts.boundary, opts.lines);
      }

      function drawNightCourt() {
        const sky = ctx.createLinearGradient(0, 0, 0, FLOOR_Y);
        sky.addColorStop(0, '#060e1c');
        sky.addColorStop(0.57, '#152c43');
        sky.addColorStop(1, '#345366');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, FLOOR_Y);
        drawNightGlow(365, 238, 280, 132, '112, 162, 180', 0.19);
        drawCourtClouds('rgba(125, 166, 185, 0.04)');

        drawNightCityAndFence({
          far: '#203b50',
          nearA: '#0e2131',
          nearB: '#102637',
          roofLine: '#263e4a',
          winA: '#715947',
          winB: '#4b4942',
          lightL: '255, 224, 173',
          lightR: '162, 219, 239',
          fenceMesh: 'rgba(96, 130, 142, 0.20)',
          fenceRail: '#48606b',
          fencePost: '#253d4b',
          floor0: '#26454c',
          floor1: '#20363e',
          floor2: '#101e29',
          glowAlpha: 0.27,
          boundary: '#a6bcb8',
          lines: 'rgba(216, 231, 220, 0.55)',
        });
      }

      function drawAuroraCourt() {
        const sky = ctx.createLinearGradient(0, 0, 0, FLOOR_Y);
        sky.addColorStop(0, '#040914');
        sky.addColorStop(0.55, '#0b192e');
        sky.addColorStop(1, '#182b47');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, FLOOR_Y);

        // 柔和青紫极光带：顶部与底部均平滑衰减至 0，无硬边
        for (let band = 0; band < 2; band++) {
          ctx.save();
          const baseY = 64 + band * 44;
          const grad = ctx.createLinearGradient(0, baseY - 26, 0, baseY + 62);
          grad.addColorStop(0, 'rgba(45, 212, 191, 0)');
          grad.addColorStop(0.42, band === 0 ? 'rgba(45, 212, 191, 0.17)' : 'rgba(167, 139, 250, 0.15)');
          grad.addColorStop(1, 'rgba(45, 212, 191, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          for (let x = 0; x <= W; x += 32) {
            const wave = Math.sin(x * 0.012 + state.skyTime * (0.45 + band * 0.2) + band * 2) * 14;
            if (x === 0) ctx.moveTo(x, baseY + wave);
            else ctx.lineTo(x, baseY + wave);
          }
          ctx.lineTo(W, baseY + 62);
          ctx.lineTo(0, baseY + 62);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        drawNightCityAndFence({
          far: '#142642',
          nearA: '#0b1626',
          nearB: '#0f1d32',
          roofLine: (i) => (i % 2 ? 'rgba(56, 189, 248, 0.42)' : 'rgba(192, 132, 252, 0.38)'),
          winA: 'rgba(103, 232, 249, 0.36)',
          winB: 'rgba(196, 181, 253, 0.3)',
          lightL: '103, 232, 249',
          lightR: '196, 181, 253',
          fenceMesh: 'rgba(103, 232, 249, 0.16)',
          fenceRail: '#334155',
          fencePost: '#1e293b',
          floor0: '#1e293b',
          floor1: '#172033',
          floor2: '#0b1120',
          glowAlpha: 0.24,
          boundary: '#7dd3fc',
          lines: 'rgba(186, 230, 253, 0.48)',
        });
      }

      function drawStarryCourt() {
        const sky = ctx.createLinearGradient(0, 0, 0, FLOOR_Y);
        sky.addColorStop(0, '#02040a');
        sky.addColorStop(0.5, '#0b1026');
        sky.addColorStop(1, '#1b1d3d');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, FLOOR_Y);

        // 淡银河光带
        ctx.save();
        ctx.translate(W * 0.5, 130);
        ctx.rotate(-0.22);
        const milky = ctx.createRadialGradient(0, 0, 10, 0, 0, 290);
        milky.addColorStop(0, 'rgba(129, 140, 248, 0.14)');
        milky.addColorStop(0.55, 'rgba(56, 189, 248, 0.06)');
        milky.addColorStop(1, 'rgba(15, 23, 42, 0)');
        ctx.fillStyle = milky;
        ctx.scale(1.6, 0.45);
        ctx.beginPath();
        ctx.arc(0, 0, 290, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 确定性星辰闪烁
        for (let i = 0; i < 42; i++) {
          const sx = (i * 97 + 41) % W;
          const sy = (i * 53 + 17) % (FLOOR_Y - 90);
          const twinkle = 0.3 + 0.55 * (0.5 + 0.5 * Math.sin(state.skyTime * (1.5 + (i % 4) * 0.6) + i));
          ctx.fillStyle = i % 5 === 0 ? `rgba(253, 224, 71, ${twinkle})` : `rgba(226, 232, 240, ${twinkle})`;
          ctx.beginPath();
          ctx.arc(sx, sy, i % 6 === 0 ? 1.7 : 1.1, 0, Math.PI * 2);
          ctx.fill();
        }

        // 偶发流星（每 5.2 秒划过一次）
        const meteorCycle = state.skyTime % 5.2;
        if (meteorCycle < 0.75) {
          const p = meteorCycle / 0.75;
          const mx = 520 - p * 220;
          const my = 32 + p * 85;
          ctx.strokeStyle = `rgba(254, 240, 138, ${(1 - p) * 0.75})`;
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(mx, my);
          ctx.lineTo(mx + 34, my - 13);
          ctx.stroke();
        }

        drawNightCityAndFence({
          far: '#181c3a',
          nearA: '#0a0f1f',
          nearB: '#0f172a',
          roofLine: 'rgba(253, 230, 138, 0.28)',
          winA: 'rgba(253, 224, 71, 0.32)',
          winB: 'rgba(147, 197, 253, 0.25)',
          lightL: '253, 224, 140',
          lightR: '147, 197, 253',
          fenceMesh: 'rgba(147, 197, 253, 0.14)',
          fenceRail: '#312e81',
          fencePost: '#1e1b4b',
          floor0: '#1e1b3a',
          floor1: '#15142d',
          floor2: '#090919',
          glowAlpha: 0.24,
          boundary: '#fde68a',
          lines: 'rgba(224, 231, 255, 0.5)',
        });
      }

      function drawSunsetCourt() {
        const isDusk = state.score >= 15;

        // 随分数段渐进切换天空氛围（黄昏 -> 暮色 -> 霓虹夜场）
        const sky = ctx.createLinearGradient(0, 0, 0, FLOOR_Y);
        if (isDusk) {
          sky.addColorStop(0, '#0f172a');
          sky.addColorStop(0.45, '#1e1b4b');
          sky.addColorStop(0.82, '#4338ca');
          sky.addColorStop(1, '#7c3aed');
        } else {
          sky.addColorStop(0, '#312e81');
          sky.addColorStop(0.45, '#7c2d12');
          sky.addColorStop(0.82, '#ea580c');
          sky.addColorStop(1, '#fdba74');
        }
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, FLOOR_Y);

        const sunY = isDusk ? 255 : 235;
        const sunGrad = ctx.createRadialGradient(480, sunY, 10, 480, sunY, 95);
        sunGrad.addColorStop(0, isDusk ? 'rgba(221, 214, 254, 0.45)' : 'rgba(254, 240, 138, 0.92)');
        sunGrad.addColorStop(0.5, isDusk ? 'rgba(139, 92, 246, 0.22)' : 'rgba(251, 146, 60, 0.35)');
        sunGrad.addColorStop(1, 'rgba(251, 146, 60, 0)');
        ctx.fillStyle = sunGrad;
        ctx.beginPath();
        ctx.arc(480, sunY, 95, 0, Math.PI * 2);
        ctx.fill();

        if (isDusk) drawCourtClouds('rgba(226, 232, 240, 0.08)');

        // 城市剪影（暮色亮起暖色窗灯）
        ctx.fillStyle = 'rgba(30, 27, 75, 0.65)';
        SKYLINE.forEach((b, idx) => {
          const topY = FLOOR_Y - b.h;
          ctx.fillRect(b.x, topY, b.w, b.h);
          if (isDusk) {
            ctx.fillStyle = 'rgba(253, 186, 116, 0.28)';
            for (let wy = topY + 14; wy < FLOOR_Y - 84; wy += 16) {
              for (let wx = b.x + 8; wx < b.x + b.w - 10; wx += 14) {
                if ((wx + wy + idx) % 3 !== 0) {
                  ctx.fillRect(wx, wy, 5, 7);
                }
              }
            }
            ctx.fillStyle = 'rgba(30, 27, 75, 0.65)';
          }
        });

        // 街头铁丝围栏（下半背景）
        const fenceTop = FLOOR_Y - 78;
        ctx.strokeStyle = 'rgba(15, 23, 42, 0.32)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, fenceTop);
        ctx.lineTo(W, fenceTop);
        for (let x = -80; x < W + 80; x += 18) {
          ctx.moveTo(x, fenceTop);
          ctx.lineTo(x + 78, FLOOR_Y);
          ctx.moveTo(x + 78, fenceTop);
          ctx.lineTo(x, FLOOR_Y);
        }
        ctx.stroke();

        // 街头塑胶/木纹球场地面
        const floorGrad = ctx.createLinearGradient(0, FLOOR_Y, 0, H);
        floorGrad.addColorStop(0, '#c2410c');
        floorGrad.addColorStop(0.25, '#9a3412');
        floorGrad.addColorStop(1, '#431407');
        ctx.fillStyle = floorGrad;
        ctx.fillRect(0, FLOOR_Y, W, H - FLOOR_Y);
        drawCourtMarkings('rgba(254, 243, 199, 0.85)', 'rgba(255, 255, 255, 0.38)');
      }

      function drawCourtMarkings(boundary, lines) {
        // 极淡木地板横向拼接线
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let fy = FLOOR_Y + 14; fy < H; fy += 16) {
          ctx.moveTo(0, fy);
          ctx.lineTo(W, fy);
        }
        ctx.stroke();

        // 左侧三秒区深色块（占地面中间纵深，顺应中心透视）
        const keyTopY = FLOOR_Y + 14;
        const keyBotY = H - 12;
        ctx.fillStyle = 'rgba(30, 41, 59, 0.42)';
        ctx.beginPath();
        ctx.moveTo(0, keyTopY);
        ctx.lineTo(176, keyTopY);
        ctx.lineTo(154, keyBotY);
        ctx.lineTo(0, keyBotY);
        ctx.closePath();
        ctx.fill();

        // 场边主线 + 简洁透视标线（三秒区框线 + 右侧分界线）
        ctx.fillStyle = boundary;
        ctx.fillRect(0, FLOOR_Y, W, 3);

        ctx.strokeStyle = lines;
        ctx.lineWidth = 2;
        ctx.beginPath();
        // 三秒区上、右、下框线
        ctx.moveTo(0, keyTopY);
        ctx.lineTo(176, keyTopY);
        ctx.lineTo(154, keyBotY);
        ctx.lineTo(0, keyBotY);
        // 右侧透视分界线（向中心消失点收敛）
        ctx.moveTo(430, FLOOR_Y);
        ctx.lineTo(470, H);
        ctx.stroke();
      }

      function drawNetLayer(ry, isFront) {
        const swing = Math.sin(state.netSwing * Math.PI * 3) * 9 * state.netSwing;
        const expand = Math.sin(state.netExpand * Math.PI) * 7;
        const cols = 6;
        const rimW = RIM_RIGHT_X - RIM_LEFT_X;
        const botY = ry + 48 + expand * 0.4;

        ctx.save();
        ctx.strokeStyle = isFront ? 'rgba(255, 255, 255, 0.92)' : 'rgba(203, 213, 225, 0.55)';
        ctx.lineWidth = isFront ? 1.9 : 1.4;
        ctx.lineCap = 'round';

        for (let i = 0; i < cols; i++) {
          const t1 = i / cols;
          const t2 = (i + 1) / cols;
          const x1 = RIM_LEFT_X + rimW * t1;
          const x2 = RIM_LEFT_X + rimW * t2;
          const bx1 = RIM_LEFT_X + 8 - expand * 0.5 + (rimW - 16 + expand) * t1 + swing;
          const bx2 = RIM_LEFT_X + 8 - expand * 0.5 + (rimW - 16 + expand) * t2 + swing;
          const midY = ry + 24;
          const cx1 = (x1 + bx2) * 0.5 + (t1 - 0.5) * expand * 0.6 + swing * 0.45;
          const cx2 = (x2 + bx1) * 0.5 + (t2 - 0.5) * expand * 0.6 + swing * 0.45;

          ctx.beginPath();
          if (isFront) {
            ctx.moveTo(x1, ry + 3);
            ctx.quadraticCurveTo(cx1, midY, bx2, botY);
          } else {
            ctx.moveTo(x2, ry + 1);
            ctx.quadraticCurveTo(cx2, midY, bx1, botY);
          }
          ctx.stroke();
        }

        if (isFront) {
          // 篮网横向收口绳圈
          ctx.strokeStyle = 'rgba(248, 250, 252, 0.6)';
          ctx.lineWidth = 1.3;
          ctx.beginPath();
          ctx.moveTo(RIM_LEFT_X + 5 - expand * 0.3 + swing * 0.4, ry + 24);
          ctx.quadraticCurveTo(RIM_CENTER_X + swing * 0.5, ry + 28 + expand * 0.3, RIM_RIGHT_X - 5 + expand * 0.3 + swing * 0.4, ry + 24);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawHoop(frontLayer) {
        const springOffset = Math.sin(state.rimSpring * Math.PI) * 2.5;
        const ry = state.rimY + springOffset;
        const boardTop = state.rimY - 82;
        const boardBottom = state.rimY + 26;
        const rimRx = (RIM_RIGHT_X - RIM_LEFT_X) / 2;
        const rimRy = 6.5;

        if (!frontLayer) {
          // 底部：地面投影 + 加厚配重底座 + 斜向支撑杆
          ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
          ctx.beginPath();
          ctx.ellipse(30, FLOOR_Y + 4, 34, 5, 0, 0, Math.PI * 2);
          ctx.fill();

          // 底座：使用较亮的填充与浅色描边，避免在夜场与深色楼群剪影融为一体
          ctx.fillStyle = '#334155';
          ctx.strokeStyle = '#94a3b8';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.roundRect(6, FLOOR_Y - 26, 48, 26, 5);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#64748b';
          ctx.fillRect(12, FLOOR_Y - 22, 36, 4);

          ctx.strokeStyle = '#64748b';
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(46, FLOOR_Y - 24);
          ctx.lineTo(32, FLOOR_Y - 70);
          ctx.stroke();

          // 中部：自适应液压立柱 + 立体防撞护垫
          const poleTop = Math.min(boardTop + 26, state.rimY - 48);
          ctx.fillStyle = '#334155';
          ctx.fillRect(24, poleTop, 12, FLOOR_Y - poleTop - 20);
          ctx.fillStyle = '#64748b';
          ctx.fillRect(26, poleTop, 3, FLOOR_Y - poleTop - 20);

          // 橙色防撞柱套与高光
          ctx.fillStyle = '#ea580c';
          ctx.beginPath();
          ctx.roundRect(19, FLOOR_Y - 128, 22, 102, 5);
          ctx.fill();
          ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
          ctx.fillRect(22, FLOOR_Y - 122, 4, 90);

          // 上部：斜向鹅颈悬臂 + 三角支撑
          ctx.strokeStyle = '#475569';
          ctx.lineWidth = 6;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(30, poleTop + 10);
          ctx.lineTo(BOARD_X - 4, state.rimY - 44);
          ctx.moveTo(30, state.rimY - 10);
          ctx.lineTo(BOARD_X - 4, state.rimY - 16);
          ctx.stroke();

          // 玻璃篮板与金属包边
          ctx.fillStyle = state.boardFlash > 0
            ? 'rgba(255, 255, 255, 0.96)'
            : 'rgba(241, 245, 249, 0.86)';
          ctx.strokeStyle = '#cbd5e1';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(BOARD_X - 6, boardTop, 12, boardBottom - boardTop, 4);
          ctx.fill();
          ctx.stroke();

          // 玻璃高光与红色方框标记
          ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
          ctx.fillRect(BOARD_X - 3, boardTop + 10, 3, 42);
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(BOARD_X + 2, state.rimY - 40, 4, 30);

          // 篮筐弹簧减震盒 + 连接杆 + 后半圈
          ctx.fillStyle = '#64748b';
          ctx.fillRect(BOARD_X + 6, state.rimY - 5, 7, 10);

          ctx.strokeStyle = '#9a3412';
          ctx.lineWidth = 5.5;
          ctx.beginPath();
          ctx.moveTo(BOARD_X + 12, ry);
          ctx.lineTo(RIM_LEFT_X, ry);
          ctx.stroke();

          ctx.strokeStyle = '#c2410c';
          ctx.lineWidth = 5.5;
          ctx.beginPath();
          ctx.ellipse(RIM_CENTER_X, ry, rimRx, rimRy, 0, Math.PI, Math.PI * 2);
          ctx.stroke();

          // 后半层篮网
          drawNetLayer(ry, false);
        } else {
          // 前半层篮网（遮住穿网而过的球）
          drawNetLayer(ry, true);

          // 立体橙色金属篮筐前半圈
          ctx.strokeStyle = '#c2410c';
          ctx.lineWidth = 6.5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.ellipse(RIM_CENTER_X, ry + 1, rimRx, rimRy, 0, 0, Math.PI);
          ctx.stroke();

          ctx.strokeStyle = '#fb923c';
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.ellipse(RIM_CENTER_X, ry - 0.5, rimRx, rimRy, 0, 0.08, Math.PI - 0.08);
          ctx.stroke();

          ctx.fillStyle = '#fdba74';
          ctx.beginPath();
          ctx.arc(RIM_LEFT_X, ry, 4.2, 0, Math.PI * 2);
          ctx.arc(RIM_RIGHT_X, ry, 4.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawBlocker() {
        const blockers = getBlockers();
        if (blockers.length === 0) return;

        blockers.forEach((blk) => {
          const bx = blk.x;
          const by = blk.y;
          const h = blk.h;
          const top = by - h / 2;

          ctx.save();
          ctx.shadowColor = blk.flash > 0 ? '#fef08a' : 'rgba(239, 68, 68, 0.65)';
          ctx.shadowBlur = blk.flash > 0 ? 18 : 10;

          const grad = ctx.createLinearGradient(bx - 6, top, bx + 6, top + h);
          grad.addColorStop(0, blk.flash > 0 ? '#fef08a' : '#f87171');
          grad.addColorStop(0.5, blk.flash > 0 ? '#facc15' : '#dc2626');
          grad.addColorStop(1, '#991b1b');

          ctx.fillStyle = grad;
          ctx.strokeStyle = '#fee2e2';
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.roundRect(bx - 6, top, 12, h, 6);
          ctx.fill();
          ctx.stroke();

          ctx.shadowBlur = 0;
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
          ctx.lineWidth = 1.5;
          for (let y = top + 10; y <= top + h - 10; y += 9) {
            ctx.beginPath();
            ctx.moveTo(bx - 4, y - 3);
            ctx.lineTo(bx + 4, y + 3);
            ctx.stroke();
          }

          ctx.fillStyle = '#e2e8f0';
          ctx.beginPath();
          ctx.roundRect(bx - 7, top - 2, 14, 6, 3);
          ctx.roundRect(bx - 7, top + h - 4, 14, 6, 3);
          ctx.fill();
          ctx.restore();
        });
      }

      function drawBall() {
        const b = state.ball;
        const onFire = state.combo >= 2;

        // 火焰/金球/普通气流拖尾
        state.trail.forEach((t) => {
          ctx.save();
          const maxL = t.maxLife || 0.35;
          ctx.globalAlpha = Math.max(0, t.life * (t.alpha || 1.4));
          ctx.fillStyle = t.color;
          ctx.beginPath();
          ctx.arc(t.x, t.y, t.r * (t.life / maxL), 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        // 火焰连击外光晕
        if (onFire && !b.scored) {
          ctx.save();
          const aura = ctx.createRadialGradient(b.x, b.y, BALL_R * 0.6, b.x, b.y, BALL_R * 1.65);
          aura.addColorStop(0, 'rgba(251, 146, 60, 0.55)');
          aura.addColorStop(1, 'rgba(251, 146, 60, 0)');
          ctx.fillStyle = aura;
          ctx.beginPath();
          ctx.arc(b.x, b.y, BALL_R * 1.65, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        const heightRatio = Math.max(0.25, 1 - (FLOOR_Y - BALL_R - b.y) / 280);
        ctx.fillStyle = 'rgba(0, 0, 0, ' + (0.38 * heightRatio).toFixed(2) + ')';
        ctx.beginPath();
        ctx.ellipse(b.x, FLOOR_Y + 6, BALL_R * heightRatio, 5 * heightRatio, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.translate(b.x, b.y);
        const sx = 1 + b.squash;
        const sy = 1 - b.squash;
        ctx.scale(sx, sy);

        const skin = BALL_SKINS[skinIndex];
        const useFixedLighting = !b.isGold && (skin.id === 'planet' || skin.id === 'ice' || skin.id === 'water');

        // 1. 旋转纹理层
        ctx.save();
        ctx.rotate(b.rot);
        ctx.beginPath();
        ctx.arc(0, 0, BALL_R, 0, Math.PI * 2);
        ctx.clip();

        if (b.isGold || skin.id === 'classic' || skin.id === 'darkgold') {
          const grad = ctx.createRadialGradient(-BALL_R * 0.32, -BALL_R * 0.32, BALL_R * 0.12, 0, 0, BALL_R);
          if (b.isGold) {
            grad.addColorStop(0, '#fef9c3');
            grad.addColorStop(0.5, '#facc15');
            grad.addColorStop(1, '#a16207');
          } else {
            grad.addColorStop(0, skin.c0);
            grad.addColorStop(0.45, skin.c1);
            grad.addColorStop(1, skin.c2);
          }
          ctx.fillStyle = grad;
          ctx.fillRect(-BALL_R, -BALL_R, BALL_R * 2, BALL_R * 2);

          ctx.strokeStyle = b.isGold ? '#713f12' : skin.seam;
          ctx.lineWidth = 1.7;
          ctx.beginPath();
          ctx.moveTo(-BALL_R, 0);
          ctx.lineTo(BALL_R, 0);
          ctx.moveTo(0, -BALL_R);
          ctx.lineTo(0, BALL_R);
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(-BALL_R * 0.92, 0, BALL_R * 0.72, -0.75, 0.75);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(BALL_R * 0.92, 0, BALL_R * 0.72, Math.PI - 0.75, Math.PI + 0.75);
          ctx.stroke();
        } else if (skin.id === 'planet') {
          // 蔚蓝星球：深海底色 + 多块翠绿/沙金大陆 + 极地冰盖 + 流云带
          ctx.fillStyle = '#0369a1';
          ctx.fillRect(-BALL_R, -BALL_R, BALL_R * 2, BALL_R * 2);

          // 浅海浅滩过渡
          ctx.fillStyle = '#0ea5e9';
          ctx.beginPath();
          ctx.ellipse(-5, -2, 11, 8, 0.3, 0, Math.PI * 2);
          ctx.ellipse(8, 6, 9, 7, -0.4, 0, Math.PI * 2);
          ctx.fill();

          // 陆地板块（深绿底 + 沙金高地）
          ctx.fillStyle = '#22c55e';
          ctx.beginPath();
          ctx.ellipse(-6, -4, 7.5, 4.8, 0.35, 0, Math.PI * 2);
          ctx.ellipse(7, 5, 6.8, 5.2, -0.45, 0, Math.PI * 2);
          ctx.ellipse(-7, 9, 4.5, 3, 0.2, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#86efac';
          ctx.beginPath();
          ctx.ellipse(-6.5, -4.5, 4, 2.2, 0.35, 0, Math.PI * 2);
          ctx.ellipse(6.5, 4.5, 3.5, 2.4, -0.45, 0, Math.PI * 2);
          ctx.fill();

          // 南北极冰盖
          ctx.fillStyle = 'rgba(248, 250, 252, 0.88)';
          ctx.beginPath();
          ctx.ellipse(0, -BALL_R + 2, 10, 4, 0, 0, Math.PI * 2);
          ctx.ellipse(0, BALL_R - 1.5, 8, 3.2, 0, 0, Math.PI * 2);
          ctx.fill();

          // 斜向白色云带
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
          ctx.lineWidth = 2;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.arc(-2, -6, 13, 0.2, 1.3);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(3, 5, 11, 2.7, 3.8);
          ctx.stroke();
        } else if (skin.id === 'ice') {
          // 寒冰晶球：冷白亮底 + 几何冰晶切面 + 六角雪花核心
          ctx.fillStyle = '#bae6fd';
          ctx.fillRect(-BALL_R, -BALL_R, BALL_R * 2, BALL_R * 2);

          const facets = [
            { pts: [[-19, -19], [2, -19], [-4, -2], [-19, 3]], col: '#e0f2fe' },
            { pts: [[2, -19], [19, -19], [19, 2], [-4, -2]], col: '#7dd3fc' },
            { pts: [[-19, 3], [-4, -2], [3, 19], [-19, 19]], col: '#38bdf8' },
            { pts: [[-4, -2], [19, 2], [19, 19], [3, 19]], col: '#0284c7' },
          ];
          facets.forEach((f) => {
            ctx.fillStyle = f.col;
            ctx.beginPath();
            ctx.moveTo(f.pts[0][0], f.pts[0][1]);
            for (let i = 1; i < f.pts.length; i++) ctx.lineTo(f.pts[i][0], f.pts[i][1]);
            ctx.closePath();
            ctx.fill();
          });

          // 六角雪花晶核
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
          ctx.lineWidth = 1.6;
          ctx.lineCap = 'round';
          for (let a = 0; a < 3; a++) {
            const ang = (a * Math.PI) / 3;
            const dx = Math.cos(ang) * 11;
            const dy = Math.sin(ang) * 11;
            ctx.beginPath();
            ctx.moveTo(-dx, -dy);
            ctx.lineTo(dx, dy);
            ctx.stroke();
          }
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(0, 0, 2.8, 0, Math.PI * 2);
          ctx.fill();
        } else if (skin.id === 'water') {
          // 深海气泡：晶莹通透水蓝底 + 双层波纹 + 错落气泡群
          const wGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, BALL_R);
          wGrad.addColorStop(0, '#cffafe');
          wGrad.addColorStop(0.65, '#22d3ee');
          wGrad.addColorStop(1, '#0e7490');
          ctx.fillStyle = wGrad;
          ctx.fillRect(-BALL_R, -BALL_R, BALL_R * 2, BALL_R * 2);

          // 内部深色水波层
          ctx.fillStyle = 'rgba(8, 145, 178, 0.42)';
          ctx.beginPath();
          ctx.moveTo(-BALL_R, 2);
          ctx.quadraticCurveTo(-7, -4, 0, 2);
          ctx.quadraticCurveTo(8, 8, BALL_R, 1);
          ctx.lineTo(BALL_R, BALL_R);
          ctx.lineTo(-BALL_R, BALL_R);
          ctx.closePath();
          ctx.fill();

          // 错落气泡
          const bubbles = [
            { x: -7, y: -6, r: 3.6 },
            { x: 6, y: -7, r: 2.3 },
            { x: 7, y: 4, r: 4.1 },
            { x: -4, y: 8, r: 2.7 },
            { x: 0, y: -1, r: 1.8 },
          ];
          bubbles.forEach((bb) => {
            ctx.fillStyle = 'rgba(236, 254, 255, 0.5)';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
            ctx.lineWidth = 0.9;
            ctx.beginPath();
            ctx.arc(bb.x, bb.y, bb.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(bb.x - bb.r * 0.32, bb.y - bb.r * 0.32, Math.max(0.8, bb.r * 0.28), 0, Math.PI * 2);
            ctx.fill();
          });
        }
        ctx.restore();

        // 2. 固定球面立体光影层（不随旋转转动，塑造真实 3D 球体感）
        if (useFixedLighting) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(0, 0, BALL_R, 0, Math.PI * 2);
          ctx.clip();

          // 右下角球面暗部阴影
          const shadowGrad = ctx.createRadialGradient(-BALL_R * 0.38, -BALL_R * 0.38, BALL_R * 0.25, 0, 0, BALL_R * 1.05);
          shadowGrad.addColorStop(0, 'rgba(255, 255, 255, 0.28)');
          shadowGrad.addColorStop(0.55, 'rgba(15, 23, 42, 0)');
          shadowGrad.addColorStop(1, 'rgba(2, 6, 23, 0.52)');
          ctx.fillStyle = shadowGrad;
          ctx.fillRect(-BALL_R, -BALL_R, BALL_R * 2, BALL_R * 2);

          // 左上角玻璃/大气高光月牙
          ctx.fillStyle = skin.id === 'water' ? 'rgba(255, 255, 255, 0.58)' : 'rgba(255, 255, 255, 0.38)';
          ctx.beginPath();
          ctx.ellipse(-BALL_R * 0.42, -BALL_R * 0.42, 5.5, 2.8, -0.75, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        ctx.restore();

        // 球体边缘柔和轮廓，确保在黄昏/夜场背景下同样醒目
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.scale(sx, sy);
        ctx.strokeStyle = b.isGold
          ? 'rgba(254, 240, 138, 0.65)'
          : skin.id === 'planet'
            ? 'rgba(125, 211, 252, 0.65)'
            : skin.id === 'ice'
              ? 'rgba(224, 242, 254, 0.78)'
              : skin.id === 'water'
                ? 'rgba(165, 243, 252, 0.72)'
                : 'rgba(255, 255, 255, 0.22)';
        ctx.lineWidth = useFixedLighting ? 1.6 : 1.2;
        ctx.beginPath();
        ctx.arc(0, 0, BALL_R - 0.5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        if (b.isGold && !b.scored) {
          ctx.fillStyle = '#fef08a';
          ctx.font = 'bold 12px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(t('×2 金球'), b.x, b.y - BALL_R - 8);
        }
      }

      function render() {
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.save();
        // 5 阶段场景：0-14 黄昏 -> 15-29 暮色 -> 30-59 夜场 -> 60-99 极光 -> 100+ 星河
        if (state.score >= 100) {
          drawStarryCourt();
        } else if (state.score >= 60) {
          drawAuroraCourt();
        } else if (state.score >= 30) {
          drawNightCourt();
        } else {
          drawSunsetCourt();
        }
        if (state.shake > 0.2) {
          const sx = (Math.random() - 0.5) * state.shake * 2;
          const sy = (Math.random() - 0.5) * state.shake * 2;
          ctx.translate(sx, sy);
        }

        drawHoop(false);
        drawBlocker();
        drawBall();
        drawHoop(true);

        state.rings.forEach((rg) => {
          ctx.save();
          ctx.globalAlpha = Math.max(0, rg.life);
          ctx.strokeStyle = rg.color;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(rg.x, rg.y, rg.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        });

        state.particles.forEach((p) => {
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        if (!state.started && !state.ended) {
          ctx.fillStyle = 'rgba(15, 23, 42, 0.62)';
          ctx.beginPath();
          ctx.roundRect(W / 2 - 150, 118, 300, 48, 12);
          ctx.fill();
          ctx.fillStyle = '#f8fafc';
          ctx.font = 'bold 16px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(t('连续点击升空 · 停手落网 🏀'), W / 2, 148);
        }

        if (state.paused) {
          ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 26px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(t('已暂停（P / 点击继续）'), W / 2, H / 2);
        }

        state.popups.forEach((p) => {
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.font = 'bold 20px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillStyle = p.color;
          ctx.fillText(p.text, p.x, p.y);
          ctx.restore();
        });

        // 画面右上角状态徽章：火焰连击 / 金球回合
        if (state.started && !state.ended) {
          let badgeText = '';
          let badgeColor = '#fb923c';
          if (state.ball && state.ball.isGold) {
            badgeText = t('⭐ 金球回合 ×2');
            badgeColor = '#facc15';
          } else if (state.combo >= 2) {
            badgeText = t('🔥 火焰连击 ×{combo}', { combo: state.combo });
            badgeColor = '#fb923c';
          }
          if (badgeText) {
            ctx.save();
            ctx.font = 'bold 13px sans-serif';
            const tw = ctx.measureText(badgeText).width + 22;
            ctx.fillStyle = 'rgba(15, 23, 42, 0.68)';
            ctx.beginPath();
            ctx.roundRect(W - tw - 14, 14, tw, 28, 999);
            ctx.fill();
            ctx.strokeStyle = badgeColor;
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.fillStyle = badgeColor;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(badgeText, W - tw / 2 - 14, 28.5);
            ctx.restore();
          }
        }

        ctx.restore();
      }

      function loop(ts) {
        if (!lastTime) lastTime = ts;
        const dt = Math.min((ts - lastTime) / 1000, 0.04);
        lastTime = ts;
        // 物理子步进：单步不超过 1/90 秒，降低低帧率下穿模风险
        const steps = Math.max(1, Math.ceil(dt / (1 / 90)));
        for (let i = 0; i < steps; i++) update(dt / steps);
        render();
        requestAnimationFrame(loop);
      }

      skinBtn.addEventListener('click', () => {
        skinIndex = (skinIndex + 1) % BALL_SKINS.length;
        renderSkinButton();
        try {
          localStorage.setItem(SKIN_STORAGE_KEY, String(skinIndex));
        } catch {}
      });
      document.querySelectorAll('button').forEach((btn) => {
        btn.addEventListener('click', () => btn.blur());
      });
      document.getElementById('restart-btn').addEventListener('click', initGame);
      document.getElementById('overlay-restart').addEventListener('click', initGame);

      initGame();
      GameKit.mountMoreGames('basketball', document.getElementById('more-games'));
      GameKit.showTutorial({
        id: 'basketball',
        steps: [
          { icon: '👆', title: t('连点升空'), text: t('连续点击球场，或连按空格键，让球持续升高。') },
          { icon: '🏀', title: t('停手落网'), text: t('在篮筐上方停止点击，让球自然下落；空心入网得分最高。') },
        ],
      });
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
