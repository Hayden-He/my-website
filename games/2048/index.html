<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>经典 2048 - 小游乐场</title>
  <meta name="description" content="经典 2048：丝滑滑动合并方块，支持 4×4 与 5×5 棋盘、自动存档与单步撤回。" />
  <link rel="canonical" href="https://my-website-all.pages.dev/games/2048/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="小游乐场" />
  <meta property="og:locale" content="zh_CN" />
  <meta property="og:title" content="经典 2048 · Little Playground" />
  <meta property="og:description" content="经典 2048：丝滑滑动合并方块，支持 4×4 与 5×5 棋盘、自动存档与单步撤回。" />
  <meta property="og:url" content="https://my-website-all.pages.dev/games/2048/" />
  <meta property="og:image" content="https://my-website-all.pages.dev/assets/og-image.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="小游乐场 · Little Playground：12 款即开即玩的小游戏" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="经典 2048 · Little Playground" />
  <meta name="twitter:description" content="经典 2048：丝滑滑动合并方块，支持 4×4 与 5×5 棋盘、自动存档与单步撤回。" />
  <meta name="twitter:image" content="https://my-website-all.pages.dev/assets/og-image.jpg" />
  <meta name="twitter:image:alt" content="小游乐场 · Little Playground：12 款即开即玩的小游戏" />
  <meta name="author" content="Hayden-He" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="小游乐场" />
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/style.css" />
  <link rel="stylesheet" href="/assets/game-shell.css" />
  <link rel="stylesheet" href="./modules/2048.css" />
</head>
<body>
  <!-- inline-icons:start -->
  <!-- inline-icons:end -->
  <header class="game-topbar">
    <div class="container game-topbar-inner">
      <a class="back-link" href="/" data-i18n="← 返回大厅">← 返回大厅</a>
      <h1 class="game-topbar-title">
        <svg class="title-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><use href="#game-2048"></use></svg>
        <span data-i18n="经典 2048">经典 2048</span>
      </h1>
      <div class="game-topbar-actions">
        <a class="game-topbar-cat" href="/categories/puzzle" data-i18n="益智休闲">益智休闲</a>
        <button class="lang-btn theme-btn" type="button" data-theme-toggle aria-label="主题：跟随系统" title="主题：跟随系统"><svg class="theme-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#theme-system"></use></svg></button>
        <button class="lang-btn" type="button" data-lang-toggle>EN</button>
      </div>
    </div>
  </header>

  <main class="game-wrap">
    <div class="rule-banner">
      <span data-i18n="合并相同数字，目标 2048。">合并相同数字，目标 2048。</span>
      <span class="rule-demo">
        <span class="mini-chip">2</span>+<span class="mini-chip">2</span>=<span class="mini-chip four">4</span>
      </span>
    </div>

    <div class="hud">
      <div id="score-box" class="hud-box">
        <div class="hud-label" data-i18n="当前得分">当前得分</div>
        <div id="score-el" class="hud-value">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label" data-i18n="最大方块">最大方块</div>
        <div id="max-el" class="hud-value" style="color: var(--primary);">2</div>
      </div>
      <div class="hud-box">
        <div class="hud-label" data-i18n="模式最高">模式最高</div>
        <div id="best-el" class="hud-value" style="color: var(--accent-text);">0</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="mode-pills" role="group" aria-label="棋盘尺寸" data-i18n-attr="aria-label:棋盘尺寸">
        <button id="size-4" class="mode-pill active" type="button" data-mode="4" data-i18n="4×4 经典">4×4 经典</button>
        <button id="size-obstacle" class="mode-pill" type="button" data-mode="obstacle" data-i18n="4×4 障碍">4×4 障碍</button>
        <button id="size-5" class="mode-pill" type="button" data-mode="5" data-i18n="5×5 轻松">5×5 轻松</button>
      </div>
      <div class="btn-group">
        <button id="help-btn" class="btn-small secondary" type="button" title="查看玩法" data-i18n="玩法" data-i18n-attr="title:查看玩法">玩法</button>
        <button id="sound-btn" class="btn-small secondary" type="button">音效: 开</button>
        <button id="undo-btn" class="btn-small secondary" type="button" disabled data-i18n="撤回">撤回</button>
        <button id="restart-btn" class="btn-small" type="button" data-i18n="重开">重开</button>
      </div>
    </div>

    <div id="board-wrap" class="board-wrap">
      <div class="board-stage">
        <div id="grid-bg" class="grid-bg"></div>
        <div id="tile-layer" class="tile-layer"></div>
      </div>
      <div id="overlay" class="overlay" role="status" aria-live="polite">
        <h2 id="overlay-title">没有可移动的方块了</h2>
        <p id="overlay-desc">本局得分：0</p>
        <div class="overlay-actions">
          <button id="keep-btn" class="overlay-btn secondary" type="button" style="display: none;" data-i18n="继续挑战">继续挑战</button>
          <button id="overlay-btn" class="overlay-btn" type="button" data-i18n="再来一局">再来一局</button>
        </div>
      </div>
    </div>

    <p class="hint-text" data-i18n="滑动或方向键/WASD 移动，U 或 Ctrl+Z 撤回（最多 3 步）。可挑战 4×4 障碍或 5×5 轻松。">滑动或方向键/WASD 移动，U 或 Ctrl+Z 撤回（最多 3 步）。可挑战 4×4 障碍或 5×5 轻松。</p>

    <div id="more-games" class="more-games" data-more-games="2048"></div>
  </main>

  <script src="/assets/site-data.js"></script>
  <script src="/assets/i18n.js"></script>
  <script src="/assets/games.js"></script>
  <script src="/assets/game-kit.js"></script>
  <script src="/assets/game-rules.js"></script>
  <script type="module" src="./modules/main.js"></script>
</body>
</html>
