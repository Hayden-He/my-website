  <style>


    .btn-small.flag-active {
      background: #f97316;
      color: #fff;
    }

    .board-wrap {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1 / 1;
      background: #cbd5e1;
      border-radius: 16px;
      padding: 10px;
      box-shadow: var(--shadow-md);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .mine-grid {
      --cols: 9;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(var(--cols), 1fr);
      grid-template-rows: repeat(var(--cols), 1fr);
      gap: 3px;
    }

    .mine-grid.dense {
      gap: 2px;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 6px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      transition: transform 0.08s ease, background 0.1s ease;
    }

    .mine-grid.mid .cell {
      font-size: 0.88rem;
      border-radius: 5px;
    }

    .mine-grid.dense .cell {
      font-size: 0.74rem;
      border-radius: 4px;
    }

    .cell.closed {
      background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 1px 2px rgba(15, 23, 42, 0.14);
    }

    .cell.closed:hover {
      background: linear-gradient(180deg, #ffffff 0%, #dbeafe 100%);
    }

    .cell.closed:active {
      transform: scale(0.94);
    }

    .cell.flagged {
      background: linear-gradient(180deg, #fff7ed 0%, #fed7aa 100%);
    }

    .cell.open {
      background: #f8fafc;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.06);
      cursor: default;
    }

    .cell.open.chordable {
      cursor: pointer;
    }

    .cell.mine-hit {
      background: #ef4444;
      color: #fff;
    }

    .cell.mine-show {
      background: #fee2e2;
    }

    .cell.wrong-flag {
      background: #fecaca;
    }

    .n1 { color: #2563eb; }
    .n2 { color: #16a34a; }
    .n3 { color: #dc2626; }
    .n4 { color: #4f46e5; }
    .n5 { color: #991b1b; }
    .n6 { color: #0891b2; }
    .n7 { color: #1e293b; }
    .n8 { color: #64748b; }

    /* 本页尺寸；其余外壳样式见 assets/game-shell.css */
    .game-wrap { --game-width: 540px; }
    .hud { grid-template-columns: repeat(3, 1fr); }

    .mobile-diff-note {
      display: none;
      width: 100%;
      margin: -4px 0 0;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      .mode-pill[data-diff="medium"],
      .mode-pill[data-diff="hard"] {
        display: none;
      }

      .mobile-diff-note {
        display: block;
      }
    }

    @media (max-width: 340px) {
      /* 320px 下 4 个按钮改成 2×2，避免最后只剩一个按钮单独一行 */
      .btn-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        width: 100%;
      }
    }

  </style>

    <div id="more-games" class="more-games"></div>

  <script>
    (function () {
      const t = (key, params) => (window.I18N ? I18N.t(key, params) : key);

      function createIcon(name, className, viewBox) {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', className || 'icon');
        svg.setAttribute('viewBox', viewBox || '0 0 24 24');
        svg.setAttribute('aria-hidden', 'true');
        svg.setAttribute('focusable', 'false');
        const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
        use.setAttribute('href', '#' + name);
        svg.appendChild(use);
        return svg;
      }

      function appendCellIcon(btn, name) {
        btn.textContent = '';
        btn.appendChild(createIcon(name, 'cell-icon', '0 0 32 32'));
      }

      const GLOBAL_BEST_KEY = 'game_best_minesweeper';
      const DIFF_BEST_PREFIX = 'game_best_minesweeper_';
      const MODE_KEY = 'game_mode_minesweeper';

      const DIFFS = {
        easy: { size: 9, mines: 10, label: '9×9 轻松' },
        medium: { size: 12, mines: 22, label: '12×12 标准' },
        hard: { size: 16, mines: 40, label: '16×16 挑战' },
      };

      const MOBILE_BOARD_QUERY = window.matchMedia('(max-width: 600px)');

      const gridEl = document.getElementById('mine-grid');
      const minesEl = document.getElementById('mines-el');
      const timeEl = document.getElementById('time-el');
      const bestEl = document.getElementById('best-el');
      const toolBtn = document.getElementById('tool-btn');
      const soundBtn = document.getElementById('sound-btn');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');
      const diffBtns = document.querySelectorAll('.mode-pill[data-diff]');
      const helpBtn = document.getElementById('help-btn');

      let soundEnabled = window.SiteData ? SiteData.getSound() : true;
      GameKit.bindSoundButton(soundBtn, soundEnabled, (on) => {
        soundEnabled = on;
      });

      function playTone(freq, duration, type, slideTo) {
        if (!soundEnabled || !window.SiteData) return;
        SiteData.withAudio((ac) => {
          try {
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = type || 'sine';
            osc.frequency.setValueAtTime(freq, ac.currentTime);
            if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime + duration);
            gain.gain.setValueAtTime(0.08, ac.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start();
            osc.stop(ac.currentTime + duration);
          } catch {}
        });
      }

      let diff = 'easy';
      try {
        const savedDiff = localStorage.getItem(MODE_KEY);
        if (savedDiff && DIFFS[savedDiff]) diff = savedDiff;
      } catch {}
      // 手机上格子在 25px 以下，12×12 / 16×16 不可用；仅保留 9×9
      if (MOBILE_BOARD_QUERY.matches) diff = 'easy';

      let size = 9;
      let totalMines = 10;
      let board = [];
      let flagMode = false;
      let started = false;
      let ended = false;
      let elapsed = 0;
      let timerId = null;
      let openedCount = 0;
      let flagCount = 0;
      let hitPos = null;
      let dialogOpen = false;
      let endState = '';
      let endSec = 0;
      let endBest = 0;

      function readBest(key) {
        return GameKit.readBest(key);
      }

      function saveBest(sec) {
        const diffKey = DIFF_BEST_PREFIX + diff;
        const curDiffBest = readBest(diffKey);
        if (!curDiffBest || sec < curDiffBest) {
          GameKit.writeBest(diffKey, sec);
        }
        const curGlobalBest = readBest(GLOBAL_BEST_KEY);
        if (!curGlobalBest || sec < curGlobalBest) {
          GameKit.writeBest(GLOBAL_BEST_KEY, sec);
        }
      }

      function updateHud() {
        minesEl.textContent = Math.max(0, totalMines - flagCount);
        timeEl.textContent = elapsed + 's';
        const best = readBest(DIFF_BEST_PREFIX + diff);
        bestEl.textContent = best > 0 ? best + 's' : '--';
      }

      function stopTimer() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
      }

      function startTimer() {
        stopTimer();
        timerId = setInterval(() => {
          if (!started || ended || document.hidden || dialogOpen) return;
          elapsed += 1;
          timeEl.textContent = elapsed + 's';
        }, 1000);
      }

      function neighbors(r, c) {
        const res = [];
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = r + dr;
            const nc = c + dc;
            if (nr >= 0 && nr < size && nc >= 0 && nc < size) res.push([nr, nc]);
          }
        }
        return res;
      }

      function placeMines(safeR, safeC) {
        const candidates = [];
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
            candidates.push([r, c]);
          }
        }
        for (let i = candidates.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
        }
        for (let i = 0; i < totalMines; i++) {
          const [mr, mc] = candidates[i];
          board[mr][mc].mine = true;
        }
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            if (board[r][c].mine) continue;
            board[r][c].adj = neighbors(r, c).filter(([nr, nc]) => board[nr][nc].mine).length;
          }
        }
      }

      function initGame() {
        stopTimer();
        const cfg = DIFFS[diff];
        size = cfg.size;
        totalMines = cfg.mines;
        started = false;
        ended = false;
        elapsed = 0;
        openedCount = 0;
        flagCount = 0;
        hitPos = null;
        endState = '';
        endSec = 0;
        endBest = 0;

        board = Array.from({ length: size }, () =>
          Array.from({ length: size }, () => ({
            mine: false,
            open: false,
            flag: false,
            adj: 0,
          }))
        );

        diffBtns.forEach((b) => b.classList.toggle('active', b.dataset.diff === diff));
        gridEl.style.setProperty('--cols', String(size));
        gridEl.className = 'mine-grid' + (size === 12 ? ' mid' : size === 16 ? ' dense' : '');
        overlay.classList.remove('show');
        updateHud();
        render();
      }

      function revealSafeArea(startR, startC) {
        const queue = [[startR, startC]];
        let opened = 0;
        while (queue.length > 0) {
          const [r, c] = queue.shift();
          const cell = board[r][c];
          if (cell.open || cell.flag || cell.mine) continue;
          cell.open = true;
          opened += 1;
          openedCount += 1;
          if (cell.adj === 0) {
            neighbors(r, c).forEach(([nr, nc]) => {
              if (!board[nr][nc].open && !board[nr][nc].flag) queue.push([nr, nc]);
            });
          }
        }
        return opened;
      }

      function checkWin() {
        if (openedCount === size * size - totalMines) {
          ended = true;
          stopTimer();
          for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
              if (board[r][c].mine) board[r][c].flag = true;
            }
          }
          flagCount = totalMines;
          const finalSec = Math.max(1, elapsed);
          saveBest(finalSec);
          updateHud();
          render();
          playTone(523, 0.12, 'triangle', 784);
          setTimeout(() => playTone(784, 0.18, 'sine', 1046), 80);
          endState = 'win';
          endSec = finalSec;
          endBest = readBest(DIFF_BEST_PREFIX + diff);
          renderEndText();
          overlay.classList.add('show');
        }
      }

      function renderEndText() {
        if (endState === 'win') {
          overlayTitle.textContent = t('排雷成功！🎉');
          overlayDesc.textContent = t('{label} · 用时 {sec} 秒（最佳 {best} 秒）', {
            label: t(DIFFS[diff].label),
            sec: endSec,
            best: endBest,
          });
        } else if (endState === 'lose') {
          overlayTitle.textContent = t('踩到地雷了');
          overlayDesc.textContent = t('坚持了 {elapsed} 秒，再试一次吧！', { elapsed: endSec });
        }
      }

      function triggerLose(r, c) {
        ended = true;
        hitPos = r + ',' + c;
        stopTimer();
        playTone(170, 0.28, 'sawtooth', 75);
        endState = 'lose';
        endSec = elapsed;
        render();
        renderEndText();
        overlay.classList.add('show');
      }

      function openCell(r, c) {
        if (ended) return;
        const cell = board[r][c];
        if (cell.flag) return;

        if (!started) {
          started = true;
          placeMines(r, c);
          startTimer();
        }

        if (cell.open) {
          // 快捷排雷（Chord）：周围旗子数等于数字时翻开其余格
          if (cell.adj > 0) {
            const adjCells = neighbors(r, c);
            const flags = adjCells.filter(([nr, nc]) => board[nr][nc].flag).length;
            if (flags === cell.adj) {
              let anyOpened = false;
              for (const [nr, nc] of adjCells) {
                const target = board[nr][nc];
                if (target.open || target.flag) continue;
                if (target.mine) {
                  triggerLose(nr, nc);
                  return;
                }
                anyOpened = revealSafeArea(nr, nc) > 0 || anyOpened;
              }
              if (anyOpened) {
                playTone(580, 0.06, 'sine', 740);
                render();
                checkWin();
              }
            }
          }
          return;
        }

        if (cell.mine) {
          triggerLose(r, c);
          return;
        }

        const count = revealSafeArea(r, c);
        playTone(count > 3 ? 620 : 480, 0.05, 'sine', count > 3 ? 820 : 560);
        render();
        checkWin();
      }

      function toggleFlag(r, c) {
        if (ended) return;
        const cell = board[r][c];
        if (cell.open) return;
        cell.flag = !cell.flag;
        flagCount += cell.flag ? 1 : -1;
        playTone(cell.flag ? 680 : 380, 0.05, 'triangle');
        updateHud();
        render();
      }

      function render() {
        gridEl.innerHTML = '';
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            const cell = board[r][c];
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.dataset.r = String(r);
            btn.dataset.c = String(c);

            if (ended) {
              if (cell.mine && hitPos === r + ',' + c) {
                btn.className = 'cell mine-hit';
                appendCellIcon(btn, 'art-explosion');
              } else if (cell.mine && !cell.flag) {
                btn.className = 'cell mine-show';
                appendCellIcon(btn, 'game-minesweeper');
              } else if (!cell.mine && cell.flag) {
                btn.className = 'cell wrong-flag';
                appendCellIcon(btn, 'art-cross');
              } else if (cell.flag) {
                btn.className = 'cell closed flagged';
                appendCellIcon(btn, 'icon-flag');
              } else if (cell.open) {
                btn.className = 'cell open' + (cell.adj > 0 ? ' n' + cell.adj : '');
                btn.textContent = cell.adj > 0 ? String(cell.adj) : '';
              } else {
                btn.className = 'cell closed';
              }
            } else if (cell.open) {
              btn.className = 'cell open' + (cell.adj > 0 ? ' n' + cell.adj + ' chordable' : '');
              btn.textContent = cell.adj > 0 ? String(cell.adj) : '';
            } else if (cell.flag) {
              btn.className = 'cell closed flagged';
              appendCellIcon(btn, 'icon-flag');
            } else {
              btn.className = 'cell closed';
            }

            let stateLabel;
            if (cell.mine && ended) {
              stateLabel = t(hitPos === r + ',' + c ? '踩中的地雷' : '地雷');
            } else if (!cell.mine && cell.flag && ended) {
              stateLabel = t('插错的旗子');
            } else if (cell.flag) {
              stateLabel = t('已插旗');
            } else if (cell.open) {
              stateLabel = cell.adj > 0
                ? (cell.adj === 1
                  ? t('已翻开，周围 1 颗雷')
                  : t('已翻开，周围 {adj} 颗雷', { adj: cell.adj }))
                : t('已翻开，空白');
            } else {
              stateLabel = t('未翻开');
            }
            btn.setAttribute('aria-label', t('第 {row} 行第 {col} 列，{state}', {
              row: r + 1,
              col: c + 1,
              state: stateLabel,
            }));

            gridEl.appendChild(btn);
          }
        }
      }

      // 事件委托：支持左键翻开/快捷排雷、右键插旗、手机长按插旗
      let longPressTimer = null;
      let longPressed = false;

      gridEl.addEventListener('contextmenu', (e) => e.preventDefault());

      gridEl.addEventListener('pointerdown', (e) => {
        const btn = e.target.closest('.cell');
        if (!btn || ended) return;
        const isMouse = e.pointerType === 'mouse' || !e.pointerType;
        if (isMouse && e.button !== 0) return;
        longPressed = false;
        const r = Number(btn.dataset.r);
        const c = Number(btn.dataset.c);
        // 长按插旗只用于触屏/手写笔；鼠标慢点不应变成插旗
        if (!isMouse && !board[r][c].open) {
          longPressTimer = setTimeout(() => {
            longPressed = true;
            toggleFlag(r, c);
            if (navigator.vibrate) navigator.vibrate(15);
          }, 320);
        }
      });

      gridEl.addEventListener('pointerup', () => {
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
      });

      gridEl.addEventListener('pointerleave', () => {
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
      });

      gridEl.addEventListener('pointercancel', () => {
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
      });

      gridEl.addEventListener('mousedown', (e) => {
        if (e.button !== 2) return;
        const btn = e.target.closest('.cell');
        if (!btn) return;
        toggleFlag(Number(btn.dataset.r), Number(btn.dataset.c));
      });

      gridEl.addEventListener('click', (e) => {
        if (longPressed) {
          longPressed = false;
          return;
        }
        const btn = e.target.closest('.cell');
        if (!btn) return;
        const r = Number(btn.dataset.r);
        const c = Number(btn.dataset.c);
        if (flagMode && !board[r][c].open) {
          toggleFlag(r, c);
        } else {
          openCell(r, c);
        }
      });

      diffBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          const next = btn.dataset.diff;
          if (!DIFFS[next] || next === diff) return;
          if (MOBILE_BOARD_QUERY.matches && next !== 'easy') return;
          diff = next;
          try { localStorage.setItem(MODE_KEY, diff); } catch {}
          initGame();
        });
      });

      if (typeof MOBILE_BOARD_QUERY.addEventListener === 'function') {
        MOBILE_BOARD_QUERY.addEventListener('change', (event) => {
          if (event.matches && diff !== 'easy') {
            diff = 'easy';
            initGame();
          }
        });
      }

      function renderToolMode() {
        toolBtn.textContent = '';
        toolBtn.appendChild(createIcon('icon-flag', 'tool-icon', '0 0 24 24'));
        const label = document.createElement('span');
        label.textContent = t(flagMode ? '模式: 插旗' : '模式: 翻开');
        toolBtn.appendChild(label);
        toolBtn.classList.toggle('flag-active', flagMode);
      }

      toolBtn.addEventListener('click', () => {
        flagMode = !flagMode;
        renderToolMode();
      });

      document.addEventListener('site:dialogopen', () => {
        dialogOpen = true;
      });
      document.addEventListener('site:dialogclose', () => {
        dialogOpen = false;
      });

      document.getElementById('restart-btn').addEventListener('click', initGame);
      document.getElementById('overlay-btn').addEventListener('click', initGame);
      document.getElementById('view-board-btn').addEventListener('click', () => {
        overlay.classList.remove('show');
      });

      document.addEventListener('i18n:change', () => {
        renderToolMode();
        if (ended) renderEndText();
        render();
      });

      const TUTORIAL_STEPS = [
        {
          icon: 'art-target',
          title: '目标：翻开所有安全格',
          text: '把所有不是雷的格子翻开就赢；不需要去点雷。',
        },
        {
          icon: 'art-grid',
          title: '数字 = 周围 8 格雷数',
          text: '数字表示它周围 8 格里有几颗雷，不是全盘剩余的雷数。',
        },
        {
          icon: 'icon-flag',
          title: '翻开与插旗',
          text: '点击或左键翻开；右键或手机长按插旗。第一下一定安全，会先翻出一片空白。',
        },
        {
          icon: 'art-zap',
          title: '快捷排雷',
          text: '当一个数字周围的旗子数等于它时，点击这个数字可一次翻开其余相邻格。',
        },
      ];

      function showRules(force) {
        GameKit.showTutorial({
          id: 'minesweeper',
          steps: TUTORIAL_STEPS.map((step) => ({
            icon: step.icon,
            title: t(step.title),
            text: t(step.text),
          })),
          force: !!force,
        });
      }

      helpBtn.addEventListener('click', () => showRules(true));

      initGame();
      renderToolMode();
      GameKit.mountMoreGames('minesweeper', document.getElementById('more-games'));
      showRules(false);
    })();
  </script>
</body>
</html>
