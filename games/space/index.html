  <style>
    .game-wrap {
      --game-width: 500px;
      --battle-status-height: 48px;
    }

    .hud { grid-template-columns: repeat(3, 1fr); }

    .hud-value.accent { color: var(--accent-text); }

    .status-strip {
      width: 100%;
      display: grid;
      grid-template-rows: repeat(2, 1.35rem);
      align-items: center;
      gap: 2px;
      padding: 6px 12px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .status-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .armor-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .armor-count {
      color: var(--text);
      font-size: 0.76rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .armor-hearts {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .armor-pip {
      width: 12px;
      height: 10px;
      border: 1px solid #18794e;
      border-radius: 3px;
      background: #22c55e;
    }

    .armor-pip.lost {
      border-color: #94a3b8;
      background: transparent;
    }

    .status-badge {
      display: block;
      min-width: 0;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 800;
      background: #eff6ff;
      color: #1d4ed8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-badge.overdrive {
      background: linear-gradient(90deg, #e9d5ff var(--remaining, 100%), #f5f3ff var(--remaining, 100%));
      color: #5b21b6;
      font-variant-numeric: tabular-nums;
    }

    .status-badge.overdrive.ending {
      background: linear-gradient(90deg, #fed7aa var(--remaining, 100%), #fff7ed var(--remaining, 100%));
      color: #9a3412;
    }

    .status-badge.blast {
      background: #fff1e7;
      color: #9a3412;
      font-variant-numeric: tabular-nums;
    }

    .status-badge.shield {
      background: #ecfeff;
      color: #0e7490;
      border: 1px solid #a5e8f3;
    }

    .status-badge.shield::before {
      content: '';
      display: inline-block;
      margin-inline-end: 4px;
      width: 7px;
      height: 9px;
      background: currentColor;
      clip-path: polygon(50% 0, 100% 22%, 85% 66%, 50% 100%, 15% 66%, 0 22%);
    }

    .status-badge[hidden] { display: none; }

    .stage-box {
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #1e293b;
      box-shadow: var(--shadow-md);
      background: #060918;
    }

    .mobile-game-stage { width: 100%; }
    .playfield { position: relative; }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 460 / 560;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: crosshair;
    }

    .battle-status {
      box-sizing: border-box;
      block-size: var(--battle-status-height);
      display: grid;
      align-items: center;
      padding: 5px 10px;
      border-bottom: 1px solid #26344c;
      background: #0b1426;
      color: #e0f2fe;
    }

    .battle-status > * { grid-area: 1 / 1; min-width: 0; }
    .battle-status > [hidden] { display: none; }
    .battle-wave { text-align: center; font-size: 0.85rem; font-weight: 800; }

    .boss-bar-wrap {
      display: grid;
      gap: 4px;
    }

    .boss-bar-wrap[hidden] { display: none; }

    .boss-bar-label {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: repeat(2, 1em);
      grid-template-areas: 'name health' 'phase phase';
      align-items: baseline;
      gap: 3px 8px;
      font-size: 0.72rem;
      font-weight: 800;
      line-height: 1;
      color: #fecaca;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
    }

    .boss-bar-track {
      height: 9px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(248, 113, 113, 0.45);
      overflow: hidden;
    }

    .boss-bar-fill {
      height: 100%;
      width: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #ef4444, #f97316, #fde047);
      transition: width 0.08s linear;
    }

    .boss-bar-wrap[data-phase] .boss-bar-track {
      position: relative;
      border-color: #7dd3fc;
    }

    .boss-bar-wrap[data-phase] .boss-bar-label {
      color: #bae6fd;
    }

    .boss-bar-wrap[data-phase] .boss-bar-track::after {
      content: '';
      position: absolute;
      inset: 0 auto 0 50%;
      width: 2px;
      transform: translateX(-50%);
      background: #f8fafc;
    }

    .boss-bar-wrap[data-phase] .boss-bar-fill {
      background: linear-gradient(90deg, #0284c7, #67e8f9);
    }

    .boss-bar-wrap[data-phase='2'] .boss-bar-fill {
      background: linear-gradient(90deg, #6366f1, #c4b5fd);
    }

    .boss-bar-wrap[data-kind='crimson'] .boss-bar-track { border-color: #fb7185; }
    .boss-bar-wrap[data-kind='crimson'] .boss-bar-label { color: #fecdd3; }
    .boss-bar-wrap[data-kind='crimson'] .boss-bar-fill {
      background: linear-gradient(90deg, #be123c, #fb7185);
    }
    .boss-bar-wrap[data-kind='crimson'][data-phase='2'] .boss-bar-fill {
      background: linear-gradient(90deg, #ef4444, #fbbf24);
    }

    .boss-bar-wrap[data-kind='mothership'] .boss-bar-track { border-color: #d8b4fe; }
    .boss-bar-wrap[data-kind='mothership'] .boss-bar-label { color: #f0d9ff; }
    .boss-bar-wrap[data-kind='mothership'] .boss-bar-fill {
      background: linear-gradient(90deg, #7c3aed, #c084fc);
    }
    .boss-bar-wrap[data-kind='mothership'][data-phase='2'] .boss-bar-fill {
      background: linear-gradient(90deg, #9140d4, #f0abfc);
    }

    .boss-phase-label {
      grid-area: phase;
      color: #e0f2fe;
      text-align: center;
    }

    .boss-phase-label[data-cue='dodge'] { color: #fda4af; }
    .boss-phase-label[data-cue='guard'] { color: #fde68a; }
    .boss-phase-label[data-cue='attack'] { color: #86efac; }

    #boss-name { grid-area: name; }
    :is(#boss-name, .boss-phase-label) {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #boss-hp-text {
      grid-area: health;
      font-variant-numeric: tabular-nums;
      color: #fff;
      text-align: right;
    }

    .action-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .emp-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      font-size: 0.84rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px -4px rgba(37, 99, 235, 0.55);
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .emp-btn:active:not(:disabled) { transform: scale(0.96); }

    #emp-count {
      inline-size: 2.5ch;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .emp-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .skin-pills {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--surface-muted);
      padding: 3px;
      border-radius: 999px;
      flex-wrap: wrap;
    }

    .skin-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    .skin-pill.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
    }

    :root[data-theme="dark"] .status-badge {
      background: var(--primary-soft);
      color: #93c5fd;
    }

    :root[data-theme="dark"] .status-badge.overdrive {
      background: linear-gradient(90deg, rgba(168, 85, 247, 0.36) var(--remaining, 100%), rgba(168, 85, 247, 0.12) var(--remaining, 100%));
      color: #e9d5ff;
    }

    :root[data-theme="dark"] .status-badge.overdrive.ending {
      background: linear-gradient(90deg, rgba(249, 115, 22, 0.38) var(--remaining, 100%), rgba(249, 115, 22, 0.14) var(--remaining, 100%));
      color: #fed7aa;
    }

    :root[data-theme="dark"] .status-badge.blast {
      background: rgba(251, 146, 60, 0.18);
      color: #fdba74;
    }

    :root[data-theme="dark"] .status-badge.shield {
      background: rgba(6, 182, 212, 0.18);
      color: #67e8f9;
      border-color: rgba(103, 232, 249, 0.45);
    }

    .skin-swatch {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .overlay-summary {
      display: grid;
      gap: 5px;
      max-width: 100%;
    }

    .overlay-summary[hidden] { display: none; }

    .overlay-summary #overlay-stats {
      font-size: 0.84rem !important;
      font-weight: 700;
      color: #93c5fd !important;
    }

    .overlay-actions { flex-wrap: wrap; justify-content: center; }

    .practice-menu {
      display: grid;
      gap: 6px;
      width: min(100%, 280px);
    }

    .practice-menu .overlay-btn { min-height: 40px; padding-block: 7px; }
    .practice-menu .overlay-btn:disabled { background: #1e293b; color: #cbd5e1; cursor: default; }

    .game-wrap :is(.practice-menu, #flight-options, .mode-pills)[hidden] { display: none; }
    .game-wrap[data-practice] .hud { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .space-legend {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: var(--shadow-sm);
    }

    .legend-title {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .legend-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(146px, 1fr));
      gap: 7px 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.75rem;
      line-height: 1.3;
      color: var(--text);
    }

    .legend-badge {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 0.68rem;
      font-weight: 800;
    }

    #flight-options { display: none; }
    .mobile-game-immersive #flight-options { display: block; max-width: 100%; }
    #flight-options summary { cursor: pointer; padding: 6px 8px; }
    #flight-options-content {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 6px;
      padding-top: 5px;
    }

    .mobile-game-immersive .game-wrap {
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      width: min(100%, 500px);
      align-items: center;
      gap: 5px;
    }

    .mobile-game-immersive .hud { grid-column: 1; grid-row: 1; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
    .mobile-game-immersive .hud-box { padding: 3px 4px; }
    .mobile-game-immersive .best-hud { display: none; }
    .mobile-game-immersive .toolbar { grid-column: 2; grid-row: 1; justify-content: end; }
    .mobile-game-immersive .toolbar .btn-group { flex-wrap: nowrap; gap: 4px; }
    .mobile-game-immersive .toolbar .btn-small { padding-inline: 6px; font-size: 0.74rem; }
    .mobile-game-immersive #pause-btn { min-inline-size: 4.75rem; }
    .mobile-game-immersive .status-strip { grid-column: 1 / -1; grid-row: 2; padding-block: 2px; }
    .mobile-game-immersive .mobile-game-stage { grid-column: 1 / -1; grid-row: 3; }
    .mobile-game-immersive .stage-box {
      width: min(100%, calc((100vh - 175px) * (460 / 560)));
      width: min(100%, max(1px, calc((100cqh - var(--battle-status-height) - 2px) * (460 / 560) + 2px)));
    }
    .mobile-game-immersive .action-bar { grid-column: 1 / -1; grid-row: 4; justify-content: center; }
    .mobile-game-immersive .emp-btn { min-height: 44px; }
    .mobile-game-immersive .hint { display: none; }

    @media (max-width: 560px) {
      .hud { gap: 8px; }
      .hud-box { padding: 8px 6px; }
      .hud-value { font-size: 1.15rem; }
      .action-bar { justify-content: center; }
      .skin-pill { padding: 4px 8px; font-size: 0.72rem; }
      .legend-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 8px; }
    }

    @media (max-width: 390px) {
      .status-strip { gap: 5px; padding: 5px 8px; }
      .status-group { gap: 4px; }
      .status-badge { padding: 2px 5px; }
    }
  </style>
</head>

      const PICKUP_THEMES = {
        weapon: { body: '#713b13', rim: '#fde047', wave: 'triangle', notes: [523, 659, 880] },
        shield: { body: '#11495d', rim: '#67e8f9', wave: 'sine', notes: [392, 784] },

      // 音频合成（节流防噪耳）
      let noiseBuffer = null;
      let lastShootSfxAt = 0;
      let lastHitSfxAt = 0;

      function getNoiseBuffer(ac) {
        if (noiseBuffer && noiseBuffer.sampleRate === ac.sampleRate) return noiseBuffer;
        const len = Math.floor(ac.sampleRate * 0.55);
        const buf = ac.createBuffer(1, len, ac.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i += 1) data[i] = Math.random() * 2 - 1;
        noiseBuffer = buf;
        return buf;
      }

      function withAudio(fn) {
        if (!soundEnabled || !window.SiteData) return;
        SiteData.withAudio((ac) => {
          try {
            fn(ac);
          } catch {}
        });
      }

      const WEAPON_ACCENTS = {
        armorHit: { wave: 'square', from: 780, to: 260, duration: 0.085, gain: 0.065, interval: 95 },
        blastImpact: { wave: 'sawtooth', from: 148, to: 44, duration: 0.29, gain: 0.15, interval: 0 },
        overdriveStart: { wave: 'triangle', from: 125, to: 315, duration: 0.22, gain: 0.12, interval: 0 },
        overdriveEnding: { wave: 'sine', from: 680, to: 470, duration: 0.15, gain: 0.07, interval: 0 },
      };
      const lastAccentAt = new Map();

      function playWeaponAccent(kind, ship = skin) {
        const now = performance.now();
        const sound = WEAPON_ACCENTS[kind] || SKINS[ship].heavy[kind];
        if (now - (lastAccentAt.get(kind) ?? -Infinity) < sound.interval) return;
        lastAccentAt.set(kind, now);
        withAudio((ac) => {
          const now = ac.currentTime;
          const end = now + sound.duration;
          const oscillator = ac.createOscillator();
          const envelope = ac.createGain();
          oscillator.type = sound.wave;
          oscillator.frequency.setValueAtTime(sound.from, now);
          oscillator.frequency.exponentialRampToValueAtTime(sound.to, end);
          envelope.gain.setValueAtTime(0.001, now);
          envelope.gain.linearRampToValueAtTime(sound.gain, now + 0.008);
          envelope.gain.exponentialRampToValueAtTime(0.001, end);
          oscillator.connect(envelope);
          envelope.connect(ac.destination);
          oscillator.start(now);
          oscillator.stop(end);
        });
      }

      function playShoot(shot, overdrive, volume = 1) {
        const now = performance.now();
        if (now - lastShootSfxAt < 95) return;
        lastShootSfxAt = now;
        withAudio((ac) => {
          const t0 = ac.currentTime;
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = shot.wave;
          osc.frequency.setValueAtTime(shot.from * (overdrive ? 1.20 : 1), t0);
          osc.frequency.exponentialRampToValueAtTime(shot.to, t0 + shot.duration);
          gain.gain.setValueAtTime(shot.gain * volume, t0);
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + shot.duration + 0.005);
          osc.connect(gain);
          gain.connect(ac.destination);
          osc.start(t0);
          osc.stop(t0 + shot.duration + 0.01);
        });
      }

      function playHit(heavy = false, armored = false, ship = skin) {
        if (heavy) {
          playWeaponAccent(armored ? 'armorHit' : 'heavyHit', ship);
          return;
        }
        const now = performance.now();
        if (now - lastHitSfxAt < 65) return;
        lastHitSfxAt = now;
        withAudio((ac) => {
          const t0 = ac.currentTime;
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(420, t0);
          osc.frequency.exponentialRampToValueAtTime(160, t0 + 0.04);
          gain.gain.setValueAtTime(0.04, t0);
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.045);
          osc.connect(gain);
          gain.connect(ac.destination);
          osc.start(t0);
          osc.stop(t0 + 0.05);
        });
      }

      function playExplode(big) {
        withAudio((ac) => {
          const t0 = ac.currentTime;
          const dur = big ? 0.45 : 0.22;
          const src = ac.createBufferSource();
          src.buffer = getNoiseBuffer(ac);
          const lp = ac.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.setValueAtTime(big ? 1400 : 1100, t0);
          lp.frequency.exponentialRampToValueAtTime(140, t0 + dur);
          const nGain = ac.createGain();
          nGain.gain.setValueAtTime(big ? 0.24 : 0.13, t0);
          nGain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
          src.connect(lp);
          lp.connect(nGain);
          nGain.connect(ac.destination);
          src.start(t0);
          src.stop(t0 + dur + 0.02);

          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(big ? 190 : 160, t0);
          osc.frequency.exponentialRampToValueAtTime(45, t0 + dur);
          gain.gain.setValueAtTime(big ? 0.18 : 0.09, t0);
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
          osc.connect(gain);
          gain.connect(ac.destination);
          osc.start(t0);
          osc.stop(t0 + dur + 0.02);
        });
      }

            const gain = ac.createGain();
            osc.type = theme.wave;
            osc.frequency.setValueAtTime(freq, t0 + delay);
            gain.gain.setValueAtTime(0.095, t0 + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, t0 + delay + 0.13);
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start(t0 + delay);
            osc.stop(t0 + delay + 0.14);
          });

      function currentBest() {

        if (mode === 'standard') {
          if (val > bestStandard) {
            bestStandard = val;

            return true;
          }

      function renderHud() {
        scoreEl.textContent = score;
        waveEl.textContent = wave;
        bestEl.textContent = currentBest();
        battleWave.hidden = Boolean(boss);
        const waveLabel = t('第 {w} 波', { w: wave });
        if (battleWave.textContent !== waveLabel) battleWave.textContent = waveLabel;

        armorEl.setAttribute('aria-label', t('剩余护甲：{hp}', { hp: player.hp }));
        armorEl.setAttribute('aria-valuemax', String(player.maxHp));
        armorEl.setAttribute('aria-valuenow', String(player.hp));
        const armorCount = t('护甲 {hp}/{max}', { hp: player.hp, max: player.maxHp });
        if (armorCountEl.textContent !== armorCount) armorCountEl.textContent = armorCount;
        if (armorEl.childElementCount !== player.maxHp) {
          armorEl.textContent = '';
          for (let i = 0; i < player.maxHp; i += 1) {
            const pip = document.createElement('span');
            pip.className = 'armor-pip' + (i >= player.hp ? ' lost' : '');
            armorEl.appendChild(pip);
          }
        } else {
          for (let i = 0; i < player.maxHp; i += 1) {
            armorEl.children[i].classList.toggle('lost', i >= player.hp);
          }
        }

        shieldBadge.hidden = !player.hasShield;
        weaponBadge.textContent = t('主炮 Lv.{lv}', { lv: player.weaponLv });
        blastBadge.hidden = player.blastAmmo === 0;
        if (player.blastAmmo > 0) {
          const label = t('爆破弹 ×{ammo}', { ammo: player.blastAmmo });
          if (blastBadge.textContent !== label) blastBadge.textContent = label;
        }

        overdriveBadge.classList.toggle('ending', player.overdriveTimer > 0 && player.overdriveTimer <= OVERDRIVE_END_CUE);
        if (player.overdriveTimer > 0) {
          overdriveBadge.hidden = false;
          const remaining = (Math.ceil(player.overdriveTimer * 10) / 10).toFixed(1);
          const label = t('免伤 {sec}s', { sec: remaining });
          if (overdriveBadge.textContent !== label) overdriveBadge.textContent = label;
          overdriveBadge.style.setProperty('--remaining', (100 * player.overdriveTimer / OVERDRIVE_SECONDS) + '%');
        } else {
          overdriveBadge.hidden = true;
        }

        if (boss) {
          bossBarWrap.hidden = false;
          const name = getBossName(boss.kind);
          if (bossNameEl.textContent !== name) bossNameEl.textContent = name;
          const pct = Math.max(0, Math.min(100, Math.round((boss.hp / boss.maxHp) * 100)));
          if (bossHpText.textContent !== pct + '%' || bossBarFill.style.width === '') {
            bossBarFill.style.width = pct + '%';
            bossHpText.textContent = pct + '%';
            bossBarTrack.setAttribute('aria-valuenow', String(pct));
          }
        } else {
          bossBarWrap.hidden = true;
        }

        if (boss) {
          const phase = String(boss.phase);
          if (bossBarWrap.dataset.phase !== phase) bossBarWrap.dataset.phase = phase;
          if (bossBarWrap.dataset.kind !== boss.kind) bossBarWrap.dataset.kind = boss.kind;
          let phaseLabel = t('阶段 {phase}/2', { phase: boss.phase });
          let cue = '';
          const attack = boss.prismAttack;
          if (boss.maneuver === 'transform') phaseLabel = t('相位转换 · 无敌');
          else if (boss.campCounter) phaseLabel = t('锁定预警 · 移动躲避');
          else if (boss.maneuver === 'reflect-warn') phaseLabel = t('镜面护甲展开中');
          else if (boss.maneuver === 'reflect') phaseLabel = t('镜面护甲 · 小心反弹');
          else if (attack?.step === 'sweep-warn' || attack?.step === 'warn') {
            phaseLabel = attack.step === 'warn' ? t('晶弹齐射预警') : attack.sweep.secondPass ? t('折返预警') : t('扫射预警');
            if (boss.prismMirror) {
              phaseLabel = t('{source} · {warning}', { source: attack.fromMirror ? t('镜像') : t('本体'), warning: phaseLabel });
            }
          } else if (boss.maneuver === 'mirror') phaseLabel = t('镜像交错火力');
          else if (boss.laserState === 'telegraph') {
            phaseLabel = boss.laserTimer > MOTHERSHIP_LASER_LOCK_SECONDS
              ? t('双轨激光 · 正在瞄准')
              : t('激光锁定 · 离开亮带');
            cue = 'dodge';
          } else if (boss.laserState === 'fire') {
            phaseLabel = t('双轨激光 · 避开光束');
            cue = 'dodge';
          } else if (boss.maneuver === 'dash-warn') {
            phaseLabel = boss.dashPass === 2 ? t('折返突进 · 横向躲避') : t('突进预警 · 横向躲避');
            cue = 'dodge';
          }
          else if (boss.maneuver === 'scatter-warn') phaseLabel = t('侧翼散射预警');
          else if (boss.maneuver === 'deploy') phaseLabel = t('部署供盾护卫');
          else if (boss.maneuver === 'recover') {
            if (boss.kind === 'crimson' && boss.guard) {
              phaseLabel = player.empCharges > 0 ? t('护卫挡弹 · 脉冲可破') : t('护卫挡弹 · 先击破护卫');
              cue = 'guard';
            } else {
              if (boss.kind === 'crimson') phaseLabel = t('反击窗口 · 瞄准本体');
              else if (boss.kind === 'mothership') phaseLabel = t('核心暴露 · 攻击母舰');
              else phaseLabel = t('核心暴露');
              cue = 'attack';
            }
          } else if (boss.supports?.length) {
            const jammed = boss.supportJam > 0;
            phaseLabel = jammed
              ? t('供盾中断 · 攻击母舰')
              : t('护卫供盾 {count}/2 · 先打护卫', { count: boss.supports.length });
            cue = jammed ? 'attack' : 'guard';
          } else if (bossIntroHint && boss.y < boss.targetY) {
            phaseLabel = bossIntroHint;
          }
          if (bossPhaseLabel.textContent !== phaseLabel) bossPhaseLabel.textContent = phaseLabel;
          if (bossPhaseLabel.dataset.cue !== cue) bossPhaseLabel.dataset.cue = cue;
          bossPhaseLabel.hidden = false;
        } else {
          if (bossBarWrap.dataset.phase) delete bossBarWrap.dataset.phase;
          if (bossBarWrap.dataset.kind) delete bossBarWrap.dataset.kind;
          bossPhaseLabel.hidden = true;
        }

        empCountEl.textContent = '×' + player.empCharges;
        empBtn.disabled = state !== 'playing' || player.empCharges <= 0 || empCooldown > 0 || boss?.maneuver === 'transform';

        pauseBtn.disabled = state !== 'playing' && state !== 'paused';
        pauseBtn.textContent = t(state === 'paused' ? '继续' : '暂停');
      }

      function renderBossSummary() {
        const clearedNames = Array.from(defeatedBosses, ([kind, count]) => {
          const name = getBossName(kind, false);
          return count > 1 ? `${name} ×${count}` : name;
        });
        bossClearsEl.textContent = clearedNames.length
          ? t('本局击破 Boss：{names}', { names: clearedNames.join(' · ') })
          : t('本局尚未击破 Boss');

        const tier = Math.ceil(wave / BOSS_WAVE_INTERVAL);
        const bossWave = tier * BOSS_WAVE_INTERVAL;
        const remaining = bossWave - wave;
        const target = { wave: bossWave, name: getBossName(getBossKind(tier), false), remaining };
        bossTargetEl.textContent = remaining > 0
          ? t('再过 {remaining} 波迎战{name}（第 {wave} 波）', target)
          : t('下次目标：第 {wave} 波 · {name}', target);
      }

      function renderOverlay() {
        const practicing = practiceTier > 0;
        const choosingPractice = practiceMenuOpen;
        gameWrap.toggleAttribute('data-practice', practicing);
        modePills.hidden = practicing;
        bestEl.parentElement.hidden = practicing;
        waveLabelEl.dataset.i18n = practicing ? '练习波次' : '当前波次';
        waveLabelEl.textContent = t(waveLabelEl.dataset.i18n);
        practiceMenu.hidden = !choosingPractice;
        practiceMenuBtn.hidden = practicing || choosingPractice || (state !== 'ready' && state !== 'over');
        practiceBackBtn.hidden = !choosingPractice && !(practicing && state === 'over');
        overlayBtn.hidden = choosingPractice;
        overlaySummary.hidden = state !== 'over' || practicing || choosingPractice;
        flightOptions.hidden = choosingPractice;
        restartBtn.disabled = choosingPractice;
        if (state === 'playing') {
          const moveFocus = overlay.contains(document.activeElement);
          flightOptions.open = false;
          overlay.classList.remove('show');
          if (moveFocus) pauseBtn.focus({ preventScroll: true });

        if (choosingPractice) {
          overlayTitle.textContent = t('Boss 练习');
          overlayDesc.textContent = t('标准难度 · 3 点护甲 · Lv.4 主炮 · 2 次脉冲');
          practiceBackBtn.textContent = state === 'over' ? t('返回结算') : t('返回开局');
          for (const choice of practiceChoices) {
            const tier = Number(choice.dataset.practiceTier);
            const kind = getBossKind(tier);
            const name = getBossName(kind, false);
            choice.disabled = !hasSeenBoss(kind);
            choice.textContent = choice.disabled
              ? t('{name} · 第 {wave} 波遇到后解锁', { name, wave: tier * BOSS_WAVE_INTERVAL })
              : name;
          }
        } else if (state === 'ready') {
          overlayTitle.textContent = t('太空战机');
          overlayDesc.textContent = t(mode === 'standard'
            ? '标准闯关：3 点护甲起步，升级主炮、释放脉冲清弹，每 5 波迎战星际 Boss！'
            : '王牌极速：初始 Lv.2 主炮、弹幕更密集、得分 1.5 倍加成，挑战极限操作！');
          overlayBtn.textContent = t('开始游戏');
        } else if (state === 'paused') {
          overlayTitle.textContent = t('已暂停');
          overlayDesc.textContent = t('当前得分：{score}', { score });
          overlayBtn.textContent = t('继续游戏');
        } else if (state === 'over' && practicing) {
          const kind = getBossKind(practiceTier);
          overlayTitle.textContent = defeatedBosses.has(kind) ? t('练习成功') : t('战机坠毁');
          overlayDesc.textContent = t('练习对象：{name} · 得分：{score}', { name: getBossName(kind, false), score });
          overlayBtn.textContent = t('重试');
          practiceBackBtn.textContent = t('返回选择');
        } else if (state === 'over') {
          overlayTitle.textContent = t('战机坠毁');
          const suffix = newBest ? t('（新纪录！）') : '';
          overlayDesc.textContent = t('本局得分：{score}（本模式最高：{best}）', {
            score,
            best: currentBest(),
          }) + suffix;
          overlayStats.textContent = t('击毁 {kills} 架 · 抵达第 {wave} 波 · 最高 {combo} 连击', {
            kills,
            wave,
            combo: maxCombo,
          });
          renderBossSummary();
          overlayBtn.textContent = t('再来一局');
        }
      }

      function syncModeButtons() {
        modeStandardBtn.classList.toggle('active', mode === 'standard');
        modeAceBtn.classList.toggle('active', mode === 'ace');
        skinBtns.forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.skin === skin);
        });
      }

      function scoutFormation(positions) {
        return positions.map((x, index) => ({ kind: 'scout', x, y: -24 - index * 15 }));
      }

      function openingWaveQueue(num) {
        const flight = (kind, lesson, x, y, side = 0) => ({ kind, lesson, x, y, side });
        let queue;
        if (num === 1) {
          queue = [
            { items: scoutFormation([W * 0.50, W * 0.34, W * 0.66]), delay: 1.38 },
            { items: scoutFormation([W * 0.23, W * 0.50, W * 0.77]), delay: 0 },
          ];
        } else if (num === 2) {
          queue = [
            { items: [flight('interceptor', 'aim', 138, -26), flight('interceptor', 'aim', 322, -82)], delay: 1.68 },
            { items: scoutFormation([95, 230, 365]), delay: 1.22 },
            { items: scoutFormation([155, 230, 305]), delay: 0 },
          ];
        } else if (num === 3) {
          queue = [
            { items: [flight('interceptor', 'flank', 54, -27, -1), flight('interceptor', 'flank', 406, -71, 1)], delay: 1.65 },
            { items: scoutFormation([145, 230, 315]), delay: 1.30 },
            { items: [flight('interceptor', 'flank', 406, -28, 1), flight('interceptor', 'flank', 54, -82, -1),
              ...scoutFormation([191, 269])], delay: 0 },
          ];
        } else {
          queue = [
            { items: [flight('gunship', 'spread', 230, -38), ...scoutFormation([77, 142, 383])], delay: 2.15 },
            { items: [flight('interceptor', 'aim', 108, -24), flight('interceptor', 'flank', 406, -65, 1),
              ...scoutFormation([171, 289])], delay: 1.63 },
            { items: [flight('gunship', 'spread', 178, -38), ...scoutFormation([88, 345])], delay: 0 },
          ];
        }
        if (mode === 'ace') {
          queue[queue.length - 1].delay = 0.82;
          queue.push({ items: scoutFormation([111, 349]), delay: 0 });
        }
        return queue;
      }

      function crossfireWaveQueue() {
        return [-1, 1, -1].flatMap((side, index) => {
          const fromFlank = (x) => side === -1 ? x : W - x;
          return [
            {
              items: [
                { kind: 'interceptor', lesson: 'aim', x: fromFlank(184), y: -26 },
                ...scoutFormation([fromFlank(112), fromFlank(66)]),
              ],
              delay: 1.45,
            },
            {
              items: [
                { kind: 'interceptor', lesson: 'flank', x: fromFlank(50), y: -28, side },
                ...scoutFormation([fromFlank(146)]),
              ],
              delay: index === 2 ? 0 : 1.62,
            },
          ];
        });
      }

      function gunshipEscortWaveQueue() {
        return [false, true].flatMap((mirrored) => {
          const lane = (x) => mirrored ? W - x : x;
          return [
            {
              items: [
                { kind: 'scout', x: lane(158), y: -48 },
                { kind: 'scout', x: lane(230), y: -82 },
              ],
              delay: 0.48,
            },
            {
              items: [{ kind: 'gunship', lesson: 'spread', x: lane(194), y: -38 }],
              delay: 1.2,
            },
            {
              items: [
                ...scoutFormation([52, 113, 313, 370, 414].map(lane)),
                { kind: 'interceptor', x: lane(274), y: -84 },
              ],
              delay: mirrored ? 0 : 2.05,
            },
          ];
        });
      }

      function buildWaveQueue(num) {
        if (num <= 4) return openingWaveQueue(num);
        if (mode === 'standard' && num === 7) return crossfireWaveQueue();
        if (mode === 'standard' && num === 9) return gunshipEscortWaveQueue();
        const queue = [];
        const baseCount = mode === 'ace' ? 7 : 5;
        let remaining = baseCount + Math.floor(num * 1.5);
        const fastRoll = () => Math.random();

        // 编队优先：双翼 V 字 / 横排 / 侧翼狙击 / 陨石带
        while (remaining > 0) {
          const r = fastRoll();
          if (remaining >= 5 && r < 0.34) {
            // 5 架 V 字编队
            const cx = 92 + Math.random() * (W - 184);
            const kind = num >= 3 && Math.random() < 0.45 ? 'interceptor' : 'scout';
            const batch = [];
            for (let k = -2; k <= 2; k += 1) {
              batch.push({
                kind,
                x: cx + k * 34,
                y: -26 - Math.abs(k) * 20,
              });
            }
            queue.push({ items: batch, delay: Math.max(0.75, 1.45 - num * 0.03) });
            remaining -= 5;
          } else if (remaining >= 3 && r < 0.62) {
            // 3 架横排/狙击编队
            const kind = num >= 4 && Math.random() < 0.48 ? 'drone' : 'interceptor';
            const cx = 96 + Math.random() * (W - 192);
            const batch = [
              { kind, x: cx - 54, y: -26 },
              { kind: num >= 3 && Math.random() < 0.35 ? 'gunship' : kind, x: cx, y: -38 },
              { kind, x: cx + 54, y: -26 },
            ];
            queue.push({ items: batch, delay: Math.max(0.8, 1.55 - num * 0.03) });
            remaining -= 3;
          } else if (remaining >= 3 && num >= 2 && r < 0.78) {
            // 陨石群穿插
            const batch = [];
            const rockStyles = ['boulder', 'shard'];
            for (let k = 0; k < 3; k += 1) {
              batch.push({
                kind: 'asteroid',
                rockStyle: rockStyles[k],
                x: 52 + ((W - 104) * (k + 0.2 + Math.random() * 0.6)) / 3,
                y: -24 - Math.random() * 34,
              });
            }
            queue.push({ items: batch, delay: 1.1 });
            remaining -= 3;
          } else {
            // 散兵/重型护卫组合
            let kind = 'scout';
            const roll = Math.random();
            if (num >= 4 && roll > 0.78) kind = 'drone';
            else if (num >= 3 && roll > 0.56) kind = 'gunship';
            else if (num >= 2 && roll > 0.38) kind = 'asteroid';
            else if (roll > 0.2) kind = 'interceptor';
            queue.push({
              items: [{ kind, x: null, y: null }],
              delay: Math.max(0.28, (mode === 'ace' ? 0.55 : 0.75) - num * 0.022),
            });
            remaining -= 1;
          }
        }
        return queue;
      }

      function normalWaveBanner(num) {
        if (num === 2) return t('第 2 波 · 躲避瞄准弹');
        if (num === 3) return t('第 3 波 · 留意侧翼拦截');
        if (num === 4) return t('第 4 波 · 从散射间隙穿过');
        if (mode === 'standard' && num === 7) return t('第 7 波 · 留意交叉夹击');
        if (mode === 'standard' && num === 9) return t('第 9 波 · 炮艇护送');
        return t('第 {w} 波', { w: num });
      }

      function startWave(num) {
        wave = num;
        bossIntroHint = wave === BOSS_WAVE_INTERVAL ? t('留意突进预警，向两侧躲避') : '';
        const nextScene = Math.floor((num - 1) / BOSS_WAVE_INTERVAL) % SPACE_SCENES.length;
        if (nextScene !== sceneIndex) {
          previousScene = sceneIndex;
          sceneIndex = nextScene;
          sceneBlend = 0;
        }
        if (wave % BOSS_WAVE_INTERVAL === 0) {
          spawnQueue = [];
          waveSpawnTimer = 0;
          bossSupplyTimer = 9.5;
          bossAlertAlpha = 1;
          spawnBoss(wave / BOSS_WAVE_INTERVAL);
          if (!practiceTier) recordBossEncounter(boss.kind);
          waveBanner = t('⚠ 第 {w} 波 · {name}', { w: wave, name: boss.name });
          waveBannerTimer = 2.6;
          playBossAlert();
        } else {
          spawnQueue = buildWaveQueue(wave);
          waveSpawnTimer = 0.22;
          bossSupplyTimer = 0;
          waveBanner = normalWaveBanner(wave);
          waveBannerTimer = 1.5;
          if (wave === 4) spawnPickup('blast', W * 0.5, H * 0.42);
        }
      }

      function resetState(nextState) {
        state = nextState;
        score = 0;
        wave = 1;
        sceneIndex = 0;
        previousScene = 0;
        sceneBlend = 1;
        backgroundTime = 0;
        meteors = [];
        meteorTimer = 3.5;
        newBest = false;
        kills = 0;
        defeatedBosses.clear();
        combo = 0;
        comboTimer = 0;
        maxCombo = 0;

        player.x = W * 0.5;
        player.y = H - 72;
        player.prevX = player.x;
        player.bank = 0;
        player.hp = 3;
        player.maxHp = 3;
        player.weaponLv = practiceTier ? 4 : mode === 'ace' ? 2 : 1;
        player.hasShield = false;
        player.empCharges = 2;
        player.invulnTimer = 0;
        player.overdriveTimer = 0;
        player.fireCd = 0;
        player.blastAmmo = 0;
        player.blastCd = 0;

        boss = null;
        bullets = [];
        enemyBullets = [];
        enemies = [];
        pickups = [];
        pickupCue = null;
        particles = [];
        debris = [];
        muzzleFlashes = [];
        afterimages = [];
        afterimageCd = 0;
        shockwaves = [];
        floatTexts = [];
        empWave = null;
        empCooldown = 0;
        shakeTimer = 0;
        flashAlpha = 0;
        bossAlertAlpha = 0;
        bossIntroHint = '';
        bossSupplyTimer = 0;
        activeTouchId = null;
        touchLastPt = null;
        mouseTarget = null;
        clearKeys();

        if (nextState === 'playing') {
          startWave(practiceTier ? practiceTier * BOSS_WAVE_INTERVAL : 1);
        } else {
          spawnQueue = [];
          waveBanner = '';
          waveBannerTimer = 0;
        }

        renderHud();
        renderOverlay();
      }

      function startGame() {
        if (practiceMenuOpen) return;
        resetState('playing');
      }

      function openPracticeMenu() {
        if (state !== 'ready' && state !== 'over') return;
        practiceMenuOpen = true;
        if (practiceTier) {
          practiceTier = 0;
          mode = campaignMode;
          syncModeButtons();
          resetState('ready');
        } else {
          renderOverlay();
        }
        (practiceChoices.find((choice) => !choice.disabled) || practiceBackBtn).focus();
      }

      function startPractice(tier) {
        const kind = BOSS_KINDS[tier - 1];
        if (!practiceMenuOpen || !kind || !hasSeenBoss(kind)) return;
        practiceMenuOpen = false;
        practiceTier = tier;
        mode = 'standard';
        startGame();
      }

      function endGame() {
        if (state === 'over') return;
        state = 'over';
        newBest = !practiceTier && updateBest(score);
        activeTouchId = null;
        touchLastPt = null;
        mouseTarget = null;
        clearKeys();
        renderHud();
        renderOverlay();
      }

      function pauseGame() {
        if (state !== 'playing') return;
        state = 'paused';
        activeTouchId = null;
        touchLastPt = null;
        mouseTarget = null;
        clearKeys();
        renderHud();
        renderOverlay();
      }

      function resumeGame() {
        if (state !== 'paused') return;
        state = 'playing';
        renderHud();
        renderOverlay();
      }

      function pauseForInterruption() {
        interruptionCount += 1;
        pauseGame();
      }

      function bindImmersiveLayout() {
        const options = document.getElementById('flight-options-content');
        const controls = [
          modeStandardBtn.parentElement, soundBtn, helpBtn, restartBtn,
          skinBtns[0].parentElement, document.querySelector('.space-legend'),
        ].map((control) => {
          const anchor = document.createComment('flight option');
          control.before(anchor);
          return { control, anchor };
        });
        let immersive = false;
        GameKit.bindMobileLayout('space', document.getElementById('immersive-btn'), pauseForInterruption, {
          portraitOnly: true,
          onRender(active) {
            if (active === immersive) return;
            immersive = active;
            for (const { control, anchor } of controls) {
              if (active) options.appendChild(control);
              else anchor.after(control);
            }
          },
        });
      }

      async function confirmAbandonIfActive(switchingMode = false) {
        if (SiteData.isDialogOpen()) return false;
        if (state !== 'playing' && state !== 'paused') return true;

        const wasPlaying = state === 'playing';
        const previousInterruptions = interruptionCount;
        pauseGame();
        const confirmed = await SiteData.confirmDialog({
          title: switchingMode ? t('切换模式') : t('重开本局'),
          message: switchingMode ? t('切换模式会结束当前飞行。') : t('当前进度将被清除，确定重开吗？'),
          confirmText: switchingMode ? t('切换') : t('重开'),
          cancelText: wasPlaying ? t('继续本局') : t('取消'),
          danger: true,
        });
        if (!confirmed && wasPlaying && !document.hidden && interruptionCount === previousInterruptions) {
          resumeGame();
        }
        return confirmed;
      }

      // 特效辅助
      function pushParticle(p) {
        if (particles.length >= MAX_PARTICLES) particles.shift();
        particles.push(p);
      }

      function addFloatText(x, y, text, color, scale) {
        floatTexts.push({
          x: Math.max(48, Math.min(W - 48, x)),
          y: Math.max(36, Math.min(H - 36, y)),
          text,
          color: color || '#fde047',
          scale: scale || 1,
          life: 0.75,
          maxLife: 0.75,
        });
      }

      function triggerShake(mag, time) {
        shakeMag = Math.max(shakeMag, mag);
        shakeTimer = Math.max(shakeTimer, time);
      }

      function spawnExplosion(x, y, color, count, radius, debrisCount, blast = false) {
        const life = blast ? 0.50 : 0.30;
        shockwaves.push({
          x,
          y,
          r: 8,
          maxR: radius || 46,
          color,
          life,
          maxLife: life,
          blast,
        });
        for (let i = 0; i < count; i += 1) {
          const a = Math.random() * Math.PI * 2;
          const spd = 55 + Math.random() * 195;
          pushParticle({
            x,
            y,
            vx: Math.cos(a) * spd,
            vy: Math.sin(a) * spd,
            r: 1.8 + Math.random() * 3.4,
            color: i % 3 === 0 ? '#ffffff' : color,
            life: 0.28 + Math.random() * 0.28,
            maxLife: 0.56,
          });
        }
        const shards = debrisCount == null ? Math.min(8, Math.max(3, Math.floor(count / 4))) : debrisCount;
        for (let i = 0; i < shards; i += 1) {
          const a = Math.random() * Math.PI * 2;
          const spd = 65 + Math.random() * 155;
          debris.push({
            x,
            y,
            vx: Math.cos(a) * spd,
            vy: Math.sin(a) * spd,
            w: 4 + Math.random() * 6,
            h: 2.5 + Math.random() * 3.5,
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 14,
            color: i % 2 === 0 ? color : '#cbd5e1',
            life: 0.45 + Math.random() * 0.3,
            maxLife: 0.75,
          });
        }
      }

      function addScore(basePts) {
        const modeMult = mode === 'ace' ? 1.5 : 1;
        const comboMult = combo >= 12 ? 1.5 : (combo >= 6 ? 1.25 : 1);
        const pts = Math.round(basePts * modeMult * comboMult);
        score += pts;
        return pts;
      }

      // 敌机与 Boss 生成
      function createAsteroidPolygon(r, rockStyle) {
        const pts = [];
        const shard = rockStyle === 'shard';
        const n = shard ? 6 : 9;
        for (let i = 0; i < n; i += 1) {
          const a = (Math.PI * 2 * i) / n - Math.PI / 2;
          const dist = r * (0.75 + Math.random() * 0.25);
          pts.push({ x: Math.cos(a) * dist * (shard ? 0.72 : 1), y: Math.sin(a) * dist });
        }
        return pts;
      }

      function fastRockOverlaps(rock, fromX, fromY, toX, toY, padding, dt = 0) {
        const angle = rock.rot + rock.vRot * dt * 0.5;
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        const rx = rock.r * 0.72 + padding;
        const ry = rock.r + padding;
        const margin = rock.r + 10;
        const nextX = Math.max(margin, Math.min(W - margin, rock.x + rock.vx * dt));
        const x1 = fromX - rock.x;
        const y1 = fromY - rock.y;
        const x2 = toX - nextX;
        const y2 = toY - rock.y - rock.vy * dt;
        const x = (x1 * cos + y1 * sin) / rx;
        const y = (-x1 * sin + y1 * cos) / ry;
        const dx = (x2 * cos + y2 * sin) / rx - x;
        const dy = (-x2 * sin + y2 * cos) / ry - y;
        const lengthSquared = dx * dx + dy * dy;
        const at = lengthSquared ? Math.max(0, Math.min(1, -(x * dx + y * dy) / lengthSquared)) : 0;
        return (x + dx * at) ** 2 + (y + dy * at) ** 2 <= 1;
      }

      function spawnEnemyAt(spec) {
        const kind = (spec && spec.kind) || 'scout';
        const aceBoost = mode === 'ace' ? 1 : 0;
        const hpScale = 1 + Math.floor((wave - 1) / 3) * 0.42 + aceBoost * 0.25;
        const fireScale = Math.max(0.56, 1 - wave * 0.032 - aceBoost * 0.14);

        if (kind === 'scout') {
          const hp = Math.max(1, Math.round(1.0 * hpScale));
          enemies.push({
            kind,
            x: spec.x != null ? Math.max(28, Math.min(W - 28, spec.x)) : 34 + Math.random() * (W - 68),
            y: spec.y != null ? spec.y : -26,
            vx: spec.x != null ? 0 : (Math.random() - 0.5) * 58,
            vy: 138 + wave * 5.5 + aceBoost * 22,
            r: 15,
            hp,
            maxHp: hp,
            pts: 18,
            fireCd: (wave >= 4 ? (0.9 + Math.random() * 0.9) : (1.5 + Math.random() * 1.1)) * fireScale,
            hitFlash: 0,
            phase: Math.random() * Math.PI * 2,
          });
        } else if (kind === 'interceptor') {
          const hp = Math.round(2.4 * hpScale);
          enemies.push({
            kind,
            x: spec.x != null ? Math.max(36, Math.min(W - 36, spec.x)) : 44 + Math.random() * (W - 88),
            y: spec.y != null ? spec.y : -30,
            vx: 0,
            vy: 96 + wave * 4 + aceBoost * 16,
            r: 18,
            hp,
            maxHp: hp,
            pts: 32,
            fireCd: spec.lesson ? 0.44 : (0.65 + Math.random() * 0.65) * fireScale,
            lesson: spec.lesson,
            entryX: spec.x,
            entrySide: spec.side,
            lockTimer: 0,
            lockAngle: Math.PI * 0.5,
            hitFlash: 0,
            phase: Math.random() * Math.PI * 2,
          });
        } else if (kind === 'drone') {
          const hp = Math.round(3 * hpScale);
          enemies.push({
            kind,
            x: spec.x != null ? Math.max(34, Math.min(W - 34, spec.x)) : 40 + Math.random() * (W - 80),
            y: spec.y != null ? spec.y : -30,
            targetY: 85 + Math.random() * 95,
            vx: (Math.random() < 0.5 ? -1 : 1) * (42 + wave * 2),
            vy: 112 + wave * 3,
            r: 16,
            hp,
            maxHp: hp,
            pts: 45,
            fireCd: (1.05 + Math.random() * 0.45) * fireScale,
            lockTimer: 0,
            lockAngle: Math.PI * 0.5,
            hitFlash: 0,
            phase: Math.random() * Math.PI * 2,
          });
        } else if (kind === 'gunship') {
          const hp = Math.round(5.5 * hpScale);
          enemies.push({
            kind,
            x: spec.x != null ? Math.max(46, Math.min(W - 46, spec.x)) : 56 + Math.random() * (W - 112),
            y: spec.y != null ? spec.y : -38,
            vx: spec.lesson ? 0 : (Math.random() < 0.5 ? -1 : 1) * (32 + wave * 1.5),
            vy: 56 + wave * 2.5,
            r: 25,
            hp,
            maxHp: hp,
            pts: 70,
            fireCd: spec.lesson ? 0.18 : (0.95 + Math.random() * 0.5) * fireScale,
            lesson: spec.lesson,
            lockTimer: 0,
            hitFlash: 0,
            phase: Math.random() * Math.PI * 2,
          });
        } else {
          const rockStyle = spec.rockStyle || (Math.random() < 0.50 ? 'boulder' : 'shard');
          const fast = rockStyle === 'shard';
          const r = fast ? 12 + Math.random() * 5 : 24 + Math.random() * 5;
          const pace = Math.min(54, wave * 3);
          const hp = Math.round(3.8 * hpScale);
          enemies.push({
            kind: 'asteroid',
            x: spec.x != null ? Math.max(r + 14, Math.min(W - r - 14, spec.x)) : 40 + Math.random() * (W - 80),
            y: spec.y != null ? spec.y : -r - 12,
            vx: (Math.random() - 0.5) * (fast ? 108 : 42),
            vy: (fast ? 158 : 75) + Math.random() * (fast ? 31 : 24) + pace,
            r,
            hp,
            maxHp: hp,
            pts: 40,
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * (fast ? 2.6 : 1.15),
            rockStyle,
            poly: createAsteroidPolygon(r, rockStyle),
            fireCd: 99,
            hitFlash: 0,
          });
        }
      }

      function getBossKind(tier) {
        return BOSS_KINDS[(tier - 1) % BOSS_KINDS.length];
      }

      function getBossName(kind, showRole = true) {
        const name = kind === 'crimson' ? t('绯红裁决者')
          : kind === 'prism' ? t('苍蓝棱镜') : t('紫曜母舰');
        return showRole ? t('{name} BOSS', { name }) : name;
      }

      function openingEnemyShots(enemy) {
        const down = Math.PI * 0.5;
        if (enemy.lesson === 'aim') return [{ x: 0, y: 12, angle: enemy.lockAngle }];
        if (enemy.lesson === 'flank') return [-7, 7].map((x) => ({ x, y: 13, angle: down }));
        const spreads = mode === 'ace' ? [-0.40, -0.20, 0, 0.20, 0.40] : [-0.30, 0, 0.30];
        return spreads.map((spread) => ({ x: 0, y: 18, angle: down + spread }));
      }

      function updateOpeningEnemyAttack(enemy, dt) {
        const spread = enemy.lesson === 'spread';
        if (enemy.lockTimer > 0) {
          enemy.lockTimer = Math.max(0, enemy.lockTimer - dt);
          if (enemy.lockTimer > 0) return;
          const speed = spread ? 205 : enemy.lesson === 'aim' ? 218 : 228;
          for (const shot of openingEnemyShots(enemy)) {
            enemyBullets.push({ x: enemy.x + shot.x, y: enemy.y + shot.y,
              vx: Math.cos(shot.angle) * speed, vy: Math.sin(shot.angle) * speed,
              r: spread ? 5.5 : 4.5, color: spread ? '#fbbf24' : '#6ee7b7' });
          }
          enemy.fireCd = spread ? (mode === 'ace' ? 1.55 : 1.9) : 2.05;
          return;
        }

        const minY = enemy.lesson === 'flank' ? 150 : spread ? 61 : 55;
        if (enemy.y < minY || enemy.y > H - 180) return;
        enemy.fireCd -= dt;
        if (enemy.fireCd > 0) return;
        enemy.lockAngle = Math.atan2(player.y - enemy.y - 12, player.x - enemy.x);
        enemy.lockTimer = spread ? (mode === 'ace' ? 0.45 : 0.64) : enemy.lesson === 'aim' ? 0.52 : 0.36;
      }

      function computeBossLasers(b) {
        const down = Math.PI * 0.5;
        return [
          { x: b.x - 46, y: b.y + 20, angle: down },
          { x: b.x + 46, y: b.y + 20, angle: down },
        ];
      }

      function spawnBoss(tier) {
        const kind = getBossKind(tier);
        const hpBase = kind === 'mothership' ? 115 : (kind === 'prism' ? 100 : 90);
        const hp = Math.round((hpBase + tier * 60) * BOSS_HP_SCALE * (mode === 'ace' ? 1.25 : 1));
        boss = {
          tier,
          kind,
          name: getBossName(kind),
          x: W * 0.5,
          y: -92,
          targetY: 98,
          vx: (110 + Math.min(tier * 13, 56)) * (kind === 'mothership' ? 0.85 : 1) * (mode === 'ace' ? 1.14 : 1),
          r: kind === 'mothership' ? 50 : 46,
          hp,
          maxHp: hp,
          pts: 450 + tier * 160,
          hitFlash: 0,
          patternTimer: mode === 'ace' ? 0.38 : 0.52,
          patternIndex: 0,
          phase: 1,
          maneuver: 'patrol',
          maneuverTimer: kind === 'crimson' ? 0.24 : 0,
          prismAttack: null,
          sweepDirection: 1,
          dashX: W * 0.5,
          dashPass: 1,
          guard: null,
          laserState: 'idle', // 'idle' | 'telegraph' | 'fire'
          laserTimer: 0,
          lasers: [],
          laserWidth: 16,
        };
        if (kind === 'mothership') {
          boss.lasers = computeBossLasers(boss);
          boss.supports = [];
          boss.supportJam = 0;
          boss.supportCooldown = 0;
        }
      }

      function damageBoss(amount, flash) {
        if (boss.maneuver === 'transform') return false;
        const links = mothershipShieldLinks();
        let damageScale = 1;
        if (boss.kind === 'mothership') {
          damageScale = links === 2 ? 0.22 : links === 1 ? 0.58 : 1;
        } else if (boss.maneuver !== 'recover') {
          damageScale = boss.phase === 2 ? 0.45 : 0.64;
        }
        const nextHp = boss.hp - amount * damageScale;
        if (boss.phase === 1 && nextHp <= boss.maxHp / 2) {
          if (boss.prismReflect) endPrismReflection();
          boss.hp = boss.maxHp / 2;
          boss.hitFlash = 0;
          boss.maneuver = 'transform';
          boss.maneuverTimer = 1;
          boss.prismAttack = null;
          boss.campSpot = null;
          boss.campCounter = null;
          boss.guard = null;
          boss.laserState = 'idle';
          enemyBullets = [];
          playBossAlert();
          renderHud();
        } else {
          boss.hp = nextHp;
          boss.hitFlash = flash;
          if (boss.hp <= 0) defeatBoss();
        }
        return true;
      }

      function setBossManeuver(next, duration) {
        boss.maneuver = next;
        boss.maneuverTimer = duration;
      }

      function patrolBoss(dt) {
        boss.x += boss.vx * dt;
        if (boss.x < boss.r + 22) {
          boss.x = boss.r + 22;
          boss.vx = Math.abs(boss.vx);
        } else if (boss.x > W - boss.r - 22) {
          boss.x = W - boss.r - 22;
          boss.vx = -Math.abs(boss.vx);
        }
      }

      function updateBossCampCounter(dt) {
        if (boss.maneuver === 'transform' || boss.y < boss.targetY) return false;

        const counter = boss.campCounter;
        if (counter) {
          counter.remaining -= dt;
          if (counter.remaining <= 0) {
            const angle = Math.atan2(counter.targetY - counter.y, counter.targetX - counter.x);
            enemyBullets.push({ x: counter.x, y: counter.y, vx: Math.cos(angle) * 360,
              vy: Math.sin(angle) * 360, r: 7, color: '#fbbf24' });
            boss.campCounter = null;
            boss.campSpot = null;
            playBossLaserFire();
          }
          return true;
        }

        const spot = boss.campSpot;
        if (!spot || (player.x - spot.x) ** 2 + (player.y - spot.y) ** 2 > BOSS_CAMP_RADIUS ** 2) {
          boss.campSpot = { x: player.x, y: player.y, elapsed: 0 };
          return false;
        }
        spot.elapsed += dt;
        const betweenAttacks = boss.maneuver === 'patrol' || boss.maneuver === 'reposition'
          || (boss.maneuver === 'mirror' && !boss.prismAttack);
        if (spot.elapsed < BOSS_CAMP_SECONDS || !betweenAttacks) return false;

        boss.campCounter = {
          x: boss.x, y: boss.y, targetX: player.x, targetY: player.y, remaining: BOSS_COUNTER_WARNING,
        };
        playBossLaserCharge();
        return true;
      }

      function mothershipShieldLinks() {
        return boss.supports && boss.supportJam === 0
          ? boss.supports.filter((craft) => craft.age >= MOTHERSHIP_DEPLOY_SECONDS).length
          : 0;
      }

      function deployMothershipSupports() {
        const hp = (mode === 'ace' ? 19 : 15) + Math.floor((boss.tier - 3) / 3) * 2;
        for (const side of [-1, 1]) {
          if (boss.supports.some((craft) => craft.side === side)) continue;
          boss.supports.push({
            side,
            x: boss.x + side * 34,
            y: boss.y + 22,
            hp,
            maxHp: hp,
            age: 0,
            flash: 0,
            fireCd: side > 0 ? 1.05 : 0.70,
            dodgeTimer: 0,
            dodgeCooldown: 0,
            dodgeDirection: 0,
          });
        }
        boss.laserState = 'idle';
        setBossManeuver('deploy', MOTHERSHIP_DEPLOY_SECONDS);
        playBossLaserCharge();
      }

      function updateMothershipSupports(dt) {
        for (const craft of boss.supports) {
          craft.age += dt;
          craft.flash = Math.max(0, craft.flash - dt);
          const progress = Math.min(1, craft.age / MOTHERSHIP_DEPLOY_SECONDS);
          craft.dodgeTimer = Math.max(0, craft.dodgeTimer - dt);
          craft.dodgeCooldown = Math.max(0, craft.dodgeCooldown - dt);
          if (progress === 1 && craft.dodgeCooldown === 0) {
            for (const bullet of bullets) {
              const ahead = bullet.y - craft.y;
              if (ahead < 20 || ahead > 108 || bullet.vy >= 0) continue;
              const crossingX = bullet.x + bullet.vx * ahead / -bullet.vy;
              if (Math.abs(crossingX - craft.x) > 22) continue;
              const away = crossingX < craft.x ? 1 : -1;
              const target = craft.x + away * 32;
              craft.dodgeDirection = target < 26 || target > W - 26 ? -away : away;
              craft.dodgeTimer = MOTHERSHIP_DODGE_SECONDS;
              craft.dodgeCooldown = mode === 'ace' ? 1.05 : 1.35;
              break;
            }
          }
          const dodge = Math.sin(Math.PI * craft.dodgeTimer / MOTHERSHIP_DODGE_SECONDS) * craft.dodgeDirection * 32;
          const weave = Math.sin(craft.age * 3.8 + (craft.side > 0 ? 1.4 : 0)) * 18 * progress;
          const offset = 34 + (72 + weave) * progress;
          craft.x = Math.max(26, Math.min(W - 26, boss.x + craft.side * offset + dodge));
          craft.y = boss.y + 22 + (64 + Math.cos(craft.age * 3.1 + craft.side) * 12) * progress;
          craft.fireCd = Math.max(0, craft.fireCd - dt);
          if (craft.fireCd === 0 && state === 'playing') {
            const angle = Math.atan2(player.y - craft.y - 10, player.x - craft.x);
            const speed = 255 + Math.min(boss.tier * 8, 72);
            enemyBullets.push({
              x: craft.x,
              y: craft.y + 10,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              r: 5,
              color: '#f0abfc',
            });
            craft.fireCd = mode === 'ace' ? 1.15 : 1.45;
          }
        }
      }

      function bulletCrossesCircle(bullet, previousX, previousY, x, y, radius) {
        const dx = bullet.x - previousX;
        const dy = bullet.y - previousY;
        const lengthSquared = dx * dx + dy * dy;
        const along = lengthSquared > 0 ? ((x - previousX) * dx + (y - previousY) * dy) / lengthSquared : 0;
        const at = Math.max(0, Math.min(1, along));
        return (x - previousX - dx * at) ** 2 + (y - previousY - dy * at) ** 2 <= radius ** 2;
      }

      function ellipseImpactTime(x, y, previousX, previousY, centerX, centerY, rx, ry) {
        // Normalize the hitbox to a unit circle and solve for the first point of contact.
        const startX = (previousX - centerX) / rx;
        const startY = (previousY - centerY) / ry;
        const outside = startX * startX + startY * startY - 1;
        if (outside <= 0) return 0;
        const dx = (x - previousX) / rx;
        const dy = (y - previousY) / ry;
        const lengthSquared = dx * dx + dy * dy;
        const dot = startX * dx + startY * dy;
        const discriminant = dot * dot - lengthSquared * outside;
        if (dot >= 0 || discriminant < 0) return null;
        const impact = (-dot - Math.sqrt(discriminant)) / lengthSquared;
        return impact <= 1 ? impact : null;
      }

      function hitMothershipSupport(bullet, previousX, previousY) {
        const supports = boss?.supports;
        if (!supports?.length) return false;
        for (let i = 0; i < supports.length; i += 1) {
          const craft = supports[i];
          if (!bulletCrossesCircle(bullet, previousX, previousY, craft.x, craft.y, 16 + bullet.r)) continue;
          if (!bullet.explosive) damageMothershipSupport(i, bullet.dmg, bullet);
          return true;
        }
        return false;
      }

      function damageMothershipSupport(index, amount, bullet) {
        const supports = boss.supports;
        const craft = supports[index];
        craft.hp -= amount;
        craft.flash = 0.1;
        playHit(bullet?.heavy, true, bullet?.style);
        if (craft.hp > 0) return;
        spawnExplosion(craft.x, craft.y, '#c084fc', 15, 28, 4);
        playExplode(false);
        supports.splice(index, 1);
        boss.supportCooldown = mode === 'ace' ? 2.0 : 2.8;
        if (!supports.length) {
          boss.laserState = 'idle';
          setBossManeuver('recover', mode === 'ace' ? 0.85 : 1.15);
        }
      }

      function updateMothership(dt) {
        boss.supportJam = Math.max(0, boss.supportJam - dt);
        boss.supportCooldown = Math.max(0, boss.supportCooldown - dt);
        boss.maneuverTimer = Math.max(0, boss.maneuverTimer - dt);

        if (boss.maneuver === 'transform') {
          boss.y = Math.min(boss.targetY, boss.y + BOSS_ENTRY_SPEED * dt);
          if (boss.maneuverTimer === 0) {
            boss.phase = 2;
            deployMothershipSupports();
          }
        } else if (boss.maneuver === 'deploy' || boss.maneuver === 'recover') {
          if (boss.maneuverTimer === 0) {
            boss.patternTimer = 0.36;
            setBossManeuver('patrol', 0);
          }
        } else if (boss.y < boss.targetY) {
          boss.y = Math.min(boss.targetY, boss.y + BOSS_ENTRY_SPEED * dt);
        } else if (boss.laserState === 'idle') {
          if (boss.phase === 2 && boss.supports.length < 2 && boss.supportCooldown === 0) {
            deployMothershipSupports();
          } else {
            patrolBoss(dt);
            boss.patternTimer -= dt;
            if (boss.patternTimer <= 0) attackWithMothership();
          }
        } else {
          updateMothershipLaser(dt);
        }
        updateMothershipSupports(dt);
      }

      function attackWithMothership() {
        boss.patternIndex = (boss.patternIndex + 1) % 3;
        if (boss.patternIndex === 0) {
          const speed = 225 + Math.min(boss.tier * 12, 95);
          for (let offset = -5; offset <= 5; offset += 1) {
            const angle = Math.PI * (0.5 + 0.07 * offset);
            enemyBullets.push({ x: boss.x, y: boss.y + 26, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, r: 6.5, color: '#c084fc' });
          }
          boss.patternTimer = mode === 'ace' ? 0.72 : 0.95;
        } else if (boss.patternIndex === 1) {
          for (const offset of [-52, 0, 52]) {
            const x = boss.x + offset;
            const y = boss.y + 20;
            const angle = Math.atan2(player.y - y, player.x - x);
            enemyBullets.push({ x, y, vx: Math.cos(angle) * 275, vy: Math.sin(angle) * 275, r: 5.5, color: '#e879f9' });
          }
          boss.patternTimer = mode === 'ace' ? 0.78 : 1.02;
        } else {
          boss.laserState = 'telegraph';
          boss.laserTimer = mode === 'ace' ? 0.66 : 0.78;
          boss.laserWidth = 14;
          const target = player.x + (player.x >= boss.x ? -46 : 46);
          boss.laserTargetX = Math.max(94, Math.min(W - 94, target));
          boss.lasers = computeBossLasers(boss);
          boss.patternTimer = mode === 'ace' ? 0.42 : 0.57;
          playBossLaserCharge();
        }
      }

      function updateMothershipLaser(dt) {
        boss.laserTimer -= dt;
        if (boss.laserState === 'telegraph') {
          if (boss.laserTimer > MOTHERSHIP_LASER_LOCK_SECONDS) {
            boss.x += (boss.laserTargetX - boss.x) * Math.min(1, dt * 9);
            boss.lasers = computeBossLasers(boss);
          }
          if (boss.laserTimer <= 0) {
            boss.laserState = 'fire';
            boss.laserTimer = 0.92;
            triggerShake(6, 0.22);
            playBossLaserFire();
          }
        } else {
          if (boss.lasers.some((beam) => beamHitsPlayer(beam, boss.laserWidth))) damagePlayer();
          if (boss.laserTimer <= 0) boss.laserState = 'idle';
        }
      }

      function crimsonDashEnd() {
        return boss.phase === 2 ? H - 82 : H - 108;
      }

      function alignCrimsonDash() {
        boss.dashX = Math.max(boss.r + 22, Math.min(W - boss.r - 22, player.x));
        setBossManeuver('dash-align', boss.phase === 2 ? 0.19 : 0.29);
      }

      function fireCrimsonScatter() {
        const speed = (mode === 'ace' ? 325 : 285) + Math.min(35, boss.tier * 5);
        for (const side of [-1, 1]) {
          for (const spread of CRIMSON_SCATTER_ANGLES) {
            const angle = Math.PI * 0.5 - side * spread;
            enemyBullets.push({ x: boss.x + side * 31, y: boss.y + 21,
              vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, r: 5, color: '#fb923c' });
          }
        }
        playBossLaserFire();
      }

      function updateCrimsonBoss(dt) {
        if (boss.maneuver === 'patrol' && boss.y < boss.targetY) {
          boss.y = Math.min(boss.targetY, boss.y + BOSS_ENTRY_SPEED * dt);
          return;
        }

        const ace = mode === 'ace';
        const enraged = boss.phase === 2;
        const before = boss.maneuverTimer;
        boss.maneuverTimer = Math.max(0, before - dt);
        if (boss.guard) updateCrimsonGuard(dt);

        switch (boss.maneuver) {
          case 'transform':
            boss.y += (boss.targetY - boss.y) * Math.min(1, dt * 6);
            if (boss.maneuverTimer === 0) {
              boss.y = boss.targetY;
              boss.phase = 2;
              boss.dashPass = 1;
              alignCrimsonDash();
            }
            break;
          case 'patrol':
            patrolBoss(dt);
            if (boss.maneuverTimer === 0) alignCrimsonDash();
            break;
          case 'recover':
            if (boss.maneuverTimer === 0) {
              boss.guard = null;
              setBossManeuver('scatter-warn', ace ? 0.48 : 0.60);
              playBossLaserCharge();
            }
            break;
          case 'scatter-warn':
            if (boss.maneuverTimer === 0) {
              fireCrimsonScatter();
              boss.dashPass = 1;
              setBossManeuver('patrol', ace ? 0.40 : 0.56);
            }
            break;
          case 'dash-align':
            boss.x += (boss.dashX - boss.x) * Math.min(1, dt / before);
            if (boss.maneuverTimer === 0) {
              setBossManeuver('dash-warn', enraged ? (ace ? 0.46 : 0.55) : (ace ? 0.55 : 0.68));
              playBossLaserCharge();
            }
            break;
          case 'dash-warn':
            if (boss.maneuverTimer === 0) {
              setBossManeuver('dash', enraged ? (ace ? 0.30 : 0.36) : (ace ? 0.35 : 0.42));
              playBossLaserFire();
            }
            break;
          case 'dash':
            boss.y += (crimsonDashEnd() - boss.y) * Math.min(1, dt / before);
            if (boss.maneuverTimer === 0) {
              if (enraged && boss.dashPass === 1) setBossManeuver('dash-pause', 0.15);
              else setBossManeuver('dash-retreat', enraged ? 0.48 : 0.58);
            }
            break;
          case 'dash-pause':
            if (boss.maneuverTimer === 0) setBossManeuver('dash-retreat', 0.40);
            break;
          case 'dash-retreat':
            boss.y += (boss.targetY - boss.y) * Math.min(1, dt / before);
            if (boss.maneuverTimer === 0) {
              if (enraged && boss.dashPass === 1) {
                boss.dashPass = 2;
                alignCrimsonDash();
              } else {
                if (enraged) spawnCrimsonGuard();
                setBossManeuver('recover', enraged ? (ace ? 0.95 : 1.2) : 1.04);
              }
            }
            break;
        }
      }

      function spawnCrimsonGuard() {
        const side = boss.x < W * 0.5 ? 1 : -1;
        const hp = (mode === 'ace' ? 13 : 10) + Math.floor(boss.tier / 3);
        boss.guard = { x: boss.x + side * 36, y: boss.y + 8, hp, maxHp: hp, flash: 0, side, age: 0 };
      }

      function updateCrimsonGuard(dt) {
        const guard = boss.guard;
        guard.age += dt;
        guard.flash = Math.max(0, guard.flash - dt);
        const opening = Math.min(1, guard.age / 0.34);
        const leaving = Math.max(0, 1 - boss.maneuverTimer / 0.22);
        const flight = Math.max(1 - opening, leaving);
        guard.x = boss.x + guard.side * (36 * flight + 23 * Math.sin(Math.PI * flight));
        guard.y = boss.y + CRIMSON_GUARD_OFFSET + (8 - CRIMSON_GUARD_OFFSET) * flight;
      }

      function hitCrimsonGuard(bullet, previousX, previousY) {
        const guard = boss?.guard;
        if (!guard) return false;
        const y = guard.y;
        if (bullet.y > y + 12 + bullet.r || previousY < y - 12 - bullet.r) return false;
        const distance = previousY - bullet.y;
        const travel = distance > 0 ? Math.min(1, Math.max(0, (previousY - y) / distance)) : 0;
        const x = previousX + (bullet.x - previousX) * travel;
        if (Math.abs(x - guard.x) > CRIMSON_GUARD_HALF_WIDTH + bullet.r) return false;
        if (!bullet.explosive) damageCrimsonGuard(bullet.dmg, bullet);
        return true;
      }

      function damageCrimsonGuard(amount, bullet) {
        const guard = boss.guard;
        guard.hp -= amount;
        guard.flash = 0.10;
        playHit(bullet?.heavy, true, bullet?.style);
        if (guard.hp <= 0) destroyCrimsonGuard();
      }

      function destroyCrimsonGuard() {
        spawnExplosion(boss.guard.x, boss.guard.y, '#fb923c', 12, 27, 3);
        playExplode(false);
        boss.guard = null;
      }

      function firePrismFan(source, second) {
        const spacing = Math.PI / 14;
        const count = (mode === 'ace' ? 9 : 7) - (source === boss ? 0 : 2);
        const speed = 235 + Math.min(boss.tier * 12, 95) + (second ? 42 : 0);
        for (let i = 0; i < count; i += 1) {
          const angle = Math.PI * 0.5 + (i - (count - 1) / 2 + (second ? 0.5 : 0)) * spacing;
          enemyBullets.push({ x: source.x + (second ? 22 : -22), y: source.y + 24,
            vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, r: 5,
            color: source === boss ? '#38bdf8' : '#e9a5ff' });
        }
      }

      function startPrismReflection() {
        boss.prismReflect = {
          panels: Array(PRISM_REFLECT_PANELS).fill(0),
          cooldown: 0,
          bolts: 0,
        };
        setBossManeuver('reflect-warn', PRISM_REFLECT_WARNING);
        playPrismReflectCue(false);
      }

      function endPrismReflection() {
        boss.prismReflect = null;
        spawnExplosion(boss.x, boss.y, '#c4b5fd', 16, 94, 8);
        playPrismReflectCue(true);
        setBossManeuver('recover', mode === 'ace' ? 1.05 : 1.30);
      }

      function reflectPrismBolt(bullet, previousX, previousY) {
        if (boss?.maneuver !== 'reflect') return false;
        const radius = PRISM_REFLECT_RADIUS + bullet.r;
        const impact = ellipseImpactTime(bullet.x, bullet.y, previousX, previousY, boss.x, boss.y,
          radius, radius * PRISM_REFLECT_ASPECT);
        if (impact === null) return false;
        const x = previousX + (bullet.x - previousX) * impact;
        const y = previousY + (bullet.y - previousY) * impact;
        const dx = x - boss.x;
        const dy = (y - boss.y) / PRISM_REFLECT_ASPECT;

        const shield = boss.prismReflect;
        const sector = Math.round(Math.atan2(dy, dx) / (2 * Math.PI) * PRISM_REFLECT_PANELS);
        shield.panels[(sector + PRISM_REFLECT_PANELS) % PRISM_REFLECT_PANELS] = 0.17;
        if (shield.cooldown > 0 || shield.bolts >= PRISM_REFLECT_MAX_BOLTS) return false;
        shield.cooldown = PRISM_REFLECT_INTERVAL;
        shield.bolts += 1;
        const vx = Math.max(-150, Math.min(150, -bullet.vx * 0.6 + dx * 1.9));
        enemyBullets.push({
          x, y, vx, vy: mode === 'ace' ? 315 : 280, r: 5.5, reflected: true,
        });
        pushParticle({ x, y, vx: vx * 0.3, vy: 92,
          r: 3.8, color: '#fce7a4', life: 0.20, maxLife: 0.20 });
        return true;
      }

      function startPrismMirror() {
        const side = player.x < W * 0.5 ? -1 : 1;
        const hp = (mode === 'ace' ? 270 : 235) + Math.min(45, (boss.tier - 2) * 3);
        boss.prismMirror = {
          side,
          x: W * 0.5 + side * 128,
          y: boss.y - 30,
          r: boss.r,
          hp,
          maxHp: hp,
          age: 0,
          hitFlash: 0,
          attackIndex: 0,
          attackDelay: 0.58,
          nextFromMirror: false,
        };
        setBossManeuver('mirror', 0);
        playBossAlert();
      }

      function destroyPrismMirror() {
        const { x, y } = boss.prismMirror;
        if (boss.prismAttack?.fromMirror) boss.prismAttack = null;
        boss.prismMirror = null;
        spawnExplosion(x, y, '#e9a5ff', 17, 62, 7);
        playExplode(false);
        if (boss.prismAttack) setBossManeuver('attack', 0);
        else prismRetreat();
      }

      function hitPrismMirror(bullet, previousX, previousY) {
        const mirror = boss?.prismMirror;
        if (!mirror || mirror.age < PRISM_MIRROR_DEPLOY_SECONDS) return false;
        if (!bulletCrossesCircle(bullet, previousX, previousY, mirror.x, mirror.y, mirror.r + bullet.r)) return false;
        if (!bullet.explosive) damagePrismMirror(bullet.dmg, bullet);
        return true;
      }

      function damagePrismMirror(amount, bullet) {
        const mirror = boss.prismMirror;
        if (mirror.hitFlash < 0.04) playHit(bullet?.heavy, false, bullet?.style);
        mirror.hp -= amount;
        mirror.hitFlash = 0.09;
        if (mirror.hp <= 0) destroyPrismMirror();
      }

      function updatePrismMirror(dt) {
        const mirror = boss.prismMirror;
        const attack = boss.prismAttack;
        mirror.age += dt;
        mirror.hitFlash = Math.max(0, mirror.hitFlash - dt);
        // Keep each warning fixed to its source until that ship finishes attacking.
        if (!attack?.fromMirror) {
          const target = W * 0.5 + mirror.side * 128 + Math.sin(mirror.age * 3.2) * 23;
          mirror.x += Math.sign(target - mirror.x) * Math.min(Math.abs(target - mirror.x), 230 * dt);
          mirror.y = 150 + Math.cos(mirror.age * 4) * 9;
        }
        if (!attack || attack.fromMirror) {
          const target = W * 0.5 - mirror.side * 94 + Math.sin(mirror.age * 2.4) * 21;
          boss.x += Math.sign(target - boss.x) * Math.min(Math.abs(target - boss.x), 230 * dt);
        }
        if (attack) {
          if (updatePrismAttack(dt)) {
            boss.prismAttack = null;
            mirror.nextFromMirror = !attack.fromMirror;
            if (attack.fromMirror) mirror.attackIndex = (mirror.attackIndex + 1) % PRISM_MIRROR_ATTACKS.length;
            mirror.attackDelay = mode === 'ace' ? 0.15 : 0.20;
          }
        } else {
          mirror.attackDelay = Math.max(0, mirror.attackDelay - dt);
          if (mirror.attackDelay === 0) {
            startPrismAttack(PRISM_MIRROR_ATTACKS[mirror.attackIndex], mirror.nextFromMirror);
          }
        }
      }

      function setPrismAttackStep(attack, step, duration) {
        attack.step = step;
        attack.remaining = duration;
      }

      function startPrismSweep(attack, secondPass = false) {
        const direction = boss.sweepDirection;
        const arc = boss.phase === 2 ? 0.47 : 0.53;
        attack.sweep = {
          from: Math.PI * 0.5 - direction * arc,
          to: Math.PI * 0.5 + direction * arc,
          duration: mode === 'ace' ? 0.84 : 1.00,
          width: attack.fromMirror ? PRISM_MIRROR_BEAM_WIDTH : PRISM_BEAM_WIDTH,
          secondPass,
        };
        boss.sweepDirection = -direction;
        setPrismAttackStep(attack, 'sweep-warn', secondPass ? (mode === 'ace' ? 0.51 : 0.60) : (mode === 'ace' ? 0.62 : 0.74));
        playBossLaserCharge();
      }

      function startPrismAttack(kind, fromMirror = false) {
        const attack = { kind, fromMirror };
        boss.prismAttack = attack;
        if (kind === 'fan') {
          firePrismFan(fromMirror ? boss.prismMirror : boss, false);
          setPrismAttackStep(attack, 'fan', mode === 'ace' ? 0.23 : 0.30);
        } else if (kind === 'sweep') {
          startPrismSweep(attack);
        } else {
          setPrismAttackStep(attack, 'warn', mode === 'ace' ? 0.50 : 0.64);
          playBossLaserCharge();
        }
      }

      function startPrismSoloAttack(kind) {
        setBossManeuver('attack', 0);
        startPrismAttack(kind);
      }

      function prismBeam(attack, source) {
        const { from, to, duration } = attack.sweep;
        const progress = attack.step === 'sweep-fire' ? 1 - attack.remaining / duration : 0;
        return { x: source.x, y: source.y + 6, angle: from + (to - from) * progress };
      }

      function updatePrismAttack(dt) {
        const attack = boss.prismAttack;
        const source = attack.fromMirror ? boss.prismMirror : boss;
        const before = attack.remaining;
        attack.remaining = Math.max(0, before - dt);
        const finished = attack.remaining === 0;
        switch (attack.step) {
          case 'fan':
            if (finished) firePrismFan(source, true);
            return finished;
          case 'sweep-warn':
            if (finished) {
              setPrismAttackStep(attack, 'sweep-fire', attack.sweep.duration);
              playBossLaserFire();
            }
            break;
          case 'sweep-fire':
            if (beamHitsPlayer(prismBeam(attack, source), attack.sweep.width)) {
              damagePlayer();
              if (state === 'over') return false;
            }
            if (finished) {
              if (boss.phase === 1 || attack.sweep.secondPass) return true;
              startPrismSweep(attack, true);
            }
            break;
          case 'warn':
            if (finished) {
              playBossLaserFire();
              setPrismAttackStep(attack, 'barrage', 0.30);
            }
            break;
          case 'barrage': {
            const color = attack.fromMirror ? '#e9a5ff' : '#67e8f9';
            for (const beat of [0.30, 0.20, 0.10]) {
              if (before < beat || attack.remaining >= beat) continue;
              for (const offset of [-20, 0, 20]) {
