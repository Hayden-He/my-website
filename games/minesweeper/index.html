<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="小游乐场" />
  <meta property="og:locale" content="zh_CN" />
  <meta property="og:title" content="经典扫雷 · Little Playground" />
  <meta property="og:description" content="经典扫雷：首击必安全、支持数字快捷排雷与三档难度，支持电脑与手机。" />
  <meta property="og:url" content="https://my-website-all.pages.dev/games/minesweeper/" />
  <meta property="og:image" content="https://my-website-all.pages.dev/assets/og-image.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="小游乐场 · Little Playground：12 款即开即玩的小游戏" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="经典扫雷 · Little Playground" />
  <meta name="twitter:description" content="经典扫雷：首击必安全、支持数字快捷排雷与三档难度，支持电脑与手机。" />
  <meta name="twitter:image" content="https://my-website-all.pages.dev/assets/og-image.jpg" />
  <meta name="twitter:image:alt" content="小游乐场 · Little Playground：12 款即开即玩的小游戏" />
  <meta name="author" content="Hayden-He" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="小游乐场" />
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/style.css" />
  <link rel="stylesheet" href="/assets/game-shell.css" />
  <link rel="stylesheet" href="./modules/minesweeper.css" />
</head>
<body>
  <!-- inline-icons:start -->
  <!-- inline-icons:end -->
  <header class="game-topbar">
    <div class="container game-topbar-inner">
      <a class="back-link" href="/" data-i18n="← 返回大厅">← 返回大厅</a>
      <h1 class="game-topbar-title">
        <svg class="title-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><use href="#game-minesweeper"></use></svg>
        <span data-i18n="经典扫雷">经典扫雷</span>
      </h1>
      <div class="game-topbar-actions">
        <a class="game-topbar-cat" href="/categories/puzzle" data-i18n="益智休闲">益智休闲</a>
        <button class="lang-btn theme-btn" type="button" data-theme-toggle aria-label="主题：跟随系统" title="主题：跟随系统"><svg class="theme-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#theme-system"></use></svg></button>
        <button class="lang-btn" type="button" data-lang-toggle>EN</button>
      </div>
    </div>
  </header>

  <main class="game-wrap">
    <div class="hud">
      <div class="hud-box">
        <div class="hud-label" data-i18n="剩余地雷">剩余地雷</div>
        <div id="mines-el" class="hud-value">10</div>
      </div>
      <div class="hud-box">
        <div class="hud-label" data-i18n="当前用时">当前用时</div>
        <div id="time-el" class="hud-value" style="color: var(--primary);">0s</div>
      </div>
      <div class="hud-box">
        <div class="hud-label" data-i18n="最佳用时">最佳用时</div>
        <div id="best-el" class="hud-value" style="color: var(--accent-text);">--</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="mode-pills" role="group" aria-label="难度选择" data-i18n-attr="aria-label:难度选择">
        <button class="mode-pill active" type="button" data-diff="easy">9×9</button>
        <button class="mode-pill" type="button" data-diff="medium">12×12</button>
        <button class="mode-pill" type="button" data-diff="hard">16×16</button>
      </div>
      <div class="btn-group">
        <button id="help-btn" class="btn-small secondary" type="button" title="查看玩法" data-i18n="玩法" data-i18n-attr="title:查看玩法">玩法</button>
        <button id="hint-btn" class="btn-small secondary" type="button" disabled>提示 (2)</button>
        <button id="tool-btn" class="btn-small secondary" type="button">模式: 翻开</button>
        <button id="sound-btn" class="btn-small secondary" type="button">音效: 开</button>
        <button id="restart-btn" class="btn-small" type="button" data-i18n="重开">重开</button>
      </div>
    </div>

    <p id="mine-streak" class="hint-text mine-streak" aria-live="polite"></p>

    <div class="board-wrap">
      <div class="mine-grid-scroll">
        <div id="mine-grid" class="mine-grid"></div>
      </div>
      <div id="overlay" class="overlay" role="status" aria-live="polite">
        <h2 id="overlay-title">排雷成功！🎉</h2>
        <p id="overlay-desc">用时：0s</p>
        <div class="overlay-actions">
          <button id="view-board-btn" class="overlay-btn secondary" type="button" data-i18n="查看棋盘">查看棋盘</button>
          <button id="overlay-btn" class="overlay-btn" type="button" data-i18n="再来一局">再来一局</button>
        </div>
      </div>
    </div>

    <p class="hint-text" data-i18n="点击翻开，右键或长按在插旗与 ? 间切换；按 F 切模式、H 安全提示、R 重开。">点击翻开，右键或长按在插旗与 ? 间切换；按 F 切模式、H 安全提示、R 重开。</p>

    <div id="more-games" class="more-games" data-more-games="minesweeper"></div>
  </main>

  <script src="/assets/site-data.js"></script>
  <script src="/assets/i18n.js"></script>
  <script src="/assets/games.js"></script>
  <script src="/assets/game-kit.js"></script>
  <script src="/assets/game-rules.js"></script>
  <script type="module" src="./modules/main.js"></script>
</body>
</html>
