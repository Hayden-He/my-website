<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>页面未找到 - 小游乐场</title>
  <meta name="robots" content="noindex" />
  <meta name="author" content="Hayden-He" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg?v=20261118001" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="小游乐场" />
  <script src="/assets/theme.js?v=20261118001"></script>
  <link rel="stylesheet" href="/assets/style.css?v=20261118001" />
  <style>
    .not-found-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }

    .not-found-card {
      width: 100%;
      max-width: 540px;
      text-align: center;
      background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 32px;
      box-shadow: var(--shadow-sm);
    }

    :root[data-theme="dark"] .not-found-card {
      background: var(--hero-bg);
    }

    .not-found-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: var(--primary-soft);
      font-size: 2.1rem;
      margin-bottom: 16px;
    }

    .not-found-code {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .not-found-title {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }

    .not-found-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .not-found-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .not-found-actions .play-btn {
      width: auto;
      min-width: 150px;
      padding: 11px 22px;
    }

    .secondary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .secondary-btn:hover {
      background: var(--surface-muted);
      border-color: var(--border-strong);
    }

    @media (max-width: 600px) {
      .not-found-wrap {
        padding: 28px 20px;
      }

      .not-found-card {
        padding: 32px 22px;
      }

      .not-found-title {
        font-size: 1.35rem;
      }

      .not-found-actions .play-btn,
      .not-found-actions .secondary-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <!-- inline-icons:start -->
  <!-- inline-icons:end -->
  <header id="site-header" class="site-header"></header>

  <main class="container not-found-wrap">
    <section class="not-found-card" aria-labelledby="not-found-heading">
      <div class="not-found-icon" aria-hidden="true">
        <svg class="not-found-mark" viewBox="0 0 40 40" focusable="false"><use href="#brand"></use></svg>
      </div>
      <div><span class="not-found-code">404</span></div>
      <h1 id="not-found-heading" class="not-found-title" data-i18n="这关还没解锁">这关还没解锁</h1>
      <p class="not-found-desc" data-i18n="你似乎走到了地图边缘，不如回到大厅挑一局新游戏。">你似乎走到了地图边缘，不如回到大厅挑一局新游戏。</p>
      <div class="not-found-actions">
        <a href="/" class="play-btn" data-i18n="返回全部游戏">返回全部游戏</a>
        <a href="/games/basketball/" class="secondary-btn">
          <svg class="btn-inline-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><use href="#game-basketball"></use></svg>
          <span data-i18n="来一局投篮">来一局投篮</span>
        </a>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="/assets/site-data.js?v=20261118001"></script>
  <script src="/assets/i18n.js?v=20261118001"></script>
  <script src="/assets/games.js?v=20261118001"></script>
  <script src="/assets/app.js?v=20261118001"></script>
  <script>initSitePage('');</script>
</body>
</html>
