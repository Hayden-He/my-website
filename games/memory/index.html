  <style>
    .game-wrap { --game-width: 460px; }
    .game-wrap.wide { --game-width: 520px; }

    .hud { grid-template-columns: repeat(3, 1fr); }
    .toolbar .mode-pills { flex-wrap: wrap; }

    .memory-stage {
      position: relative;
      width: 100%;
    }

    .memory-board {
      --cols: 4;
      display: grid;
      grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
      gap: 8px;
      width: 100%;
      padding: 12px;
      border-radius: 16px;
      background: var(--track);
      box-shadow: var(--shadow-md);
      user-select: none;
      -webkit-user-select: none;
    }

    .memory-card {
      position: relative;
      aspect-ratio: 1 / 1;
      border: none;
      padding: 0;
      background: transparent;
      border-radius: 12px;
      cursor: pointer;
      perspective: 700px;
      -webkit-perspective: 700px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .memory-card:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }

    .memory-card-inner {
      position: absolute;
      inset: 0;
      display: block;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .memory-card.flipped .memory-card-inner,
    .memory-card.peeking .memory-card-inner,
    .memory-card.matched .memory-card-inner {
      transform: rotateY(180deg);
    }

    .memory-icon {
      display: block;
      width: 58%;
      height: 58%;
    }

    .memory-face {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
    }

    .memory-back {
      background:
        radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.22), transparent 58%),
        linear-gradient(135deg, #2563eb, #3b82f6);
      color: #fff;
      font-size: 1.35rem;
      font-weight: 800;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16);
    }

    .memory-back::after {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px dashed rgba(255, 255, 255, 0.28);
      border-radius: 8px;
      pointer-events: none;
    }

    .memory-front {
      background: var(--surface);
      border: 1px solid var(--border);
      transform: rotateY(180deg);
      font-size: clamp(1.35rem, 5.2vw, 2rem);
    }

    .memory-card.matched .memory-front {
      background: #f0fdf4;
      border-color: #4ade80;
      animation: match-pop 0.28s ease-out;
    }

    .memory-card.matched {
      cursor: default;
      opacity: 0.92;
    }

    .memory-card.mismatch .memory-front {
      background: #fff1f2;
      border-color: #fb7185;
      animation: mismatch-shake 0.3s ease-in-out;
    }

    .memory-status { width: 100%; min-height: 1.4rem; }
    .memory-status.combo-hot { color: var(--primary); font-weight: 700; }

    .memory-board[data-mode="4"] { --cols: 4; }
    .memory-board[data-mode="5"] { --cols: 5; }
    .memory-board[data-mode="6"] { --cols: 6; }

    @keyframes match-pop {
      0% { transform: rotateY(180deg) scale(0.92); }
      60% { transform: rotateY(180deg) scale(1.04); }
      100% { transform: rotateY(180deg) scale(1); }
    }

    @keyframes mismatch-shake {
      0%, 100% { transform: rotateY(180deg) translateX(0); }
      25% { transform: rotateY(180deg) translateX(-4px); }
      75% { transform: rotateY(180deg) translateX(4px); }
    }

    :root[data-theme="dark"] .memory-card.matched .memory-front {
      background: rgba(34, 197, 94, 0.18);
      border-color: #22c55e;
    }

    :root[data-theme="dark"] .memory-card.mismatch .memory-front {
      background: rgba(244, 63, 94, 0.22);
      border-color: #fb7185;
    }

    @media (max-width: 440px) {
      .memory-board[data-mode="6"] {
        --cols: 4;
        gap: 6px;
        padding: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .memory-card.matched .memory-front,
      .memory-card.mismatch .memory-front {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <!-- inline-icons:start -->
  <!-- inline-icons:end -->
  <header class="game-topbar">
    <div class="container game-topbar-inner">
      <a class="back-link" href="/" data-i18n="← 返回大厅">← 返回大厅</a>
      <h1 class="game-topbar-title">
        <svg class="title-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><use href="#game-memory"></use></svg>
        <span data-i18n="记忆翻牌">记忆翻牌</span>
      </h1>
      <div class="game-topbar-actions">
        <a class="game-topbar-cat" href="/categories/puzzle" data-i18n="益智休闲">益智休闲</a>
        <button class="lang-btn theme-btn" type="button" data-theme-toggle aria-label="主题：跟随系统" title="主题：跟随系统"><svg class="theme-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#theme-system"></use></svg></button>
        <button class="lang-btn" type="button" data-lang-toggle>EN</button>
      </div>
    </div>
  </header>

  <main class="game-wrap">
    <div class="hud">
      <div class="hud-box">
        <div class="hud-label" data-i18n="尝试次数">尝试次数</div>
        <div id="moves-el" class="hud-value">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label" data-i18n="用时">用时</div>
        <div id="time-el" class="hud-value" style="color: var(--primary);">0s</div>
      </div>
      <div class="hud-box">
        <div class="hud-label" data-i18n="最少尝试">最少尝试</div>
        <div id="best-el" class="hud-value" style="color: var(--accent-text);">--</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="mode-pills" role="group" aria-label="牌桌尺寸" data-i18n-attr="aria-label:牌桌尺寸">
        <button id="mode-4" class="mode-pill active" data-memory-mode="4" data-i18n="4×4 轻松">4×4 轻松</button>
        <button id="mode-5" class="mode-pill" data-memory-mode="5" data-i18n="5×4 标准">5×4 标准</button>
        <button id="mode-6" class="mode-pill" data-memory-mode="6" data-i18n="6×4 挑战">6×4 挑战</button>
      </div>
      <div class="btn-group">
        <button id="help-btn" class="btn-small secondary" type="button" title="查看玩法" data-i18n="玩法" data-i18n-attr="title:查看玩法">玩法</button>
        <button id="preview-btn" class="btn-small secondary" data-i18n="预览牌面">预览牌面</button>
        <button id="sound-btn" class="btn-small secondary">音效: 开</button>
        <button id="restart-btn" class="btn-small" data-i18n="重开">重开</button>
      </div>
    </div>

    <p id="memory-status" class="hint-text memory-status" role="status"></p>
    <div class="memory-stage">
      <div id="memory-board" class="memory-board" aria-label="记忆翻牌牌桌" data-i18n-attr="aria-label:记忆翻牌牌桌"></div>
      <div id="overlay" class="overlay" role="status" aria-live="polite">
        <h2 id="overlay-title" data-i18n="全部配对！🎉">全部配对！🎉</h2>
        <p id="overlay-desc"></p>
        <div class="overlay-actions">
          <button id="overlay-btn" class="overlay-btn" data-i18n="再来一局">再来一局</button>
        </div>
      </div>
    </div>

    <p class="hint-text" data-i18n="翻两张算一次尝试；按 P 预览、R 重开，方向键移动选牌。">翻两张算一次尝试；按 P 预览、R 重开，方向键移动选牌。</p>

    <div id="more-games" class="more-games"></div>
  </main>

  <script src="/assets/site-data.js"></script>
  <script src="/assets/i18n.js"></script>
  <script src="/assets/games.js"></script>
  <script src="/assets/game-kit.js"></script>
  <script src="/assets/game-rules.js"></script>
  <script>
    (function () {
      const t = (key, params) => (window.I18N ? I18N.t(key, params) : key);
      const BEST_PREFIX = 'game_best_memory_';
      const BEST_COMBO_KEY = 'game_best_memory_combo';
      const MODE_KEY = 'game_mode_memory';
      const ICONS = [
        { id: 'apple', name: '苹果' },
        { id: 'orange', name: '橙子' },
        { id: 'lemon', name: '柠檬' },
        { id: 'grape', name: '葡萄' },
        { id: 'watermelon', name: '西瓜' },
        { id: 'strawberry', name: '草莓' },
        { id: 'cherry', name: '樱桃' },
        { id: 'kiwi', name: '猕猴桃' },
        { id: 'peach', name: '桃子' },
        { id: 'coconut', name: '椰子' },
        { id: 'pineapple', name: '菠萝' },
        { id: 'pear', name: '梨子' },
      ];
      const MODES = {
        4: { cols: 4, pairs: 8, label: '4×4 轻松' },
        5: { cols: 5, pairs: 10, label: '5×4 标准' },
        6: { cols: 6, pairs: 12, label: '6×4 挑战' },
      };

      const wrapEl = document.querySelector('.game-wrap');
      const boardEl = document.getElementById('memory-board');
      const movesEl = document.getElementById('moves-el');
      const timeEl = document.getElementById('time-el');
      const bestEl = document.getElementById('best-el');
      const soundBtn = document.getElementById('sound-btn');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');
      const previewBtn = document.getElementById('preview-btn');
      const statusEl = document.getElementById('memory-status');
      const modeBtns = document.querySelectorAll('[data-memory-mode]');

      let mode = 4;
      try {
        const saved = Number(localStorage.getItem(MODE_KEY));
        if (MODES[saved]) mode = saved;
      } catch {}

      let soundEnabled = window.SiteData ? SiteData.getSound() : true;
      GameKit.bindSoundButton(soundBtn, soundEnabled, (on) => {
        soundEnabled = on;
      });

      let deck = [];
      let first = null;
      let second = null;
      let moves = 0;
      let matches = 0;
      let combo = 0;
      let maxCombo = 0;
      let started = false;
      let ended = false;
      let lock = false;
      let mismatchTimer = null;
      let mismatchPair = null;
      let previewUsed = false;
      let previewing = false;
      let previewTimer = null;
      let previewRemain = 0;
      let elapsed = 0;
      let timerId = null;
      let dialogOpen = false;
      let newRecord = false;
      let gameId = 0;

      function bestKey(size) {
        return BEST_PREFIX + size + (previewUsed ? '_preview' : '');
      }

      function readBest(size) {
        return GameKit.readBest(bestKey(size));
      }

      function playTone(freq, duration, slideTo) {
        if (!soundEnabled || !window.SiteData) return;
        SiteData.withAudio((ac) => {
          try {
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.frequency.setValueAtTime(freq, ac.currentTime);
            if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime + duration);
            gain.gain.setValueAtTime(0.06, ac.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start();
            osc.stop(ac.currentTime + duration);
          } catch {}
        });
      }

      function playComboChime(streak) {
        if (!soundEnabled || !window.SiteData) return;
        const base = 580 + Math.min(streak, 6) * 55;
        SiteData.withAudio((ac) => {
          try {
            [base, base + 180].forEach((freq, i) => {
              const osc = ac.createOscillator();
              const gain = ac.createGain();
              const start = ac.currentTime + i * 0.055;
              osc.type = 'sine';
              osc.frequency.value = freq;
              gain.gain.setValueAtTime(0.065, start);
              gain.gain.exponentialRampToValueAtTime(0.001, start + 0.11);
              osc.connect(gain);
              gain.connect(ac.destination);
              osc.start(start);
              osc.stop(start + 0.12);
            });
          } catch {}
        });
      }

      function playVictoryFanfare() {
        if (!soundEnabled || !window.SiteData) return;
        SiteData.withAudio((ac) => {
          try {
            [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
              const osc = ac.createOscillator();
              const gain = ac.createGain();
              const start = ac.currentTime + i * 0.07;
              osc.type = 'triangle';
              osc.frequency.value = freq;
              gain.gain.setValueAtTime(0.001, start);
              gain.gain.linearRampToValueAtTime(0.07, start + 0.015);
              gain.gain.exponentialRampToValueAtTime(0.001, start + 0.22);
              osc.connect(gain);
              gain.connect(ac.destination);
              osc.start(start);
              osc.stop(start + 0.23);
            });
          } catch {}
        });
      }

      function updateHud() {
        movesEl.textContent = moves;
        timeEl.textContent = elapsed + 's';
        const best = readBest(mode);
        bestEl.textContent = best > 0 ? best + t(' 次') : '--';
        previewBtn.disabled = started || previewUsed;
        const pairs = MODES[mode].pairs;
        statusEl.classList.toggle('combo-hot', !previewing && !lock && combo >= 2);
        if (previewing) {
          statusEl.textContent = t('记住牌面（{sec}s）...', { sec: previewRemain });
        } else if (lock) {
          statusEl.textContent = t('这两张牌不同，点下一张可立即继续。');
        } else if (started && combo >= 2) {
          statusEl.textContent = t('已配对 {matches}/{pairs} · 连击 ×{combo}', { matches, pairs, combo });
        } else if (started) {
          statusEl.textContent = t('已配对 {matches}/{pairs}', { matches, pairs });
        } else if (previewUsed) {
          statusEl.textContent = t('本局使用了预览，纪录单独计算。');
        } else {
          statusEl.textContent = '';
        }
      }

      function stopTimer() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
      }

      function startTimer() {
        if (timerId) return;
        timerId = setInterval(() => {
          if (!started || ended || document.hidden || dialogOpen) return;
          elapsed += 1;
          timeEl.textContent = elapsed + 's';
        }, 1000);
      }

      function buildDeck(size) {
        return GameRules.buildMemoryDeck(ICONS, MODES[size].pairs);
      }

      function renderBoard() {
        boardEl.innerHTML = '';
        boardEl.dataset.mode = String(mode);
        if (wrapEl) wrapEl.classList.toggle('wide', mode === 6);
        deck.forEach((card, index) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'memory-card';
          btn.dataset.index = String(index);
          btn.dataset.icon = card.icon;
          btn.dataset.name = card.name;
          btn.setAttribute('aria-label', t('未翻开的牌'));

          const inner = document.createElement('span');
          inner.className = 'memory-card-inner';

          const back = document.createElement('span');
          back.className = 'memory-face memory-back';
          back.setAttribute('aria-hidden', 'true');
          back.textContent = '?';

          const front = document.createElement('span');
          front.className = 'memory-face memory-front';
          front.setAttribute('aria-hidden', 'true');
          const frontIcon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          frontIcon.setAttribute('class', 'memory-icon');
          frontIcon.setAttribute('viewBox', '0 0 32 32');
          frontIcon.setAttribute('aria-hidden', 'true');
          const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
          use.setAttribute('href', '#mem-' + card.icon);
          frontIcon.appendChild(use);
          front.appendChild(frontIcon);

          inner.appendChild(back);
          inner.appendChild(front);
          btn.appendChild(inner);
          boardEl.appendChild(btn);
        });
      }

      function setCardBack(card) {
        card.classList.remove('flipped', 'matched', 'mismatch');
        card.setAttribute('aria-label', t('未翻开的牌'));
      }

      function clearMismatchPending() {
        if (mismatchTimer) {
          clearTimeout(mismatchTimer);
          mismatchTimer = null;
        }
        if (mismatchPair) {
          setCardBack(mismatchPair[0]);
          setCardBack(mismatchPair[1]);
          mismatchPair = null;
        }
        lock = false;
      }

      function initGame() {
        gameId += 1;
        stopTimer();
        clearMismatchPending();
        if (previewTimer) {
          clearInterval(previewTimer);
          previewTimer = null;
        }
        previewRemain = 0;
        modeBtns.forEach((btn) => {
          const active = Number(btn.dataset.memoryMode) === mode;
          btn.classList.toggle('active', active);
          btn.setAttribute('aria-pressed', String(active));
        });
        deck = buildDeck(mode);
        first = null;
        second = null;
        moves = 0;
        matches = 0;
        combo = 0;
        maxCombo = 0;
        started = false;
        ended = false;
        previewUsed = false;
        previewing = false;
        elapsed = 0;
        newRecord = false;
        overlay.classList.remove('show');
        renderBoard();
        updateHud();
      }

      function refreshCardAria() {
        boardEl.querySelectorAll('.memory-card').forEach((card) => {
          if (card.classList.contains('matched')) {
            card.setAttribute('aria-label', t('已配对，{icon}', { icon: t(card.dataset.name) }));
          } else if (card.classList.contains('flipped') || card.classList.contains('peeking')) {
            card.setAttribute('aria-label', t('已翻开，{icon}', { icon: t(card.dataset.name) }));
          } else {
            card.setAttribute('aria-label', t('未翻开的牌'));
          }
        });
      }

      function previewCards() {
        if (started || previewUsed || previewing || ended) return;
        previewUsed = true;
        previewing = true;
        previewRemain = 2;
        const currentGame = gameId;
        const cards = boardEl.querySelectorAll('.memory-card');
        cards.forEach((card) => card.classList.add('peeking'));
        refreshCardAria();
        updateHud();
        previewTimer = setInterval(() => {
          if (currentGame !== gameId) {
            clearInterval(previewTimer);
            previewTimer = null;
            return;
          }
          previewRemain -= 1;
          if (previewRemain <= 0) {
            clearInterval(previewTimer);
            previewTimer = null;
            previewing = false;
            cards.forEach((card) => card.classList.remove('peeking'));
            refreshCardAria();
          }
          updateHud();
        }, 1000);
      }

      function formatFinishDesc() {
        const pairs = MODES[mode].pairs;
        const accuracy = moves > 0 ? Math.round((pairs / moves) * 100) : 100;
        const best = readBest(mode);
        return (newRecord ? t('新纪录！') : '') +
          t('尝试 {moves} 次（准确率 {accuracy}% · 最高连击 ×{combo}）· 用时 {elapsed}s · 最少 {best} 次', {
            moves,
            accuracy,
            combo: maxCombo,
            elapsed,
            best,
          });
      }

      function finishGame() {
        ended = true;
        stopTimer();
        const currentGame = gameId;
        const isNew = readBest(mode) === 0 || moves < readBest(mode);
        if (isNew) {
          GameKit.writeBest(bestKey(mode), moves);
          newRecord = true;
        }
        if (!previewUsed) {
          GameKit.saveBestIfHigher(BEST_COMBO_KEY, maxCombo);
        }

        setTimeout(() => {
          if (currentGame !== gameId) return;
          overlayTitle.textContent = t('全部配对！🎉');
          overlayDesc.textContent = formatFinishDesc();
          overlay.classList.add('show');
          updateHud();
          playVictoryFanfare();
        }, 380);
      }

      boardEl.addEventListener('click', (event) => {
        const card = event.target.closest('.memory-card');
        if (!card || previewing || ended) return;
        if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
        if (lock) clearMismatchPending();

        if (!started) {
          started = true;
          startTimer();
          updateHud();
        }

        card.classList.add('flipped');
        card.setAttribute('aria-label', t('已翻开，{icon}', { icon: t(card.dataset.name) }));
        playTone(520, 0.05);

        if (!first) {
          first = card;
          return;
        }

        second = card;
        moves += 1;

        if (GameRules.isMemoryPairMatch(first.dataset.icon, second.dataset.icon)) {
          const a = first;
          const b = second;
          first = null;
          second = null;
          a.classList.add('matched');
          b.classList.add('matched');
          a.setAttribute('aria-label', t('已配对，{icon}', { icon: t(a.dataset.name) }));
          b.setAttribute('aria-label', t('已配对，{icon}', { icon: t(b.dataset.name) }));
          matches += 1;
          combo += 1;
          maxCombo = Math.max(maxCombo, combo);
          updateHud();
          playComboChime(combo);
          if (matches === MODES[mode].pairs) finishGame();
          return;
        }

        combo = 0;
        lock = true;
        const currentGame = gameId;
        mismatchPair = [first, second];
        first = null;
        second = null;
        mismatchPair[0].classList.add('mismatch');
        mismatchPair[1].classList.add('mismatch');
        updateHud();
        playTone(300, 0.06, 210);
        mismatchTimer = setTimeout(() => {
          if (currentGame !== gameId) return;
          clearMismatchPending();
          updateHud();
        }, 720);
      });

      function switchMode(next) {
        if (next === mode) return;
        mode = next;
        try {
          localStorage.setItem(MODE_KEY, String(mode));
        } catch {}
        initGame();
      }

      async function confirmAbandonAndRun(action, { switching = false } = {}) {
        if (!started || ended) {
          action();
          return;
        }
        const ok = await window.SiteData.confirmDialog({
          title: switching ? t('切换牌桌') : t('重开本局'),
          message: switching
            ? t('切换牌桌会清除当前翻牌进度。')
            : t('当前翻牌进度将被清除，确定重开吗？'),
          confirmText: switching ? t('切换') : t('重开'),
          cancelText: t('继续本局'),
          danger: true,
        });
        if (ok) action();
      }

      modeBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          const next = Number(btn.dataset.memoryMode);
          if (next !== mode) confirmAbandonAndRun(() => switchMode(next), { switching: true });
        });
      });
      previewBtn.addEventListener('click', previewCards);
      document.getElementById('restart-btn').addEventListener('click', () => confirmAbandonAndRun(initGame));
      document.getElementById('overlay-btn').addEventListener('click', initGame);

      document.addEventListener('keydown', (event) => {
        if (GameKit.shouldIgnoreGameKey(event, { ignoreOnControl: true })) return;
        if (window.SiteData && SiteData.isDialogOpen && SiteData.isDialogOpen()) return;
        if (window.GameKit && GameKit.isTutorialOpen && GameKit.isTutorialOpen()) return;
        const target = event.target;
        if (target instanceof Element && target.closest('input, textarea, select, [contenteditable="true"]')) return;
        if (event.code === 'KeyP') {
          event.preventDefault();
          previewCards();
          return;
        }
        if (event.code === 'KeyR') {
          event.preventDefault();
          confirmAbandonAndRun(initGame);
          return;
        }
        if (!boardEl.contains(document.activeElement)) return;
        const cards = Array.from(boardEl.querySelectorAll('.memory-card'));
        const idx = cards.indexOf(document.activeElement);
        if (idx < 0) return;
        const cols = getComputedStyle(boardEl).gridTemplateColumns.split(' ').length || MODES[mode].cols;
        let nextIdx = -1;
        if (event.code === 'ArrowLeft') nextIdx = idx > 0 ? idx - 1 : -1;
        else if (event.code === 'ArrowRight') nextIdx = idx + 1 < cards.length ? idx + 1 : -1;
        else if (event.code === 'ArrowUp') nextIdx = idx - cols >= 0 ? idx - cols : -1;
        else if (event.code === 'ArrowDown') nextIdx = idx + cols < cards.length ? idx + cols : -1;
        if (nextIdx >= 0) {
          event.preventDefault();
          cards[nextIdx].focus();
        }
      });

      document.addEventListener('i18n:change', () => {
        updateHud();
        refreshCardAria();
        if (overlay.classList.contains('show')) {
          overlayDesc.textContent = formatFinishDesc();
        }
      });

      document.addEventListener('site:dialogopen', () => {
        dialogOpen = true;
      });
      document.addEventListener('site:dialogclose', () => {
        dialogOpen = false;
      });

      function showTutorial(force) {
        GameKit.showTutorial({
          id: 'memory',
          force,
          steps: [
            { icon: 'game-memory', title: t('翻牌与连击'), text: t('每次翻开两张牌配对消除；连续配对会累计连击并提升清脆音效，不配对时直接点下一张即可继续。') },
            { icon: 'mem-pineapple', title: t('三种牌桌与预览'), text: t('支持 4×4 轻松、5×4 标准与 6×4 挑战；开局前可按 P 或点「预览牌面」偷看 2 秒（纪录单独计算）。') },
          ],
        });
      }

      document.getElementById('help-btn').addEventListener('click', () => showTutorial(true));
      initGame();
      GameKit.mountMoreGames('memory', document.getElementById('more-games'));
      showTutorial(false);
    })();
  </script>
</body>
</html>
