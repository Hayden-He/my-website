  <style>


    .rule-banner {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      box-shadow: var(--shadow-sm);
    }

    .rule-demo {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 700;
      color: var(--text);
    }

    .mini-chip {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 6px;
      font-size: 0.8rem;
      background: #eee4da;
      color: #776e65;
    }

    .mini-chip.four {
      background: #ede0c8;
    }

    .score-float {
      position: absolute;
      top: 4px;
      right: 8px;
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--accent-text);
      pointer-events: none;
      animation: score-rise 0.65s ease-out forwards;
    }

    @keyframes score-rise {
      0% { opacity: 1; transform: translateY(4px); }
      100% { opacity: 0; transform: translateY(-16px); }
    }

    .board-wrap {
      --size: 4;
      --gap: 10px;
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1 / 1;
      background: #bbada0;
      border-radius: 16px;
      padding: 12px;
      box-shadow: var(--shadow-md);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .board-stage {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .grid-bg {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(var(--size), 1fr);
      grid-template-rows: repeat(var(--size), 1fr);
      gap: var(--gap);
    }

    .cell-bg {
      border-radius: 10px;
      background: rgba(238, 228, 218, 0.35);
    }

    .tile-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .tile {
      --cell: calc((100% - (var(--size) - 1) * var(--gap)) / var(--size));
      position: absolute;
      top: 0;
      left: 0;
      width: var(--cell);
      height: var(--cell);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-weight: 800;
      font-size: 1.65rem;
      color: #776e65;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
      transition: transform 0.11s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    .tile-inner {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tile.compact {
      font-size: 1.35rem;
    }

    .tile.spawn .tile-inner {
      animation: pop-in 0.18s ease-out;
    }

    .tile.merged .tile-inner {
      animation: merge-pop 0.2s ease-out;
    }

    @keyframes pop-in {
      0% { transform: scale(0.45); opacity: 0.4; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes merge-pop {
      0% { transform: scale(0.9); }
      50% { transform: scale(1.13); }
      100% { transform: scale(1); }
    }

    .tile[data-val="2"] .tile-inner { background: #eee4da; }
    .tile[data-val="4"] .tile-inner { background: #ede0c8; }
    .tile[data-val="8"] .tile-inner { background: #f2b179; color: #fff; }
    .tile[data-val="16"] .tile-inner { background: #f59563; color: #fff; }
    .tile[data-val="32"] .tile-inner { background: #f67c5f; color: #fff; }
    .tile[data-val="64"] .tile-inner { background: #f65e3b; color: #fff; }
    .tile[data-val="128"] .tile-inner { background: #edcf72; color: #fff; font-size: 1.35rem; }
    .tile[data-val="256"] .tile-inner { background: #edcc61; color: #fff; font-size: 1.35rem; }
    .tile[data-val="512"] .tile-inner { background: #edc850; color: #fff; font-size: 1.35rem; }
    .tile[data-val="1024"] .tile-inner { background: #edc53f; color: #fff; font-size: 1.1rem; }
    .tile[data-val="2048"] .tile-inner { background: #edc22e; color: #fff; font-size: 1.1rem; box-shadow: 0 0 18px rgba(237, 194, 46, 0.55); }
    .tile.super .tile-inner { background: #3c3a32; color: #fff; font-size: 1.02rem; }
    .tile.compact.super .tile-inner { font-size: 0.85rem; }

    /* 本页尺寸；其余外壳样式见 assets/game-shell.css */
    .game-wrap { --game-width: 460px; }
    .hud { grid-template-columns: repeat(3, 1fr); }

  <script>
    (function () {
      const t = (key, params) => (window.I18N ? I18N.t(key, params) : key);
      const LEGACY_BEST_KEY = 'game_best_2048';
      const BEST_PREFIX = LEGACY_BEST_KEY + '_';
      const SAVE_PREFIX = 'game_save_2048_';
      const MODE_KEY = SAVE_PREFIX + 'mode';
      const temporarySaves = new Map();

      const gridBgEl = document.getElementById('grid-bg');
      const tileLayerEl = document.getElementById('tile-layer');
      const scoreBoxEl = document.getElementById('score-box');
      const scoreEl = document.getElementById('score-el');
      const maxEl = document.getElementById('max-el');
      const bestEl = document.getElementById('best-el');
      const undoBtn = document.getElementById('undo-btn');
      const soundBtn = document.getElementById('sound-btn');
      const size4Btn = document.getElementById('size-4');
      const size5Btn = document.getElementById('size-5');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');
      const keepBtn = document.getElementById('keep-btn');
      const boardWrap = document.getElementById('board-wrap');

      let soundEnabled = window.SiteData ? SiteData.getSound() : true;
      GameKit.bindSoundButton(soundBtn, soundEnabled, (on) => {
        soundEnabled = on;
      });

      function playMergeTone(maxVal) {
        if (!soundEnabled || !window.SiteData) return;
        SiteData.withAudio((audioCtx) => {
          try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const base = maxVal > 0 ? Math.min(880, 260 + Math.log2(maxVal) * 48) : 220;
            osc.frequency.setValueAtTime(base, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.07, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
          } catch {}
        });
      }

      function bestKeyFor(sizeValue) {
        return BEST_PREFIX + sizeValue;
      }

      function readBestScore(sizeValue) {
        return GameKit.readBest(bestKeyFor(sizeValue));
      }

      // 旧版把 4×4 / 5×5 的最高分存在同一个键里，首次升级时迁移到当前尺寸
      function migrateLegacyBest(sizeValue) {
        try {
          const legacy = localStorage.getItem(LEGACY_BEST_KEY);
          if (!legacy) return;
          if (!localStorage.getItem(bestKeyFor(sizeValue))) {
            localStorage.setItem(bestKeyFor(sizeValue), legacy);
          }
          localStorage.removeItem(LEGACY_BEST_KEY);
        } catch {}
      }

      let bestScore = 0;
      let newBestThisGame = false;

      let size = 4;
      let board = [];
      let score = 0;
      let prevState = null;
      let victory = null;
      let lastSpawn = null;
      let lastMerged = new Set();
      let renderSeq = 0;

      function cloneBoard(b) {
        return b.map((row) => row.slice());
      }

      function readProgress(key) {
        if (temporarySaves.has(key)) return temporarySaves.get(key);
        try {
          return localStorage.getItem(key);
        } catch {
          return null;
        }
      }

      function writeProgress(key, value) {
        try {
          localStorage.setItem(key, value);
          temporarySaves.delete(key);
        } catch {
          temporarySaves.set(key, value);
        }
      }

      function saveGame() {
        writeProgress(SAVE_PREFIX + size, JSON.stringify({ board, score, prevState, victory }));
      }

      function isValidPosition(position) {
        return position && Number.isSafeInteger(position.score) && position.score >= 0 &&
          Array.isArray(position.board) && position.board.length === size &&
          position.board.every((row) => Array.isArray(row) && row.length === size && row.every((tile) => (
            tile === 0 || (Number.isSafeInteger(tile) && tile >= 2 && tile === 2 ** Math.floor(Math.log2(tile)))
          ))) && position.board.some((row) => row.some((tile) => tile !== 0));
      }

      function rebuildGridBg() {
        boardWrap.style.setProperty('--size', String(size));
        gridBgEl.innerHTML = '';
        for (let i = 0; i < size * size; i++) {
          const cell = document.createElement('div');
          cell.className = 'cell-bg';
          gridBgEl.appendChild(cell);
        }
      }

      function openGame(saveFresh = true) {
        size4Btn.classList.toggle('active', size === 4);
        size5Btn.classList.toggle('active', size === 5);
        rebuildGridBg();
        bestScore = readBestScore(size);
        newBestThisGame = false;

        let saved;
        try {
          saved = JSON.parse(readProgress(SAVE_PREFIX + size));
        } catch {
          // 无法读取的存档可用新棋局替换
        }
        if (!isValidPosition(saved)) {
          initGame();
          if (saveFresh) saveGame();
          return;
        }
        board = saved.board;
        score = saved.score;
        prevState = isValidPosition(saved.prevState) ? saved.prevState : null;
        victory = saved.victory === 'acknowledged' ? 'acknowledged' : 'pending';
        if (getMaxTile() < 2048) victory = null;
        lastSpawn = null;
        lastMerged = new Set();
        render();
        showOutcome();
      }

      function initGame() {
        board = Array.from({ length: size }, () => Array(size).fill(0));
        score = 0;
        prevState = null;
        victory = null;
        newBestThisGame = false;
        lastSpawn = null;
        lastMerged = new Set();
        addRandomTile();
        addRandomTile();
        render();
        showOutcome();
      }

      function addRandomTile() {
        const empty = [];
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            if (board[r][c] === 0) empty.push([r, c]);
          }
        }
        if (empty.length === 0) return;
        const [r, c] = empty[Math.floor(Math.random() * empty.length)];
        board[r][c] = Math.random() < 0.9 ? 2 : 4;
        lastSpawn = r + ',' + c;
      }

      function showScoreFloat(gained) {
        if (gained <= 0) return;
        const el = document.createElement('span');
        el.className = 'score-float';
        el.textContent = '+' + gained;
        scoreBoxEl.appendChild(el);
        setTimeout(() => el.remove(), 700);
      }

      function slideLineWithOrigins(line) {
        // line: [{ val, idx }]
        const nonZero = line.filter((item) => item.val !== 0);
        const result = [];
        const origins = []; // 对应新位置上由哪些旧下标组成
        const mergedIdx = [];
        let gained = 0;
        let highestMerged = 0;

        for (let i = 0; i < nonZero.length; i++) {
          if (i + 1 < nonZero.length && nonZero[i].val === nonZero[i + 1].val) {
            const merged = nonZero[i].val * 2;
            mergedIdx.push(result.length);
            origins.push([nonZero[i].idx, nonZero[i + 1].idx]);
            result.push(merged);
            gained += merged;
            if (merged > highestMerged) highestMerged = merged;
            i++;
          } else {
            origins.push([nonZero[i].idx]);
            result.push(nonZero[i].val);
          }
        }
        while (result.length < size) {
          result.push(0);
          origins.push([]);
        }
        return { result, origins, gained, mergedIdx, highestMerged };
      }

      function toCoord(dir, i, j) {
        if (dir === 'left') return [i, j];
        if (dir === 'right') return [i, size - 1 - j];
        if (dir === 'up') return [j, i];
        return [size - 1 - j, i];
      }

      function move(dir) {
        if (overlay.classList.contains('show')) return;

        const snapshotBoard = cloneBoard(board);
        const snapshotScore = score;
        let moved = false;
        let totalGained = 0;
        let highestMerged = 0;
        const mergedCells = new Set();
        const animTiles = [];

        for (let i = 0; i < size; i++) {
          const line = [];
          for (let j = 0; j < size; j++) {
            const [r, c] = toCoord(dir, i, j);
            line.push({ val: board[r][c], idx: j });
          }

          const { result, origins, gained, mergedIdx, highestMerged: hm } = slideLineWithOrigins(line);
          totalGained += gained;
          if (hm > highestMerged) highestMerged = hm;

          for (let j = 0; j < size; j++) {
            const val = result[j];
            const [r, c] = toCoord(dir, i, j);

            if (board[r][c] !== val) {
              board[r][c] = val;
              moved = true;
            }
            if (val > 0) {
              const isMerged = mergedIdx.includes(j);
              if (isMerged) mergedCells.add(r + ',' + c);
              origins[j].forEach((fromIdx) => {
                const [fr, fc] = toCoord(dir, i, fromIdx);
                animTiles.push({
                  val,
                  fromVal: line[fromIdx].val,
                  fromR: fr,
                  fromC: fc,
                  toR: r,
                  toC: c,
                  isMerged,
                });
              });
            }
          }
        }

        if (!moved) return;

        playMergeTone(highestMerged);

        prevState = { board: snapshotBoard, score: snapshotScore };
        lastMerged = mergedCells;

        score += totalGained;
        showScoreFloat(totalGained);
        if (score > bestScore) {
          newBestThisGame = true;
          bestScore = score;
          GameKit.saveBestIfHigher(bestKeyFor(size), bestScore);
        }

        addRandomTile();
        if (victory === null && getMaxTile() >= 2048) victory = 'pending';
        render(animTiles);
        // 滑动结束后再落定合并值与新方块，避免两个“合并后数字”同时滑入
        const seq = renderSeq;
        setTimeout(() => {
          if (seq === renderSeq) render();
        }, 140);
        showOutcome();
        saveGame();
      }

      function showOutcome() {
        const isNewRecord = newBestThisGame && score > 0 && score >= bestScore;
        if (victory === 'pending') {
          overlayTitle.textContent = t('恭喜合成 2048！🎉');
          overlayDesc.textContent = (isNewRecord ? t('🎉 新纪录！') : '') +
            t('当前得分：{score}，你可以继续挑战更高数字！', { score });
          keepBtn.style.display = 'inline-block';
          overlay.classList.add('show');
        } else if (!canMove()) {
          overlayTitle.textContent = t('没有可移动的方块了');
          overlayDesc.textContent = (isNewRecord ? t('🎉 新纪录！') : '') +
            t('本局得分：{score} · 最大方块：{tile}（本模式最高：{best}）', {
              score,
              tile: getMaxTile(),
              best: bestScore,
            });
          keepBtn.style.display = 'none';
          overlay.classList.add('show');
        } else {
          keepBtn.style.display = 'none';
          overlay.classList.remove('show');
        }
      }

      function getMaxTile() {
        let m = 0;
        board.forEach((row) => row.forEach((v) => { if (v > m) m = v; }));
        return m;
      }

      function canMove() {
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            if (board[r][c] === 0) return true;
            if (r < size - 1 && board[r][c] === board[r + 1][c]) return true;
            if (c < size - 1 && board[r][c] === board[r][c + 1]) return true;
          }
        }
        return false;
      }

      function tileTransform(r, c) {
        return `translate3d(calc(${c} * (100% + var(--gap))), calc(${r} * (100% + var(--gap))), 0)`;
      }

      function createTileEl(val, r, c, extraClass) {
        const tile = document.createElement('div');
        let cls = 'tile';
        if (size === 5) cls += ' compact';
        if (val > 2048) cls += ' super';
        if (extraClass) cls += ' ' + extraClass;
        tile.className = cls;
        tile.dataset.val = String(val);
        tile.style.transform = tileTransform(r, c);

        const inner = document.createElement('div');
        inner.className = 'tile-inner';
        inner.textContent = String(val);
        tile.appendChild(inner);
        return tile;
      }

      function render(animTiles) {
        renderSeq += 1;
        scoreEl.textContent = score;
        maxEl.textContent = getMaxTile();
        bestEl.textContent = bestScore;
        undoBtn.disabled = !prevState;
        tileLayerEl.innerHTML = '';

        if (animTiles && animTiles.length > 0) {
          const moving = [];

          animTiles.forEach((item) => {
            // 起点先显示合并前的数字，滑动到位后再由下一次 render 换成合并结果
            const el = createTileEl(item.fromVal, item.fromR, item.fromC, '');
            tileLayerEl.appendChild(el);
            if (item.fromR !== item.toR || item.fromC !== item.toC) {
              moving.push({ el, toR: item.toR, toC: item.toC });
            }
          });

          if (moving.length > 0) {
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                moving.forEach(({ el, toR, toC }) => {
                  el.style.transform = tileTransform(toR, toC);
                });
              });
            });
          }
          return;
        }

        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            const val = board[r][c];
            if (val <= 0) continue;
            const key = r + ',' + c;
            const extra = key === lastSpawn ? 'spawn' : lastMerged.has(key) ? 'merged' : '';
            tileLayerEl.appendChild(createTileEl(val, r, c, extra));
          }
        }
      }

      undoBtn.addEventListener('click', () => {
        if (!prevState) return;
        board = prevState.board;
        score = prevState.score;
        prevState = null;
        // 撤回后按棋盘实际状态重置“已提示胜利”标记，避免回到 2048 之前后再次合成不再提示
        victory = getMaxTile() >= 2048 ? 'acknowledged' : null;
        lastSpawn = null;
        lastMerged = new Set();
        render();
        showOutcome();
        saveGame();
      });

      keepBtn.addEventListener('click', () => {
        victory = 'acknowledged';
        showOutcome();
        saveGame();
      });

      function switchMode(nextSize) {
        if (size === nextSize) return;
        size = nextSize;
        writeProgress(MODE_KEY, String(size));
        openGame();
      }

      size4Btn.addEventListener('click', () => switchMode(4));
      size5Btn.addEventListener('click', () => switchMode(5));

      document.addEventListener('keydown', (e) => {
        if (GameKit.shouldIgnoreGameKey(e)) return;
        if (window.SiteData && SiteData.isDialogOpen && SiteData.isDialogOpen()) return;
        if (window.GameKit && GameKit.isTutorialOpen && GameKit.isTutorialOpen()) return;
        const map = {
          ArrowLeft: 'left',
          KeyA: 'left',
          ArrowRight: 'right',
          KeyD: 'right',
          ArrowUp: 'up',
          KeyW: 'up',
          ArrowDown: 'down',
          KeyS: 'down',
        };
        if (map[e.code]) {
          e.preventDefault();
          move(map[e.code]);
        }
      });

      let startTouch = null;
      let swipedThisTouch = false;
      boardWrap.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          startTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
          swipedThisTouch = false;
        }
      }, { passive: true });

      boardWrap.addEventListener('touchmove', (e) => {
        if (!startTouch || swipedThisTouch || e.touches.length === 0) return;
        const dx = e.touches[0].clientX - startTouch.x;
        const dy = e.touches[0].clientY - startTouch.y;
        if (Math.hypot(dx, dy) < 24) return;
        swipedThisTouch = true;
        if (Math.abs(dx) > Math.abs(dy)) {
          move(dx > 0 ? 'right' : 'left');
        } else {
          move(dy > 0 ? 'down' : 'up');
        }
      }, { passive: true });

      boardWrap.addEventListener('touchend', () => {
        startTouch = null;
        swipedThisTouch = false;
      }, { passive: true });

      function forceRestart() {
        initGame();
        saveGame();
      }

      async function restartWithConfirm() {
        if (!(canMove() && score > 0)) {
          forceRestart();
          return;
        }
        const ok = await window.SiteData.confirmDialog({
          title: t('重开棋局'),
          message: t('重开 {size}×{size} 棋局？当前进度将被清除。', { size }),
          confirmText: t('重开'),
          cancelText: t('继续本局'),
          danger: true,
        });
        if (ok) forceRestart();
      }

      document.getElementById('restart-btn').addEventListener('click', restartWithConfirm);
      document.getElementById('overlay-btn').addEventListener('click', forceRestart);

      document.addEventListener('i18n:change', () => {
        if (overlay.classList.contains('show')) showOutcome();
      });

      window.addEventListener('pageshow', (event) => {
        if (event.persisted) openGame(false);
      });

      window.addEventListener('storage', (event) => {
        if (event.key === null || event.key === bestKeyFor(size)) {
          bestScore = readBestScore(size);
          bestEl.textContent = bestScore;
          showOutcome();
        }
        const saveKey = SAVE_PREFIX + size;
        if (event.key === null || event.key === saveKey) {
          temporarySaves.delete(saveKey);
          openGame(false);
        }
      });

      size = readProgress(MODE_KEY) === '5' ? 5 : 4;
      migrateLegacyBest(size);
      openGame();
      GameKit.mountMoreGames('2048', document.getElementById('more-games'));
    })();
  </script>
</body>
</html>
