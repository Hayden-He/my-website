<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>经典贪吃蛇 - 小游乐场</title>
  <meta name="description" content="经典贪吃蛇：支持键盘与连续划屏，含经典撞墙与自由穿墙双模式。" />
  <meta name="author" content="Hayden-He" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/assets/style.css" />
  <script src="/assets/site-data.js"></script>
  <script src="/assets/canvas-polyfill.js"></script>
  <style>
    .game-wrap {
      max-width: 560px;
      margin: 18px auto 36px;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .hud {
      width: 100%;
      max-width: 520px;
      display: grid;
      grid-template-columns: 1fr 1fr auto auto;
      gap: 8px;
      align-items: stretch;
    }

    .hud-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .hud-label {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .hud-value {
      font-size: 1.15rem;
      font-weight: 800;
    }

    .toolbar {
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mode-pills {
      display: flex;
      background: #e2e8f0;
      padding: 3px;
      border-radius: 10px;
      gap: 4px;
    }

    .mode-pill {
      border: none;
      background: transparent;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .mode-pill.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .btn-small {
      padding: 8px 14px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-small.secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    .stage-box {
      position: relative;
      width: 100%;
      max-width: 520px;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid #86efac;
      box-shadow: var(--shadow-md);
      background: #ecfdf5;
      transition: border-color 0.2s ease;
    }

    .stage-box.wrap-mode {
      border-style: dashed;
      border-color: #38bdf8;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #fff;
      padding: 20px;
      text-align: center;
    }

    .overlay.show {
      display: flex;
    }

    .overlay-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(2, 50px);
      gap: 8px;
      margin-top: 2px;
    }

    .dpad-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 12px;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.08s ease, transform 0.08s ease;
    }

    .dpad-btn:active {
      background: #dbeafe;
      transform: scale(0.95);
    }

    .dpad-empty {
      visibility: hidden;
    }

    .hint-text {
      font-size: 0.82rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* 方向键仅在触屏设备显示，桌面端使用键盘 */
    @media (hover: hover) and (pointer: fine) {
      .dpad {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header class="game-topbar">
    <div class="container game-topbar-inner">
      <a class="back-link" href="/">← 返回大厅</a>
      <span class="game-topbar-title">经典贪吃蛇 🐍</span>
      <a class="game-topbar-cat" href="/categories/arcade.html">动作街机</a>
    </div>
  </header>

  <main class="game-wrap">
    <div class="hud">
      <div class="hud-box">
        <div class="hud-label">当前得分</div>
        <div id="score-el" class="hud-value">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">历史最高</div>
        <div id="best-el" class="hud-value" style="color: var(--accent);">0</div>
      </div>
      <button id="pause-btn" class="btn-small secondary">暂停</button>
      <button id="restart-btn" class="btn-small">重开</button>
    </div>

    <div class="toolbar">
      <div class="mode-pills" role="group" aria-label="游戏模式">
        <button id="mode-classic" class="mode-pill active">经典撞墙</button>
        <button id="mode-wrap" class="mode-pill">自由穿墙</button>
      </div>
      <button id="sound-btn" class="btn-small secondary">音效: 开</button>
    </div>

    <div id="stage-box" class="stage-box">
      <canvas id="board" width="560" height="560"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="overlay-title">游戏结束</h2>
        <p id="overlay-desc">得分：0</p>
        <button id="overlay-btn" class="overlay-btn">再来一局</button>
      </div>
    </div>

    <div class="dpad" aria-label="方向控制">
      <div class="dpad-empty"></div>
      <button class="dpad-btn" data-dir="up" type="button">↑</button>
      <div class="dpad-empty"></div>
      <button class="dpad-btn" data-dir="left" type="button">←</button>
      <button class="dpad-btn" data-dir="down" type="button">↓</button>
      <button class="dpad-btn" data-dir="right" type="button">→</button>
    </div>

    <p class="hint-text">🍎普通 +10 · ⭐金星 +30（限时）· ❄️冰果减速 · 方向键/WASD/连续划屏操控</p>
  </main>

  <script>
    (function () {
      const STORAGE_KEY = 'game_best_snake';
      const canvas = document.getElementById('board');
      const ctx = canvas.getContext('2d');
      const stageBox = document.getElementById('stage-box');
      const scoreEl = document.getElementById('score-el');
      const bestEl = document.getElementById('best-el');
      const pauseBtn = document.getElementById('pause-btn');
      const soundBtn = document.getElementById('sound-btn');
      const modeClassicBtn = document.getElementById('mode-classic');
      const modeWrapBtn = document.getElementById('mode-wrap');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');

      const SIZE = 560;
      const DPR = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = SIZE * DPR;
      canvas.height = SIZE * DPR;

      const GRID = 24;
      const CELL = SIZE / GRID;
      const BONUS_TTL = 45;

      let soundEnabled = window.SiteData ? SiteData.getSound() : true;
      soundBtn.textContent = soundEnabled ? '音效: 开' : '音效: 关';

      function playTone(freq, duration, slideTo) {
        if (!soundEnabled || !window.SiteData) return;
        SiteData.withAudio((audioCtx) => {
          try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
          } catch {}
        });
      }

      let bestScore = 0;
      try {
        bestScore = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10) || 0;
      } catch {}
      bestEl.textContent = bestScore;

      let snake, dir, nextDirs, food, bonusItem, score, eatenCount, speedOffset, started, paused, gameOver, timer;
      let particles = [];
      let popups = [];
      let wrapMode = false;
      let animTime = 0;
      let lastFrameTs = 0;

      // 枚举所有空格后随机选取，避免蛇接近占满棋盘时随机撞格造成死循环；无空格时返回 null
      function randomEmptyCell() {
        const empty = [];
        for (let y = 0; y < GRID; y++) {
          for (let x = 0; x < GRID; x++) {
            const onSnake = snake.some((s) => s.x === x && s.y === y);
            const onFood = food && food.x === x && food.y === y;
            const onBonus = bonusItem && bonusItem.x === x && bonusItem.y === y;
            if (!onSnake && !onFood && !onBonus) empty.push({ x, y });
          }
        }
        return empty.length ? empty[Math.floor(Math.random() * empty.length)] : null;
      }

      function spawnParticles(gx, gy, color, count) {
        const cx = gx * CELL + CELL / 2;
        const cy = gy * CELL + CELL / 2;
        for (let i = 0; i < count; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 45 + Math.random() * 110;
          particles.push({
            x: cx,
            y: cy,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            r: 2 + Math.random() * 2.5,
            color,
            life: 1,
          });
        }
      }

      function addPopup(gx, gy, text, color) {
        popups.push({
          x: Math.max(40, Math.min(SIZE - 40, gx * CELL + CELL / 2)),
          y: Math.max(28, gy * CELL),
          text,
          color,
          life: 1,
        });
      }

      function updateBest() {
        scoreEl.textContent = score;
        if (score > bestScore) {
          bestScore = score;
          bestEl.textContent = bestScore;
          try {
            localStorage.setItem(STORAGE_KEY, String(bestScore));
          } catch {}
        }
      }

      function initGame() {
        const mid = Math.floor(GRID / 2);
        snake = [
          { x: mid, y: mid },
          { x: mid - 1, y: mid },
          { x: mid - 2, y: mid },
        ];
        dir = { x: 1, y: 0 };
        nextDirs = [];
        score = 0;
        eatenCount = 0;
        speedOffset = 0;
        bonusItem = null;
        particles = [];
        popups = [];
        started = false;
        paused = false;
        gameOver = false;
        food = randomEmptyCell();
        overlay.classList.remove('show');
        pauseBtn.textContent = '暂停';
        scoreEl.textContent = '0';
        if (timer) clearTimeout(timer);
      }

      function togglePause() {
        if (!started || gameOver) return;
        paused = !paused;
        pauseBtn.textContent = paused ? '继续' : '暂停';
        if (paused) {
          if (timer) clearTimeout(timer);
        } else {
          tick();
        }
      }

      function setDirection(name) {
        if (gameOver || paused) return;
        const map = {
          up: { x: 0, y: -1 },
          down: { x: 0, y: 1 },
          left: { x: -1, y: 0 },
          right: { x: 1, y: 0 },
        };
        const candidate = map[name];
        if (!candidate) return;

        if (!started) {
          dir = candidate.x === -1 && candidate.y === 0 ? { x: 1, y: 0 } : candidate;
          started = true;
          tick();
          return;
        }

        const lastDir = nextDirs.length > 0 ? nextDirs[nextDirs.length - 1] : dir;
        if (candidate.x + lastDir.x === 0 && candidate.y + lastDir.y === 0) return;
        if (candidate.x === lastDir.x && candidate.y === lastDir.y) return;
        if (nextDirs.length < 2) nextDirs.push(candidate);
      }

      function tick() {
        if (!started || paused || gameOver) return;
        if (nextDirs.length > 0) dir = nextDirs.shift();

        let nx = snake[0].x + dir.x;
        let ny = snake[0].y + dir.y;

        if (wrapMode) {
          nx = (nx + GRID) % GRID;
          ny = (ny + GRID) % GRID;
        } else if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) {
          endGame();
          return;
        }

        // 不吃果子时尾巴本步会移开，允许蛇头进入尾巴当前所在格（经典规则）
        const willGrow =
          (food && nx === food.x && ny === food.y) ||
          (bonusItem && nx === bonusItem.x && ny === bonusItem.y);
        const bodyToCheck = willGrow ? snake : snake.slice(0, -1);
        if (bodyToCheck.some((s) => s.x === nx && s.y === ny)) {
          endGame();
          return;
        }

        const head = { x: nx, y: ny };
        snake.unshift(head);

        let grew = false;
        if (food && head.x === food.x && head.y === food.y) {
          grew = true;
          eatenCount += 1;
          score += 10;
          playTone(520, 0.08, 760);
          spawnParticles(head.x, head.y, '#ef4444', 10);
          addPopup(head.x, head.y, '+10', '#15803d');
          food = randomEmptyCell();
          if (!food) {
            updateBest();
            food = { x: -1, y: -1 };
            endGame('通关！🎉');
            return;
          }

          // 每吃 4 个普通果子，刷新一个限时奖励果（金星或冰果）
          if (eatenCount % 4 === 0 && !bonusItem) {
            const pos = randomEmptyCell();
            if (pos) {
              bonusItem = {
                x: pos.x,
                y: pos.y,
                type: Math.random() < 0.7 ? 'star' : 'ice',
                ttl: BONUS_TTL,
                maxTtl: BONUS_TTL,
              };
            }
          }
        } else if (bonusItem && head.x === bonusItem.x && head.y === bonusItem.y) {
          grew = true;
          if (bonusItem.type === 'star') {
            score += 30;
            playTone(660, 0.14, 1040);
            spawnParticles(head.x, head.y, '#f59e0b', 16);
            addPopup(head.x, head.y, '+30 ★', '#d97706');
          } else {
            score += 15;
            speedOffset = Math.min(48, speedOffset + 28);
            playTone(440, 0.14, 300);
            spawnParticles(head.x, head.y, '#38bdf8', 14);
            addPopup(head.x, head.y, '+15 ❄️减速', '#0284c7');
          }
          bonusItem = null;
        }

        if (bonusItem) {
          bonusItem.ttl -= 1;
          if (bonusItem.ttl <= 0) bonusItem = null;
        }

        if (grew) {
          updateBest();
        } else {
          snake.pop();
        }

        const delay = Math.max(82, 185 - Math.floor(score / 25) * 6 + speedOffset);
        if (speedOffset > 0) speedOffset = Math.max(0, speedOffset - 0.6);
        timer = setTimeout(tick, delay);
      }

      function endGame(title) {
        gameOver = true;
        playTone(220, 0.22, 95);
        overlayTitle.textContent = title || '游戏结束';
        overlayDesc.textContent = '本局得分：' + score + '（历史最高：' + bestScore + '）';
        overlay.classList.add('show');
      }

      function draw(dt) {
        animTime += dt;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

        // 清爽草地棋盘格
        for (let r = 0; r < GRID; r++) {
          for (let c = 0; c < GRID; c++) {
            ctx.fillStyle = (r + c) % 2 === 0 ? '#ecfdf5' : '#e2fbe9';
            ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
          }
        }

        // 普通红苹果
        if (food && food.x >= 0) {
          const fx = food.x * CELL + CELL / 2;
          const fy = food.y * CELL + CELL / 2;
          const pulse = 1 + Math.sin(animTime * 4.2) * 0.05;
          const r = CELL * 0.37 * pulse;

          ctx.fillStyle = 'rgba(239, 68, 68, 0.16)';
          ctx.beginPath();
          ctx.arc(fx, fy + 1, r * 1.28, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(fx, fy + 1, r, 0, Math.PI * 2);
          ctx.fill();

          // 高光与绿叶
          ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
          ctx.beginPath();
          ctx.arc(fx - r * 0.3, fy - r * 0.2, r * 0.22, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#16a34a';
          ctx.beginPath();
          ctx.ellipse(fx + 2, fy - r * 0.95, 4, 2.2, -0.5, 0, Math.PI * 2);
          ctx.fill();
        }

        // 限时特殊果子（带倒计时外环）
        if (bonusItem) {
          const bx = bonusItem.x * CELL + CELL / 2;
          const by = bonusItem.y * CELL + CELL / 2;
          const isStar = bonusItem.type === 'star';
          const ratio = Math.max(0, bonusItem.ttl / bonusItem.maxTtl);
          const blink = bonusItem.ttl <= 12 && Math.floor(animTime * 10) % 2 === 0 ? 0.55 : 1;

          ctx.save();
          ctx.globalAlpha = blink;

          // 倒计时外环
          ctx.strokeStyle = isStar ? 'rgba(245, 158, 11, 0.25)' : 'rgba(56, 189, 248, 0.25)';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(bx, by, CELL * 0.46, 0, Math.PI * 2);
          ctx.stroke();

          ctx.strokeStyle = isStar ? '#d97706' : '#0284c7';
          ctx.beginPath();
          ctx.arc(bx, by, CELL * 0.46, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ratio);
          ctx.stroke();

          ctx.fillStyle = isStar ? '#f59e0b' : '#38bdf8';
          ctx.beginPath();
          ctx.arc(bx, by, CELL * 0.36, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#fff';
          ctx.font = 'bold 12px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(isStar ? '★' : '❄', bx, by + 0.5);
          ctx.restore();
        }

        // 蛇身渐变绘制
        const len = snake.length;
        for (let idx = len - 1; idx >= 0; idx--) {
          const seg = snake[idx];
          const t = len > 1 ? idx / (len - 1) : 0;
          const pad = idx === 0 ? 1.2 : 1.8 + t * 1.4;
          const rad = idx === 0 ? 8 : Math.max(4, 7 - t * 2);

          if (idx === 0) {
            ctx.fillStyle = '#15803d';
          } else {
            const g = Math.round(197 - t * 32);
            const b = Math.round(94 - t * 18);
            ctx.fillStyle = `rgb(34, ${g}, ${b})`;
          }

          ctx.beginPath();
          ctx.roundRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, rad);
          ctx.fill();

          if (idx === 0) {
            const cx = seg.x * CELL + CELL / 2;
            const cy = seg.y * CELL + CELL / 2;
            const ex = dir.x * 3.5;
            const ey = dir.y * 3.5;

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(cx + ex - dir.y * 4, cy + ey + dir.x * 4, 2.8, 0, Math.PI * 2);
            ctx.arc(cx + ex + dir.y * 4, cy + ey - dir.x * 4, 2.8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(cx + ex * 1.25 - dir.y * 4, cy + ey * 1.25 + dir.x * 4, 1.3, 0, Math.PI * 2);
            ctx.arc(cx + ex * 1.25 + dir.y * 4, cy + ey * 1.25 - dir.x * 4, 1.3, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // 粒子特效
        particles = particles.filter((p) => {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt * 2.4;
          if (p.life <= 0) return false;
          ctx.save();
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          return true;
        });

        // 得分飘字
        popups = popups.filter((p) => {
          p.y -= 28 * dt;
          p.life -= dt * 1.4;
          if (p.life <= 0) return false;
          ctx.save();
          ctx.globalAlpha = p.life;
          ctx.font = 'bold 14px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillStyle = p.color;
          ctx.fillText(p.text, p.x, p.y);
          ctx.restore();
          return true;
        });

        // 冰果减速状态提示
        if (speedOffset > 2 && started && !gameOver) {
          ctx.save();
          ctx.fillStyle = 'rgba(2, 132, 199, 0.85)';
          ctx.beginPath();
          ctx.roundRect(SIZE - 96, 12, 84, 26, 999);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 12px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('❄️ 减速中', SIZE - 54, 25);
          ctx.restore();
        }

        if (!started && !gameOver) {
          ctx.fillStyle = 'rgba(15, 23, 42, 0.74)';
          ctx.beginPath();
          ctx.roundRect(SIZE / 2 - 165, SIZE / 2 - 78, 330, 44, 12);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 14px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('按方向键 / WASD 或点击画面开始 🐍', SIZE / 2, SIZE / 2 - 51);
        } else if (paused && !gameOver) {
          ctx.fillStyle = 'rgba(15, 23, 42, 0.56)';
          ctx.fillRect(0, 0, SIZE, SIZE);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 24px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('已暂停（点击或按空格继续）', SIZE / 2, SIZE / 2);
        }
      }

      function frameLoop(ts) {
        if (!lastFrameTs) lastFrameTs = ts;
        const dt = Math.min((ts - lastFrameTs) / 1000, 0.05);
        lastFrameTs = ts;
        draw(dt);
        requestAnimationFrame(frameLoop);
      }

      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'KeyP') {
          e.preventDefault();
          togglePause();
          return;
        }
        const keyMap = {
          ArrowUp: 'up',
          KeyW: 'up',
          ArrowDown: 'down',
          KeyS: 'down',
          ArrowLeft: 'left',
          KeyA: 'left',
          ArrowRight: 'right',
          KeyD: 'right',
        };
        if (keyMap[e.code]) {
          e.preventDefault();
          setDirection(keyMap[e.code]);
        }
      });

      document.querySelectorAll('.dpad-btn').forEach((btn) => {
        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          setDirection(btn.dataset.dir);
        });
      });

      let touchStart = null;
      let touchMoved = false;
      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
          touchMoved = false;
        }
      }, { passive: true });

      // 连续划屏转向：达到阈值即响应，无需松手
      canvas.addEventListener('touchmove', (e) => {
        if (!touchStart || e.touches.length === 0) return;
        const dx = e.touches[0].clientX - touchStart.x;
        const dy = e.touches[0].clientY - touchStart.y;
        if (Math.hypot(dx, dy) < 22) return;
        touchMoved = true;
        touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        if (Math.abs(dx) > Math.abs(dy)) {
          setDirection(dx > 0 ? 'right' : 'left');
        } else {
          setDirection(dy > 0 ? 'down' : 'up');
        }
      }, { passive: true });

      canvas.addEventListener('touchend', () => {
        touchStart = null;
      }, { passive: true });

      canvas.addEventListener('click', () => {
        if (touchMoved) return;
        if (!started && !gameOver) {
          setDirection('right');
        } else if (paused && !gameOver) {
          togglePause();
        }
      });

      function setWrapMode(flag) {
        wrapMode = flag;
        modeClassicBtn.classList.toggle('active', !flag);
        modeWrapBtn.classList.toggle('active', flag);
        stageBox.classList.toggle('wrap-mode', flag);
        initGame();
      }

      modeClassicBtn.addEventListener('click', () => setWrapMode(false));
      modeWrapBtn.addEventListener('click', () => setWrapMode(true));

      soundBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundBtn.textContent = soundEnabled ? '音效: 开' : '音效: 关';
        if (window.SiteData) SiteData.setSound(soundEnabled);
      });

      pauseBtn.addEventListener('click', togglePause);

      // 切到后台时自动暂停，避免蛇在后台继续移动
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && started && !paused && !gameOver) togglePause();
      });
      document.getElementById('restart-btn').addEventListener('click', initGame);
      document.getElementById('overlay-btn').addEventListener('click', initGame);

      initGame();
      requestAnimationFrame(frameLoop);
    })();
  </script>
</body>
</html>
