<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta property="og:type" content="website" />

  <meta property="og:title" content="数字华容道 · Little Playground" />
  <meta property="og:description" content="数字华容道：滑动数字方块，把 1–8 / 1–15 / 1–24 按顺序排好；支持整行整列滑动与 3×3、4×4、5×5 棋盘，步数越少越好。" />
  <meta property="og:url" content="https://my-website-all.pages.dev/games/slide/" />

  <meta name="twitter:title" content="数字华容道 · Little Playground" />
  <meta name="twitter:description" content="数字华容道：滑动数字方块，把 1–8 / 1–15 / 1–24 按顺序排好；支持整行整列滑动与 3×3、4×4、5×5 棋盘，步数越少越好。" />
  <meta name="twitter:image" content="https://my-website-all.pages.dev/assets/og-image.jpg" />
  <meta name="twitter:image:alt" content="小游乐场 · Little Playground：12 款即开即玩的小游戏" />
  <meta name="author" content="Hayden-He" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="小游乐场" />
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/style.css" />
  <link rel="stylesheet" href="/assets/game-shell.css" />
  <link rel="stylesheet" href="./modules/slide.css" />
</head>
<body>
  <!-- inline-icons:start -->
  <!-- inline-icons:end -->

  <header class="game-topbar">
    <div class="container game-topbar-inner">
      <a class="back-link" href="/" data-i18n="← 返回大厅">← 返回大厅</a>
      <h1 class="game-topbar-title">
        <svg class="title-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><use href="#game-slide"></use></svg>
        <span data-i18n="数字华容道">数字华容道</span>
      </h1>
      <div class="game-topbar-actions">
        <a class="game-topbar-cat" href="/categories/puzzle" data-i18n="益智休闲">益智休闲</a>
        <button class="lang-btn theme-btn" type="button" data-theme-toggle aria-label="主题：跟随系统" title="主题：跟随系统"><svg class="theme-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#theme-system"></use></svg></button>
        <button class="lang-btn" type="button" data-lang-toggle>EN</button>
      </div>
    </div>
  </header>

  <main class="game-wrap">
    <div class="hud">
      <div class="hud-box">
        <div class="hud-label" data-i18n="步数">步数</div>
        <div id="moves-el" class="hud-value">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label" data-i18n="用时">用时</div>
        <div id="time-el" class="hud-value" style="color: var(--primary);">0s</div>
      </div>
      <div class="hud-box">
        <div class="hud-label" data-i18n="最少步数">最少步数</div>
        <div id="best-el" class="hud-value" style="color: var(--accent-text);">--</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="mode-pills" role="group" aria-label="棋盘尺寸" data-i18n-attr="aria-label:棋盘尺寸">
        <button id="mode-beginner" class="mode-pill" type="button" data-slide-mode="beginner" data-i18n="3×3 入门">3×3 入门</button>
        <button id="mode-3" class="mode-pill active" type="button" data-slide-mode="3" data-i18n="3×3 经典">3×3 经典</button>
        <button id="mode-4" class="mode-pill" type="button" data-slide-mode="4" data-i18n="4×4 标准">4×4 标准</button>
        <button id="mode-5" class="mode-pill" type="button" data-slide-mode="5" data-i18n="5×5 挑战">5×5 挑战</button>
      </div>
      <div class="btn-group">
        <button id="help-btn" class="btn-small secondary" type="button" title="查看玩法" data-i18n="玩法" data-i18n-attr="title:查看玩法">玩法</button>
        <button id="sound-btn" class="btn-small secondary" type="button">音效: 开</button>
        <button id="restart-btn" class="btn-small" type="button" data-i18n="重开">重开</button>
        <button id="retry-btn" class="btn-small secondary" type="button" data-i18n="同盘重试">同盘重试</button>
      </div>
    </div>

    <div class="slide-goal">
      <div class="slide-goal-info">
        <p class="hint-text" data-i18n="点同行或同列方块可一次整排推动，空位留在右下角。">点同行或同列方块可一次整排推动，空位留在右下角。</p>
        <p id="slide-progress" class="hint-text slide-progress" aria-live="polite"></p>
      </div>
      <div id="slide-goal-grid" class="slide-goal-grid" aria-hidden="true"></div>
    </div>
    <div class="slide-stage">
      <div id="slide-board" class="slide-board" role="grid" aria-label="数字华容道棋盘" data-i18n-attr="aria-label:数字华容道棋盘"></div>
      <div id="overlay" class="overlay" role="status" aria-live="polite">
        <h2 id="overlay-title">完成！</h2>
        <p id="overlay-desc">步数：0 · 用时：0s</p>
        <div class="overlay-actions">
          <button id="overlay-btn" class="overlay-btn" type="button" data-i18n="再来一局">再来一局</button>
          <button id="overlay-retry-btn" class="overlay-btn secondary" type="button" data-i18n="同盘重试">同盘重试</button>
        </div>
      </div>
    </div>

    <p class="hint-text" data-i18n="支持划屏、方向键 / WASD 移动，按 R 重开；初次玩可选 3×3 入门。">支持划屏、方向键 / WASD 移动，按 R 重开；初次玩可选 3×3 入门。</p>

    <div id="more-games" class="more-games" data-more-games="slide"></div>
  </main>

  <script src="/assets/site-data.js"></script>
  <script src="/assets/i18n.js"></script>
  <script src="/assets/games.js"></script>
  <script src="/assets/game-kit.js"></script>
  <script src="/assets/game-rules.js"></script>
  <script type="module" src="./modules/main.js"></script>
</body>
</html>
