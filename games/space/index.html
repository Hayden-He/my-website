  <style>
    .game-wrap { --game-width: 500px; }

    .hud { grid-template-columns: repeat(3, 1fr); }

    .hud-value.accent { color: var(--accent-text); }

    .status-strip {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      flex-wrap: wrap;
    }

    .status-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .armor-hearts {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .armor-pip {
      width: 16px;
      height: 9px;
      border-radius: 4px;
      background: #22c55e;
      box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.25);
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .armor-pip.lost {
      background: #cbd5e1;
      box-shadow: none;
      transform: scaleY(0.75);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 800;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .status-badge.overdrive {
      background: #fef3c7;
      color: #b45309;
    }

    .status-badge.shield {
      background: #ecfeff;
      color: #0e7490;
    }

    .status-badge[hidden] { display: none; }

    .stage-box {
      position: relative;
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #1e293b;
      box-shadow: var(--shadow-md);
      background: #060918;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 460 / 560;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: crosshair;
    }

    .boss-bar-wrap {
      position: absolute;
      top: 10px;
      left: 14px;
      right: 14px;
      z-index: 2;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .boss-bar-wrap[hidden] { display: none; }

    .boss-bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      font-weight: 800;
      color: #fecaca;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
    }

    .boss-bar-track {
      height: 7px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(248, 113, 113, 0.45);
      overflow: hidden;
    }

    .boss-bar-fill {
      height: 100%;
      width: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #ef4444, #f97316, #fde047);
      transition: width 0.08s linear;
    }

    .action-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .emp-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      font-size: 0.84rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px -4px rgba(37, 99, 235, 0.55);
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .emp-btn:active:not(:disabled) { transform: scale(0.96); }

    .emp-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .skin-pills {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #f1f5f9;
      padding: 3px;
      border-radius: 999px;
      flex-wrap: wrap;
    }

    .skin-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    .skin-pill.active {
      background: #fff;
      color: var(--text);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
    }

    .skin-swatch {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .overlay-stats {
      margin: -4px 0 2px;
      font-size: 0.84rem !important;
      font-weight: 700;
      color: #93c5fd !important;
    }

    .overlay-stats[hidden] { display: none; }

    .space-legend {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: var(--shadow-sm);
    }

    .legend-title {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .legend-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(146px, 1fr));
      gap: 7px 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.75rem;
      line-height: 1.3;
      color: var(--text);
    }

    .legend-badge {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 0.68rem;
      font-weight: 800;
    }

    @media (max-width: 560px) {
      .hud { gap: 8px; }
      .hud-box { padding: 8px 6px; }
      .hud-value { font-size: 1.15rem; }
      .action-bar { justify-content: center; }
      .skin-pill { padding: 4px 8px; font-size: 0.72rem; }
      .legend-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 8px; }
    }
  </style>
</head>

        <div class="legend-item"><span class="legend-badge" style="background:#2563eb" aria-hidden="true">◎</span><span data-i18n="脉冲补给：清弹冲击波+1">脉冲补给：清弹冲击波+1</span></div>
        <div class="legend-item"><span class="legend-badge" style="background:#dc2626" aria-hidden="true">!</span><span data-i18n="Boss预警：预警线锁定后发射激光">Boss预警：预警线锁定后发射激光</span></div>
      </div>
    </section>

    <div id="more-games" class="more-games"></div>
  </main>

  <script>
    (function () {
      const t = (key, params) => I18N.t(key, params);
      const MODE_KEY = 'game_mode_space';
      const SKIN_KEY = 'game_skin_space';
      const BEST_KEYS = {
        standard: 'game_best_space_standard',
        ace: 'game_best_space_ace',
      };

      const W = 460;
      const H = 560;
      const MAX_PARTICLES = 160;

      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score-el');
      const waveEl = document.getElementById('wave-el');
      const bestEl = document.getElementById('best-el');
      const armorEl = document.getElementById('armor-el');
      const shieldBadge = document.getElementById('shield-badge');
      const weaponBadge = document.getElementById('weapon-badge');
      const overdriveBadge = document.getElementById('overdrive-badge');
      const bossBarWrap = document.getElementById('boss-bar-wrap');
      const bossNameEl = document.getElementById('boss-name');
      const bossBarFill = document.getElementById('boss-bar-fill');
      const bossHpText = document.getElementById('boss-hp-text');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');
      const overlayStats = document.getElementById('overlay-stats');
      const overlayBtn = document.getElementById('overlay-btn');
      const pauseBtn = document.getElementById('pause-btn');
      const soundBtn = document.getElementById('sound-btn');
      const helpBtn = document.getElementById('help-btn');
      const restartBtn = document.getElementById('restart-btn');
      const empBtn = document.getElementById('emp-btn');
      const empCountEl = document.getElementById('emp-count');
      const modeStandardBtn = document.getElementById('mode-standard');
      const modeAceBtn = document.getElementById('mode-ace');
      const skinBtns = Array.from(document.querySelectorAll('.skin-pill'));

      function readStored(key, fallback) {
        try {
          return localStorage.getItem(key) || fallback;
        } catch {
          return fallback;
        }
      }

      function writeStored(key, val) {
        try {
          localStorage.setItem(key, val);
        } catch {}
      }

      let mode = readStored(MODE_KEY, 'standard');
      if (mode !== 'standard' && mode !== 'ace') mode = 'standard';

      let skin = readStored(SKIN_KEY, 'cobalt');
      const SKINS = {
        cobalt: {
          wing: '#0284c7',
          wingHi: '#38bdf8',
          body: '#f8fafc',
          cockpit: '#2563eb',
          bolt: '#7dd3fc',
          glow: '#0ea5e9',
          flame: '#f97316',
        },
        crimson: {
          wing: '#be123c',
          wingHi: '#fb7185',
          body: '#fff1f2',
          cockpit: '#e11d48',
          bolt: '#fdba74',
          glow: '#f97316',
          flame: '#fde047',
        },
        phantom: {
          wing: '#6d28d9',
          wingHi: '#c084fc',
          body: '#e2e8f0',
          cockpit: '#7c3aed',
          bolt: '#d8b4fe',
          glow: '#a855f7',
          flame: '#38bdf8',
        },
      };
      if (!SKINS[skin]) skin = 'cobalt';

      let soundEnabled = window.SiteData ? SiteData.getSound() : true;
      GameKit.bindSoundButton(soundBtn, soundEnabled, (on) => {
        soundEnabled = on;
      });

      // 音频合成（节流防噪耳）
      let noiseBuffer = null;
      let lastShootSfxAt = 0;
      let lastHitSfxAt = 0;

      function getNoiseBuffer(ac) {
        if (noiseBuffer && noiseBuffer.sampleRate === ac.sampleRate) return noiseBuffer;
        const len = Math.floor(ac.sampleRate * 0.55);
        const buf = ac.createBuffer(1, len, ac.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i += 1) data[i] = Math.random() * 2 - 1;
        noiseBuffer = buf;
        return buf;
      }

      function withAudio(fn) {
        if (!soundEnabled || !window.SiteData) return;
        SiteData.withAudio((ac) => {
          try {
            fn(ac);
          } catch {}
        });
      }

      function playShoot(overdrive) {
        const now = performance.now();
        if (now - lastShootSfxAt < 95) return;
        lastShootSfxAt = now;
        withAudio((ac) => {
          const t0 = ac.currentTime;
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(overdrive ? 980 : 780, t0);
          osc.frequency.exponentialRampToValueAtTime(240, t0 + 0.055);
          gain.gain.setValueAtTime(0.045, t0);
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.06);
          osc.connect(gain);
          gain.connect(ac.destination);
          osc.start(t0);
          osc.stop(t0 + 0.065);
        });
      }

      function playHit() {
        const now = performance.now();
        if (now - lastHitSfxAt < 65) return;
        lastHitSfxAt = now;
        withAudio((ac) => {
          const t0 = ac.currentTime;
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(420, t0);
          osc.frequency.exponentialRampToValueAtTime(160, t0 + 0.04);
          gain.gain.setValueAtTime(0.04, t0);
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.045);
          osc.connect(gain);
          gain.connect(ac.destination);
          osc.start(t0);
          osc.stop(t0 + 0.05);
        });
      }

      function playExplode(big) {
        withAudio((ac) => {
          const t0 = ac.currentTime;
          const dur = big ? 0.45 : 0.22;
          const src = ac.createBufferSource();
          src.buffer = getNoiseBuffer(ac);
          const lp = ac.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.setValueAtTime(big ? 1400 : 1100, t0);
          lp.frequency.exponentialRampToValueAtTime(140, t0 + dur);
          const nGain = ac.createGain();
          nGain.gain.setValueAtTime(big ? 0.24 : 0.13, t0);
          nGain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
          src.connect(lp);
          lp.connect(nGain);
          nGain.connect(ac.destination);
          src.start(t0);
          src.stop(t0 + dur + 0.02);

          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(big ? 190 : 160, t0);
          osc.frequency.exponentialRampToValueAtTime(45, t0 + dur);
          gain.gain.setValueAtTime(big ? 0.18 : 0.09, t0);
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
          osc.connect(gain);
          gain.connect(ac.destination);
          osc.start(t0);
          osc.stop(t0 + dur + 0.02);
        });
      }

      function playPowerup() {
        withAudio((ac) => {
          const t0 = ac.currentTime;
          for (const [freq, delay] of [[523, 0], [659, 0.05], [880, 0.1]]) {
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, t0 + delay);
            gain.gain.setValueAtTime(0.11, t0 + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, t0 + delay + 0.13);
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start(t0 + delay);
            osc.stop(t0 + delay + 0.14);
          }
        });
      }

      function playEmp() {
        withAudio((ac) => {
          const t0 = ac.currentTime;
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(680, t0);
          osc.frequency.exponentialRampToValueAtTime(85, t0 + 0.42);
          gain.gain.setValueAtTime(0.18, t0);
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.45);
          osc.connect(gain);
          gain.connect(ac.destination);
          osc.start(t0);
          osc.stop(t0 + 0.46);
        });
      }

      function playBossAlert() {
        withAudio((ac) => {
          const t0 = ac.currentTime;
          for (const delay of [0, 0.22]) {
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(320, t0 + delay);
            osc.frequency.linearRampToValueAtTime(560, t0 + delay + 0.14);
            gain.gain.setValueAtTime(0.12, t0 + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, t0 + delay + 0.18);
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start(t0 + delay);
            osc.stop(t0 + delay + 0.19);
          }
        });
      }

      function playPlayerHit() {
        withAudio((ac) => {
          const t0 = ac.currentTime;
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, t0);
          osc.frequency.exponentialRampToValueAtTime(75, t0 + 0.24);
          gain.gain.setValueAtTime(0.18, t0);
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.26);
          osc.connect(gain);
          gain.connect(ac.destination);
          osc.start(t0);
          osc.stop(t0 + 0.27);
        });
      }

      function playBossLaserCharge() {
        withAudio((ac) => {
          const t0 = ac.currentTime;
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(220, t0);
          osc.frequency.exponentialRampToValueAtTime(880, t0 + 0.72);
          gain.gain.setValueAtTime(0.02, t0);
          gain.gain.linearRampToValueAtTime(0.11, t0 + 0.65);
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.78);
          osc.connect(gain);
          gain.connect(ac.destination);
          osc.start(t0);
          osc.stop(t0 + 0.8);
        });
      }

      function playBossLaserFire() {
        withAudio((ac) => {
          const t0 = ac.currentTime;
          const src = ac.createBufferSource();
          src.buffer = getNoiseBuffer(ac);
          const bp = ac.createBiquadFilter();
          bp.type = 'bandpass';
          bp.frequency.setValueAtTime(950, t0);
          bp.Q.setValueAtTime(1.5, t0);
          const nGain = ac.createGain();
          nGain.gain.setValueAtTime(0.16, t0);
          nGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.45);
          src.connect(bp);
          bp.connect(nGain);
          nGain.connect(ac.destination);
          src.start(t0);
          src.stop(t0 + 0.48);

          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(480, t0);
          osc.frequency.exponentialRampToValueAtTime(140, t0 + 0.42);
          gain.gain.setValueAtTime(0.12, t0);
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.44);
          osc.connect(gain);
          gain.connect(ac.destination);
          osc.start(t0);
          osc.stop(t0 + 0.46);
        });
      }

      function playWaveClear() {
        withAudio((ac) => {
          const t0 = ac.currentTime;
          for (const [freq, delay] of [[523, 0], [659, 0.07], [784, 0.14], [1046, 0.22]]) {
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, t0 + delay);
            gain.gain.setValueAtTime(0.11, t0 + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, t0 + delay + 0.2);
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start(t0 + delay);
            osc.stop(t0 + delay + 0.22);
          }
        });
      }

      function playComboMilestone() {
        withAudio((ac) => {
          const t0 = ac.currentTime;
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(880, t0);
          osc.frequency.exponentialRampToValueAtTime(1320, t0 + 0.11);
          gain.gain.setValueAtTime(0.09, t0);
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.13);
          osc.connect(gain);
          gain.connect(ac.destination);
          osc.start(t0);
          osc.stop(t0 + 0.14);
        });
      }

      // DPR 高清适配
      function syncCanvasDpr() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      syncCanvasDpr();
      window.addEventListener('resize', syncCanvasDpr);

      // 视差星空、星云、远景行星与流星
      const stars = [];
      for (let i = 0; i < 95; i += 1) {
        const layer = i < 45 ? 1 : (i < 78 ? 2 : 3);
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: layer === 1 ? 0.9 : (layer === 2 ? 1.4 : 2.1),
          speed: layer === 1 ? 26 : (layer === 2 ? 58 : 115),
          alpha: layer === 1 ? 0.35 : (layer === 2 ? 0.6 : 0.9),
          tint: i % 9 === 0 ? '#93c5fd' : (i % 13 === 0 ? '#fde68a' : '#ffffff'),
        });
      }

      const nebulae = [
        { x: W * 0.28, y: H * 0.25, r: 170, color: 'rgba(56, 189, 248, 0.08)', vy: 10 },
        { x: W * 0.76, y: H * 0.65, r: 195, color: 'rgba(168, 85, 247, 0.09)', vy: 14 },
      ];

      const planet = { x: W * 0.78, y: -90, r: 58, vy: 7 };
      let meteors = [];
      let meteorTimer = 3.5;

      // 游戏状态
      let state = 'ready'; // 'ready' | 'playing' | 'paused' | 'over'
      let score = 0;
      let wave = 1;
      let bestStandard = GameKit.readBest(BEST_KEYS.standard);
      let bestAce = GameKit.readBest(BEST_KEYS.ace);
      let newBest = false;
      let kills = 0;
      let combo = 0;
      let comboTimer = 0;
      let maxCombo = 0;
      let bossAlertAlpha = 0;

      // 自机状态
      const player = {
        x: W * 0.5,
        y: H - 72,
        prevX: W * 0.5,
        bank: 0,
        hp: 3,
        maxHp: 3,
        weaponLv: 1,
        hasShield: false,
        empCharges: 2,
        invulnTimer: 0,
        overdriveTimer: 0,
        fireCd: 0,
      };

      // 波次与实体
      let spawnQueue = [];
      let waveSpawnTimer = 0;
      let waveBanner = '';
      let waveBannerTimer = 0;
      let empWave = null;
      let empCooldown = 0;
      let boss = null;
      let bossSupplyTimer = 0;
      let bullets = [];
      let enemyBullets = [];
      let enemies = [];
      let pickups = [];
      let particles = [];
      let debris = [];
      let muzzleFlashes = [];
      let afterimages = [];
      let afterimageCd = 0;
      let shockwaves = [];
      let floatTexts = [];
      let shakeTimer = 0;
      let shakeMag = 0;
      let flashAlpha = 0;
      let flashColor = '#ffffff';

      // 输入状态
      const keys = Object.create(null);
      let activeTouchId = null;
      let touchLastPt = null;
      let mouseTarget = null;

      function clearKeys() {
        for (const k of Object.keys(keys)) keys[k] = false;
      }

      function currentBest() {
        return mode === 'standard' ? bestStandard : bestAce;
      }

      function updateBest(val) {
        if (mode === 'standard') {
          if (val > bestStandard) {
            bestStandard = val;
            GameKit.saveBestIfHigher(BEST_KEYS.standard, val);
            return true;
          }
        } else if (val > bestAce) {
          bestAce = val;
          GameKit.saveBestIfHigher(BEST_KEYS.ace, val);
          return true;
        }
        return false;
      }

      function renderHud() {
        scoreEl.textContent = score;
        waveEl.textContent = wave;
        bestEl.textContent = currentBest();

        armorEl.setAttribute('aria-label', t('剩余护甲：{hp}', { hp: player.hp }));
        if (armorEl.childElementCount !== player.maxHp) {
          armorEl.textContent = '';
          for (let i = 0; i < player.maxHp; i += 1) {
            const pip = document.createElement('span');
            pip.className = 'armor-pip' + (i >= player.hp ? ' lost' : '');
            armorEl.appendChild(pip);
          }
        } else {
          for (let i = 0; i < player.maxHp; i += 1) {
            armorEl.children[i].classList.toggle('lost', i >= player.hp);
          }
        }

        shieldBadge.hidden = !player.hasShield;
        weaponBadge.textContent = t('主炮 Lv.{lv}', { lv: player.weaponLv });

        if (player.overdriveTimer > 0) {
          overdriveBadge.hidden = false;
          overdriveBadge.textContent = '⚡ ' + player.overdriveTimer.toFixed(1) + 's';
        } else {
          overdriveBadge.hidden = true;
        }

        if (boss) {
          bossBarWrap.hidden = false;
          bossNameEl.textContent = getBossName(boss.kind);
          const pct = Math.max(0, Math.min(100, Math.round((boss.hp / boss.maxHp) * 100)));
          bossBarFill.style.width = pct + '%';
          bossHpText.textContent = pct + '%';
        } else {
          bossBarWrap.hidden = true;
        }

        empCountEl.textContent = '×' + player.empCharges;
        empBtn.disabled = state !== 'playing' || player.empCharges <= 0 || empCooldown > 0;

        pauseBtn.disabled = state !== 'playing' && state !== 'paused';
        pauseBtn.textContent = t(state === 'paused' ? '继续' : '暂停');
      }

      function renderOverlay() {
        if (state === 'playing') {
          overlay.classList.remove('show');
          return;
        }
        overlay.classList.add('show');
        if (state === 'ready') {
          overlayTitle.textContent = t('太空战机');
          overlayDesc.textContent = t(mode === 'standard'
            ? '标准闯关：3 点护甲起步，升级主炮、释放脉冲清弹，每 5 波迎战星际 Boss！'
            : '王牌极速：初始 Lv.2 主炮、弹幕更密集、得分 1.5 倍加成，挑战极限操作！');
          overlayStats.textContent = '';
          overlayStats.hidden = true;
          overlayBtn.textContent = t('开始游戏');
        } else if (state === 'paused') {
          overlayTitle.textContent = t('已暂停');
          overlayDesc.textContent = t('当前得分：{score}', { score });
          overlayStats.textContent = '';
          overlayStats.hidden = true;
          overlayBtn.textContent = t('继续游戏');
        } else if (state === 'over') {
          overlayTitle.textContent = t('战机坠毁');
          const suffix = newBest ? t('（新纪录！）') : '';
          overlayDesc.textContent = t('本局得分：{score}（本模式最高：{best}）', {
            score,
            best: currentBest(),
          }) + suffix;
          overlayStats.textContent = t('击毁 {kills} 架 · 抵达第 {wave} 波 · 最高 {combo} 连击', {
            kills,
            wave,
            combo: maxCombo,
          });
          overlayStats.hidden = false;
          overlayBtn.textContent = t('再来一局');
        }
      }

      function syncModeButtons() {
        modeStandardBtn.classList.toggle('active', mode === 'standard');
        modeAceBtn.classList.toggle('active', mode === 'ace');
        skinBtns.forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.skin === skin);
        });
      }

      function buildWaveQueue(num) {
        const queue = [];
        const baseCount = mode === 'ace' ? 7 : 5;
        let remaining = baseCount + Math.floor(num * 1.5);
        const fastRoll = () => Math.random();

        // 编队优先：双翼 V 字 / 横排 / 侧翼狙击 / 陨石带
        while (remaining > 0) {
          const r = fastRoll();
          if (remaining >= 5 && r < 0.34) {
            // 5 架 V 字编队
            const cx = 92 + Math.random() * (W - 184);
            const kind = num >= 3 && Math.random() < 0.45 ? 'interceptor' : 'scout';
            const batch = [];
            for (let k = -2; k <= 2; k += 1) {
              batch.push({
                kind,
                x: cx + k * 34,
                y: -26 - Math.abs(k) * 20,
              });
            }
            queue.push({ items: batch, delay: Math.max(0.75, 1.45 - num * 0.03) });
            remaining -= 5;
          } else if (remaining >= 3 && r < 0.62) {
            // 3 架横排/狙击编队
            const kind = num >= 4 && Math.random() < 0.48 ? 'drone' : 'interceptor';
            const cx = 96 + Math.random() * (W - 192);
            const batch = [
              { kind, x: cx - 54, y: -26 },
              { kind: num >= 3 && Math.random() < 0.35 ? 'gunship' : kind, x: cx, y: -38 },
              { kind, x: cx + 54, y: -26 },
            ];
            queue.push({ items: batch, delay: Math.max(0.8, 1.55 - num * 0.03) });
            remaining -= 3;
          } else if (remaining >= 3 && num >= 2 && r < 0.78) {
            // 陨石群穿插
            const batch = [];
            for (let k = 0; k < 3; k += 1) {
              batch.push({
                kind: 'asteroid',
                x: 52 + ((W - 104) * (k + 0.2 + Math.random() * 0.6)) / 3,
                y: -24 - Math.random() * 34,
              });
            }
            queue.push({ items: batch, delay: 1.1 });
            remaining -= 3;
          } else {
            // 散兵/重型护卫组合
            let kind = 'scout';
            const roll = Math.random();
            if (num >= 4 && roll > 0.78) kind = 'drone';
            else if (num >= 3 && roll > 0.56) kind = 'gunship';
            else if (num >= 2 && roll > 0.38) kind = 'asteroid';
            else if (roll > 0.2) kind = 'interceptor';
            queue.push({
              items: [{ kind, x: null, y: null }],
              delay: Math.max(0.28, (mode === 'ace' ? 0.55 : 0.75) - num * 0.022),
            });
            remaining -= 1;
          }
        }
        return queue;
      }

      function startWave(num) {
        wave = num;
        if (wave % 5 === 0) {
          spawnQueue = [];
          waveSpawnTimer = 0;
          bossSupplyTimer = 9.5;
          bossAlertAlpha = 1;
          spawnBoss(Math.floor(wave / 5));
          waveBanner = t('⚠ 第 {w} 波 · {name}', { w: wave, name: boss.name });
          waveBannerTimer = 2.6;
          playBossAlert();
        } else {
          spawnQueue = buildWaveQueue(wave);
          waveSpawnTimer = 0.22;
          bossSupplyTimer = 0;
          waveBanner = t('第 {w} 波', { w: wave });
          waveBannerTimer = 1.5;
        }
      }

      function resetState(nextState) {
        state = nextState;
        score = 0;
        wave = 1;
        newBest = false;
        kills = 0;
        combo = 0;
        comboTimer = 0;
        maxCombo = 0;

        player.x = W * 0.5;
        player.y = H - 72;
        player.prevX = player.x;
        player.bank = 0;
        player.hp = 3;
        player.maxHp = 3;
        player.weaponLv = mode === 'ace' ? 2 : 1;
        player.hasShield = false;
        player.empCharges = 2;
        player.invulnTimer = 0;
        player.overdriveTimer = 0;
        player.fireCd = 0;

        boss = null;
        bullets = [];
        enemyBullets = [];
        enemies = [];
        pickups = [];
        particles = [];
        debris = [];
        muzzleFlashes = [];
        afterimages = [];
        afterimageCd = 0;
        shockwaves = [];
        floatTexts = [];
        empWave = null;
        empCooldown = 0;
        shakeTimer = 0;
        flashAlpha = 0;
        bossAlertAlpha = 0;
        bossSupplyTimer = 0;
        activeTouchId = null;
        touchLastPt = null;
        mouseTarget = null;
        clearKeys();

        if (nextState === 'playing') {
          startWave(1);
        } else {
          spawnQueue = [];
          waveBanner = '';
          waveBannerTimer = 0;
        }

        renderHud();
        renderOverlay();
      }

      function startGame() {
        resetState('playing');
      }

      function endGame() {
        if (state === 'over') return;
        state = 'over';
        newBest = updateBest(score);
        activeTouchId = null;
        touchLastPt = null;
        mouseTarget = null;
        clearKeys();
        renderHud();
        renderOverlay();
      }

      function pauseGame() {
        if (state !== 'playing') return;
        state = 'paused';
        activeTouchId = null;
        touchLastPt = null;
        mouseTarget = null;
        clearKeys();
        renderHud();
        renderOverlay();
      }

      function resumeGame() {
        if (state !== 'paused') return;
        state = 'playing';
        renderHud();
        renderOverlay();
      }

      async function confirmAbandonIfActive() {
        if ((state === 'playing' || state === 'paused') && (score > 0 || wave > 1)) {
          if (state === 'playing') pauseGame();
          return window.SiteData.confirmDialog({
            title: t('重开本局'),
            message: t('当前进度将被清除，确定重开吗？'),
            confirmText: t('重开'),
            cancelText: t('继续本局'),
            danger: true,
          });
        }
        return true;
      }

      // 特效辅助
      function pushParticle(p) {
        if (particles.length >= MAX_PARTICLES) particles.shift();
        particles.push(p);
      }

      function addFloatText(x, y, text, color, scale) {
        floatTexts.push({
          x: Math.max(48, Math.min(W - 48, x)),
          y: Math.max(36, Math.min(H - 36, y)),
          text,
          color: color || '#fde047',
          scale: scale || 1,
          life: 0.75,
          maxLife: 0.75,
        });
      }

      function triggerShake(mag, time) {
        shakeMag = Math.max(shakeMag, mag);
        shakeTimer = Math.max(shakeTimer, time);
      }

      function spawnExplosion(x, y, color, count, radius, debrisCount) {
        shockwaves.push({
          x,
          y,
          r: 8,
          maxR: radius || 46,
          color,
          life: 0.3,
          maxLife: 0.3,
        });
        for (let i = 0; i < count; i += 1) {
          const a = Math.random() * Math.PI * 2;
          const spd = 55 + Math.random() * 195;
          pushParticle({
            x,
            y,
            vx: Math.cos(a) * spd,
            vy: Math.sin(a) * spd,
            r: 1.8 + Math.random() * 3.4,
            color: i % 3 === 0 ? '#ffffff' : color,
            life: 0.28 + Math.random() * 0.28,
            maxLife: 0.56,
          });
        }
        const shards = debrisCount == null ? Math.min(8, Math.max(3, Math.floor(count / 4))) : debrisCount;
        for (let i = 0; i < shards; i += 1) {
          const a = Math.random() * Math.PI * 2;
          const spd = 65 + Math.random() * 155;
          debris.push({
            x,
            y,
            vx: Math.cos(a) * spd,
            vy: Math.sin(a) * spd,
            w: 4 + Math.random() * 6,
            h: 2.5 + Math.random() * 3.5,
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 14,
            color: i % 2 === 0 ? color : '#cbd5e1',
            life: 0.45 + Math.random() * 0.3,
            maxLife: 0.75,
          });
        }
      }

      function addScore(basePts) {
        const modeMult = mode === 'ace' ? 1.5 : 1;
        const comboMult = combo >= 12 ? 1.5 : (combo >= 6 ? 1.25 : 1);
        const pts = Math.round(basePts * modeMult * comboMult);
        score += pts;
        return pts;
      }

      // 敌机与 Boss 生成
      function createAsteroidPolygon(r) {
        const pts = [];
        const n = 9;
        for (let i = 0; i < n; i += 1) {
          const a = (Math.PI * 2 * i) / n;
          const dist = r * (0.76 + Math.random() * 0.32);
          pts.push({ x: Math.cos(a) * dist, y: Math.sin(a) * dist });
        }
        return pts;
      }

      function spawnEnemyAt(spec) {
        const kind = (spec && spec.kind) || 'scout';
        const aceBoost = mode === 'ace' ? 1 : 0;
        const hpScale = 1 + Math.floor((wave - 1) / 3) * 0.42 + aceBoost * 0.25;
        const fireScale = Math.max(0.56, 1 - wave * 0.032 - aceBoost * 0.14);

        if (kind === 'scout') {
          const hp = Math.max(1, Math.round(1.0 * hpScale));
          enemies.push({
            kind,
            x: spec.x != null ? Math.max(28, Math.min(W - 28, spec.x)) : 34 + Math.random() * (W - 68),
            y: spec.y != null ? spec.y : -26,
            vx: spec.x != null ? 0 : (Math.random() - 0.5) * 58,
            vy: 138 + wave * 5.5 + aceBoost * 22,
            r: 15,
            hp,
            maxHp: hp,
            pts: 18,
            fireCd: (wave >= 4 ? (0.9 + Math.random() * 0.9) : (1.5 + Math.random() * 1.1)) * fireScale,
            hitFlash: 0,
            phase: Math.random() * Math.PI * 2,
          });
        } else if (kind === 'interceptor') {
          const hp = Math.round(2.4 * hpScale);
          enemies.push({
            kind,
            x: spec.x != null ? Math.max(36, Math.min(W - 36, spec.x)) : 44 + Math.random() * (W - 88),
            y: spec.y != null ? spec.y : -30,
            vx: 0,
            vy: 96 + wave * 4 + aceBoost * 16,
            r: 18,
            hp,
            maxHp: hp,
            pts: 32,
            fireCd: (0.65 + Math.random() * 0.65) * fireScale,
            hitFlash: 0,
            phase: Math.random() * Math.PI * 2,
          });
        } else if (kind === 'drone') {
          const hp = Math.round(3 * hpScale);
          enemies.push({
            kind,
            x: spec.x != null ? Math.max(34, Math.min(W - 34, spec.x)) : 40 + Math.random() * (W - 80),
            y: spec.y != null ? spec.y : -30,
            targetY: 85 + Math.random() * 95,
            vx: (Math.random() < 0.5 ? -1 : 1) * (42 + wave * 2),
            vy: 112 + wave * 3,
            r: 16,
            hp,
            maxHp: hp,
            pts: 45,
            fireCd: (1.05 + Math.random() * 0.45) * fireScale,
            lockTimer: 0,
            lockAngle: Math.PI * 0.5,
            hitFlash: 0,
            phase: Math.random() * Math.PI * 2,
          });
        } else if (kind === 'gunship') {
          const hp = Math.round(5.5 * hpScale);
          enemies.push({
            kind,
            x: spec.x != null ? Math.max(46, Math.min(W - 46, spec.x)) : 56 + Math.random() * (W - 112),
            y: spec.y != null ? spec.y : -38,
            vx: (Math.random() < 0.5 ? -1 : 1) * (32 + wave * 1.5),
            vy: 56 + wave * 2.5,
            r: 25,
            hp,
            maxHp: hp,
            pts: 70,
            fireCd: (0.95 + Math.random() * 0.5) * fireScale,
            hitFlash: 0,
            phase: Math.random() * Math.PI * 2,
          });
        } else {
          const r = 20 + Math.random() * 9;
          const hp = Math.round(3.8 * hpScale);
          enemies.push({
            kind: 'asteroid',
            x: spec.x != null ? Math.max(r + 14, Math.min(W - r - 14, spec.x)) : 40 + Math.random() * (W - 80),
            y: spec.y != null ? spec.y : -r - 12,
            vx: (Math.random() - 0.5) * 52,
            vy: 92 + Math.random() * 40 + wave * 3,
            r,
            hp,
            maxHp: hp,
            pts: 40,
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 2.6,
            poly: createAsteroidPolygon(r),
            fireCd: 99,
            hitFlash: 0,
          });
        }
      }

      function getBossName(kind) {
        if (kind === 'crimson') return t('绯红裁决者 BOSS');
        if (kind === 'prism') return t('苍蓝棱镜 BOSS');
        return t('紫曜母舰 BOSS');
      }

      function computeBossLasers(b) {
        const down = Math.PI * 0.5;
        if (b.kind === 'prism') {
          const spread = 0.38;
          return [
            { x: b.x, y: b.y + 18, angle: down - spread },
            { x: b.x, y: b.y + 18, angle: down + spread },
          ];
        }
        if (b.kind === 'mothership') {
          return [
            { x: b.x - 46, y: b.y + 20, angle: down },
            { x: b.x + 46, y: b.y + 20, angle: down },
          ];
        }
        return [{ x: b.x, y: b.y + 26, angle: down }];
      }

      function spawnBoss(tier) {
        const mod = tier % 3;
        const kind = mod === 1 ? 'crimson' : (mod === 2 ? 'prism' : 'mothership');
        const hpBase = kind === 'mothership' ? 115 : (kind === 'prism' ? 100 : 90);
        const hp = Math.round((hpBase + tier * 60) * (mode === 'ace' ? 1.25 : 1));
        boss = {
          tier,
          kind,
          name: getBossName(kind),
          x: W * 0.5,
          y: -92,
          targetY: 98,
          vx: (84 + tier * 11) * (kind === 'mothership' ? 0.85 : 1),
          r: kind === 'mothership' ? 50 : 46,
          hp,
          maxHp: hp,
          pts: 450 + tier * 160,
          hitFlash: 0,
          patternTimer: 1.15,
          patternIndex: 0,
          spiralAngle: 0,
          laserState: 'idle', // 'idle' | 'telegraph' | 'fire'
          laserTimer: 0,
          lasers: [],
          laserWidth: 16,
        };
        boss.lasers = computeBossLasers(boss);
      }

      function maybeDropPickup(x, y, guaranteed, allowEmp) {
        if (!guaranteed && Math.random() > 0.18) return;
        const pool = ['weapon', 'weapon', 'shield', 'overdrive'];
        if (player.hp < player.maxHp) pool.push('heal', 'heal');
        else pool.push('heal');
        if (allowEmp !== false && player.empCharges < 3 && Math.random() < 0.14) {
          pool.push('emp');
        }
        const type = pool[Math.floor(Math.random() * pool.length)];
        pickups.push({
          type,
          x: Math.max(24, Math.min(W - 24, x)),
          y,
          vy: 92,
          r: 14,
          life: 0,
        });
      }

      function firePlayerWeapons() {
        const sk = SKINS[skin];
        const overdrive = player.overdriveTimer > 0;
        const lv = player.weaponLv;
        const y0 = player.y - 22;
        const dmg = overdrive ? 1.35 : 1;
        const spd = -650;

        function pushBolt(x, y, vx, vy, color) {
          bullets.push({
            x,
            y,
            vx,
            vy,
            r: overdrive ? 5 : 4,
            dmg,
            color: color || (overdrive ? '#fde047' : sk.bolt),
          });
        }

        if (lv === 1) {
          pushBolt(player.x, y0, 0, spd);
          muzzleFlashes.push({ x: player.x, y: y0, r: 9, color: sk.bolt, life: 0.06, maxLife: 0.06 });
        } else if (lv === 2) {
          pushBolt(player.x - 10, y0 + 4, 0, spd);
          pushBolt(player.x + 10, y0 + 4, 0, spd);
          muzzleFlashes.push({ x: player.x - 10, y: y0 + 2, r: 8, color: sk.bolt, life: 0.06, maxLife: 0.06 });
          muzzleFlashes.push({ x: player.x + 10, y: y0 + 2, r: 8, color: sk.bolt, life: 0.06, maxLife: 0.06 });
        } else if (lv === 3) {
          pushBolt(player.x, y0, 0, spd);
          pushBolt(player.x - 12, y0 + 6, -55, spd * 0.96);
          pushBolt(player.x + 12, y0 + 6, 55, spd * 0.96);
          muzzleFlashes.push({ x: player.x, y: y0, r: 11, color: sk.bolt, life: 0.06, maxLife: 0.06 });
        } else {
          pushBolt(player.x - 7, y0, 0, spd);
          pushBolt(player.x + 7, y0, 0, spd);
          pushBolt(player.x - 16, y0 + 8, -95, spd * 0.94);
          pushBolt(player.x + 16, y0 + 8, 95, spd * 0.94);
          pushBolt(player.x, y0 - 4, 0, spd * 1.06, '#ffffff');
          muzzleFlashes.push({ x: player.x, y: y0 - 3, r: 13, color: overdrive ? '#fde047' : '#ffffff', life: 0.065, maxLife: 0.065 });
        }
        playShoot(overdrive);
      }

      function triggerEmp() {
        if (state !== 'playing' || player.empCharges <= 0 || empCooldown > 0) return;
        player.empCharges -= 1;
        empCooldown = 0.6;
        empWave = { x: player.x, y: player.y, r: 24, maxR: 620, life: 0.45, maxLife: 0.45 };
        flashColor = '#7dd3fc';
        flashAlpha = 0.42;
        triggerShake(10, 0.35);
        playEmp();

        // 清除敌方弹幕，重创常规敌机与 Boss
        enemyBullets = [];
        for (let i = enemies.length - 1; i >= 0; i -= 1) {
          const e = enemies[i];
          e.hp -= 12;
          e.hitFlash = 0.14;
          if (e.hp <= 0) {
            destroyEnemy(i);
          }
        }
        if (boss) {
          boss.hp -= 28;
          boss.hitFlash = 0.14;
          if (boss.hp <= 0) defeatBoss();
        }
        addFloatText(player.x, player.y - 34, t('脉冲清屏！'), '#7dd3fc', 1.3);
        renderHud();
      }

      function damagePlayer() {
        if (player.invulnTimer > 0 || player.overdriveTimer > 0) return;
        if (player.hasShield) {
          player.hasShield = false;
          player.invulnTimer = 1.1;
          playPlayerHit();
          spawnExplosion(player.x, player.y, '#38bdf8', 16, 65);
          triggerShake(7, 0.22);
          addFloatText(player.x, player.y - 26, t('护盾抵消！'), '#67e8f9', 1.2);
          renderHud();
          return;
        }
        player.hp -= 1;
        player.invulnTimer = 1.6;
        if (player.weaponLv > 1) player.weaponLv -= 1;
        combo = 0;
        comboTimer = 0;
        playPlayerHit();
        flashColor = '#ef4444';
        flashAlpha = 0.38;
        triggerShake(11, 0.35);
        spawnExplosion(player.x, player.y, '#f97316', 20, 72);
        renderHud();
        if (player.hp <= 0) {
          player.hp = 0;
          playExplode(true);
          endGame();
        }
      }

      function destroyEnemy(index) {
        const e = enemies[index];
        enemies.splice(index, 1);
        kills += 1;
        combo += 1;
        comboTimer = 2.6;
        if (combo > maxCombo) maxCombo = combo;
        if (combo === 6 || combo === 12 || combo === 20) {
          playComboMilestone();
          addFloatText(player.x, player.y - 38, t('×{c} 连击！', { c: combo }), '#38bdf8', 1.25);
        }
        const gained = addScore(e.pts);
        const col = e.kind === 'asteroid' ? '#94a3b8'
          : e.kind === 'gunship' ? '#f59e0b'
          : e.kind === 'drone' ? '#a855f7'
          : e.kind === 'interceptor' ? '#34d399'
          : '#fb7185';
        spawnExplosion(e.x, e.y, col, e.kind === 'gunship' ? 22 : 14, e.r * 2.3);
        playExplode(e.kind === 'gunship');
        addFloatText(e.x, e.y - 8, '+' + gained, '#fef08a', e.kind === 'gunship' ? 1.15 : 0.92);
        maybeDropPickup(e.x, e.y, (e.kind === 'gunship' || e.kind === 'drone') && Math.random() < 0.42);
      }

      function defeatBoss() {
        if (!boss) return;
        const bx = boss.x;
        const by = boss.y;
        const pts = addScore(boss.pts);
        kills += 1;
        combo += 1;
        comboTimer = 2.8;
        if (combo > maxCombo) maxCombo = combo;
        boss = null;
        enemyBullets = [];
        bossSupplyTimer = 0;
        flashColor = '#fde047';
        flashAlpha = 0.52;
        triggerShake(15, 0.55);
        playExplode(true);
        playWaveClear();
        spawnExplosion(bx, by, '#f97316', 46, 150, 14);
        addFloatText(bx, by, '+' + pts, '#fde047', 1.45);
        if (player.empCharges < 3) player.empCharges += 1;
        maybeDropPickup(bx - 26, by, true, false);
        maybeDropPickup(bx + 26, by, true, false);
        startWave(wave + 1);
      }

      function decayVisualEffects(dt) {
        if (shakeTimer > 0) shakeTimer = Math.max(0, shakeTimer - dt);
        if (flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - dt * 2.2);
        if (bossAlertAlpha > 0) bossAlertAlpha = Math.max(0, bossAlertAlpha - dt * 0.75);
        if (empWave) {
          empWave.life -= dt;
          const p = 1 - empWave.life / empWave.maxLife;
          empWave.r = 24 + (empWave.maxR - 24) * p;
          if (empWave.life <= 0) empWave = null;
        }
        for (let i = particles.length - 1; i >= 0; i -= 1) {
          const p = particles[i];
          p.life -= dt;
          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }
          p.x += p.vx * dt;
          p.y += p.vy * dt;
        }
        for (let i = debris.length - 1; i >= 0; i -= 1) {
          const d = debris[i];
          d.life -= dt;
          if (d.life <= 0) {
            debris.splice(i, 1);
            continue;
          }
          d.x += d.vx * dt;
          d.y += d.vy * dt;
          d.rot += d.vRot * dt;
        }
        for (let i = muzzleFlashes.length - 1; i >= 0; i -= 1) {
          muzzleFlashes[i].life -= dt;
          if (muzzleFlashes[i].life <= 0) muzzleFlashes.splice(i, 1);
        }
        for (let i = afterimages.length - 1; i >= 0; i -= 1) {
          afterimages[i].life -= dt;
          if (afterimages[i].life <= 0) afterimages.splice(i, 1);
        }
        for (let i = shockwaves.length - 1; i >= 0; i -= 1) {
          shockwaves[i].life -= dt;
          if (shockwaves[i].life <= 0) shockwaves.splice(i, 1);
        }
        for (let i = floatTexts.length - 1; i >= 0; i -= 1) {
          const ft = floatTexts[i];
          ft.life -= dt;
          ft.y -= 32 * dt;
          if (ft.life <= 0) floatTexts.splice(i, 1);
        }
      }

      function update(dt) {
        // 深空背景（星球、流星、星云、星空）
        const starSpeedMult = player.overdriveTimer > 0 ? 2.4 : (state === 'ready' ? 0.55 : 1);
        for (const s of stars) {
          s.y += s.speed * starSpeedMult * dt;
          if (s.y > H + 4) {
            s.y = -4;
            s.x = Math.random() * W;
          }
        }
        for (const nb of nebulae) {
          nb.y += nb.vy * dt;
          if (nb.y - nb.r > H) nb.y = -nb.r;
        }
        planet.y += planet.vy * (player.overdriveTimer > 0 ? 1.8 : 1) * dt;
        if (planet.y - planet.r > H + 50) {
          planet.y = -planet.r - 80;
          planet.x = 70 + Math.random() * (W - 140);
        }
        meteorTimer -= dt;
        if (meteorTimer <= 0) {
          meteorTimer = 2.4 + Math.random() * 3.8;
          const fromLeft = Math.random() < 0.5;
          meteors.push({
            x: fromLeft ? Math.random() * W * 0.65 : W * 0.35 + Math.random() * W * 0.65,
            y: -16,
            vx: (fromLeft ? 1 : -1) * (150 + Math.random() * 110),
            vy: 340 + Math.random() * 140,
            len: 42 + Math.random() * 28,
            life: 1.4,
          });
        }
        for (let i = meteors.length - 1; i >= 0; i -= 1) {
          const m = meteors[i];
          m.x += m.vx * dt;
          m.y += m.vy * dt;
          m.life -= dt;
          if (m.life <= 0 || m.y > H + 80) meteors.splice(i, 1);
        }

        if (state === 'paused') return;
        if (state === 'over') {
          decayVisualEffects(dt);
          return;
        }
        if (state === 'ready') {
          const nowS = performance.now() * 0.001;
          player.x = W * 0.5 + Math.sin(nowS * 1.15) * 32;
          player.y = H - 74 + Math.cos(nowS * 1.8) * 6;
          player.bank = Math.cos(nowS * 1.15) * 0.08;
          return;
        }
        if (state !== 'playing') return;

        // 计时器衰减
        if (player.invulnTimer > 0) player.invulnTimer = Math.max(0, player.invulnTimer - dt);
        if (player.overdriveTimer > 0) player.overdriveTimer = Math.max(0, player.overdriveTimer - dt);
        if (empCooldown > 0) empCooldown = Math.max(0, empCooldown - dt);
        if (waveBannerTimer > 0) waveBannerTimer = Math.max(0, waveBannerTimer - dt);
        if (comboTimer > 0) {
          comboTimer -= dt;
          if (comboTimer <= 0) combo = 0;
        }

        // 战机键盘 / 鼠标移动
        player.prevX = player.x;
        let kx = 0;
        let ky = 0;
        if (keys.ArrowLeft || keys.KeyA) kx -= 1;
        if (keys.ArrowRight || keys.KeyD) kx += 1;
        if (keys.ArrowUp || keys.KeyW) ky -= 1;
        if (keys.ArrowDown || keys.KeyS) ky += 1;
        if (kx !== 0 || ky !== 0) {
          mouseTarget = null;
          const len = Math.hypot(kx, ky) || 1;
          player.x += (kx / len) * 355 * dt;
          player.y += (ky / len) * 355 * dt;
        } else if (mouseTarget) {
          const dx = mouseTarget.x - player.x;
          const dy = mouseTarget.y - player.y;
          const dist = Math.hypot(dx, dy);
          const step = Math.min(dist, 920 * dt);
          if (dist > 0.5) {
            player.x += (dx / dist) * step;
            player.y += (dy / dist) * step;
          }
          if (dist < 2) mouseTarget = null;
        }

        player.x = Math.max(22, Math.min(W - 22, player.x));
        player.y = Math.max(54, Math.min(H - 28, player.y));
        const vxEst = (player.x - player.prevX) / Math.max(0.001, dt);
        const targetBank = Math.max(-0.28, Math.min(0.28, vxEst * 0.00075));
        player.bank += (targetBank - player.bank) * Math.min(1, dt * 14);

        if (player.overdriveTimer > 0) {
          afterimageCd -= dt;
          if (afterimageCd <= 0) {
            afterimageCd = 0.045;
            afterimages.push({
              x: player.x,
              y: player.y,
              bank: player.bank,
              life: 0.16,
              maxLife: 0.16,
            });
          }
        }

        // 自动开火
        player.fireCd -= dt;
        if (player.fireCd <= 0) {
          const interval = player.overdriveTimer > 0 ? 0.08 : 0.155;
          player.fireCd = interval;
          firePlayerWeapons();
        }

        // 波次编队生成
        if (spawnQueue.length > 0) {
          waveSpawnTimer -= dt;
          if (waveSpawnTimer <= 0) {
            const batch = spawnQueue.shift();
            for (const item of batch.items) {
              spawnEnemyAt(item);
            }
            waveSpawnTimer = batch.delay;
          }
        } else if (!boss && enemies.length === 0) {
          startWave(wave + 1);
        }

        // Boss 战周期性补给空投（避免持久战零道具）
        if (boss) {
          bossSupplyTimer -= dt;
          if (bossSupplyTimer <= 0) {
            bossSupplyTimer = 10.5;
            maybeDropPickup(W * (0.22 + Math.random() * 0.56), -16, true, true);
          }
        }

        // 更新己方子弹
        for (let i = bullets.length - 1; i >= 0; i -= 1) {
          const b = bullets[i];
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          if (b.y < -16 || b.x < -20 || b.x > W + 20) {
            bullets.splice(i, 1);
            continue;
          }
          let hit = false;
          for (let j = enemies.length - 1; j >= 0; j -= 1) {
            const e = enemies[j];
            const rr = e.r + b.r;
            if ((b.x - e.x) ** 2 + (b.y - e.y) ** 2 <= rr * rr) {
              e.hp -= b.dmg;
              e.hitFlash = 0.065;
              hit = true;
              playHit();
              pushParticle({
                x: b.x,
                y: b.y,
                vx: (Math.random() - 0.5) * 90,
                vy: -40 + Math.random() * 80,
                r: 2,
                color: b.color,
                life: 0.16,
                maxLife: 0.16,
              });
              if (e.hp <= 0) destroyEnemy(j);
              break;
            }
          }
          if (!hit && boss && boss.y >= boss.targetY - 12) {
            const rr = boss.r + b.r;
            if ((b.x - boss.x) ** 2 + (b.y - boss.y) ** 2 <= rr * rr) {
              boss.hp -= b.dmg;
              boss.hitFlash = 0.065;
              hit = true;
              playHit();
              pushParticle({
                x: b.x,
                y: b.y,
                vx: (Math.random() - 0.5) * 110,
                vy: 40 + Math.random() * 70,
                r: 2.2,
                color: b.color,
                life: 0.16,
                maxLife: 0.16,
              });
              if (boss.hp <= 0) defeatBoss();
            }
          }
          if (hit) bullets.splice(i, 1);
        }

        // 更新敌机
        const enemyFireScale = Math.max(0.58, 1 - wave * 0.032 - (mode === 'ace' ? 0.12 : 0));
        for (let i = enemies.length - 1; i >= 0; i -= 1) {
          const e = enemies[i];
          if (e.hitFlash > 0) e.hitFlash = Math.max(0, e.hitFlash - dt);
          if (e.kind === 'interceptor') {
            e.phase += dt * 3.4;
            e.x += Math.sin(e.phase) * 115 * dt;
            e.y += e.vy * dt;
          } else if (e.kind === 'drone') {
            e.phase += dt * 2.2;
            if (e.lockTimer <= 0) {
              e.x += e.vx * dt;
            }
            if (e.y < e.targetY) {
              e.y = Math.min(e.targetY, e.y + e.vy * dt);
            } else if (e.lockTimer <= 0) {
              e.y += (16 + Math.sin(e.phase) * 12) * dt;
            }
          } else {
            e.x += e.vx * dt;
            e.y += e.vy * dt;
          }

          if (e.x < e.r + 10) {
            e.x = e.r + 10;
            e.vx = Math.abs(e.vx);
          } else if (e.x > W - e.r - 10) {
            e.x = W - e.r - 10;
            e.vx = -Math.abs(e.vx);
          }
          if (e.kind === 'asteroid') e.rot += e.vRot * dt;

          // 敌机开火（攻击欲望随关数递进）
          if (e.y > 20 && e.y < H - 140) {
            if (e.kind === 'drone' && e.lockTimer > 0) {
              e.lockTimer -= dt;
              if (e.lockTimer <= 0) {
                const spd = 280 + wave * 5;
                enemyBullets.push({
                  x: e.x,
                  y: e.y + 12,
                  vx: Math.cos(e.lockAngle) * spd,
                  vy: Math.sin(e.lockAngle) * spd,
                  r: 5.5,
                  color: '#c084fc',
                });
                e.fireCd = 2.0 * enemyFireScale;
              }
            } else {
              e.fireCd -= dt;
              if (e.fireCd <= 0) {
                if (e.kind === 'scout' && wave >= 4) {
                  e.fireCd = 2.15 * enemyFireScale;
                  const spd = 205 + wave * 3.5;
                  enemyBullets.push({ x: e.x, y: e.y + 14, vx: 0, vy: spd, r: 4.5, color: '#fb7185' });
                } else if (e.kind === 'interceptor') {
                  e.fireCd = Math.max(0.82, 1.55 * enemyFireScale);
                  const ang = Math.atan2(player.y - e.y, player.x - e.x);
                  const spd = 215 + wave * 4;
                  enemyBullets.push({ x: e.x, y: e.y + 12, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 5, color: '#fb7185' });
                } else if (e.kind === 'drone') {
                  e.lockAngle = Math.atan2(player.y - e.y, player.x - e.x);
                  e.lockTimer = 0.45;
                } else if (e.kind === 'gunship') {
                  e.fireCd = Math.max(1.05, 1.9 * enemyFireScale);
                  const spd = 195 + wave * 3.5;
                  const offsets = (wave >= 7 || mode === 'ace') ? [-0.42, -0.2, 0, 0.2, 0.42] : [-0.28, 0, 0.28];
                  for (const offset of offsets) {
                    const ang = Math.PI * 0.5 + offset;
                    enemyBullets.push({ x: e.x, y: e.y + 18, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 5.5, color: '#f59e0b' });
                  }
                }
              }
            }
          }

          if (e.y > H + e.r + 25) {
            enemies.splice(i, 1);
            continue;
          }

          // 与自机碰撞
          const hitR = e.r + 10;
          if ((e.x - player.x) ** 2 + (e.y - player.y) ** 2 <= hitR * hitR) {
            if (player.overdriveTimer > 0) {
              destroyEnemy(i);
            } else {
              destroyEnemy(i);
              damagePlayer();
              if (state === 'over') return;
            }
          }
        }

        // 更新 Boss（3 种形态与专属弹幕/激光模式）
        if (boss) {
          if (boss.hitFlash > 0) boss.hitFlash = Math.max(0, boss.hitFlash - dt);
          if (boss.y < boss.targetY) {
            boss.y = Math.min(boss.targetY, boss.y + 110 * dt);
          } else {
            if (boss.laserState === 'idle') {
              boss.x += boss.vx * dt;
              if (boss.x < boss.r + 22) {
                boss.x = boss.r + 22;
                boss.vx = Math.abs(boss.vx);
              } else if (boss.x > W - boss.r - 22) {
                boss.x = W - boss.r - 22;
                boss.vx = -Math.abs(boss.vx);
              }
            }

            if (boss.laserState !== 'idle') {
              boss.laserTimer -= dt;
              if (boss.laserState === 'telegraph') {
                if (boss.kind === 'mothership') {
                  // 母舰双平行激光保持两侧偏移，留出中心或外侧躲避通道
                  const centerTarget = Math.max(boss.r + 48, Math.min(W - boss.r - 48, boss.x));
                  boss.x += (centerTarget - boss.x) * Math.min(1, dt * 8);
                } else if (boss.kind === 'prism') {
                  // 苍蓝棱镜：居中对齐并蓄力八字斜向双激光
                  const centerTarget = Math.max(96, Math.min(W - 96, player.x * 0.4 + W * 0.3));
                  boss.x += (centerTarget - boss.x) * Math.min(1, dt * 2.4);
                } else {
                  const targetX = Math.max(boss.r + 22, Math.min(W - boss.r - 22, player.x));
                  boss.x += (targetX - boss.x) * Math.min(1, dt * 3.6);
                }
                boss.lasers = computeBossLasers(boss);
                if (boss.laserTimer <= 0) {
                  boss.laserState = 'fire';
                  boss.laserTimer = boss.kind === 'crimson' ? 0.72 : 0.78;
                  triggerShake(6, 0.22);
                  playBossLaserFire();
                }
              } else if (boss.laserState === 'fire') {
                boss.lasers = computeBossLasers(boss);
                const beamLen = H + 120;
                for (const beam of boss.lasers) {
                  const dx = Math.cos(beam.angle);
                  const dy = Math.sin(beam.angle);
                  const px = player.x - beam.x;
                  const py = player.y - beam.y;
                  const proj = px * dx + py * dy;
                  if (proj > 0 && proj < beamLen) {
                    const perp = Math.abs(px * dy - py * dx);
                    if (perp <= boss.laserWidth) {
                      damagePlayer();
                      if (state === 'over') return;
                      break;
                    }
                  }
                }
                if (boss.laserTimer <= 0) {
                  boss.laserState = 'idle';
                }
              }
            } else {
              boss.patternTimer -= dt;
              if (boss.patternTimer <= 0) {
                boss.patternIndex = (boss.patternIndex + 1) % 3;
                if (boss.kind === 'crimson') {
                  if (boss.patternIndex === 0) {
                    const count = Math.min(11, 7 + boss.tier);
                    for (let k = 0; k < count; k += 1) {
                      const ang = Math.PI * 0.2 + (Math.PI * 0.6 * k) / (count - 1);
                      const spd = 210 + boss.tier * 12;
                      enemyBullets.push({ x: boss.x, y: boss.y + 24, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 6, color: '#f43f5e' });
                    }
                    boss.patternTimer = mode === 'ace' ? 1.1 : 1.4;
                  } else if (boss.patternIndex === 1) {
                    for (const sx of [boss.x - 28, boss.x + 28]) {
                      const ang = Math.atan2(player.y - boss.y, player.x - sx);
                      const spd = 240 + boss.tier * 12;
                      enemyBullets.push({ x: sx, y: boss.y + 20, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 5.5, color: '#fb923c' });
                    }
                    boss.patternTimer = mode === 'ace' ? 1.0 : 1.3;
                  } else {
                    boss.laserState = 'telegraph';
                    boss.laserTimer = 0.85;
                    boss.laserWidth = 17;
                    boss.lasers = computeBossLasers(boss);
                    boss.patternTimer = 1.6;
                    playBossLaserCharge();
                  }
                } else if (boss.kind === 'prism') {
                  if (boss.patternIndex === 0) {
                    // 苍蓝棱镜：交错旋转螺旋星弹
                    boss.spiralAngle += 0.36;
                    const spokes = 8;
                    for (let k = 0; k < spokes; k += 1) {
                      const ang = Math.PI * 0.15 + (Math.PI * 0.7 * k) / (spokes - 1) + Math.sin(boss.spiralAngle) * 0.16;
                      const spd = 198 + boss.tier * 10;
                      enemyBullets.push({ x: boss.x, y: boss.y + 20, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 5.5, color: '#38bdf8' });
                    }
                    boss.patternTimer = mode === 'ace' ? 0.95 : 1.25;
                  } else if (boss.patternIndex === 1) {
                    // 双侧晶体聚拢弹
                    for (const sx of [boss.x - 36, boss.x + 36]) {
                      for (const spread of [-0.14, 0.14]) {
                        const ang = Math.atan2(player.y - boss.y, player.x - sx) + spread;
                        const spd = 228 + boss.tier * 10;
                        enemyBullets.push({ x: sx, y: boss.y + 18, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 5.5, color: '#22d3ee' });
                      }
                    }
                    boss.patternTimer = mode === 'ace' ? 1.05 : 1.35;
                  } else {
                    // 八字斜向双棱镜激光
                    boss.laserState = 'telegraph';
                    boss.laserTimer = 0.95;
                    boss.laserWidth = 14;
                    boss.lasers = computeBossLasers(boss);
                    boss.patternTimer = 1.7;
                    playBossLaserCharge();
                  }
                } else {
                  if (boss.patternIndex === 0) {
                    // 紫曜母舰：宽幅交错弹幕墙（中路留缝）
                    const count = 9;
                    for (let k = 0; k < count; k += 1) {
                      if (k === 4) continue;
                      const ang = Math.PI * 0.18 + (Math.PI * 0.64 * k) / (count - 1);
                      const spd = 190 + boss.tier * 10;
                      enemyBullets.push({ x: boss.x, y: boss.y + 26, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 6, color: '#c084fc' });
                    }
                    boss.patternTimer = mode === 'ace' ? 1.1 : 1.4;
                  } else if (boss.patternIndex === 1) {
                    // 护卫释放 + 双翼瞄准射击
                    if (enemies.length < 3) {
                      spawnEnemyAt({ kind: 'scout', x: boss.x - 44, y: boss.y + 14 });
                      spawnEnemyAt({ kind: 'scout', x: boss.x + 44, y: boss.y + 14 });
                    } else {
                      for (const sx of [boss.x - 38, boss.x + 38]) {
                        const ang = Math.atan2(player.y - boss.y, player.x - sx);
                        enemyBullets.push({ x: sx, y: boss.y + 20, vx: Math.cos(ang) * 235, vy: Math.sin(ang) * 235, r: 5.5, color: '#e879f9' });
                      }
                    }
                    boss.patternTimer = mode === 'ace' ? 1.15 : 1.45;
                  } else {
                    // 双翼平行竖直预警激光
                    boss.laserState = 'telegraph';
                    boss.laserTimer = 0.95;
                    boss.laserWidth = 13;
                    boss.lasers = computeBossLasers(boss);
                    boss.patternTimer = 1.75;
                    playBossLaserCharge();
                  }
                }
              }
            }
          }

          // Boss 本体碰撞
          if (boss && (boss.x - player.x) ** 2 + (boss.y - player.y) ** 2 <= (boss.r + 10) ** 2) {
            damagePlayer();
            if (state === 'over') return;
          }
        }

        // 更新敌方子弹
        for (let i = enemyBullets.length - 1; i >= 0; i -= 1) {
          const eb = enemyBullets[i];
          eb.x += eb.vx * dt;
          eb.y += eb.vy * dt;
          if (eb.y > H + 18 || eb.y < -18 || eb.x < -18 || eb.x > W + 18) {
            enemyBullets.splice(i, 1);
            continue;
          }
          const rr = eb.r + 8;
          if ((eb.x - player.x) ** 2 + (eb.y - player.y) ** 2 <= rr * rr) {
            enemyBullets.splice(i, 1);
            damagePlayer();
            if (state === 'over') return;
          }
        }

        // 更新道具（近距离轻吸附）
        for (let i = pickups.length - 1; i >= 0; i -= 1) {
          const pk = pickups[i];
          pk.life += dt;
          pk.y += pk.vy * dt;
          const dx = player.x - pk.x;
          const dy = player.y - pk.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 105 && dist > 1) {
            pk.x += (dx / dist) * 260 * dt;
            pk.y += (dy / dist) * 260 * dt;
          }
          if (pk.y > H + 20) {
            pickups.splice(i, 1);
            continue;
          }
          if (dist <= pk.r + 18) {
            pickups.splice(i, 1);
            playPowerup();
            if (pk.type === 'weapon') {
              if (player.weaponLv < 4) {
                player.weaponLv += 1;
                addFloatText(pk.x, pk.y - 8, t('火力 Lv.{lv}!', { lv: player.weaponLv }), '#fde047', 1.2);
              } else {
                const pts = addScore(50);
                addFloatText(pk.x, pk.y - 8, '+' + pts, '#fde047', 1.1);
              }
            } else if (pk.type === 'shield') {
              if (!player.hasShield) {
                player.hasShield = true;
                addFloatText(pk.x, pk.y - 8, t('能量护盾!'), '#67e8f9', 1.2);
              } else {
                const pts = addScore(40);
                addFloatText(pk.x, pk.y - 8, '+' + pts, '#67e8f9', 1.1);
              }
            } else if (pk.type === 'overdrive') {
              player.overdriveTimer = 5.5;
              addFloatText(pk.x, pk.y - 8, t('超载暴走!'), '#c084fc', 1.25);
            } else if (pk.type === 'heal') {
              if (player.hp < player.maxHp) {
                player.hp += 1;
                addFloatText(pk.x, pk.y - 8, '+1 ♥', '#4ade80', 1.25);
              } else {
                const pts = addScore(50);
                addFloatText(pk.x, pk.y - 8, '+' + pts, '#4ade80', 1.1);
              }
            } else if (pk.type === 'emp') {
              if (player.empCharges < 3) {
                player.empCharges += 1;
                addFloatText(pk.x, pk.y - 8, t('+1 脉冲!'), '#7dd3fc', 1.25);
              } else {
                const pts = addScore(60);
                addFloatText(pk.x, pk.y - 8, '+' + pts, '#7dd3fc', 1.1);
              }
            }
          }
        }

        decayVisualEffects(dt);
        renderHud();
      }

      // 渲染
      function drawPlayer(tNow) {
        const sk = SKINS[skin];
        for (const af of afterimages) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, (af.life / af.maxLife) * 0.34);
          ctx.translate(af.x, af.y);
          ctx.rotate(af.bank);
          ctx.beginPath();
          ctx.moveTo(0, -21);
          ctx.lineTo(19, 12);
          ctx.lineTo(0, 11);
          ctx.lineTo(-19, 12);
          ctx.closePath();
          ctx.fillStyle = sk.wingHi;
          ctx.fill();
          ctx.restore();
        }
        if (player.invulnTimer > 0 && Math.floor(tNow / 65) % 2 === 0) return;
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.bank);

        // 护盾环
        if (player.hasShield || player.overdriveTimer > 0) {
          ctx.save();
          const pulse = 27 + Math.sin(tNow * 0.012) * 2.5;
          ctx.beginPath();
          ctx.arc(0, 2, pulse, 0, Math.PI * 2);
          ctx.strokeStyle = player.overdriveTimer > 0 ? 'rgba(250, 204, 21, 0.8)' : 'rgba(56, 189, 248, 0.78)';
          ctx.lineWidth = 2.4;
          ctx.stroke();
          ctx.fillStyle = player.overdriveTimer > 0 ? 'rgba(250, 204, 21, 0.12)' : 'rgba(56, 189, 248, 0.1)';
          ctx.fill();
          ctx.restore();
        }

        // 双尾焰
        const flameH = 12 + Math.sin(tNow * 0.045) * 4 + (player.overdriveTimer > 0 ? 7 : 0);
        for (const fx of [-6, 6]) {
          ctx.beginPath();
          ctx.moveTo(fx - 3, 14);
          ctx.lineTo(fx, 14 + flameH);
          ctx.lineTo(fx + 3, 14);
          ctx.closePath();
          ctx.fillStyle = sk.flame;
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(fx - 1.5, 14);
          ctx.lineTo(fx, 14 + flameH * 0.58);
          ctx.lineTo(fx + 1.5, 14);
          ctx.closePath();
          ctx.fillStyle = '#ffffff';
          ctx.fill();
        }

        // 翼尖武器挂架（随火力等级显现）
        if (player.weaponLv >= 2) {
          ctx.fillStyle = sk.wingHi;
          ctx.fillRect(-16, 1, 3, 11);
          ctx.fillRect(13, 1, 3, 11);
        }
        if (player.weaponLv >= 4) {
          ctx.fillStyle = '#fde047';
          ctx.fillRect(-20, 6, 3, 8);
          ctx.fillRect(17, 6, 3, 8);
        }

        // 主翼
        ctx.beginPath();
        ctx.moveTo(0, -20);
        ctx.lineTo(20, 12);
        ctx.lineTo(13, 16);
        ctx.lineTo(0, 11);
        ctx.lineTo(-13, 16);
        ctx.lineTo(-20, 12);
        ctx.closePath();
        ctx.fillStyle = sk.wing;
        ctx.fill();
        ctx.strokeStyle = sk.wingHi;
        ctx.lineWidth = 1.4;
        ctx.stroke();

        // 机身核心
        ctx.beginPath();
        ctx.moveTo(0, -23);
        ctx.lineTo(6.5, 12);
        ctx.lineTo(0, 16);
        ctx.lineTo(-6.5, 12);
        ctx.closePath();
        ctx.fillStyle = sk.body;
        ctx.fill();

        // 驾驶舱玻璃
        ctx.beginPath();
        ctx.ellipse(0, -4, 3.2, 7.5, 0, 0, Math.PI * 2);
        ctx.fillStyle = sk.cockpit;
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(-1, -6.5, 1.1, 3, -0.2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
        ctx.fill();

        ctx.restore();
      }

      function drawEnemyHpBar(e) {
        if (e.maxHp < 2 || e.hp >= e.maxHp) return;
        const w = Math.max(24, Math.min(40, e.r * 1.45));
        const y = -e.r - 10;
        const pct = Math.max(0, Math.min(1, e.hp / e.maxHp));
        ctx.fillStyle = 'rgba(2, 6, 23, 0.85)';
        ctx.fillRect(-w * 0.5 - 1, y - 1, w + 2, 6);
        ctx.fillStyle = pct > 0.5 ? '#4ade80' : (pct > 0.25 ? '#fbbf24' : '#fb7185');
        ctx.fillRect(-w * 0.5, y, w * pct, 4);
      }

      function drawEnemy(e, tNow) {
        ctx.save();
        ctx.translate(e.x, e.y);
        if (e.kind === 'asteroid') {
          ctx.save();
          ctx.rotate(e.rot);
          ctx.beginPath();
          e.poly.forEach((pt, idx) => {
            if (idx === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
          });
          ctx.closePath();
          const rg = ctx.createRadialGradient(-e.r * 0.25, -e.r * 0.25, 2, 0, 0, e.r);
          rg.addColorStop(0, e.hitFlash > 0 ? '#ffffff' : '#94a3b8');
          rg.addColorStop(1, e.hitFlash > 0 ? '#e2e8f0' : '#475569');
          ctx.fillStyle = rg;
          ctx.fill();
          ctx.strokeStyle = e.hitFlash > 0 ? '#ffffff' : '#cbd5e1';
          ctx.lineWidth = 1.6;
          ctx.stroke();
          if (e.hitFlash <= 0) {
            ctx.fillStyle = 'rgba(15, 23, 42, 0.45)';
            ctx.beginPath();
            ctx.arc(-e.r * 0.26, -e.r * 0.18, e.r * 0.22, 0, Math.PI * 2);
            ctx.arc(e.r * 0.28, e.r * 0.24, e.r * 0.15, 0, Math.PI * 2);
            ctx.fill();
            if (e.hp < e.maxHp) {
              ctx.strokeStyle = '#fb923c';
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.moveTo(-e.r * 0.4, -e.r * 0.1);
              ctx.lineTo(0, e.r * 0.1);
              ctx.lineTo(e.r * 0.35, -e.r * 0.2);
              ctx.stroke();
            }
          }
          ctx.restore();
        } else if (e.kind === 'scout') {
          // 推进尾焰
          const flame = 6 + Math.sin(tNow * 0.04 + e.phase) * 2.5;
          ctx.fillStyle = 'rgba(251, 113, 133, 0.85)';
          ctx.beginPath();
          ctx.moveTo(-3.5, -10);
          ctx.lineTo(0, -10 - flame);
          ctx.lineTo(3.5, -10);
          ctx.closePath();
          ctx.fill();
          // 双层机翼与装甲线
          ctx.beginPath();
          ctx.moveTo(0, 17);
          ctx.lineTo(15, -9);
          ctx.lineTo(5, -5);
          ctx.lineTo(0, -14);
          ctx.lineTo(-5, -5);
          ctx.lineTo(-15, -9);
          ctx.closePath();
          ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : '#e11d48';
          ctx.fill();
          ctx.strokeStyle = '#fda4af';
          ctx.lineWidth = 1.2;
          ctx.stroke();
          ctx.fillStyle = '#881337';
          ctx.beginPath();
          ctx.moveTo(0, 12);
          ctx.lineTo(6, -3);
          ctx.lineTo(-6, -3);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#fef08a';
          ctx.beginPath();
          ctx.ellipse(0, 4, 2.4, 4.5, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (e.kind === 'interceptor') {
          const flame = 7 + Math.sin(tNow * 0.04 + e.phase) * 2.5;
          for (const fx of [-6, 6]) {
            ctx.fillStyle = '#34d399';
            ctx.beginPath();
            ctx.moveTo(fx - 2.5, -11);
            ctx.lineTo(fx, -11 - flame);
            ctx.lineTo(fx + 2.5, -11);
            ctx.closePath();
            ctx.fill();
          }
          ctx.beginPath();
          ctx.moveTo(0, 19);
          ctx.lineTo(18, -5);
          ctx.lineTo(12, -16);
          ctx.lineTo(4, -6);
          ctx.lineTo(-4, -6);
          ctx.lineTo(-12, -16);
          ctx.lineTo(-18, -5);
          ctx.closePath();
          ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : '#059669';
          ctx.fill();
          ctx.strokeStyle = '#6ee7b7';
          ctx.lineWidth = 1.4;
          ctx.stroke();
          ctx.fillStyle = '#064e3b';
          ctx.beginPath();
          ctx.moveTo(0, 14);
          ctx.lineTo(7, -2);
          ctx.lineTo(-7, -2);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#fde047';
          ctx.beginPath();
          ctx.ellipse(0, 4, 3, 5, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (e.kind === 'drone') {
          // 狙击无人机：激光锁定预警细线
          if (e.lockTimer > 0) {
            ctx.save();
            ctx.setLineDash([5, 5]);
            ctx.strokeStyle = 'rgba(192, 132, 252, 0.72)';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(0, 12);
            ctx.lineTo(Math.cos(e.lockAngle) * 380, Math.sin(e.lockAngle) * 380);
            ctx.stroke();
            ctx.restore();
          }
          ctx.beginPath();
          ctx.moveTo(0, 16);
          ctx.lineTo(16, 0);
          ctx.lineTo(10, -15);
          ctx.lineTo(-10, -15);
          ctx.lineTo(-16, 0);
          ctx.closePath();
          ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : '#6d28d9';
          ctx.fill();
          ctx.strokeStyle = '#c084fc';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(0, 1, 5.2, 0, Math.PI * 2);
          ctx.fillStyle = '#e879f9';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(0, 1, 2.3, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
        } else if (e.kind === 'gunship') {
          const flame = 8 + Math.sin(tNow * 0.035 + e.phase) * 3;
          for (const fx of [-9, 9]) {
            ctx.fillStyle = '#fb923c';
            ctx.beginPath();
            ctx.moveTo(fx - 3.5, -18);
            ctx.lineTo(fx, -18 - flame);
            ctx.lineTo(fx + 3.5, -18);
            ctx.closePath();
            ctx.fill();
          }
          // 炮艇双翼装甲与炮口
          ctx.beginPath();
          ctx.moveTo(0, 25);
          ctx.lineTo(25, 7);
          ctx.lineTo(21, -18);
          ctx.lineTo(9, -15);
          ctx.lineTo(-9, -15);
          ctx.lineTo(-21, -18);
          ctx.lineTo(-25, 7);
          ctx.closePath();
          ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : '#b45309';
          ctx.fill();
          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.fillStyle = '#78350f';
          ctx.fillRect(-13, -8, 26, 15);
          ctx.fillStyle = '#fef08a';
          ctx.fillRect(-17, 6, 4, 8);
          ctx.fillRect(13, 6, 4, 8);
          ctx.beginPath();
          ctx.arc(0, 5, 5.5, 0, Math.PI * 2);
          ctx.fill();
        }
        drawEnemyHpBar(e);
        ctx.restore();
      }

      function drawBoss(tNow) {
        if (!boss) return;
        const lasers = boss.lasers || computeBossLasers(boss);
        const beamPalette = boss.kind === 'prism'
          ? { outer: 'rgba(56, 189, 248, 0.34)', core: '#7dd3fc', warn: '56, 189, 248' }
          : (boss.kind === 'mothership'
            ? { outer: 'rgba(192, 132, 252, 0.34)', core: '#e9d5ff', warn: '192, 132, 252' }
            : { outer: 'rgba(239, 68, 68, 0.34)', core: '#fca5a5', warn: '239, 68, 68' });

        // 激光预警线或发射激光（支持垂直、八字斜向与双轨激光）
        if (boss.laserState === 'telegraph') {
          const blink = 0.48 + Math.sin(tNow * 0.038) * 0.36;
          for (const beam of lasers) {
            ctx.save();
            ctx.translate(beam.x, beam.y);
            ctx.beginPath();
            ctx.arc(0, 0, 5 + blink * 4, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${beamPalette.warn}, ${(0.45 + blink * 0.35).toFixed(2)})`;
            ctx.fill();
            ctx.rotate(beam.angle);
            ctx.setLineDash([8, 6]);
            ctx.strokeStyle = `rgba(${beamPalette.warn}, ${blink.toFixed(2)})`;
            ctx.lineWidth = 2.6;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(740, 0);
            ctx.stroke();
            ctx.restore();
          }
        } else if (boss.laserState === 'fire') {
          for (const beam of lasers) {
            ctx.save();
            ctx.translate(beam.x, beam.y);
            ctx.rotate(beam.angle);
            ctx.fillStyle = beamPalette.outer;
            ctx.fillRect(0, -boss.laserWidth, 740, boss.laserWidth * 2);
            ctx.fillStyle = beamPalette.core;
