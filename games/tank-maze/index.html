</head>
<body>
  <!-- inline-icons:start -->
  <!-- inline-icons:end -->
  <header class="game-topbar">
    <div class="container game-topbar-inner">
      <a class="back-link" href="/" data-i18n="← 返回大厅">← 返回大厅</a>
      <h1 class="game-topbar-title">
        <svg class="title-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><use href="#game-tank-maze"></use></svg>
        <span data-i18n="坦克迷宫">坦克迷宫</span>
      </h1>
      <div class="game-topbar-actions">
        <a class="game-topbar-cat" href="/categories/arcade" data-i18n="动作街机">动作街机</a>
        <button class="lang-btn theme-btn" type="button" data-theme-toggle aria-label="主题：跟随系统" title="主题：跟随系统"><svg class="theme-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#theme-system"></use></svg></button>
        <button class="lang-btn" type="button" data-lang-toggle>EN</button>
      </div>
    </div>
  </header>

  <main class="game-wrap tank-game">
    <div class="tank-layout">
      <div class="tank-stage-header">
        <section class="tank-scoreboard" aria-label="比分、血量和弹药" data-i18n-attr="aria-label:比分、血量和弹药">
          <div class="tank-score tank-score-player">
            <span class="tank-team"><i aria-hidden="true"></i><span data-i18n="玩家">玩家</span></span>
            <strong id="player-score">0</strong>
            <span class="tank-health">
              <span aria-hidden="true" data-i18n="血量">血量</span>
              <span class="tank-health-pips" id="player-health" role="meter" aria-label="玩家血量" aria-valuemin="0" aria-valuemax="3" aria-valuenow="3" data-i18n-attr="aria-label:玩家血量"></span>
            </span>
            <span class="tank-ammo">
              <span aria-hidden="true" data-i18n="弹药">弹药</span>
              <span class="tank-ammo-pips" id="player-ammo" role="meter" aria-label="玩家弹药" aria-valuemin="0" aria-valuemax="3" aria-valuenow="3" data-i18n-attr="aria-label:玩家弹药"></span>
            </span>
          </div>
          <div class="tank-round">
            <strong id="round-label">第 1 局</strong>
            <span class="tank-compact-score" id="tank-compact-score">0 – 0</span>
            <span id="tank-round-note" aria-live="polite" data-i18n="三局两胜">三局两胜</span>
          </div>
          <div class="tank-score tank-score-ai">
            <span class="tank-team"><i aria-hidden="true"></i><span data-i18n="人机">人机</span></span>
            <strong id="ai-score">0</strong>
            <span class="tank-health">
              <span aria-hidden="true" data-i18n="血量">血量</span>
              <span class="tank-health-pips" id="ai-health" role="meter" aria-label="人机血量" aria-valuemin="0" aria-valuemax="3" aria-valuenow="3" data-i18n-attr="aria-label:人机血量"></span>
            </span>
            <span class="tank-ammo">
              <span aria-hidden="true" data-i18n="弹药">弹药</span>
              <span class="tank-ammo-pips" id="ai-ammo" role="meter" aria-label="人机弹药" aria-valuemin="0" aria-valuemax="3" aria-valuenow="3" data-i18n-attr="aria-label:人机弹药"></span>
            </span>
          </div>
        </section>
        <div class="tank-view-tools">
          <button type="button" class="btn-small secondary" id="tank-stage-pause" data-i18n="暂停" hidden>暂停</button>
          <button type="button" class="btn-small secondary tank-immersive-btn" id="tank-immersive" data-i18n="横屏沉浸" hidden>横屏沉浸</button>
        </div>
      </div>

      <div class="tank-board-slot">
        <div class="tank-arena" id="tank-arena" tabindex="0">
          <canvas id="tank-board" width="750" height="550" role="img" aria-label="坦克迷宫棋盘" data-i18n-attr="aria-label:坦克迷宫棋盘"></canvas>
          <div class="tank-overlay" id="tank-overlay" hidden>
            <div class="tank-overlay-card">
              <div role="status" aria-live="polite" aria-atomic="true">
                <h2 id="tank-overlay-title"></h2>
                <p id="tank-overlay-note"></p>
              </div>
              <div class="tank-overlay-actions">
                <button class="btn-small" id="tank-primary" type="button"></button>
                <button class="btn-small secondary" id="tank-secondary" type="button" data-i18n="换图" hidden>换图</button>
              </div>
            </div>
          </div>
          <div class="tank-unavailable" id="tank-unavailable" hidden role="status" data-i18n="当前浏览器无法显示迷宫。">当前浏览器无法显示迷宫。</div>
        </div>
      </div>

      <div class="tank-touch" id="tank-touch" role="group" aria-label="触屏控制" data-i18n-attr="aria-label:触屏控制" hidden>
        <div class="tank-stick" id="tank-stick" role="group" aria-label="移动摇杆" data-i18n-attr="aria-label:移动摇杆">
          <span class="tank-stick-thumb" aria-hidden="true"></span>
        </div>
        <button type="button" tabindex="-1" class="tank-pad-fire" id="tank-fire">
          <svg class="tank-control-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><use href="#art-target"></use></svg>
          <span data-i18n="开火">开火</span>
        </button>
      </div>

      <section class="tank-panel" aria-labelledby="tank-setup-title">
        <h2 id="tank-setup-title" data-i18n="对局设置">对局设置</h2>
        <button type="button" class="tank-choice" id="tank-map" aria-haspopup="dialog" aria-controls="tank-picker">
          <span data-i18n="地图">地图</span><strong id="tank-map-value">长直道</strong>
        </button>
        <button type="button" class="tank-choice" id="tank-difficulty" aria-haspopup="dialog" aria-controls="tank-picker">
          <span data-i18n="难度">难度</span><strong id="tank-difficulty-value">普通</strong>
        </button>
        <button type="button" class="tank-choice" id="tank-skin" aria-haspopup="dialog" aria-controls="tank-picker">
          <span data-i18n="坦克外观">坦克外观</span><strong id="tank-skin-value">标准型</strong>
        </button>
        <button type="button" class="btn-small tank-start" id="tank-start" data-i18n="开始游戏">开始游戏</button>
        <div class="tank-tools">
          <button type="button" class="btn-small secondary" id="tank-pause" data-i18n="暂停" disabled>暂停</button>
          <button type="button" class="btn-small secondary" id="tank-sound"></button>
          <button type="button" class="btn-small secondary" id="tank-help" data-i18n="玩法">玩法</button>
          <button type="button" class="btn-small secondary" id="tank-restart" data-i18n="重开" disabled>重开</button>
        </div>
        <p class="tank-key-hint" data-i18n="WASD 或方向键移动 · 空格开火 · P 暂停">WASD 或方向键移动 · 空格开火 · P 暂停</p>
        <p class="tank-touch-hint" data-i18n="左侧摇杆移动，右侧开火。">左侧摇杆移动，右侧开火。</p>
      </section>
    </div>
    <dialog class="site-dialog tank-picker" id="tank-picker" aria-labelledby="tank-picker-title">
      <h2 class="site-dialog-title" id="tank-picker-title"></h2>
      <div class="tank-picker-list" id="tank-picker-list"></div>
      <form method="dialog" class="site-dialog-actions">
        <button type="submit" class="site-dialog-btn" data-i18n="取消">取消</button>
      </form>
    </dialog>
    <div id="more-games" class="more-games"></div>
  </main>

  <script src="/assets/site-data.js?v=20261118001"></script>
  <script src="/assets/i18n.js?v=20261118001"></script>
  <script src="/assets/games.js?v=20261118001"></script>
  <script src="/assets/game-kit.js?v=20261118001"></script>
  <script>GameKit.mountMoreGames('tank-maze', document.getElementById('more-games'));</script>
  <script type="module" src="./modules/main.js"></script>
</body>
</html>
