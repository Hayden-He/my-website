<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>经典 2048 - 小游乐场</title>
  <meta name="description" content="经典 2048：滑动合并方块，支持 4×4 与 5×5 棋盘，可撤回。" />
  <meta name="author" content="Hayden-He" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/assets/style.css" />
  <script src="/assets/site-data.js"></script>
  <style>
    .game-wrap {
      max-width: 460px;
      margin: 18px auto 36px;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .rule-banner {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      box-shadow: var(--shadow-sm);
    }

    .rule-demo {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 700;
      color: var(--text);
    }

    .mini-chip {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 6px;
      font-size: 0.8rem;
      background: #eee4da;
      color: #776e65;
    }

    .mini-chip.four {
      background: #ede0c8;
    }

    .hud {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .hud-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .hud-label {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .hud-value {
      font-size: 1.15rem;
      font-weight: 800;
    }

    .toolbar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mode-pills {
      display: flex;
      background: #e2e8f0;
      padding: 3px;
      border-radius: 10px;
      gap: 4px;
    }

    .mode-pill {
      border: none;
      background: transparent;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .mode-pill.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .btn-small {
      padding: 8px 13px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-small.secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    .btn-small:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .board-wrap {
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1 / 1;
      background: #bbada0;
      border-radius: 16px;
      padding: 12px;
      box-shadow: var(--shadow-md);
      touch-action: none;
      user-select: none;
    }

    .grid-2048 {
      width: 100%;
      height: 100%;
      display: grid;
      gap: 10px;
    }

    .tile {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-weight: 800;
      font-size: 1.65rem;
      background: rgba(238, 228, 218, 0.35);
      color: #776e65;
    }

    .tile.compact {
      font-size: 1.35rem;
    }

    .tile.spawn {
      animation: pop-in 0.18s ease-out;
    }

    .tile.merged {
      animation: merge-pop 0.22s ease-out;
    }

    @keyframes pop-in {
      0% { transform: scale(0.5); opacity: 0.4; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes merge-pop {
      0% { transform: scale(0.92); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    .tile[data-val="2"] { background: #eee4da; }
    .tile[data-val="4"] { background: #ede0c8; }
    .tile[data-val="8"] { background: #f2b179; color: #fff; }
    .tile[data-val="16"] { background: #f59563; color: #fff; }
    .tile[data-val="32"] { background: #f67c5f; color: #fff; }
    .tile[data-val="64"] { background: #f65e3b; color: #fff; }
    .tile[data-val="128"] { background: #edcf72; color: #fff; font-size: 1.35rem; }
    .tile[data-val="256"] { background: #edcc61; color: #fff; font-size: 1.35rem; }
    .tile[data-val="512"] { background: #edc850; color: #fff; font-size: 1.35rem; }
    .tile[data-val="1024"] { background: #edc53f; color: #fff; font-size: 1.1rem; }
    .tile[data-val="2048"] { background: #edc22e; color: #fff; font-size: 1.1rem; }
    .tile.super { background: #3c3a32; color: #fff; font-size: 1.05rem; }

    .overlay {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    .overlay.show {
      display: flex;
    }

    .overlay-actions {
      display: flex;
      gap: 10px;
    }

    .overlay-btn {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .overlay-btn.secondary {
      background: #475569;
    }

    .hint-text {
      font-size: 0.84rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <header class="game-topbar">
    <div class="container game-topbar-inner">
      <a class="back-link" href="/">← 返回大厅</a>
      <span class="game-topbar-title">经典 2048 🔢</span>
      <a class="game-topbar-cat" href="/categories/puzzle.html">益智休闲</a>
    </div>
  </header>

  <main class="game-wrap">
    <div class="rule-banner">
      <span><strong>玩法：</strong>相同数字相撞合并翻倍，目标合成 <strong>2048</strong></span>
      <span class="rule-demo">
        <span class="mini-chip">2</span>+<span class="mini-chip">2</span>=<span class="mini-chip four">4</span>
      </span>
    </div>

    <div class="hud">
      <div class="hud-box">
        <div class="hud-label">当前得分</div>
        <div id="score-el" class="hud-value">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">最大方块</div>
        <div id="max-el" class="hud-value" style="color: var(--primary);">2</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">历史最高</div>
        <div id="best-el" class="hud-value" style="color: var(--accent);">0</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="mode-pills" role="group" aria-label="棋盘尺寸">
        <button id="size-4" class="mode-pill active">4×4 经典</button>
        <button id="size-5" class="mode-pill">5×5 轻松</button>
      </div>
      <div class="btn-group">
        <button id="sound-btn" class="btn-small secondary">音效: 开</button>
        <button id="undo-btn" class="btn-small secondary" disabled>撤回</button>
        <button id="restart-btn" class="btn-small">重开</button>
      </div>
    </div>

    <div id="board-wrap" class="board-wrap">
      <div id="grid" class="grid-2048"></div>
      <div id="overlay" class="overlay">
        <h2 id="overlay-title">没有可移动的方块了</h2>
        <p id="overlay-desc">本局得分：0</p>
        <div class="overlay-actions">
          <button id="keep-btn" class="overlay-btn secondary" style="display: none;">继续挑战</button>
          <button id="overlay-btn" class="overlay-btn">再来一局</button>
        </div>
      </div>
    </div>

    <p class="hint-text">电脑按 ↑ ↓ ← → 或 WASD 移动，手机在棋盘上滑动；新手推荐先试 5×5 模式</p>
  </main>

  <script>
    (function () {
      const STORAGE_KEY = 'game_best_2048';
      const gridEl = document.getElementById('grid');
      const scoreEl = document.getElementById('score-el');
      const maxEl = document.getElementById('max-el');
      const bestEl = document.getElementById('best-el');
      const undoBtn = document.getElementById('undo-btn');
      const soundBtn = document.getElementById('sound-btn');
      const size4Btn = document.getElementById('size-4');
      const size5Btn = document.getElementById('size-5');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');
      const keepBtn = document.getElementById('keep-btn');
      const boardWrap = document.getElementById('board-wrap');

      let soundEnabled = window.SiteData ? SiteData.getSound() : true;
      soundBtn.textContent = soundEnabled ? '音效: 开' : '音效: 关';

      function playMergeTone(maxVal) {
        if (!soundEnabled) return;
        if (!window.SiteData) return;
        SiteData.withAudio((audioCtx) => {
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const base = maxVal > 0 ? Math.min(880, 260 + Math.log2(maxVal) * 48) : 220;
          osc.frequency.setValueAtTime(base, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.07, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.08);
        } catch {}
        });
      }

      let bestScore = 0;
      try {
        bestScore = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10) || 0;
      } catch {}

      let size = 4;
      let board = [];
      let score = 0;
      let prevState = null;
      let wonShown = false;
      let lastSpawn = null;
      let lastMerged = new Set();

      function cloneBoard(b) {
        return b.map((row) => row.slice());
      }

      function initGame() {
        board = Array.from({ length: size }, () => Array(size).fill(0));
        score = 0;
        prevState = null;
        wonShown = false;
        lastSpawn = null;
        lastMerged = new Set();
        overlay.classList.remove('show');
        keepBtn.style.display = 'none';
        undoBtn.disabled = true;
        gridEl.style.gridTemplateColumns = 'repeat(' + size + ', 1fr)';
        gridEl.style.gridTemplateRows = 'repeat(' + size + ', 1fr)';
        addRandomTile();
        addRandomTile();
        render();
      }

      function addRandomTile() {
        const empty = [];
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            if (board[r][c] === 0) empty.push([r, c]);
          }
        }
        if (empty.length === 0) return;
        const [r, c] = empty[Math.floor(Math.random() * empty.length)];
        board[r][c] = Math.random() < 0.9 ? 2 : 4;
        lastSpawn = r + ',' + c;
      }

      function slideLine(line) {
        const filtered = line.filter((v) => v !== 0);
        const result = [];
        const mergedIdx = [];
        let gained = 0;
        let highestMerged = 0;
        for (let i = 0; i < filtered.length; i++) {
          if (i + 1 < filtered.length && filtered[i] === filtered[i + 1]) {
            const merged = filtered[i] * 2;
            mergedIdx.push(result.length);
            result.push(merged);
            gained += merged;
            if (merged > highestMerged) highestMerged = merged;
            i++;
          } else {
            result.push(filtered[i]);
          }
        }
        while (result.length < size) result.push(0);
        return { result, gained, mergedIdx, highestMerged };
      }

      function move(dir) {
        if (overlay.classList.contains('show')) return;

        const snapshotBoard = cloneBoard(board);
        const snapshotScore = score;
        let moved = false;
        let totalGained = 0;
        let highestMerged = 0;
        const mergedCells = new Set();

        for (let i = 0; i < size; i++) {
          const line = [];
          for (let j = 0; j < size; j++) {
            if (dir === 'left') line.push(board[i][j]);
            if (dir === 'right') line.push(board[i][size - 1 - j]);
            if (dir === 'up') line.push(board[j][i]);
            if (dir === 'down') line.push(board[size - 1 - j][i]);
          }

          const { result, gained, mergedIdx, highestMerged: hm } = slideLine(line);
          totalGained += gained;
          if (hm > highestMerged) highestMerged = hm;

          for (let j = 0; j < size; j++) {
            const val = result[j];
            let r = i;
            let c = j;
            if (dir === 'right') c = size - 1 - j;
            if (dir === 'up') { r = j; c = i; }
            if (dir === 'down') { r = size - 1 - j; c = i; }

            if (board[r][c] !== val) {
              board[r][c] = val;
              moved = true;
            }
            if (mergedIdx.includes(j)) mergedCells.add(r + ',' + c);
          }
        }

        if (!moved) return;

        playMergeTone(highestMerged);

        prevState = { board: snapshotBoard, score: snapshotScore };
        undoBtn.disabled = false;
        lastMerged = mergedCells;

        score += totalGained;
        if (score > bestScore) {
          bestScore = score;
          try {
            localStorage.setItem(STORAGE_KEY, String(bestScore));
          } catch {}
        }

        addRandomTile();
        render();

        if (!wonShown && getMaxTile() >= 2048) {
          wonShown = true;
          overlayTitle.textContent = '恭喜合成 2048！🎉';
          overlayDesc.textContent = '当前得分：' + score + '，你可以继续挑战更高数字！';
          keepBtn.style.display = 'inline-block';
          overlay.classList.add('show');
          return;
        }

        if (!canMove()) {
          overlayTitle.textContent = '没有可移动的方块了';
          overlayDesc.textContent = '本局得分：' + score + '（历史最高：' + bestScore + '）';
          keepBtn.style.display = 'none';
          overlay.classList.add('show');
        }
      }

      function getMaxTile() {
        let m = 0;
        board.forEach((row) => row.forEach((v) => { if (v > m) m = v; }));
        return m;
      }

      function canMove() {
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            if (board[r][c] === 0) return true;
            if (r < size - 1 && board[r][c] === board[r + 1][c]) return true;
            if (c < size - 1 && board[r][c] === board[r][c + 1]) return true;
          }
        }
        return false;
      }

      function render() {
        scoreEl.textContent = score;
        maxEl.textContent = getMaxTile();
        bestEl.textContent = bestScore;
        gridEl.innerHTML = '';
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            const val = board[r][c];
            const key = r + ',' + c;
            const tile = document.createElement('div');
            let cls = 'tile';
            if (size === 5) cls += ' compact';
            if (val > 2048) cls += ' super';
            if (key === lastSpawn) cls += ' spawn';
            else if (lastMerged.has(key)) cls += ' merged';
            tile.className = cls;
            if (val > 0) {
              tile.dataset.val = String(val);
              tile.textContent = String(val);
            }
            gridEl.appendChild(tile);
          }
        }
      }

      undoBtn.addEventListener('click', () => {
        if (!prevState) return;
        board = prevState.board;
        score = prevState.score;
        prevState = null;
        // 撤回后按棋盘实际状态重置“已提示胜利”标记，避免回到 2048 之前后再次合成不再提示
        wonShown = getMaxTile() >= 2048;
        lastSpawn = null;
        lastMerged = new Set();
        undoBtn.disabled = true;
        overlay.classList.remove('show');
        render();
      });

      keepBtn.addEventListener('click', () => overlay.classList.remove('show'));

      size4Btn.addEventListener('click', () => {
        size = 4;
        size4Btn.classList.add('active');
        size5Btn.classList.remove('active');
        initGame();
      });

      size5Btn.addEventListener('click', () => {
        size = 5;
        size5Btn.classList.add('active');
        size4Btn.classList.remove('active');
        initGame();
      });

      soundBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundBtn.textContent = soundEnabled ? '音效: 开' : '音效: 关';
        if (window.SiteData) SiteData.setSound(soundEnabled);
      });

      document.addEventListener('keydown', (e) => {
        const map = {
          ArrowLeft: 'left',
          KeyA: 'left',
          ArrowRight: 'right',
          KeyD: 'right',
          ArrowUp: 'up',
          KeyW: 'up',
          ArrowDown: 'down',
          KeyS: 'down',
        };
        if (map[e.code]) {
          e.preventDefault();
          move(map[e.code]);
        }
      });

      let startTouch = null;
      boardWrap.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          startTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
      }, { passive: true });

      boardWrap.addEventListener('touchend', (e) => {
        if (!startTouch || e.changedTouches.length === 0) return;
        const dx = e.changedTouches[0].clientX - startTouch.x;
        const dy = e.changedTouches[0].clientY - startTouch.y;
        startTouch = null;
        if (Math.hypot(dx, dy) < 24) return;
        if (Math.abs(dx) > Math.abs(dy)) {
          move(dx > 0 ? 'right' : 'left');
        } else {
          move(dy > 0 ? 'down' : 'up');
        }
      }, { passive: true });

      document.getElementById('restart-btn').addEventListener('click', initGame);
      document.getElementById('overlay-btn').addEventListener('click', initGame);

      initGame();
    })();
  </script>
</body>
</html>
