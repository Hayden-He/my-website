<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <meta name="twitter:image" content="https://my-website-all.pages.dev/assets/og-image.jpg" />
  <meta name="twitter:image:alt" content="小游乐场 · Little Playground：12 款即开即玩的小游戏" />

  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="小游乐场" />
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/style.css" />
  <link rel="stylesheet" href="/assets/game-shell.css" />
  <link rel="stylesheet" href="./modules/memory.css" />
</head>
<body>
  <!-- inline-icons:start -->
  <!-- inline-icons:end -->
  <header class="game-topbar">
    <div class="container game-topbar-inner">
      <a class="back-link" href="/" data-i18n="← 返回大厅">← 返回大厅</a>
      <h1 class="game-topbar-title">
        <svg class="title-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><use href="#game-memory"></use></svg>
        <span data-i18n="记忆翻牌">记忆翻牌</span>
      </h1>
      <div class="game-topbar-actions">
        <a class="game-topbar-cat" href="/categories/puzzle" data-i18n="益智休闲">益智休闲</a>
        <button class="lang-btn theme-btn" type="button" data-theme-toggle aria-label="主题：跟随系统" title="主题：跟随系统"><svg class="theme-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#theme-system"></use></svg></button>
        <button class="lang-btn" type="button" data-lang-toggle>EN</button>
      </div>
    </div>
  </header>

  <main class="game-wrap">
    <div class="hud">
      <div class="hud-box">
        <div class="hud-label" data-i18n="尝试次数">尝试次数</div>
        <div id="moves-el" class="hud-value">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label" data-i18n="用时">用时</div>
        <div id="time-el" class="hud-value" style="color: var(--primary);">0s</div>
      </div>
      <div class="hud-box">
        <div class="hud-label" data-i18n="最少尝试">最少尝试</div>
        <div id="best-el" class="hud-value" style="color: var(--accent-text);">--</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="mode-pills" role="group" aria-label="牌桌尺寸" data-i18n-attr="aria-label:牌桌尺寸">
        <button id="mode-4" class="mode-pill active" data-memory-mode="4" data-i18n="4×4 轻松">4×4 轻松</button>
        <button id="mode-5" class="mode-pill" data-memory-mode="5" data-i18n="5×4 标准">5×4 标准</button>
        <button id="mode-6" class="mode-pill" data-memory-mode="6" data-i18n="6×4 挑战">6×4 挑战</button>
      </div>
      <div class="btn-group">
        <button id="help-btn" class="btn-small secondary" type="button" title="查看玩法" data-i18n="玩法" data-i18n-attr="title:查看玩法">玩法</button>
        <button id="preview-btn" class="btn-small secondary" data-i18n="预览牌面">预览牌面</button>
        <button id="sound-btn" class="btn-small secondary">音效: 开</button>
        <button id="restart-btn" class="btn-small" data-i18n="重开">重开</button>
      </div>
    </div>

    <p id="memory-status" class="hint-text memory-status" role="status"></p>
    <div class="memory-stage">
      <div id="memory-board" class="memory-board" aria-label="记忆翻牌牌桌" data-i18n-attr="aria-label:记忆翻牌牌桌"></div>
      <div id="overlay" class="overlay" role="status" aria-live="polite">
        <h2 id="overlay-title" data-i18n="全部配对！🎉">全部配对！🎉</h2>
        <p id="overlay-desc"></p>
        <div class="overlay-actions">
          <button id="overlay-btn" class="overlay-btn" data-i18n="再来一局">再来一局</button>
        </div>
      </div>
    </div>

    <p class="hint-text" data-i18n="翻两张算一次尝试；按 P 预览、R 重开，方向键移动选牌。">翻两张算一次尝试；按 P 预览、R 重开，方向键移动选牌。</p>

    <div id="more-games" class="more-games"></div>
  </main>

  <script src="/assets/site-data.js"></script>
  <script src="/assets/i18n.js"></script>
  <script src="/assets/games.js"></script>
  <script src="/assets/game-kit.js"></script>
  <script src="/assets/game-rules.js"></script>
  <script>GameKit.mountMoreGames('memory', document.getElementById('more-games'));</script>
  <script type="module" src="./modules/main.js"></script>
</body>
</html>
