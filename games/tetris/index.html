<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>俄罗斯方块 - 小游乐场</title>

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="小游乐场" />
  <meta property="og:locale" content="zh_CN" />
  <meta property="og:title" content="俄罗斯方块 · Little Playground" />
  <meta property="og:description" content="俄罗斯方块：经典马拉松、40 行竞速与道具狂热三模式，支持防卡手随机、贴墙旋转、暂存、落点虚影与自动存档。" />
  <meta property="og:url" content="https://my-website-all.pages.dev/games/tetris/" />
  <meta property="og:image" content="https://my-website-all.pages.dev/assets/og-image.jpg" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="俄罗斯方块 · Little Playground" />
  <meta name="twitter:description" content="俄罗斯方块：经典马拉松、40 行竞速与道具狂热三模式，支持防卡手随机、贴墙旋转、暂存、落点虚影与自动存档。" />
  <meta name="twitter:image" content="https://my-website-all.pages.dev/assets/og-image.jpg" />
  <meta name="twitter:image:alt" content="小游乐场 · Little Playground：12 款即开即玩的小游戏" />
  <meta name="author" content="Hayden-He" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="小游乐场" />
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/style.css" />
  <link rel="stylesheet" href="/assets/game-shell.css" />
  <link rel="stylesheet" href="./modules/tetris.css" />
</head>
<body>
  <!-- inline-icons:start -->
  <!-- inline-icons:end -->
  <header class="game-topbar">
    <div class="container game-topbar-inner">
      <a class="back-link" href="/" data-i18n="← 返回大厅">← 返回大厅</a>
      <h1 class="game-topbar-title">
        <svg class="title-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><use href="#game-tetris"></use></svg>
        <span data-i18n="俄罗斯方块">俄罗斯方块</span>
      </h1>
      <div class="game-topbar-actions">
        <a class="game-topbar-cat" href="/categories/puzzle" data-i18n="益智休闲">益智休闲</a>
        <button class="lang-btn theme-btn" type="button" data-theme-toggle aria-label="主题：跟随系统" title="主题：跟随系统"><svg class="theme-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#theme-system"></use></svg></button>
        <button class="lang-btn" type="button" data-lang-toggle>EN</button>
      </div>
    </div>
  </header>

  <main class="game-wrap">
    <div class="mobile-game-controls">
      <div class="hud">
        <div class="hud-box">
          <div id="hud-primary-label" class="hud-label" data-i18n="得分">得分</div>
          <div id="hud-primary-val" class="hud-value">0</div>
        </div>
        <div class="hud-box">
          <div id="hud-best-label" class="hud-label" data-i18n="最高纪录">最高纪录</div>
          <div id="hud-best-val" class="hud-value hud-best">0</div>
        </div>
        <div class="hud-box">
          <div id="hud-third-label" class="hud-label" data-i18n="等级">等级</div>
          <div id="hud-third-val" class="hud-value">1</div>
        </div>
        <div class="hud-box">
          <div id="hud-fourth-label" class="hud-label" data-i18n="消行">消行</div>
          <div id="hud-fourth-val" class="hud-value">0</div>
        </div>
      </div>

      <div class="toolbar">
        <div class="mode-pills" role="group" aria-label="模式切换" data-i18n-attr="aria-label:模式切换">
          <button type="button" class="mode-pill active" data-mode="marathon" data-i18n="经典马拉松">经典马拉松</button>
          <button type="button" class="mode-pill" data-mode="sprint" data-i18n="40 行竞速">40 行竞速</button>
          <button type="button" class="mode-pill" data-mode="party" data-i18n="道具狂热">道具狂热</button>
        </div>
        <div class="btn-group">
          <button id="pause-btn" type="button" class="btn-small secondary" data-i18n="暂停">暂停</button>
          <button id="sound-btn" type="button" class="btn-small secondary"></button>
          <button id="help-btn" type="button" class="btn-small secondary" data-i18n="玩法">玩法</button>
          <button id="immersive-btn" type="button" class="btn-small secondary" data-i18n="沉浸模式" hidden>沉浸模式</button>
          <button id="restart-btn" type="button" class="btn-small" data-i18n="重开">重开</button>
        </div>
      </div>
    </div>

    <div class="mobile-game-stage">
      <div class="tetris-arena">
        <div class="left-rail">
          <button id="hold-btn" type="button" class="side-panel hold-panel hold-btn" aria-label="点击暂存当前方块" data-i18n-attr="aria-label:点击暂存当前方块">
            <div class="side-label" data-i18n="暂存">暂存</div>
            <canvas id="hold-canvas" class="mini-canvas"></canvas>
          </button>
          <div id="tetris-callout" class="tetris-callout" aria-live="polite" aria-atomic="true"></div>
        </div>

        <div class="board-slot">
          <div class="board-wrap">
            <canvas id="tetris-canvas" role="img" aria-label="俄罗斯方块棋盘" data-i18n-attr="aria-label:俄罗斯方块棋盘"></canvas>
            <div id="overlay" class="overlay show" role="status" aria-live="polite">
              <h2 id="overlay-title" data-i18n="俄罗斯方块">俄罗斯方块</h2>
              <p id="overlay-desc" data-i18n="堆叠下落方块凑满整行消除，挑战更高分数或更快消满 40 行。">堆叠下落方块凑满整行消除，挑战更高分数或更快消满 40 行。</p>
              <div id="overlay-stats" class="overlay-stats" hidden></div>
              <div class="overlay-actions">
                <button id="overlay-primary-btn" type="button" class="overlay-btn" data-i18n="开始游戏">开始游戏</button>
                <button id="overlay-secondary-btn" type="button" class="overlay-btn secondary" hidden data-i18n="重新开始">重新开始</button>
              </div>
            </div>
          </div>
        </div>

        <section class="side-panel next-panel" aria-label="下一个方块" data-i18n-attr="aria-label:下一个方块">
          <div class="side-label" data-i18n="下一个">下一个</div>
          <div class="next-list">
            <canvas id="next-0" class="mini-canvas"></canvas>
            <canvas id="next-1" class="mini-canvas"></canvas>
            <canvas id="next-2" class="mini-canvas"></canvas>
          </div>
        </section>
      </div>
    </div>

    <div class="tetris-pad" role="group" aria-label="触屏控制" data-i18n-attr="aria-label:触屏控制">
      <button type="button" class="pad-btn" data-action="left" aria-label="左移" data-i18n-attr="aria-label:左移">◀</button>
      <button type="button" class="pad-btn" data-action="right" aria-label="右移" data-i18n-attr="aria-label:右移">▶</button>
      <button type="button" class="pad-btn accent" data-action="rotate" aria-label="旋转" data-i18n-attr="aria-label:旋转">↻ <span data-i18n="旋转">旋转</span></button>
      <button type="button" class="pad-btn" data-action="hold" aria-label="暂存" data-i18n-attr="aria-label:暂存">⇄ <span data-i18n="暂存">暂存</span></button>
      <button type="button" class="pad-btn" data-action="soft" data-i18n="▼ 加速">▼ 加速</button>
      <button type="button" class="pad-btn primary" data-action="hard" data-i18n="⤓ 落底">⤓ 落底</button>
    </div>

    <p class="hint-text tetris-keys" data-i18n="方向键移动 · ↑/X 旋转 · Z 逆转 · 空格 落底 · C 暂存 · P 暂停">方向键移动 · ↑/X 旋转 · Z 逆转 · 空格 落底 · C 暂存 · P 暂停</p>

    <div id="more-games" class="more-games" data-more-games="tetris"></div>
  </main>

  <script src="/assets/canvas-polyfill.js"></script>
  <script src="/assets/site-data.js"></script>
  <script src="/assets/i18n.js"></script>
  <script src="/assets/games.js"></script>
  <script src="/assets/game-kit.js"></script>
  <script type="module" src="./modules/main.js"></script>
</body>
</html>
