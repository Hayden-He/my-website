<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>经典扫雷 - 小游乐场</title>
  <meta name="description" content="经典扫雷：首击必安全、支持数字快捷排雷与三档难度，支持电脑与手机。" />
  <meta name="author" content="Hayden-He" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/assets/style.css" />
  <script src="/assets/site-data.js"></script>
  <style>
    .game-wrap {
      max-width: 540px;
      margin: 18px auto 36px;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .hud {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .hud-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .hud-label {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .hud-value {
      font-size: 1.15rem;
      font-weight: 800;
    }

    .toolbar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mode-pills {
      display: flex;
      background: #e2e8f0;
      padding: 3px;
      border-radius: 10px;
      gap: 4px;
    }

    .mode-pill {
      border: none;
      background: transparent;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .mode-pill.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-small {
      padding: 7px 12px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-small.secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    .btn-small.flag-active {
      background: #f97316;
      color: #fff;
    }

    .board-wrap {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1 / 1;
      background: #cbd5e1;
      border-radius: 16px;
      padding: 10px;
      box-shadow: var(--shadow-md);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .mine-grid {
      --cols: 9;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(var(--cols), 1fr);
      grid-template-rows: repeat(var(--cols), 1fr);
      gap: 3px;
    }

    .mine-grid.dense {
      gap: 2px;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 6px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      transition: transform 0.08s ease, background 0.1s ease;
    }

    .mine-grid.mid .cell {
      font-size: 0.88rem;
      border-radius: 5px;
    }

    .mine-grid.dense .cell {
      font-size: 0.74rem;
      border-radius: 4px;
    }

    .cell.closed {
      background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 1px 2px rgba(15, 23, 42, 0.14);
    }

    .cell.closed:hover {
      background: linear-gradient(180deg, #ffffff 0%, #dbeafe 100%);
    }

    .cell.closed:active {
      transform: scale(0.94);
    }

    .cell.flagged {
      background: linear-gradient(180deg, #fff7ed 0%, #fed7aa 100%);
    }

    .cell.open {
      background: #f8fafc;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.06);
      cursor: default;
    }

    .cell.open.chordable {
      cursor: pointer;
    }

    .cell.mine-hit {
      background: #ef4444;
      color: #fff;
    }

    .cell.mine-show {
      background: #fee2e2;
    }

    .cell.wrong-flag {
      background: #fecaca;
    }

    .n1 { color: #2563eb; }
    .n2 { color: #16a34a; }
    .n3 { color: #dc2626; }
    .n4 { color: #4f46e5; }
    .n5 { color: #991b1b; }
    .n6 { color: #0891b2; }
    .n7 { color: #1e293b; }
    .n8 { color: #64748b; }

    .overlay {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #fff;
      text-align: center;
      padding: 20px;
      z-index: 5;
    }

    .overlay.show {
      display: flex;
    }

    .overlay-actions {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .overlay-btn {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .overlay-btn.secondary {
      background: #475569;
    }

    .hint-text {
      font-size: 0.82rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <header class="game-topbar">
    <div class="container game-topbar-inner">
      <a class="back-link" href="/">← 返回大厅</a>
      <span class="game-topbar-title">经典扫雷 💣</span>
      <a class="game-topbar-cat" href="/categories/puzzle.html">益智休闲</a>
    </div>
  </header>

  <main class="game-wrap">
    <div class="hud">
      <div class="hud-box">
        <div class="hud-label">剩余地雷</div>
        <div id="mines-el" class="hud-value">10</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">当前用时</div>
        <div id="time-el" class="hud-value" style="color: var(--primary);">0s</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">最佳用时</div>
        <div id="best-el" class="hud-value" style="color: var(--accent);">--</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="mode-pills" role="group" aria-label="难度选择">
        <button class="mode-pill active" data-diff="easy">9×9</button>
        <button class="mode-pill" data-diff="medium">12×12</button>
        <button class="mode-pill" data-diff="hard">16×16</button>
      </div>
      <div class="btn-group">
        <button id="tool-btn" class="btn-small secondary">模式: 翻开</button>
        <button id="sound-btn" class="btn-small secondary">音效: 开</button>
        <button id="restart-btn" class="btn-small">重开</button>
      </div>
    </div>

    <div class="board-wrap">
      <div id="mine-grid" class="mine-grid"></div>
      <div id="overlay" class="overlay">
        <h2 id="overlay-title">排雷成功！🎉</h2>
        <p id="overlay-desc">用时：0s</p>
        <div class="overlay-actions">
          <button id="view-board-btn" class="overlay-btn secondary">查看棋盘</button>
          <button id="overlay-btn" class="overlay-btn">再来一局</button>
        </div>
      </div>
    </div>

    <p class="hint-text">电脑左键翻开、右键插旗；手机长按或切换「插旗模式」标记；点击已翻开数字可快捷排雷</p>
  </main>

  <script>
    (function () {
      const GLOBAL_BEST_KEY = 'game_best_minesweeper';
      const DIFF_BEST_PREFIX = 'game_best_minesweeper_';
      const MODE_KEY = 'game_mode_minesweeper';

      const DIFFS = {
        easy: { size: 9, mines: 10, label: '9×9 轻松' },
        medium: { size: 12, mines: 22, label: '12×12 标准' },
        hard: { size: 16, mines: 40, label: '16×16 挑战' },
      };

      const gridEl = document.getElementById('mine-grid');
      const minesEl = document.getElementById('mines-el');
      const timeEl = document.getElementById('time-el');
      const bestEl = document.getElementById('best-el');
      const toolBtn = document.getElementById('tool-btn');
      const soundBtn = document.getElementById('sound-btn');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');
      const diffBtns = document.querySelectorAll('.mode-pill[data-diff]');

      let soundEnabled = window.SiteData ? SiteData.getSound() : true;
      soundBtn.textContent = soundEnabled ? '音效: 开' : '音效: 关';

      function playTone(freq, duration, type, slideTo) {
        if (!soundEnabled || !window.SiteData) return;
        SiteData.withAudio((ac) => {
          try {
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = type || 'sine';
            osc.frequency.setValueAtTime(freq, ac.currentTime);
            if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime + duration);
            gain.gain.setValueAtTime(0.08, ac.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start();
            osc.stop(ac.currentTime + duration);
          } catch {}
        });
      }

      let diff = 'easy';
      try {
        const savedDiff = localStorage.getItem(MODE_KEY);
        if (savedDiff && DIFFS[savedDiff]) diff = savedDiff;
      } catch {}

      let size = 9;
      let totalMines = 10;
      let board = [];
      let flagMode = false;
      let started = false;
      let ended = false;
      let elapsed = 0;
      let timerId = null;
      let openedCount = 0;
      let flagCount = 0;
      let hitPos = null;

      function readBest(key) {
        try {
          const val = parseInt(localStorage.getItem(key) || '0', 10);
          return val > 0 ? val : 0;
        } catch {
          return 0;
        }
      }

      function saveBest(sec) {
        const diffKey = DIFF_BEST_PREFIX + diff;
        const curDiffBest = readBest(diffKey);
        if (!curDiffBest || sec < curDiffBest) {
          try { localStorage.setItem(diffKey, String(sec)); } catch {}
        }
        const curGlobalBest = readBest(GLOBAL_BEST_KEY);
        if (!curGlobalBest || sec < curGlobalBest) {
          try { localStorage.setItem(GLOBAL_BEST_KEY, String(sec)); } catch {}
        }
      }

      function updateHud() {
        minesEl.textContent = Math.max(0, totalMines - flagCount);
        timeEl.textContent = elapsed + 's';
        const best = readBest(DIFF_BEST_PREFIX + diff);
        bestEl.textContent = best > 0 ? best + 's' : '--';
      }

      function stopTimer() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
      }

      function startTimer() {
        stopTimer();
        timerId = setInterval(() => {
          if (!started || ended || document.hidden) return;
          elapsed += 1;
          timeEl.textContent = elapsed + 's';
        }, 1000);
      }

      function neighbors(r, c) {
        const res = [];
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = r + dr;
            const nc = c + dc;
            if (nr >= 0 && nr < size && nc >= 0 && nc < size) res.push([nr, nc]);
          }
        }
        return res;
      }

      function placeMines(safeR, safeC) {
        const candidates = [];
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
            candidates.push([r, c]);
          }
        }
        for (let i = candidates.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
        }
        for (let i = 0; i < totalMines; i++) {
          const [mr, mc] = candidates[i];
          board[mr][mc].mine = true;
        }
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            if (board[r][c].mine) continue;
            board[r][c].adj = neighbors(r, c).filter(([nr, nc]) => board[nr][nc].mine).length;
          }
        }
      }

      function initGame() {
        stopTimer();
        const cfg = DIFFS[diff];
        size = cfg.size;
        totalMines = cfg.mines;
        started = false;
        ended = false;
        elapsed = 0;
        openedCount = 0;
        flagCount = 0;
        hitPos = null;

        board = Array.from({ length: size }, () =>
          Array.from({ length: size }, () => ({
            mine: false,
            open: false,
            flag: false,
            adj: 0,
          }))
        );

        diffBtns.forEach((b) => b.classList.toggle('active', b.dataset.diff === diff));
        gridEl.style.setProperty('--cols', String(size));
        gridEl.className = 'mine-grid' + (size === 12 ? ' mid' : size === 16 ? ' dense' : '');
        overlay.classList.remove('show');
        updateHud();
        render();
      }

      function revealSafeArea(startR, startC) {
        const queue = [[startR, startC]];
        let opened = 0;
        while (queue.length > 0) {
          const [r, c] = queue.shift();
          const cell = board[r][c];
          if (cell.open || cell.flag || cell.mine) continue;
          cell.open = true;
          opened += 1;
          openedCount += 1;
          if (cell.adj === 0) {
            neighbors(r, c).forEach(([nr, nc]) => {
              if (!board[nr][nc].open && !board[nr][nc].flag) queue.push([nr, nc]);
            });
          }
        }
        return opened;
      }

      function checkWin() {
        if (openedCount === size * size - totalMines) {
          ended = true;
          stopTimer();
          for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
              if (board[r][c].mine) board[r][c].flag = true;
            }
          }
          flagCount = totalMines;
          const finalSec = Math.max(1, elapsed);
          saveBest(finalSec);
          updateHud();
          render();
          playTone(523, 0.12, 'triangle', 784);
          setTimeout(() => playTone(784, 0.18, 'sine', 1046), 80);
          overlayTitle.textContent = '排雷成功！🎉';
          overlayDesc.textContent = DIFFS[diff].label + ' · 用时 ' + finalSec + ' 秒（最佳 ' + readBest(DIFF_BEST_PREFIX + diff) + ' 秒）';
          overlay.classList.add('show');
        }
      }

      function triggerLose(r, c) {
        ended = true;
        hitPos = r + ',' + c;
        stopTimer();
        playTone(170, 0.28, 'sawtooth', 75);
        render();
        overlayTitle.textContent = '踩到地雷了 💥';
        overlayDesc.textContent = '坚持了 ' + elapsed + ' 秒，再试一次吧！';
        overlay.classList.add('show');
      }

      function openCell(r, c) {
        if (ended) return;
        const cell = board[r][c];
        if (cell.flag) return;

        if (!started) {
          started = true;
          placeMines(r, c);
          startTimer();
        }

        if (cell.open) {
          // 快捷排雷（Chord）：周围旗子数等于数字时翻开其余格
          if (cell.adj > 0) {
            const adjCells = neighbors(r, c);
            const flags = adjCells.filter(([nr, nc]) => board[nr][nc].flag).length;
            if (flags === cell.adj) {
              let anyOpened = false;
              for (const [nr, nc] of adjCells) {
                const target = board[nr][nc];
                if (target.open || target.flag) continue;
                if (target.mine) {
                  triggerLose(nr, nc);
                  return;
                }
                anyOpened = revealSafeArea(nr, nc) > 0 || anyOpened;
              }
              if (anyOpened) {
                playTone(580, 0.06, 'sine', 740);
                render();
                checkWin();
              }
            }
          }
          return;
        }

        if (cell.mine) {
          triggerLose(r, c);
          return;
        }

        const count = revealSafeArea(r, c);
        playTone(count > 3 ? 620 : 480, 0.05, 'sine', count > 3 ? 820 : 560);
        render();
        checkWin();
      }

      function toggleFlag(r, c) {
        if (ended) return;
        const cell = board[r][c];
        if (cell.open) return;
        cell.flag = !cell.flag;
        flagCount += cell.flag ? 1 : -1;
        playTone(cell.flag ? 680 : 380, 0.05, 'triangle');
        updateHud();
        render();
      }

      function render() {
        gridEl.innerHTML = '';
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            const cell = board[r][c];
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.dataset.r = String(r);
            btn.dataset.c = String(c);

            if (ended) {
              if (cell.mine && hitPos === r + ',' + c) {
                btn.className = 'cell mine-hit';
                btn.textContent = '💥';
              } else if (cell.mine && !cell.flag) {
                btn.className = 'cell mine-show';
                btn.textContent = '💣';
              } else if (!cell.mine && cell.flag) {
                btn.className = 'cell wrong-flag';
                btn.textContent = '❌';
              } else if (cell.flag) {
                btn.className = 'cell closed flagged';
                btn.textContent = '🚩';
              } else if (cell.open) {
                btn.className = 'cell open' + (cell.adj > 0 ? ' n' + cell.adj : '');
                btn.textContent = cell.adj > 0 ? String(cell.adj) : '';
              } else {
                btn.className = 'cell closed';
              }
            } else if (cell.open) {
              btn.className = 'cell open' + (cell.adj > 0 ? ' n' + cell.adj + ' chordable' : '');
              btn.textContent = cell.adj > 0 ? String(cell.adj) : '';
            } else if (cell.flag) {
              btn.className = 'cell closed flagged';
              btn.textContent = '🚩';
            } else {
              btn.className = 'cell closed';
            }

            gridEl.appendChild(btn);
          }
        }
      }

      // 事件委托：支持左键翻开/快捷排雷、右键插旗、手机长按插旗
      let longPressTimer = null;
      let longPressed = false;

      gridEl.addEventListener('contextmenu', (e) => e.preventDefault());

      gridEl.addEventListener('pointerdown', (e) => {
        const btn = e.target.closest('.cell');
        if (!btn || ended) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        longPressed = false;
        const r = Number(btn.dataset.r);
        const c = Number(btn.dataset.c);
        if (!board[r][c].open) {
          longPressTimer = setTimeout(() => {
            longPressed = true;
            toggleFlag(r, c);
            if (navigator.vibrate) navigator.vibrate(15);
          }, 320);
        }
      });

      gridEl.addEventListener('pointerup', () => {
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
      });

      gridEl.addEventListener('pointerleave', () => {
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
      });

      gridEl.addEventListener('pointercancel', () => {
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
      });

      gridEl.addEventListener('mousedown', (e) => {
        if (e.button !== 2) return;
        const btn = e.target.closest('.cell');
        if (!btn) return;
        toggleFlag(Number(btn.dataset.r), Number(btn.dataset.c));
      });

      gridEl.addEventListener('click', (e) => {
        if (longPressed) {
          longPressed = false;
          return;
        }
        const btn = e.target.closest('.cell');
        if (!btn) return;
        const r = Number(btn.dataset.r);
        const c = Number(btn.dataset.c);
        if (flagMode && !board[r][c].open) {
          toggleFlag(r, c);
        } else {
          openCell(r, c);
        }
      });

      diffBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          const next = btn.dataset.diff;
          if (!DIFFS[next] || next === diff) return;
          diff = next;
          try { localStorage.setItem(MODE_KEY, diff); } catch {}
          initGame();
        });
      });

      toolBtn.addEventListener('click', () => {
        flagMode = !flagMode;
        toolBtn.textContent = flagMode ? '模式: 🚩插旗' : '模式: 翻开';
        toolBtn.classList.toggle('flag-active', flagMode);
      });

      soundBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundBtn.textContent = soundEnabled ? '音效: 开' : '音效: 关';
        if (window.SiteData) SiteData.setSound(soundEnabled);
      });

      document.getElementById('restart-btn').addEventListener('click', initGame);
      document.getElementById('overlay-btn').addEventListener('click', initGame);
      document.getElementById('view-board-btn').addEventListener('click', () => {
        overlay.classList.remove('show');
      });

      initGame();
    })();
  </script>
</body>
</html>
