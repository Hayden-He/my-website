<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>经典贪吃蛇 - 小游乐场</title>
  <meta name="description" content="经典贪吃蛇：支持键盘与触屏，含经典撞墙与自由穿墙模式。" />
  <meta name="author" content="Hayden-He" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/assets/style.css" />
  <script src="/assets/site-data.js"></script>
  <script src="/assets/canvas-polyfill.js"></script>
  <style>
    .game-wrap {
      max-width: 560px;
      margin: 18px auto 36px;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .hud {
      width: 100%;
      max-width: 520px;
      display: grid;
      grid-template-columns: 1fr 1fr auto auto;
      gap: 8px;
      align-items: stretch;
    }

    .hud-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .hud-label {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .hud-value {
      font-size: 1.15rem;
      font-weight: 800;
    }

    .toolbar {
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mode-pills {
      display: flex;
      background: #e2e8f0;
      padding: 3px;
      border-radius: 10px;
      gap: 4px;
    }

    .mode-pill {
      border: none;
      background: transparent;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .mode-pill.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .btn-small {
      padding: 8px 14px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-small.secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    .stage-box {
      position: relative;
      width: 100%;
      max-width: 520px;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid #bbf7d0;
      box-shadow: var(--shadow-md);
      background: #ecfdf5;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      touch-action: none;
      user-select: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #fff;
      padding: 20px;
      text-align: center;
    }

    .overlay.show {
      display: flex;
    }

    .overlay-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 58px);
      grid-template-rows: repeat(2, 48px);
      gap: 8px;
      margin-top: 2px;
    }

    .dpad-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      touch-action: manipulation;
    }

    .dpad-btn:active {
      background: #e2e8f0;
    }

    .dpad-empty {
      visibility: hidden;
    }

    .hint-text {
      font-size: 0.82rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* 方向键仅在触屏设备显示，桌面端使用键盘 */
    @media (hover: hover) and (pointer: fine) {
      .dpad {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header class="game-topbar">
    <div class="container game-topbar-inner">
      <a class="back-link" href="/">← 返回大厅</a>
      <span class="game-topbar-title">经典贪吃蛇 🐍</span>
      <a class="game-topbar-cat" href="/categories/arcade.html">动作街机</a>
    </div>
  </header>

  <main class="game-wrap">
    <div class="hud">
      <div class="hud-box">
        <div class="hud-label">当前得分</div>
        <div id="score-el" class="hud-value">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">历史最高</div>
        <div id="best-el" class="hud-value" style="color: var(--accent);">0</div>
      </div>
      <button id="pause-btn" class="btn-small secondary">暂停</button>
      <button id="restart-btn" class="btn-small">重开</button>
    </div>

    <div class="toolbar">
      <div class="mode-pills" role="group" aria-label="游戏模式">
        <button id="mode-classic" class="mode-pill active">经典撞墙</button>
        <button id="mode-wrap" class="mode-pill">自由穿墙</button>
      </div>
      <button id="sound-btn" class="btn-small secondary">音效: 开</button>
    </div>

    <div class="stage-box">
      <canvas id="board" width="560" height="560"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="overlay-title">游戏结束</h2>
        <p id="overlay-desc">得分：0</p>
        <button id="overlay-btn" class="overlay-btn">再来一局</button>
      </div>
    </div>

    <div class="dpad" aria-label="方向控制">
      <div class="dpad-empty"></div>
      <button class="dpad-btn" data-dir="up">↑</button>
      <div class="dpad-empty"></div>
      <button class="dpad-btn" data-dir="left">←</button>
      <button class="dpad-btn" data-dir="down">↓</button>
      <button class="dpad-btn" data-dir="right">→</button>
    </div>

    <p class="hint-text">🍎普通 +10 · ⭐金星 +30（限时）· ❄️冰果减速 · 方向键/WASD/滑动操控</p>
  </main>

  <script>
    (function () {
      const STORAGE_KEY = 'game_best_snake';
      const canvas = document.getElementById('board');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score-el');
      const bestEl = document.getElementById('best-el');
      const pauseBtn = document.getElementById('pause-btn');
      const soundBtn = document.getElementById('sound-btn');
      const modeClassicBtn = document.getElementById('mode-classic');
      const modeWrapBtn = document.getElementById('mode-wrap');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');

      const GRID = 28;
      const CELL = canvas.width / GRID;

      let soundEnabled = window.SiteData ? SiteData.getSound() : true;
      soundBtn.textContent = soundEnabled ? '音效: 开' : '音效: 关';

      function playTone(freq, duration, slideTo) {
        if (!soundEnabled) return;
        if (!window.SiteData) return;
        SiteData.withAudio((audioCtx) => {
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch {}
        });
      }

      let bestScore = 0;
      try {
        bestScore = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10) || 0;
      } catch {}
      bestEl.textContent = bestScore;

      let snake, dir, nextDirs, food, bonusItem, score, eatenCount, speedOffset, started, paused, gameOver, timer;
      let wrapMode = false;

      // 枚举所有空格后随机选取，避免蛇接近占满棋盘时随机撞格造成死循环；无空格时返回 null
      function randomEmptyCell() {
        const empty = [];
        for (let y = 0; y < GRID; y++) {
          for (let x = 0; x < GRID; x++) {
            const onSnake = snake.some((s) => s.x === x && s.y === y);
            const onFood = food && food.x === x && food.y === y;
            const onBonus = bonusItem && bonusItem.x === x && bonusItem.y === y;
            if (!onSnake && !onFood && !onBonus) empty.push({ x, y });
          }
        }
        return empty.length ? empty[Math.floor(Math.random() * empty.length)] : null;
      }

      function initGame() {
        snake = [
          { x: 14, y: 14 },
          { x: 13, y: 14 },
          { x: 12, y: 14 },
        ];
        dir = { x: 1, y: 0 };
        nextDirs = [];
        score = 0;
        eatenCount = 0;
        speedOffset = 0;
        bonusItem = null;
        started = false;
        paused = false;
        gameOver = false;
        food = randomEmptyCell();
        overlay.classList.remove('show');
        pauseBtn.textContent = '暂停';
        scoreEl.textContent = '0';
        if (timer) clearTimeout(timer);
        draw();
      }

      function togglePause() {
        if (!started || gameOver) return;
        paused = !paused;
        pauseBtn.textContent = paused ? '继续' : '暂停';
        if (paused) {
          if (timer) clearTimeout(timer);
          draw();
        } else {
          tick();
        }
      }

      function setDirection(name) {
        if (gameOver || paused) return;
        const map = {
          up: { x: 0, y: -1 },
          down: { x: 0, y: 1 },
          left: { x: -1, y: 0 },
          right: { x: 1, y: 0 },
        };
        const candidate = map[name];
        if (!candidate) return;

        if (!started) {
          dir = candidate.x === -1 && candidate.y === 0 ? { x: 1, y: 0 } : candidate;
          started = true;
          tick();
          return;
        }

        const lastDir = nextDirs.length > 0 ? nextDirs[nextDirs.length - 1] : dir;
        if (candidate.x + lastDir.x === 0 && candidate.y + lastDir.y === 0) return;
        if (candidate.x === lastDir.x && candidate.y === lastDir.y) return;
        if (nextDirs.length < 2) nextDirs.push(candidate);
      }

      function tick() {
        if (!started || paused || gameOver) return;
        if (nextDirs.length > 0) dir = nextDirs.shift();

        let nx = snake[0].x + dir.x;
        let ny = snake[0].y + dir.y;

        if (wrapMode) {
          nx = (nx + GRID) % GRID;
          ny = (ny + GRID) % GRID;
        } else if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) {
          endGame();
          return;
        }

        // 不吃果子时尾巴本步会移开，允许蛇头进入尾巴当前所在格（经典规则）
        const willGrow =
          (nx === food.x && ny === food.y) ||
          (bonusItem && nx === bonusItem.x && ny === bonusItem.y);
        const bodyToCheck = willGrow ? snake : snake.slice(0, -1);
        if (bodyToCheck.some((s) => s.x === nx && s.y === ny)) {
          endGame();
          return;
        }

        const head = { x: nx, y: ny };
        snake.unshift(head);

        let grew = false;
        if (head.x === food.x && head.y === food.y) {
          grew = true;
          eatenCount += 1;
          score += 10;
          playTone(520, 0.08, 760);
          food = randomEmptyCell();
          if (!food) {
            // 棋盘已被占满，通关
            scoreEl.textContent = score;
            if (score > bestScore) {
              bestScore = score;
              bestEl.textContent = bestScore;
              try { localStorage.setItem(STORAGE_KEY, String(bestScore)); } catch {}
            }
            food = { x: -1, y: -1 };
            endGame('通关！🎉');
            return;
          }

          // 每吃 4 个普通果子，刷新一个限时奖励果（金星或冰果）
          if (eatenCount % 4 === 0 && !bonusItem) {
            const pos = randomEmptyCell();
            if (pos) {
              bonusItem = {
                x: pos.x,
                y: pos.y,
                type: Math.random() < 0.7 ? 'star' : 'ice',
                ttl: 45,
              };
            }
          }
        } else if (bonusItem && head.x === bonusItem.x && head.y === bonusItem.y) {
          grew = true;
          if (bonusItem.type === 'star') {
            score += 30;
            playTone(660, 0.14, 1040);
          } else {
            score += 15;
            speedOffset = Math.min(45, speedOffset + 25);
            playTone(440, 0.14, 300);
          }
          bonusItem = null;
        }

        if (bonusItem) {
          bonusItem.ttl -= 1;
          if (bonusItem.ttl <= 0) bonusItem = null;
        }

        if (grew) {
          scoreEl.textContent = score;
          if (score > bestScore) {
            bestScore = score;
            bestEl.textContent = bestScore;
            try {
              localStorage.setItem(STORAGE_KEY, String(bestScore));
            } catch {}
          }
        } else {
          snake.pop();
        }

        draw();
        const delay = Math.max(85, 190 - Math.floor(score / 25) * 6 + speedOffset);
        if (speedOffset > 0) speedOffset = Math.max(0, speedOffset - 0.5);
        timer = setTimeout(tick, delay);
      }

      function endGame(title) {
        gameOver = true;
        playTone(220, 0.22, 95);
        overlayTitle.textContent = title || '游戏结束';
        overlayDesc.textContent = '本局得分：' + score + '（历史最高：' + bestScore + '）';
        overlay.classList.add('show');
        draw();
      }

      function draw() {
        // 清爽明快草地棋盘格
        for (let r = 0; r < GRID; r++) {
          for (let c = 0; c < GRID; c++) {
            ctx.fillStyle = (r + c) % 2 === 0 ? '#ecfdf5' : '#dcfce7';
            ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
          }
        }

        // 普通红苹果
        const fx = food.x * CELL + CELL / 2;
        const fy = food.y * CELL + CELL / 2;
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(fx, fy + 1, CELL * 0.37, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#16a34a';
        ctx.fillRect(fx - 1.5, fy - CELL * 0.44, 3, 4);

        // 限时特殊果子
        if (bonusItem) {
          const bx = bonusItem.x * CELL + CELL / 2;
          const by = bonusItem.y * CELL + CELL / 2;
          ctx.fillStyle = bonusItem.type === 'star' ? '#f59e0b' : '#38bdf8';
          ctx.beginPath();
          ctx.arc(bx, by, CELL * 0.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 11px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(bonusItem.type === 'star' ? '★' : '❄', bx, by + 0.5);
          ctx.textBaseline = 'alphabetic';
        }

        // 蛇身渐变
        snake.forEach((seg, idx) => {
          ctx.fillStyle = idx === 0 ? '#15803d' : idx % 2 === 0 ? '#22c55e' : '#16a34a';
          ctx.beginPath();
          ctx.roundRect(seg.x * CELL + 1.5, seg.y * CELL + 1.5, CELL - 3, CELL - 3, idx === 0 ? 7 : 5);
          ctx.fill();

          if (idx === 0) {
            ctx.fillStyle = '#ffffff';
            const cx = seg.x * CELL + CELL / 2;
            const cy = seg.y * CELL + CELL / 2;
            const ex = dir.x * 3;
            const ey = dir.y * 3;
            ctx.beginPath();
            ctx.arc(cx + ex - dir.y * 3.5, cy + ey + dir.x * 3.5, 2.3, 0, Math.PI * 2);
            ctx.arc(cx + ex + dir.y * 3.5, cy + ey - dir.x * 3.5, 2.3, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        if (!started && !gameOver) {
          ctx.fillStyle = 'rgba(15, 23, 42, 0.72)';
          ctx.beginPath();
          ctx.roundRect(canvas.width / 2 - 155, canvas.height / 2 - 76, 310, 44, 12);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 15px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('按任意方向键或点击方向按钮开始 🐍', canvas.width / 2, canvas.height / 2 - 48);
        } else if (paused && !gameOver) {
          ctx.fillStyle = 'rgba(15, 23, 42, 0.55)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 24px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('已暂停', canvas.width / 2, canvas.height / 2);
        }
      }

      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          togglePause();
          return;
        }
        const keyMap = {
          ArrowUp: 'up',
          KeyW: 'up',
          ArrowDown: 'down',
          KeyS: 'down',
          ArrowLeft: 'left',
          KeyA: 'left',
          ArrowRight: 'right',
          KeyD: 'right',
        };
        if (keyMap[e.code]) {
          e.preventDefault();
          setDirection(keyMap[e.code]);
        }
      });

      document.querySelectorAll('.dpad-btn').forEach((btn) => {
        btn.addEventListener('click', () => setDirection(btn.dataset.dir));
      });

      let touchStart = null;
      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
      }, { passive: true });

      canvas.addEventListener('touchend', (e) => {
        if (!touchStart || e.changedTouches.length === 0) return;
        const dx = e.changedTouches[0].clientX - touchStart.x;
        const dy = e.changedTouches[0].clientY - touchStart.y;
        touchStart = null;
        if (Math.hypot(dx, dy) < 20) return;
        if (Math.abs(dx) > Math.abs(dy)) {
          setDirection(dx > 0 ? 'right' : 'left');
        } else {
          setDirection(dy > 0 ? 'down' : 'up');
        }
      }, { passive: true });

      modeClassicBtn.addEventListener('click', () => {
        wrapMode = false;
        modeClassicBtn.classList.add('active');
        modeWrapBtn.classList.remove('active');
        initGame();
      });

      modeWrapBtn.addEventListener('click', () => {
        wrapMode = true;
        modeWrapBtn.classList.add('active');
        modeClassicBtn.classList.remove('active');
        initGame();
      });

      soundBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundBtn.textContent = soundEnabled ? '音效: 开' : '音效: 关';
        if (window.SiteData) SiteData.setSound(soundEnabled);
      });

      pauseBtn.addEventListener('click', togglePause);

      // 切到后台时自动暂停，避免蛇在后台继续移动
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && started && !paused && !gameOver) togglePause();
      });
      document.getElementById('restart-btn').addEventListener('click', initGame);
      document.getElementById('overlay-btn').addEventListener('click', initGame);

      initGame();
    })();
  </script>
</body>
</html>
